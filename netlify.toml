[build]
  publish = "."
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"

# Tum otomatik WhatsApp gonderim fonksiyonlari (haftalik program, randevu
# hatirlatma, yeni danisan hosgeldin mesaji) kaldirildi. WhatsApp mesajlari
# artik yalnizca panelden elle tetiklenir. Bulut yedekleme dokunulmadi.
[functions."scheduled-backup"]
  schedule = "0 9,15 * * *"
