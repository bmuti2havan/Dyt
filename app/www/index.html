<!doctype html>
<!--
  Bu dosya sadece Capacitor'ın gereksinimi için var (webDir boş olamaz).
  Uygulama açılır açılmaz capacitor.config.json'daki server.url
  (https://takip.dytaysenurkorkmazantalya.com.tr) yüklenir — gerçek
  uygulama içeriği HER ZAMAN canlı siteden gelir, bu dosya normalde
  hiç görünmez.
-->
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Diyet Takip</title>
<style>
  html,body{height:100%;margin:0;background:#0B3B63;display:flex;align-items:center;justify-content:center;font-family:-apple-system,Segoe UI,Roboto,sans-serif;color:#fff}
  .wrap{text-align:center}
  .dot{width:10px;height:10px;border-radius:50%;background:#fff;display:inline-block;margin:0 3px;animation:b 1.2s infinite ease-in-out}
  .dot:nth-child(2){animation-delay:.15s}
  .dot:nth-child(3){animation-delay:.3s}
  @keyframes b{0%,80%,100%{opacity:.3;transform:scale(.8)}40%{opacity:1;transform:scale(1)}}
</style>
</head>
<body>
  <div class="wrap">
    <div class="dot"></div><div class="dot"></div><div class="dot"></div>
  </div>
</body>
</html>
