ime başvurun.<\/p>\n              <p style=\"margin:10px 0 0;font-size:10.5px;color:var(--muted);font-style:italic\">📎 Kaynak: Güncel genel beslenme bilgisi ve yaygın kabul gören klinik beslenme kaynakları derlenerek hazırlanmıştır; kişisel tıbbi tavsiye yerine geçmez.<\/p>\n              <div style=\"display:flex;gap:8px;margin-top:10px\">\n                <button class=\"btn btn-sm\" type=\"button\" data-sv-art-docx=\"yasli-beslenme\" style=\"flex:1;justify-content:center\">⬇ Word<\/button>\n                <button class=\"btn btn-sm\" type=\"button\" data-sv-art-pdf=\"yasli-beslenme\" style=\"flex:1;justify-content:center\">⬇ PDF<\/button>\n              <\/div>\n            <\/div>\n          <\/details>\n          <details class=\"sv-art\" data-art-id=\"vejetaryen-vegan\" style=\"border:1px solid var(--line);border-radius:10px;margin-bottom:8px;overflow:hidden\">\n            <summary style=\"list-style:none;cursor:pointer;padding:11px 14px;display:flex;align-items:center;gap:10px;font-weight:600;font-size:13.5px\">\n              <span style=\"font-size:16px\">🥗<\/span>\n              <span style=\"flex:1\">Vejetaryen ve Vegan Beslenme<div style=\"font-weight:400;color:var(--muted);font-size:11.5px;margin-top:2px\">Dengeli bitkisel beslenme nasıl olur?<\/div><\/span>\n              <span class=\"sv-art-car\" style=\"color:var(--muted);font-size:11px\">▾<\/span>\n            <\/summary>\n            <div style=\"padding:4px 16px 16px;border-top:1px solid var(--line-2)\">\n              \n              <p style=\"margin:0 0 8px;font-size:13px;line-height:1.7;color:var(--ink-2)\">İyi planlanmış bitkisel beslenme her yaşta sağlıklı olabilir; ancak bazı besin ögeleri için dikkat gerekir.<\/p><div style=\"font-weight:700;color:var(--blue-700);font-size:13.5px;margin:14px 0 6px\">Dikkat edilecek besin ögeleri<\/div><ul style=\"margin:0 0 8px;padding-left:18px;font-size:13px;line-height:1.7\"><li>B12 (vegan olanlar için takviye gerekir).<\/li><li>Demir, çinko, kalsiyum ve omega-3.<\/li><li>Yeterli protein: baklagil, tofu, kuruyemiş, tam tahıl.<\/li><\/ul><div style=\"font-weight:700;color:var(--blue-700);font-size:13.5px;margin:14px 0 6px\">İpucu<\/div><p style=\"margin:0 0 8px;font-size:13px;line-height:1.7;color:var(--ink-2)\">Baklagil ve tahılı aynı gün içinde birlikte tüketmek protein kalitesini dengeler.<\/p><p style=\"margin:0 0 8px;font-size:13px;line-height:1.7;color:var(--ink-2)\">Hamilelik, çocukluk ve emzirme döneminde mutlaka uzman desteğiyle planlayın.<\/p>\n              <p style=\"margin:10px 0 0;font-size:10.5px;color:var(--muted);font-style:italic\">📎 Kaynak: Güncel genel beslenme bilgisi ve yaygın kabul gören klinik beslenme kaynakları derlenerek hazırlanmıştır; kişisel tıbbi tavsiye yerine geçmez.<\/p>\n              <div style=\"display:flex;gap:8px;margin-top:10px\">\n                <button class=\"btn btn-sm\" type=\"button\" data-sv-art-docx=\"vejetaryen-vegan\" style=\"flex:1;justify-content:center\">⬇ Word<\/button>\n                <button class=\"btn btn-sm\" type=\"button\" data-sv-art-pdf=\"vejetaryen-vegan\" style=\"flex:1;justify-content:center\">⬇ PDF<\/button>\n              <\/div>\n            <\/div>\n          <\/details>\n          <details class=\"sv-art\" data-art-id=\"takviyeler\" style=\"border:1px solid var(--line);border-radius:10px;margin-bottom:8px;overflow:hidden\">\n            <summary style=\"list-style:none;cursor:pointer;padding:11px 14px;display:flex;align-items:center;gap:10px;font-weight:600;font-size:13.5px\">\n              <span style=\"font-size:16px\">💊<\/span>\n              <span style=\"flex:1\">Besin Takviyeleri: Gerçekten Gerekli mi?<div style=\"font-weight:400;color:var(--muted);font-size:11.5px;margin-top:2px\">Hap yerine önce sofra.<\/div><\/span>\n              <span class=\"sv-art-car\" style=\"color:var(--muted);font-size:11px\">▾<\/span>\n            <\/summary>\n            <div style=\"padding:4px 16px 16px;border-top:1px solid var(--line-2)\">\n              \n              <p style=\"margin:0 0 8px;font-size:13px;line-height:1.7;color:var(--ink-2)\">Vitamin ve mineral takviyeleri belirli durumlarda gereklidir (eksiklik, hamilelik, bazı hastalıklar); ancak sağlıklı ve dengeli beslenen çoğu kişinin ihtiyacı yoktur.<\/p><div style=\"font-weight:700;color:var(--blue-700);font-size:13.5px;margin:14px 0 6px\">Dikkat edilecekler<\/div><ul style=\"margin:0 0 8px;padding-left:18px;font-size:13px;line-height:1.7\"><li>Takviyeyi tahlil ve uzman önerisine göre kullanın.<\/li><li>Fazla doz zararlı olabilir (özellikle yağda çözünen vitaminler).<\/li><li>&quot;Mucize&quot; vaat eden, hızlı kilo veren ürünlerden uzak durun.<\/li><li>İlaç etkileşimlerini hekiminize sorun.<\/li><\/ul><div style=\"font-weight:700;color:var(--blue-700);font-size:13.5px;margin:14px 0 6px\">Öncelik<\/div><p style=\"margin:0 0 8px;font-size:13px;line-height:1.7;color:var(--ink-2)\">Önce beslenmeyi düzeltmek, takviyeyi son basamak olarak düşünmek en güvenlisidir.<\/p><p style=\"margin:0 0 8px;font-size:13px;line-height:1.7;color:var(--ink-2)\">Sağlık ürünü satın almadan önce güvenilir bir kaynaktan doğrulayın.<\/p>\n              <p style=\"margin:10px 0 0;font-size:10.5px;color:var(--muted);font-style:italic\">📎 Kaynak: Güncel genel beslenme bilgisi ve yaygın kabul gören klinik beslenme kaynakları derlenerek hazırlanmıştır; kişisel tıbbi tavsiye yerine geçmez.<\/p>\n              <div style=\"display:flex;gap:8px;margin-top:10px\">\n                <button class=\"btn btn-sm\" type=\"button\" data-sv-art-docx=\"takviyeler\" style=\"flex:1;justify-content:center\">⬇ Word<\/button>\n                <button class=\"btn btn-sm\" type=\"button\" data-sv-art-pdf=\"takviyeler\" style=\"flex:1;justify-content:center\">⬇ PDF<\/button>\n              <\/div>\n            <\/div>\n          <\/details><\/div><\/details>\n        <details class=\"sv-artcat\" style=\"margin-top:12px\"><summary style=\"cursor:pointer;list-style:none;font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--blue-900);padding:9px 2px;border-bottom:1px solid var(--line)\">Besin Ögeleri <span style=\"color:var(--muted);font-weight:600\">· 15<\/span><\/summary><div style=\"padding-top:8px\">\n        \n          <details class=\"sv-art\" data-art-id=\"karbonhidrat\" style=\"border:1px solid var(--line);border-radius:10px;margin-bottom:8px;overflow:hidden\">\n            <summary style=\"list-style:none;cursor:pointer;padding:11px 14px;display:flex;align-items:center;gap:10px;font-weight:600;font-size:13.5px\">\n              <span style=\"font-size:16px\">🍞<\/span>\n              <span style=\"flex:1\">Karbonhidrat: Düşman mı, Dost mu?<div style=\"font-weight:400;color:var(--muted);font-size:11.5px;margin-top:2px\">Karbonhidratın türleri ve doğru seçimler.<\/div><\/span>\n              <span class=\"sv-art-car\" style=\"color:var(--muted);font-size:11px\">▾<\/span>\n            <\/summary>\n            <div style=\"padding:4px 16px 16px;border-top:1px solid var(--line-2)\">\n              \n              <p style=\"margin:0 0 8px;font-size:13px;line-height:1.7;color:var(--ink-2)\">Karbonhidrat vücudun ve beynin ana enerji kaynağıdır. Sorun karbonhidratın kendisi değil, hangi türünü ve ne kadar yediğimizdir.<\/p><div style=\"font-weight:700;color:var(--blue-700);font-size:13.5px;margin:14px 0 6px\">Hangi karbonhidratlar tercih edilmeli?<\/div><ul style=\"margin:0 0 8px;padding-left:18px;font-size:13px;line-height:1.7\"><li>Tam tahıllar, bulgur, yulaf, baklagiller ve sebzeler lif içerir ve yavaş sindirilir.<\/li><li>Beyaz ekmek, şekerli içecekler ve hamur işleri hızlı sindirilir, kan şekerini çabuk yükseltir.<\/li><\/ul><div style=\"font-weight:700;color:var(--blue-700);font-size:13.5px;margin:14px 0 6px\">Pratik ipucu<\/div><p style=\"margin:0 0 8px;font-size:13px;line-height:1.7;color:var(--ink-2)\">Karbonhidratı tek başına yemek yerine protein ve sebzeyle birlikte almak kan şekerinin daha dengeli seyretmesine yardımcı olur.<\/p><p style=\"margin:0 0 8px;font-size:13px;line-height:1.7;color:var(--ink-2)\">Tamamen çıkarmak yerine miktarı ve kalitesini ayarlamak çoğu insan için daha sürdürülebilirdir.<\/p>\n              <p style=\"margin:10px 0 0;font-size:10.5px;color:var(--muted);font-style:italic\">📎 Kaynak: Güncel genel beslenme bilgisi ve yaygın kabul gören klinik beslenme kaynakları derlenerek hazırlanmıştır; kişisel tıbbi tavsiye yerine geçmez.<\/p>\n              <div style=\"display:flex;gap:8px;margin-top:10px\">\n                <button class=\"btn btn-sm\" type=\"button\" data-sv-art-docx=\"karbonhidrat\" style=\"flex:1;justify-content:center\">⬇ Word<\/button>\n                <button class=\"btn btn-sm\" type=\"button\" data-sv-art-pdf=\"karbonhidrat\" style=\"flex:1;justify-content:center\">⬇ PDF<\/button>\n              <\/div>\n            <\/div>\n          <\/details>\n          <details class=\"sv-art\" data-art-id=\"saglikli-yaglar\" style=\"border:1px solid var(--line);border-radius:10px;margin-bottom:8px;overflow:hidden\">\n            <summary style=\"list-style:none;cursor:pointer;padding:11px 14px;display:flex;align-items:center;gap:10px;font-weight:600;font-size:13.5px\">\n              <span style=\"font-size:16px\">🫒<\/span>\n              <span style=\"flex:1\">Sağlıklı Yağlar<div style=\"font-weight:400;color:var(--muted);font-size:11.5px;margin-top:2px\">Zeytinyağı, kuruyemiş ve balık: hangi yağ neden önemli?<\/div><\/span>\n              <span class=\"sv-art-car\" style=\"color:var(--muted);font-size:11px\">▾<\/span>\n            <\/summary>\n            <div style=\"padding:4px 16px 16px;border-top:1px solid var(--line-2)\">\n              \n              <p style=\"margin:0 0 8px;font-size:13px;line-height:1.7;color:var(--ink-2)\">Yağ her öğünden kaçınılacak bir şey değildir; vücut yağda çözünen vitaminleri emmek ve hormonlarını üretmek için yağa ihtiyaç duyar.<\/p><div style=\"font-weight:700;color:var(--blue-700);font-size:13.5px;margin:14px 0 6px\">İyi yağ kaynakları<\/div><ul style=\"margin:0 0 8px;padding-left:18px;font-size:13px;line-height:1.7\"><li>Zeytinyağı, avokado ve fındık gibi tekli doymamış yağlar.<\/li><li>Somon, sardalya gibi yağlı balıklar ve ceviz (omega-3).<\/li><\/ul><div style=\"font-weight:700;color:var(--blue-700);font-size:13.5px;margin:14px 0 6px\">Dikkat<\/div><p style=\"margin:0 0 8px;font-size:13px;line-height:1.7;color:var(--ink-2)\">Yağ kalorisi yüksektir; bir yemek kaşığı zeytinyağı yaklaşık 90 kcal verir. Yani &quot;sağlıklı&quot; olması &quot;sınırsız&quot; olduğu anlamına gelmez.<\/p><p style=\"margin:0 0 8px;font-size:13px;line-height:1.7;color:var(--ink-2)\">Pişirmede ölçülü, salatada ve soğuk yemeklerde kullanmak iyi bir başlangıçtır.<\/p>\n              <p style=\"margin:10px 0 0;font-size:10.5px;color:var(--muted);font-style:italic\">📎 Kaynak: Güncel genel beslenme bilgisi ve yaygın kabul gören klinik beslenme kaynakları derlenerek hazırlanmıştır; kişisel tıbbi tavsiye yerine geçmez.<\/p>\n              <div style=\"display:flex;gap:8px;margin-top:10px\">\n                <button class=\"btn btn-sm\" type=\"button\" data-sv-art-docx=\"saglikli-yaglar\" style=\"flex:1;justify-content:center\">⬇ Word<\/button>\n                <button class=\"btn btn-sm\" type=\"button\" data-sv-art-pdf=\"saglikli-yaglar\" style=\"flex:1;justify-content:center\">⬇ PDF<\/button>\n              <\/div>\n            <\/div>\n          <\/details>\n          <details class=\"sv-art\" data-art-id=\"doymus-trans-yag\" style=\"border:1px solid var(--line);border-radius:10px;margin-bottom:8px;overflow:hidden\">\n            <summary style=\"list-style:none;cursor:pointer;padding:11px 14px;display:flex;align-items:center;gap:10px;font-weight:600;font-size:13.5px\">\n              <span style=\"font-size:16px\">🥓<\/span>\n              <span style=\"flex:1\">Doymuş ve Trans Yağlar<div style=\"font-weight:400;color:var(--muted);font-size:11.5px;margin-top:2px\">Kalp sağlığı için sınırlanması önerilen yağlar.<\/div><\/span>\n              <span class=\"sv-art-car\" style=\"color:var(--muted);font-size:11px\">▾<\/span>\n            <\/summary>\n            <div style=\"padding:4px 16px 16px;border-top:1px solid var(--line-2)\">\n              \n              <p style=\"margin:0 0 8px;font-size:13px;line-height:1.7;color:var(--ink-2)\">Tereyağı, kırmızı etin yağlı kısımları ve işlenmiş etlerde doymuş yağ; bazı hazır kek, bisküvi ve kızartmalarda ise trans yağ bulunabilir.<\/p><div style=\"font-weight:700;color:var(--blue-700);font-size:13.5px;margin:14px 0 6px\">Neden sınırlanmalı?<\/div><p style=\"margin:0 0 8px;font-size:13px;line-height:1.7;color:var(--ink-2)\">Yüksek miktarda doymuş yağ ve özellikle trans yağ, &quot;kötü&quot; kolesterol olarak bilinen LDL düzeyini yükseltebilir.<\/p><div style=\"font-weight:700;color:var(--blue-700);font-size:13.5px;margin:14px 0 6px\">Ne yapılabilir?<\/div><ul style=\"margin:0 0 8px;padding-left:18px;font-size:13px;line-height:1.7\"><li>Etiketlerde &quot;kısmen hidrojenize yağ&quot; ifadesine dikkat edin.<\/li><li>Kızartma yerine fırın, ızgara veya haşlamayı deneyin.<\/li><li>Sosis, salam gibi işlenmiş etleri sık tüketmeyin.<\/li><\/ul><p style=\"margin:0 0 8px;font-size:13px;line-height:1.7;color:var(--ink-2)\">Amaç yağı tamamen bırakmak değil, türünü iyileştirmektir.<\/p>\n              <p style=\"margin:10px 0 0;font-size:10.5px;color:var(--muted);font-style:italic\">📎 Kaynak: Güncel genel beslenme bilgisi ve yaygın kabul gören klinik beslenme kaynakları derlenerek hazırlanmıştır; kişisel tıbbi tavsiye yerine geçmez.<\/p>\n              <div style=\"display:flex;gap:8px;margin-top:10px\">\n                <button class=\"btn btn-sm\" type=\"button\" data-sv-art-docx=\"doymus-trans-yag\" style=\"flex:1;justify-content:center\">⬇ Word<\/button>\n                <button class=\"btn btn-sm\" type=\"button\" data-sv-art-pdf=\"doymus-trans-yag\" style=\"flex:1;justify-content:center\">⬇ PDF<\/button>\n              <\/div>\n            <\/div>\n          <\/details>\n          <details class=\"sv-art\" data-art-id=\"d-vitamini\" style=\"border:1px solid var(--line);border-radius:10px;margin-bottom:8px;overflow:hidden\">\n            <summary style=\"list-style:none;cursor:pointer;padding:11px 14px;display:flex;align-items:center;gap:10px;font-weight:600;font-size:13.5px\">\n              <span style=\"font-size:16px\">☀️<\/span>\n              <span style=\"flex:1\">D Vitamini: Güneşin Vitamini<div style=\"font-weight:400;color:var(--muted);font-size:11.5px;margin-top:2px\">Kemik ve bağışıklık için neden önemli, nasıl alınır?<\/div><\/span>\n              <span class=\"sv-art-car\" style=\"color:var(--muted);font-size:11px\">▾<\/span>\n            <\/summary>\n            <div style=\"padding:4px 16px 16px;border-top:1px solid var(--line-2)\">\n              \n              <p style=\"margin:0 0 8px;font-size:13px;line-height:1.7;color:var(--ink-2)\">D vitamini kalsiyumun emilimi, kemik ve kas sağlığı için gereklidir. Türkiye&#39;de eksikliği oldukça yaygındır.<\/p><div style=\"font-weight:700;color:var(--blue-700);font-size:13.5px;margin:14px 0 6px\">Nereden alınır?<\/div><ul style=\"margin:0 0 8px;padding-left:18px;font-size:13px;line-height:1.7\"><li>Güneş ışığı (cilt vitamin D üretir) — ancak mevsim, kıyafet ve güneş kremi miktarı etkiler.<\/li><li>Yağlı balık, yumurta sarısı ve D vitamini ile zenginleştirilmiş besinler.<\/li><\/ul><div style=\"font-weight:700;color:var(--blue-700);font-size:13.5px;margin:14px 0 6px\">Takviye gerekir mi?<\/div><p style=\"margin:0 0 8px;font-size:13px;line-height:1.7;color:var(--ink-2)\">Eksiklik kan tahliliyle anlaşılır. Doz kişiye göre değiştiği için takviyeye doktorunuzla birlikte karar vermek en doğrusudur.<\/p><p style=\"margin:0 0 8px;font-size:13px;line-height:1.7;color:var(--ink-2)\">Fazlası da zararlı olabileceğinden kendi başınıza yüksek doz kullanmayın.<\/p>\n              <p style=\"margin:10px 0 0;font-size:10.5px;color:var(--muted);font-style:italic\">📎 Kaynak: Güncel genel beslenme bilgisi ve yaygın kabul gören klinik beslenme kaynakları derlenerek hazırlanmıştır; kişisel tıbbi tavsiye yerine geçmez.<\/p>\n              <div style=\"display:flex;gap:8px;margin-top:10px\">\n                <button class=\"btn btn-sm\" type=\"button\" data-sv-art-docx=\"d-vitamini\" style=\"flex:1;justify-content:center\">⬇ Word<\/button>\n                <button class=\"btn btn-sm\" type=\"button\" data-sv-art-pdf=\"d-vitamini\" style=\"flex:1;justify-content:center\">⬇ PDF<\/button>\n              <\/div>\n            <\/div>\n          <\/details>\n          <details class=\"sv-art\" data-art-id=\"demir-anemi\" style=\"border:1px solid var(--line);border-radius:10px;margin-bottom:8px;overflow:hidden\">\n            <summary style=\"list-style:none;cursor:pointer;padding:11px 14px;display:flex;align-items:center;gap:10px;font-weight:600;font-size:13.5px\">\n              <span style=\"font-size:16px\">🩸<\/span>\n              <span style=\"flex:1\">Demir ve Anemi<div style=\"font-weight:400;color:var(--muted);font-size:11.5px;margin-top:2px\">Demir eksikliği belirtileri ve emilimi artıran ipuçları.<\/div><\/span>\n              <span class=\"sv-art-car\" style=\"color:var(--muted);font-size:11px\">▾<\/span>\n            <\/summary>\n            <div style=\"padding:4px 16px 16px;border-top:1px solid var(--line-2)\">\n              \n              <p style=\"margin:0 0 8px;font-size:13px;line-height:1.7;color:var(--ink-2)\">Demir, kanda oksijen taşıyan hemoglobinin yapısında bulunur. Eksikliğinde yorgunluk, halsizlik, solukluk ve çabuk nefes nefese kalma görülebilir.<\/p><div style=\"font-weight:700;color:var(--blue-700);font-size:13.5px;margin:14px 0 6px\">İyi kaynaklar<\/div><ul style=\"margin:0 0 8px;padding-left:18px;font-size:13px;line-height:1.7\"><li>Kırmızı et, karaciğer ve tavuk (hem demir, daha iyi emilir).<\/li><li>Mercimek, nohut, ıspanak, kuru kayısı (bitkisel demir).<\/li><\/ul><div style=\"font-weight:700;color:var(--blue-700);font-size:13.5px;margin:14px 0 6px\">Emilimi artırmak için<\/div><ul style=\"margin:0 0 8px;padding-left:18px;font-size:13px;line-height:1.7\"><li>Demir içeren yemeğin yanında limon, biber gibi C vitamini kaynakları tüketin.<\/li><li>Çay ve kahveyi yemekle birlikte değil, en az bir saat arayla için.<\/li><\/ul><p style=\"margin:0 0 8px;font-size:13px;line-height:1.7;color:var(--ink-2)\">Anemi şüphesinde mutlaka tahlil yaptırın; kendi başınıza demir takviyesi başlamayın.<\/p>\n              <p style=\"margin:10px 0 0;font-size:10.5px;color:var(--muted);font-style:italic\">📎 Kaynak: Güncel genel beslenme bilgisi ve yaygın kabul gören klinik beslenme kaynakları derlenerek hazırlanmıştır; kişisel tıbbi tavsiye yerine geçmez.<\/p>\n              <div style=\"display:flex;gap:8px;margin-top:10px\">\n                <button class=\"btn btn-sm\" type=\"button\" data-sv-art-docx=\"demir-anemi\" style=\"flex:1;justify-content:center\">⬇ Word<\/button>\n                <button class=\"btn btn-sm\" type=\"button\" data-sv-art-pdf=\"demir-anemi\" style=\"flex:1;justify-content:center\">⬇ PDF<\/button>\n              <\/div>\n            <\/div>\n          <\/details>\n          <details class=\"sv-art\" data-art-id=\"kalsiyum-kemik\" style=\"border:1px solid var(--line);border-radius:10px;margin-bottom:8px;overflow:hidden\">\n            <summary style=\"list-style:none;cursor:pointer;padding:11px 14px;display:flex;align-items:center;gap:10px;font-weight:600;font-size:13.5px\">\n              <span style=\"font-size:16px\">🦴<\/span>\n              <span style=\"flex:1\">Kalsiyum ve Kemik Sağlığı<div style=\"font-weight:400;color:var(--muted);font-size:11.5px;margin-top:2px\">Kemiklerinizi korumak için günlük kalsiyum.<\/div><\/span>\n              <span class=\"sv-art-car\" style=\"color:var(--muted);font-size:11px\">▾<\/span>\n            <\/summary>\n            <div style=\"padding:4px 16px 16px;border-top:1px solid var(--line-2)\">\n              \n              <p style=\"margin:0 0 8px;font-size:13px;line-height:1.7;color:var(--ink-2)\">Kemik kütlesinin büyük bölümü gençlik yıllarında kazanılır; ilerleyen yaşlarda amaç mevcut kemiği korumaktır.<\/p><div style=\"font-weight:700;color:var(--blue-700);font-size:13.5px;margin:14px 0 6px\">Kalsiyum kaynakları<\/div><ul style=\"margin:0 0 8px;padding-left:18px;font-size:13px;line-height:1.7\"><li>Süt, yoğurt, peynir ve kefir.<\/li><li>Susam (tahin), badem, yeşil yapraklı sebzeler ve kemiğiyle yenen balık.<\/li><\/ul><div style=\"font-weight:700;color:var(--blue-700);font-size:13.5px;margin:14px 0 6px\">Kemiğe iyi gelen alışkanlıklar<\/div><ul style=\"margin:0 0 8px;padding-left:18px;font-size:13px;line-height:1.7\"><li>D vitamini düzeyini yeterli tutmak.<\/li><li>Düzenli yük bindiren hareket (yürüyüş, direnç egzersizi).<\/li><li>Aşırı tuz, sigara ve fazla kafeinden kaçınmak.<\/li><\/ul><p style=\"margin:0 0 8px;font-size:13px;line-height:1.7;color:var(--ink-2)\">Yetişkinlerde günlük ihtiyaç genellikle 1000 mg civarındadır; kişisel ihtiyacınız için diyetisyeninize danışın.<\/p>\n              <p style=\"margin:10px 0 0;font-size:10.5px;color:var(--muted);font-style:italic\">📎 Kaynak: Güncel genel beslenme bilgisi ve yaygın kabul gören klinik beslenme kaynakları derlenerek hazırlanmıştır; kişisel tıbbi tavsiye yerine geçmez.<\/p>\n              <div style=\"display:flex;gap:8px;margin-top:10px\">\n                <button class=\"btn btn-sm\" type=\"button\" data-sv-art-docx=\"kalsiyum-kemik\" style=\"flex:1;justify-content:center\">⬇ Word<\/button>\n                <button class=\"btn btn-sm\" type=\"button\" data-sv-art-pdf=\"kalsiyum-kemik\" style=\"flex:1;justify-content:center\">⬇ PDF<\/button>\n              <\/div>\n            <\/div>\n          <\/details>\n          <details class=\"sv-art\" data-art-id=\"b12-vitamini\" style=\"border:1px solid var(--line);border-radius:10px;margin-bottom:8px;overflow:hidden\">\n            <summary style=\"list-style:none;cursor:pointer;padding:11px 14px;display:flex;align-items:center;gap:10px;font-weight:600;font-size:13.5px\">\n              <span style=\"font-size:16px\">🥚<\/span>\n              <span style=\"flex:1\">B12 Vitamini<div style=\"font-weight:400;color:var(--muted);font-size:11.5px;margin-top:2px\">Sinir sistemi ve kan yapımı için kritik bir vitamin.<\/div><\/span>\n              <span class=\"sv-art-car\" style=\"color:var(--muted);font-size:11px\">▾<\/span>\n            <\/summary>\n            <div style=\"padding:4px 16px 16px;border-top:1px solid var(--line-2)\">\n              \n              <p style=\"margin:0 0 8px;font-size:13px;line-height:1.7;color:var(--ink-2)\">B12 vitamini sinir hücreleri ve kırmızı kan hücrelerinin sağlığı için gereklidir. Neredeyse yalnızca hayvansal gıdalarda bulunur.<\/p><div style=\"font-weight:700;color:var(--blue-700);font-size:13.5px;margin:14px 0 6px\">Kimler risk altında?<\/div><ul style=\"margin:0 0 8px;padding-left:18px;font-size:13px;line-height:1.7\"><li>Vegan ve vejetaryenler.<\/li><li>Mide asidi düşük olanlar, ileri yaştakiler.<\/li><li>Uzun süre bazı mide ve şeker ilaçlarını kullananlar.<\/li><\/ul><div style=\"font-weight:700;color:var(--blue-700);font-size:13.5px;margin:14px 0 6px\">Belirtiler<\/div><p style=\"margin:0 0 8px;font-size:13px;line-height:1.7;color:var(--ink-2)\">Yorgunluk, el-ayak uyuşması, dilde yanma ve unutkanlık görülebilir.<\/p><p style=\"margin:0 0 8px;font-size:13px;line-height:1.7;color:var(--ink-2)\">Şüphe halinde kan değeri bakılmalı; gerekiyorsa tedaviyi doktor planlamalıdır.<\/p>\n              <p style=\"margin:10px 0 0;font-size:10.5px;color:var(--muted);font-style:italic\">📎 Kaynak: Güncel genel beslenme bilgisi ve yaygın kabul gören klinik beslenme kaynakları derlenerek hazırlanmıştır; kişisel tıbbi tavsiye yerine geçmez.<\/p>\n              <div style=\"display:flex;gap:8px;margin-top:10px\">\n                <button class=\"btn btn-sm\" type=\"button\" data-sv-art-docx=\"b12-vitamin btn-sm\" type=\"button\" data-sv-art-pdf=\"tuz-sodyum\" style=\"flex:1;justify-content:center\">⬇ PDF<\/button>\n              <\/div>\n            <\/div>\n          <\/details>\n          <details class=\"sv-art\" data-art-id=\"antioksidanlar\" style=\"border:1px solid var(--line);border-radius:10px;margin-bottom:8px;overflow:hidden\">\n            <summary style=\"list-style:none;cursor:pointer;padding:11px 14px;display:flex;align-items:center;gap:10px;font-weight:600;font-size:13.5px\">\n              <span style=\"font-size:16px\">🫐<\/span>\n              <span style=\"flex:1\">Antioksidanlar<div style=\"font-weight:400;color:var(--muted);font-size:11.5px;margin-top:2px\">Renkli sofranın gizli gücü.<\/div><\/span>\n              <span class=\"sv-art-car\" style=\"color:var(--muted);font-size:11px\">▾<\/span>\n            <\/summary>\n            <div style=\"padding:4px 16px 16px;border-top:1px solid var(--line-2)\">\n              \n              <p style=\"margin:0 0 8px;font-size:13px;line-height:1.7;color:var(--ink-2)\">Antioksidanlar, hücreleri zarar verici moleküllere (serbest radikaller) karşı korumaya yardımcı olan bileşiklerdir.<\/p><div style=\"font-weight:700;color:var(--blue-700);font-size:13.5px;margin:14px 0 6px\">Nerelerde bulunur?<\/div><ul style=\"margin:0 0 8px;padding-left:18px;font-size:13px;line-height:1.7\"><li>Yaban mersini, nar, çilek gibi renkli meyveler.<\/li><li>Domates, havuç, brokoli, ıspanak ve yeşil çay.<\/li><\/ul><div style=\"font-weight:700;color:var(--blue-700);font-size:13.5px;margin:14px 0 6px\">Önemli nokta<\/div><p style=\"margin:0 0 8px;font-size:13px;line-height:1.7;color:var(--ink-2)\">Faydası besinin bütününden gelir; tek bir &quot;süper gıda&quot; ya da hap yerine çeşitliliğe odaklanmak daha etkilidir.<\/p><p style=\"margin:0 0 8px;font-size:13px;line-height:1.7;color:var(--ink-2)\">Tabağınızda ne kadar çok renk varsa, o kadar çeşitli koruyucu bileşik almış olursunuz.<\/p>\n              <p style=\"margin:10px 0 0;font-size:10.5px;color:var(--muted);font-style:italic\">📎 Kaynak: Güncel genel beslenme bilgisi ve yaygın kabul gören klinik beslenme kaynakları derlenerek hazırlanmıştır; kişisel tıbbi tavsiye yerine geçmez.<\/p>\n              <div style=\"display:flex;gap:8px;margin-top:10px\">\n                <button class=\"btn btn-sm\" type=\"button\" data-sv-art-docx=\"antioksidanlar\" style=\"flex:1;justify-content:center\">⬇ Word<\/button>\n                <button class=\"btn btn-sm\" type=\"button\" data-sv-art-pdf=\"antioksidanlar\" style=\"flex:1;justify-content:center\">⬇ PDF<\/button>\n              <\/div>\n            <\/div>\n          <\/details>\n          <details class=\"sv-art\" data-art-id=\"probiyotik-prebiyotik\" style=\"border:1px solid var(--line);border-radius:10px;margin-bottom:8px;overflow:hidden\">\n            <summary style=\"list-style:none;cursor:pointer;padding:11px 14px;display:flex;align-items:center;gap:10px;font-weight:600;font-size:13.5px\">\n              <span style=\"font-size:16px\">🦠<\/span>\n              <span style=\"flex:1\">Probiyotik ve Prebiyotik<div style=\"font-weight:400;color:var(--muted);font-size:11.5px;margin-top:2px\">Bağırsak dostu besinler.<\/div><\/span>\n              <span class=\"sv-art-car\" style=\"color:var(--muted);font-size:11px\">▾<\/span>\n            <\/summary>\n            <div style=\"padding:4px 16px 16px;border-top:1px solid var(--line-2)\">\n              \n              <p style=\"margin:0 0 8px;font-size:13px;line-height:1.7;color:var(--ink-2)\">Probiyotikler yararlı canlı bakterilerdir; prebiyotikler ise bu bakterilerin besini olan liflerdir.<\/p><div style=\"font-weight:700;color:var(--blue-700);font-size:13.5px;margin:14px 0 6px\">Probiyotik kaynakları<\/div><p style=\"margin:0 0 8px;font-size:13px;line-height:1.7;color:var(--ink-2)\">Yoğurt, kefir, turşu (sirkesiz, fermente), ayran.<\/p><div style=\"font-weight:700;color:var(--blue-700);font-size:13.5px;margin:14px 0 6px\">Prebiyotik kaynakları<\/div><p style=\"margin:0 0 8px;font-size:13px;line-height:1.7;color:var(--ink-2)\">Soğan, sarımsak, pırasa, muz, yulaf ve baklagiller.<\/p><div style=\"font-weight:700;color:var(--blue-700);font-size:13.5px;margin:14px 0 6px\">Birlikte tüketin<\/div><p style=\"margin:0 0 8px;font-size:13px;line-height:1.7;color:var(--ink-2)\">İkisini aynı gün içinde almak bağırsak florasının çeşitliliğini destekler.<\/p><p style=\"margin:0 0 8px;font-size:13px;line-height:1.7;color:var(--ink-2)\">Bağırsak şikâyetleriniz uzun sürüyorsa kendi başınıza takviye yerine uzmana başvurun.<\/p>\n              <p style=\"margin:10px 0 0;font-size:10.5px;color:var(--muted);font-style:italic\">📎 Kaynak: Güncel genel beslenme bilgisi ve yaygın kabul gören klinik beslenme kaynakları derlenerek hazırlanmıştır; kişisel tıbbi tavsiye yerine geçmez.<\/p>\n              <div style=\"display:flex;gap:8px;margin-top:10px\">\n                <button class=\"btn btn-sm\" type=\"button\" data-sv-art-docx=\"probiyotik-prebiyotik\" style=\"flex:1;justify-content:center\">⬇ Word<\/button>\n                <button class=\"btn btn-sm\" type=\"button\" data-sv-art-pdf=\"probiyotik-prebiyotik\" style=\"flex:1;justify-content:center\">⬇ PDF<\/button>\n              <\/div>\n            <\/div>\n          <\/details>\n          <details class=\"sv-art\" data-art-id=\"glisemik-indeks\" style=\"border:1px solid var(--line);border-radius:10px;margin-bottom:8px;overflow:hidden\">\n            <summary style=\"list-style:none;cursor:pointer;padding:11px 14px;display:flex;align-items:center;gap:10px;font-weight:600;font-size:13.5px\">\n              <span style=\"font-size:16px\">📈<\/span>\n              <span style=\"flex:1\">Glisemik İndeks<div style=\"font-weight:400;color:var(--muted);font-size:11.5px;margin-top:2px\">Kan şekerini ne kadar hızlı yükselttiği.<\/div><\/span>\n              <span class=\"sv-art-car\" style=\"color:var(--muted);font-size:11px\">▾<\/span>\n            <\/summary>\n            <div style=\"padding:4px 16px 16px;border-top:1px solid var(--line-2)\">\n              \n              <p style=\"margin:0 0 8px;font-size:13px;line-height:1.7;color:var(--ink-2)\">Glisemik indeks (Gİ), bir besinin kan şekerini ne kadar hızlı yükselttiğini gösterir.<\/p><div style=\"font-weight:700;color:var(--blue-700);font-size:13.5px;margin:14px 0 6px\">Düşük Gİ&#39;li besinler<\/div><p style=\"margin:0 0 8px;font-size:13px;line-height:1.7;color:var(--ink-2)\">Baklagiller, yulaf, çoğu sebze, elma, yoğurt.<\/p><div style=\"font-weight:700;color:var(--blue-700);font-size:13.5px;margin:14px 0 6px\">Yüksek Gİ&#39;li besinler<\/div><p style=\"margin:0 0 8px;font-size:13px;line-height:1.7;color:var(--ink-2)\">Beyaz ekmek, pirinç pilavı, patates püresi, şekerli içecekler.<\/p><div style=\"font-weight:700;color:var(--blue-700);font-size:13.5px;margin:14px 0 6px\">Pratik ipucu<\/div><ul style=\"margin:0 0 8px;padding-left:18px;font-size:13px;line-height:1.7\"><li>Yüksek Gİ&#39;li bir besini lif, protein veya sağlıklı yağla birlikte yiyin.<\/li><li>Meyveyi meyve suyu yerine bütün olarak tercih edin.<\/li><\/ul><p style=\"margin:0 0 8px;font-size:13px;line-height:1.7;color:var(--ink-2)\">Gİ tek başına yeterli bir ölçüt değil; porsiyon ve öğün bileşimi de önemlidir.<\/p>\n              <p style=\"margin:10px 0 0;font-size:10.5px;color:var(--muted);font-style:italic\">📎 Kaynak: Güncel genel beslenme bilgisi ve yaygın kabul gören klinik beslenme kaynakları derlenerek hazırlanmıştır; kişisel tıbbi tavsiye yerine geçmez.<\/p>\n              <div style=\"display:flex;gap:8px;margin-top:10px\">\n                <button class=\"btn btn-sm\" type=\"button\" data-sv-art-docx=\"glisemik-indeks\" style=\"flex:1;justify-content:center\">⬇ Word<\/button>\n                <button class=\"btn btn-sm\" type=\"button\" data-sv-art-pdf=\"glisemik-indeks\" style=\"flex:1;justify-content:center\">⬇ PDF<\/button>\n              <\/div>\n            <\/div>\n          <\/details>\n          <details class=\"sv-art\" data-art-id=\"seker-tatlandirici\" style=\"border:1px solid var(--line);border-radius:10px;margin-bottom:8px;overflow:hidden\">\n            <summary style=\"list-style:none;cursor:pointer;padding:11px 14px;display:flex;align-items:center;gap:10px;font-weight:600;font-size:13.5px\">\n              <span style=\"font-size:16px\">🍬<\/span>\n              <span style=\"flex:1\">Şeker ve Tatlandırıcılar<div style=\"font-weight:400;color:var(--muted);font-size:11.5px;margin-top:2px\">Ne kadar şeker çok şeker?<\/div><\/span>\n              <span class=\"sv-art-car\" style=\"color:var(--muted);font-size:11px\">▾<\/span>\n            <\/summary>\n            <div style=\"padding:4px 16px 16px;border-top:1px solid var(--line-2)\">\n              \n              <p style=\"margin:0 0 8px;font-size:13px;line-height:1.7;color:var(--ink-2)\">Dünya Sağlık Örgütü, eklenmiş şekerin günlük enerjinin %10&#39;undan az, mümkünse %5&#39;inden az olmasını önerir. Bu, yetişkinde yaklaşık 25-50 gram demektir.<\/p><div style=\"font-weight:700;color:var(--blue-700);font-size:13.5px;margin:14px 0 6px\">Gizli şeker kaynakları<\/div><p style=\"margin:0 0 8px;font-size:13px;line-height:1.7;color:var(--ink-2)\">Meyveli yoğurt, hazır soslar, gazlı ve meyve aromalı içecekler, kahvaltılık gevrekler.<\/p><div style=\"font-weight:700;color:var(--blue-700);font-size:13.5px;margin:14px 0 6px\">Tatlandırıcılar<\/div><p style=\"margin:0 0 8px;font-size:13px;line-height:1.7;color:var(--ink-2)\">Kalorisiz tatlandırıcılar şekeri azaltmada geçici bir araç olabilir; ancak tatlı damak tadını değiştirmeden kalıcı çözüm olmaz.<\/p><p style=\"margin:0 0 8px;font-size:13px;line-height:1.7;color:var(--ink-2)\">Önce sıvı şekerleri (içecekleri) azaltmak en kolay ve en etkili adımlardan biridir.<\/p>\n              <p style=\"margin:10px 0 0;font-size:10.5px;color:var(--muted);font-style:italic\">📎 Kaynak: Güncel genel beslenme bilgisi ve yaygın kabul gören klinik beslenme kaynakları derlenerek hazırlanmıştır; kişisel tıbbi tavsiye yerine geçmez.<\/p>\n              <div style=\"display:flex;gap:8px;margin-top:10px\">\n                <button class=\"btn btn-sm\" type=\"button\" data-sv-art-docx=\"seker-tatlandirici\" style=\"flex:1;justify-content:center\">⬇ Word<\/button>\n                <button class=\"btn btn-sm\" type=\"button\" data-sv-art-pdf=\"seker-tatlandirici\" style=\"flex:1;justify-content:center\">⬇ PDF<\/button>\n              <\/div>\n            <\/div>\n          <\/details><\/div><\/details>\n        <details class=\"sv-artcat\" style=\"margin-top:12px\"><summary style=\"cursor:pointer;list-style:none;font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--blue-900);padding:9px 2px;border-bottom:1px solid var(--line)\">Hastalıklarda Beslenme <span style=\"color:var(--muted);font-weight:600\">· 15<\/span><\/summary><div style=\"padding-top:8px\">\n        \n          <details class=\"sv-art\" data-art-id=\"tip2-diyabet\" style=\"border:1px solid var(--line);border-radius:10px;margin-bottom:8px;overflow:hidden\">\n            <summary style=\"list-style:none;cursor:pointer;padding:11px 14px;display:flex;align-items:center;gap:10px;font-weight:600;font-size:13.5px\">\n              <span style=\"font-size:16px\">🩺<\/span>\n              <span style=\"flex:1\">Tip 2 Diyabet ve Beslenme<div style=\"font-weight:400;color:var(--muted);font-size:11.5px;margin-top:2px\">Kan şekeri dengesi için temel yaklaşımlar.<\/div><\/span>\n              <span class=\"sv-art-car\" style=\"color:var(--muted);font-size:11px\">▾<\/span>\n            <\/summary>\n            <div style=\"padding:4px 16px 16px;border-top:1px solid var(--line-2)\">\n              \n              <p style=\"margin:0 0 8px;font-size:13px;line-height:1.7;color:var(--ink-2)\">Tip 2 diyabette amaç kan şekerini dengede tutmak ve komplikasyon riskini azaltmaktır. Beslenme tedavinin önemli bir parçasıdır.<\/p><div style=\"font-weight:700;color:var(--blue-700);font-size:13.5px;margin:14px 0 6px\">Temel ilkeler<\/div><ul style=\"margin:0 0 8px;padding-left:18px;font-size:13px;line-height:1.7\"><li>Öğünleri düzenli saatlerde ve dengeli yiyin.<\/li><li>Karbonhidratı porsiyon kontrollü alın, lifli seçenekleri tercih edin.<\/li><li>Şekerli içecekleri ve rafine ürünleri azaltın.<\/li><li>Her öğüne protein ve sebze ekleyin.<\/li><\/ul><div style=\"font-weight:700;color:var(--blue-700);font-size:13.5px;margin:14px 0 6px\">Önemli<\/div><p style=\"margin:0 0 8px;font-size:13px;line-height:1.7;color:var(--ink-2)\">İlaç veya insülin kullanıyorsanız öğün planı hekiminizle birlikte yapılmalıdır; öğün atlamak kan şekerini düşürebilir.<\/p><p style=\"margin:0 0 8px;font-size:13px;line-height:1.7;color:var(--ink-2)\">Kişiye özel plan için diyetisyeninizle çalışın.<\/p>\n              <p style=\"margin:10px 0 0;font-size:10.5px;color:var(--muted);font-style:italic\">📎 Kaynak: Güncel genel beslenme bilgisi ve yaygın kabul gören klinik beslenme kaynakları derlenerek hazırlanmıştır; kişisel tıbbi tavsiye yerine geçmez.<\/p>\n              <div style=\"display:flex;gap:8px;margin-top:10px\">\n                <button class=\"btn btn-sm\" type=\"button\" data-sv-art-docx=\"tip2-diyabet\" style=\"flex:1;justify-content:center\">⬇ Word<\/button>\n                <button class=\"btn btn-sm\" type=\"button\" data-sv-art-pdf=\"tip2-diyabet\" style=\"flex:1;justify-content:center\">⬇ PDF<\/button>\n              <\/div>\n            <\/div>\n          <\/details>\n          <details class=\"sv-art\" data-art-id=\"tansiyon-dash\" style=\"border:1px solid var(--line);border-radius:10px;margin-bottom:8px;overflow:hidden\">\n            <summary style=\"list-style:none;cursor:pointer;padding:11px 14px;display:flex;align-items:center;gap:10px;font-weight:600;font-size:13.5px\">\n              <span style=\"font-size:16px\">💓<\/span>\n              <span style=\"flex:1\">Yüksek Tansiyon ve DASH Diyeti<div style=\"font-weight:400;color:var(--muted);font-size:11.5px;margin-top:2px\">Tansiyonu beslenmeyle desteklemek.<\/div><\/span>\n              <span class=\"sv-art-car\" style=\"color:var(--muted);font-size:11px\">▾<\/span>\n            <\/summary>\n            <div style=\"padding:4px 16px 16px;border-top:1px solid var(--line-2)\">\n              \n              <p style=\"margin:0 0 8px;font-size:13px;line-height:1.7;color:var(--ink-2)\">DASH diyeti, yüksek tansiyonu desteklemek için geliştirilmiş; sebze, meyve, tam tahıl ve az yağlı süt ürünlerine dayanan bir beslenme biçimidir.<\/p><div style=\"font-weight:700;color:var(--blue-700);font-size:13.5px;margin:14px 0 6px\">Ana ilkeler<\/div><ul style=\"margin:0 0 8px;padding-left:18px;font-size:13px;line-height:1.7\"><li>Tuzu azaltın.<\/li><li>Günde en az 5 porsiyon sebze-meyve tüketin.<\/li><li>Tam tahıl, baklagil ve kuruyemişi artırın.<\/li><li>İşlenmiş et ve şekeri azaltın.<\/li><\/ul><div style=\"font-weight:700;color:var(--blue-700);font-size:13.5px;margin:14px 0 6px\">Hareket<\/div><p style=\"margin:0 0 8px;font-size:13px;line-height:1.7;color:var(--ink-2)\">Haftada en az 150 dakika tempolu yürüyüş tansiyon kontrolüne katkı sağlar.<\/p><p style=\"margin:0 0 8px;font-size:13px;line-height:1.7;color:var(--ink-2)\">Tansiyon ilacı kullanıyorsanız ilaçları kendi kararınızla bırakmayın.<\/p>\n              <p style=\"margin:10px 0 0;font-size:10.5px;color:var(--muted);font-style:italic\">📎 Kaynak: Güncel genel beslenme bilgisi ve yaygın kabul gören klinik beslenme kaynakları derlenerek hazırlanmıştır; kişisel tıbbi tavsiye yerine geçmez.<\/p>\n              <div style=\"display:flex;gap:8px;margin-top:10px\">\n                <button class=\"btn btn-sm\" type=\"button\" data-sv-art-docx=\"tansiyon-dash\" style=\"flex:1;justify-content:center\">⬇ Word<\/button>\n                <button class=\"btn btn-sm\" type=\"button\" data-sv-art-pdf=\"tansiyon-dash\" style=\"flex:1;justify-content:center\">⬇ PDF<\/button>\n              <\/div>\n            <\/div>\n          <\/details>\n          <details class=\"sv-art\" data-art-id=\"kolesterol\" style=\"border:1px solid var(--line);border-radius:10px;margin-bottom:8px;overflow:hidden\">\n            <summary style=\"list-style:none;cursor:pointer;padding:11px 14px;display:flex;align-items:center;gap:10px;font-weight:600;font-size:13.5px\">\n              <span style=\"font-size:16px\">🫀<\/span>\n              <span style=\"flex:1\">Kolesterol ve Kalp Sağlığı<div style=\"font-weight:400;color:var(--muted);font-size:11.5px;margin-top:2px\">LDL, HDL ve beslenme.<\/div><\/span>\n              <span class=\"sv-art-car\" style=\"color:var(--muted);font-size:11px\">▾<\/span>\n            <\/summary>\n            <div style=\"padding:4px 16px 16px;border-top:1px solid var(--line-2)\">\n              \n              <p style=\"margin:0 0 8px;font-size:13px;line-height:1.7;color:var(--ink-2)\">Kolesterolün büyük kısmı karaciğerde üretilir; beslenme, özellikle doymuş yağ ve lif miktarı bu dengeyi etkiler.<\/p><div style=\"font-weight:700;color:var(--blue-700);font-size:13.5px;margin:14px 0 6px\">LDL&#39;yi düşürmeye yardımcı olanlar<\/div><ul style=\"margin:0 0 8px;padding-left:18px;font-size:13px;line-height:1.7\"><li>Yulaf, arpa ve baklagil gibi çözünür lifler.<\/li><li>Zeytinyağı, ceviz, badem.<\/li><li>Haftada iki öğün balık.<\/li><\/ul><div style=\"font-weight:700;color:var(--blue-700);font-size:13.5px;margin:14px 0 6px\">Azaltılması gerekenler<\/div><p style=\"margin:0 0 8px;font-size:13px;line-height:1.7;color:var(--ink-2)\">Trans yağ, işlenmiş et ve sık kızartma.<\/p><p style=\"margin:0 0 8px;font-size:13px;line-height:1.7;color:var(--ink-2)\">Yumurta çoğu kişide ölçülü tüketildiğinde sorun değildir; ancak yüksek riskli kişiler hekimlerine danışmalıdır.<\/p>\n              <p style=\"margin:10px 0 0;font-size:10.5px;color:var(--muted);font-style:italic\">📎 Kaynak: Güncel genel beslenme bilgisi ve yaygın kabul gören klinik beslenme kaynakları derlenerek hazırlanmıştır; kişisel tıbbi tavsiye yerine geçmez.<\/p>\n              <div style=\"display:flex;gap:8px;margin-top:10px\">\n                <button class=\"btn btn-sm\" type=\"button\" data-sv-art-docx=\"kolesterol\" style=\"flex:1;justify-content:center\">⬇ Word<\/button>\n                <button class=\"btn btn-sm\" type=\"button\" data-sv-art-pdf=\"kolesterol\" style=\"flex:1;justify-content:center\">⬇ PDF<\/button>\n              <\/div>\n            <\/div>\n          <\/details>\n          <details class=\"sv-art\" data-art-id=\"karaciger-yaglanma\" style=\"border:1px solid var(--line);border-radius:10px;margin-bottom:8px;overflow:hidden\">\n            <summary style=\"list-style:none;cursor:pointer;padding:11px 14px;display:flex;align-items:center;gap:10px;font-weight:600;font-size:13.5px\">\n              <span style=\"font-size:16px\">🫁<\/span>\n              <span style=\"flex:1\">Karaciğer Yağlanması<div style=\"font-weight:400;color:var(--muted);font-size:11.5px;margin-top:2px\">Beslenme ve kilo kontrolüyle iyileştirmek mümkün.<\/div><\/span>\n              <span class=\"sv-art-car\" style=\"color:var(--muted);font-size:11px\">▾<\/span>\n            <\/summary>\n            <div style=\"padding:4px 16px 16px;border-top:1px solid var(--line-2)\">\n              \n              <p style=\"margin:0 0 8px;font-size:13px;line-height:1.7;color:var(--ink-2)\">Alkole bağlı olmayan yağlı karaciğer hastalığı artık çok yaygındır ve genellikle kilo, insülin direnci ve beslenme ile ilişkilidir.<\/p><div style=\"font-weight:700;color:var(--blue-700);font-size:13.5px;margin:14px 0 6px\">Faydalı adımlar<\/div><ul style=\"margin:0 0 8px;padding-left:18px;font-size:13px;line-height:1.7\"><li>Vücut ağırlığının %5-10&#39;unu yavaş yavaş vermek karaciğer yağını belirgin azaltabilir.<\/li><li>Şekerli içecekleri ve rafine karbonhidratı azaltmak.<\/li><li>Akdeniz tarzı beslenmeyi benimsemek.<\/li><li>Düzenli hareket etmek.<\/li><\/ul><div style=\"font-weight:700;color:var(--blue-700);font-size:13.5px;margin:14px 0 6px\">Kaçınılması gereken<\/div><p style=\"margin:0 0 8px;font-size:13px;line-height:1.7;color:var(--ink-2)\">Çok hızlı kilo kaybı ve mucize detoks ürünleri karaciğeri yorabilir.<\/p><p style=\"margin:0 0 8px;font-size:13px;line-height:1.7;color:var(--ink-2)\">Tanı ve takip için mutlaka hekiminize başvurun.<\/p>\n              <p style=\"margin:10px 0 0;font-size:10.5px;color:var(--muted);font-style:italic\">📎 Kaynak: Güncel genel beslenme bilgisi ve yaygın kabul gören klinik beslenme kaynakları derlenerek hazırlanmıştır; kişisel tıbbi tavsiye yerine geçmez.<\/p>\n              <div style=\"display:flex;gap:8px;margin-top:10px\">\n                <button class=\"btn btn-sm\" type=\"button\" data-sv-art-docx=\"karaciger-yaglanma\" style=\"flex:1;justify-content:center\">⬇ Word<\/button>\n                <button class=\"btn btn-sm\" type=\"button\" data-sv-art-pdf=\"karaciger-yaglanma\" style=\"flex:1;justify-content:center\">⬇ PDF<\/button>\n              <\/div>\n            <\/div>\n          <\/details>\n          <details class=\"sv-art\" data-art-id=\"reflu\" style=\"border:1px solid var(--line);border-radius:10px;margin-bottom:8px;overflow:hidden\">\n            <summary style=\"list-style:none;cursor:pointer;padding:11px 14px;display:flex;align-items:center;gap:10px;font-weight:600;font-size:13.5px\">\n              <span style=\"font-size:16px\">🔥<\/span>\n              <span style=\"flex:1\">Reflü ve Mide Yanması<div style=\"font-weight:400;color:var(--muted);font-size:11.5px;margin-top:2px\">Şikâyetleri azaltan alışkanlıklar.<\/div><\/span>\n              <span class=\"sv-art-car\" style=\"color:var(--muted);font-size:11px\">▾<\/span>\n            <\/summary>\n            <div style=\"padding:4px 16px 16px;border-top:1px solid var(--line-2)\">\n              \n              <p style=\"margin:0 0 8px;font-size:13px;line-height:1.7;color:var(--ink-2)\">Reflüde mide içeriği yemek borusuna kaçar; yanma, ekşime ve göğüste rahatsızlık yapar.<\/p><div style=\"font-weight:700;color:var(--blue-700);font-size:13.5px;margin:14px 0 6px\">Yardımcı olabilecekler<\/div><ul style=\"margin:0 0 8px;padding-left:18px;font-size:13px;line-height:1.7\"><li>Küçük ve sık öğünler yemek.<\/li><li>Yattıktan hemen önce yemek yememek (en az 2-3 saat ara).<\/li><li>Fazla kiloyu vermek.<\/li><li>Yatak başını hafif yükseltmek.<\/li><\/ul><div style=\"font-weight:700;color:var(--blue-700);font-size:13.5px;margin:14px 0 6px\">Tetikleyici olabilecekler<\/div><p style=\"margin:0 0 8px;font-size:13px;line-height:1.7;color:var(--ink-2)\">Yağlı ve kızartma yemekler, çikolata, kahve, gazlı içecek, baharatlı ve çok asitli besinler (kişiden kişiye değişir).<\/p><p style=\"margin:0 0 8px;font-size:13px;line-height:1.7;color:var(--ink-2)\">Şikâyetler sıkça tekrarlıyorsa muayene gereklidir.<\/p>\n              <p style=\"margin:10px 0 0;font-size:10.5px;color:var(--muted);font-style:italic\">📎 Kaynak: Güncel genel beslenme bilgisi ve yaygın kabul gören klinik beslenme kaynakları derlenerek hazırlanmıştır; kişisel tıbbi tavsiye yerine geçmez.<\/p>\n              <div style=\"display:flex;gap:8px;margin-top:10px\">\n                <button class=\"btn btn-sm\" type=\"button\" data-sv-art-docx=\"reflu\" style=\"flex:1;justify-content:center\">⬇ Word<\/button>\n                <button class=\"btn btn-sm\" type=\"button\" data-sv-art-pdf=\"reflu\" style=\"flex:1;justify-content:center\">⬇ PDF<\/button>\n              <\/div>\n            <\/div>\n          <\/details>\n          <details class=\"sv-art\" data-art-id=\"gastrit\" style=\"border:1px solid var(--line);border-radius:10px;margin-bottom:8px;overflow:hidden\">\n            <summary style=\"list-style:none;cursor:pointer;padding:11px 14px;display:flex;align-items:center;gap:10px;font-weight:600;font-size:13.5px\">\n              <span style=\"font-size:16px\">🥣<\/span>\n              <span style=\"flex:1\">Gastrit ve Mide Hassasiyeti<div style=\"font-weight:400;color:var(--muted);font-size:11.5px;margin-top:2px\">Mideyi yormayan beslenme.<\/div><\/span>\n              <span class=\"sv-art-car\" style=\"color:var(--muted);font-size:11px\">▾<\/span>\n            <\/summary>\n            <div style=\"padding:4px 16px 16px;border-top:1px solid var(--line-2)\">\n              \n              <p style=\"margin:0 0 8px;font-size:13px;line-height:1.7;color:var(--ink-2)\">Gastrit, mide mukozasının iltihaplanmasıdır. Nedeni bazen bakteri (H. pylori), bazen ilaç ya da stres olabilir; tedavi hekim kontrolündedir.<\/p><div style=\"font-weight:700;color:var(--blue-700);font-size:13.5px;margin:14px 0 6px\">Beslenmede dikkat<\/div><ul style=\"margin:0 0 8px;padding-left:18px;font-size:13px;line-height:1.7\"><li>Öğünleri atlamamak, yavaş yemek.<\/li><li>Haşlama, fırın ve buğulama gibi hafif pişirme yöntemleri.<\/li><li>Alkol, sigara ve aşırı acıdan uzak durmak.<\/li><\/ul><div style=\"font-weight:700;color:var(--blue-700);font-size:13.5px;margin:14px 0 6px\">Kişisel tolerans<\/div><p style=\"margin:0 0 8px;font-size:13px;line-height:1.7;color:var(--ink-2)\">Her kişide tetikleyici farklıdır; hangi besinin rahatsız ettiğini not ederek bulabilirsiniz.<\/p><p style=\"margin:0 0 8px;font-size:13px;line-height:1.7;color:var(--ink-2)\">Kilo kaybı, kanlı kusma veya siyah dışkı varsa acilen hekime başvurun.<\/p>\n              <p style=\"margin:10px 0 0;font-size:10.5px;color:var(--muted);font-style:italic\">📎 Kaynak: Güncel genel beslenme bilgisi ve yaygın kabul gören klinik beslenme kaynakları derlenerek hazırlanmıştır; kişisel tıbbi tavsiye yerine geçmez.<\/p>\n              <div style=\"display:flex;gap:8px;margin-top:10px\">\n                <button class=\"btn btn-sm\" type=\"button\" data-sv-art-docx=\"gastrit\" style=\"flex:1;justify-content:center\">⬇ Word<\/button>\n                <button class=\"btn btn-sm\" type=\"button\" data-sv-art-pdf=\"gastrit\" style=\"flex:1;justify-content:center\">⬇ PDF<\/button>\n              <\/div>\n            <\/div>\n          <\/details>\n          <details class=\"sv-art\" data-art-id=\"ibs\" style=\"border:1px solid var(--line);border-radius:10px;margin-bottom:8px;overflow:hidden\">\n            <summary style=\"list-style:none;cursor:pointer;padding:11px 14px;display:flex;align-items:center;gap:10px;font-weight:600;font-size:13.5px\">\n              <span style=\"font-size:16px\">🌀<\/span>\n              <span style=\"flex:1\">İrritabl Bağırsak Sendromu (IBS)<div style=\"font-weight:400;color:var(--muted);font-size:11.5px;margin-top:2px\">Şişkinlik ve düzensiz bağırsak için beslenme ipuçları.<\/div><\/span>\n              <span class=\"sv-art-car\" style=\"color:var(--muted);font-size:11px\">▾<\/span>\n            <\/summary>\n            <div style=\"padding:4px 16px 16px;border-top:1px solid var(--line-2)\">\n              \n              <p style=\"margin:0 0 8px;font-size:13px;line-height:1.7;color:var(--ink-2)\">IBS karın ağrısı, şişkinlik, kabızlık ve/veya ishal ile seyreden, çok yaygın bir fonksiyonel bağırsak rahatsızlığıdır.<\/p><div style=\"font-weight:700;color:var(--blue-700);font-size:13.5px;margin:14px 0 6px\">Faydalı olabilecek yaklaşımlar<\/div><ul style=\"margin:0 0 8px;padding-left:18px;font-size:13px;line-height:1.7\"><li>Düzenli ve yavaş yemek.<\/li><li>Tetikleyici besinleri günlük tutarak belirlemek.<\/li><li>Stres yönetimi ve uyku düzeni.<\/li><li>Gerektiğinde uzman gözetiminde düşük FODMAP planı denemek.<\/li><\/ul><div style=\"font-weight:700;color:var(--blue-700);font-size:13.5px;margin:14px 0 6px\">Uyarı<\/div><p style=\"margin:0 0 8px;font-size:13px;line-height:1.7;color:var(--ink-2)\">Düşük FODMAP diyeti uzun süre ve kontrolsüz uygulanmamalı, mutlaka diyetisyen eşliğinde yapılmalıdır.<\/p><p style=\"margin:0 0 8px;font-size:13px;line-height:1.7;color:var(--ink-2)\">Alarm belirtileri (kilo kaybı, kanlı dışkı, gece şikâyeti) varsa vakit kaybetmeden doktora gidin.<\/p>\n              <p style=\"margin:10px 0 0;font-size:10.5px;color:var(--muted);font-style:italic\">📎 Kaynak: Güncel genel beslenme bilgisi ve yaygın kabul gören klinik beslenme kaynakları derlenerek hazırlanmıştır; kişisel tıbbi tavsiye yerine geçmez.<\/p>\n              <div style=\"display:flex;gap:8px;margin-top:10px\">\n                <button class=\"btn btn-sm\" type=\"button\" data-sv-art-docx=\"ibs\" style=\"flex:1;justify-content:center\">⬇ Word<\/button>\n                <button class=\"btn btn-sm\" type=\"button\" data-sv-art-pdf=\"ibs\" style=\"flex:1;justify-content:center\">⬇ PDF<\/button>\n              <\/div>\n            <\/div>\n          <\/details>\n          <details class=\"sv-art\" data-art-id=\"colyak-gluten\" style=\"border:1px solid var(--line);border-radius:10px;margin-bottom:8px;overflow:hidden\">\n            <summary style=\"list-style:none;cursor:pointer;padding:11px 14px;display:flex;align-items:center;gap:10px;font-weight:600;font-size:13.5px\">\n              <span style=\"font-size:16px\">🌾<\/span>\n              <span style=\"flex:1\">Çölyak ve Glutensiz Beslenme<div style=\"font-weight:400;color:var(--muted);font-size:11.5px;margin-top:2px\">Gluten ne zaman sorun olur?<\/div><\/span>\n              <span class=\"sv-art-car\" style=\"color:var(--muted);font-size:11px\">▾<\/span>\n            <\/summary>\n            <div style=\"padding:4px 16px 16px;border-top:1px solid var(--line-2)\">\n              \n              <p style=\"margin:0 0 8px;font-size:13px;line-height:1.7;color:var(--ink-2)\">Çölyak, glutenin ince bağırsağa zarar verdiği otoimmün bir hastalıktır. Tek tedavisi yaşam boyu glutensiz beslenmedir.<\/p><div style=\"font-weight:700;color:var(--blue-700);font-size:13.5px;margin:14px 0 6px\">Gluten nerede bulunur?<\/div><p style=\"margin:0 0 8px;font-size:13px;line-height:1.7;color:var(--ink-2)\">Buğday, arpa ve çavdar ile bunlardan yapılan ekmek, makarna, bulgur ve birçok hazır ürün.<\/p><div style=\"font-weight:700;color:var(--blue-700);font-size:13.5px;margin:14px 0 6px\">Glutensiz olanlar<\/div><p style=\"margin:0 0 8px;font-size:13px;line-height:1.7;color:var(--ink-2)\">Pirinç, mısır, patates, baklagiller, et, süt ürünleri, sebze-meyve ve sertifikalı glutensiz ürünler.<\/p><div style=\"font-weight:700;color:var(--blue-700);font-size:13.5px;margin:14px 0 6px\">Önemli<\/div><p style=\"margin:0 0 8px;font-size:13px;line-height:1.7;color:var(--ink-2)\">Teşhis konmadan glutensiz beslenmeye başlamayın; tetkik sonucunu bozabilir.<\/p><p style=\"margin:0 0 8px;font-size:13px;line-height:1.7;color:var(--ink-2)\">Etiket okumak ve çapraz bulaşmaya dikkat etmek çok önemlidir.<\/p>\n              <p style=\"margin:10px 0 0;font-size:10.5px;color:var(--muted);font-style:italic\">📎 Kaynak: Güncel genel beslenme bilgisi ve yaygın kabul gören klinik beslenme kaynakları derlenerek hazırlanmıştır; kişisel tıbbi tavsiye yerine geçmez.<\/p>\n              <div style=\"display:flex;gap:8px;margin-top:10px\">\n                <button class=\"btn btn-sm\" type=\"button\" data-sv-art-docx=\"colyak-gluten\" style=\"flex:1;justify-content:center\">⬇ Word<\/button>\n                <button class=\"btn btn-sm\" type=\"button\" data-sv-art-pdf=\"colyak-gluten\" style=\"flex:1;justify-content:center\">⬇ PDF<\/button>\n              <\/div>\n            <\/div>\n          <\/details>\n          <details class=\"sv-art\" data-art-id=\"laktoz-intoleransi\" style=\"border:1px solid var(--line);border-radius:10px;margin-bottom:8px;overflow:hidden\">\n            <summary style=\"list-style:none;cursor:pointer;padding:11px 14px;display:flex;align-items:center;gap:10px;font-weight:600;font-size:13.5px\">\n              <span style=\"font-size:16px\">🥛<\/span>\n              <span style=\"flex:1\">Laktoz İntoleransı<div style=\"font-weight:400;color:var(--muted);font-size:11.5px;margin-top:2px\">Süt sorun mu yaratıyor?<\/div><\/span>\n              <span class=\"sv-art-car\" style=\"color:var(--muted);font-size:11px\">▾<\/span>\n            <\/summary>\n            <div style=\"padding:4px 16px 16px;border-top:1px solid var(--line-2)\">\n              \n              <p style=\"margin:0 0 8px;font-size:13px;line-height:1.7;color:var(--ink-2)\">Laktoz intoleransı, süt şekeri olan laktozu parçalayan enzimin az olması durumudur; süt içtikten sonra şişkinlik, gaz ve ishal yapabilir.<\/p><div style=\"font-weight:700;color:var(--blue-700);font-size:13.5px;margin:14px 0 6px\">Neler yapılabilir?<\/div><ul style=\"margin:0 0 8px;padding-left:18px;font-size:13px;line-height:1.7\"><li>Yoğurt, kefir ve olgun peynirler genellikle daha iyi tolere edilir.<\/li><li>Laktozsuz süt ve ürünleri tercih edilebilir.<\/li><li>Süt ürünlerini azar azar ve yemekle birlikte denemek.<\/li><\/ul><div style=\"font-weight:700;color:var(--blue-700);font-size:13.5px;margin:14px 0 6px\">Kalsiyum<\/div><p style=\"margin:0 0 8px;font-size:13px;line-height:1.7;color:var(--ink-2)\">Süt ürünleri azaltılıyorsa kalsiyum açığı olmaması için alternatif kaynaklar planlanmalıdır.<\/p><p style=\"margin:0 0 8px;font-size:13px;line-height:1.7;color:var(--ink-2)\">Süt alerjisi ile intolerans farklı şeylerdir; şüphe varsa hekime başvurun.<\/p>\n              <p style=\"margin:10px 0 0;font-size:10.5px;color:var(--muted);font-style:italic\">📎 Kaynak: Güncel genel beslenme bilgisi ve yaygın kabul gören klinik beslenme kaynakları derlenerek hazırlanmıştır; kişisel tıbbi tavsiye yerine geçmez.<\/p>\n              <div style=\"display:flex;gap:8px;margin-top:10px\">\n                <button class=\"btn btn-sm\" type=\"button\" data-sv-art-docx=\"laktoz-intoleransi\" style=\"flex:1;justify-content:center\">⬇ Word<\/button>\n                <button class=\"btn btn-sm\" type=\"button\" data-sv-art-pdf=\"laktoz-intoleransi\" style=\"flex:1;justify-content:center\">⬇ PDF<\/button>\n              <\/div>\n            <\/div>\n          <\/details>\n          <details class=\"sv-art\" data-art-id=\"gut-urik-asit\" style=\"border:1px solid var(--line);border-radius:10px;margin-bottom:8px;overflow:hidden\">\n            <summary style=\"list-style:none;cursor:pointer;padding:11px 14px;display:flex;align-items:center;gap:10px;font-weight:600;font-size:13.5px\">\n              <span style=\"font-size:16px\">🦶<\/span>\n              <span style=\"flex:1\">Gut ve Ürik Asit<div style=\"font-weight:400;color:var(--muted);font-size:11.5px;margin-top:2px\">Ürik asit yüksekliğinde beslenme.<\/div><\/span>\n              <span class=\"sv-art-car\" style=\"color:var(--muted);font-size:11px\">▾<\/span>\n            <\/summary>\n            <div style=\"padding:4px 16px 16px;border-top:1px solid var(--line-2)\">\n              \n              <p style=\"margin:0 0 8px;font-size:13px;line-height:1.7;color:var(--ink-2)\">Gut, kandaki ürik asit yükselmesiyle eklemlerde ani ağrı ve şişlik atakları yapan bir hastalıktır.<\/p><div style=\"font-weight:700;color:var(--blue-700);font-size:13.5px;margin:14px 0 6px\">Dikkat edilecekler<\/div><ul style=\"margin:0 0 8px;padding-left:18px;font-size:13px;line-height:1.7\"><li>Sakatat, kırmızı et ve bazı deniz ürünlerini sınırlamak.<\/li><li>Alkolden (özellikle bira) kaçınmak.<\/li><li>Fruktozlu şekerli içeceklerden uzak durmak.<\/li><li>Bol su içmek.<\/li><\/ul><div style=\"font-weight:700;color:var(--blue-700);font-size:13.5px;margin:14px 0 6px\">Kilo<\/div><p style=\"margin:0 0 8px;font-size:13px;line-height:1.7;color:var(--ink-2)\">Yavaş ve kontrollü kilo vermek ataklarını azaltabilir; aşırı hızlı kilo kaybı ise tetikleyebilir.<\/p><p style=\"margin:0 0 8px;font-size:13px;line-height:1.7;color:var(--ink-2)\">İlaç tedavisi hekim tarafından düzenlenir; beslenme bunu destekleyici bir unsurdur.<\/p>\n              <p style=\"margin:10px 0 0;font-size:10.5px;color:var(--muted);font-style:italic\">📎 Kaynak: Güncel genel beslenme bilgisi ve yaygın kabul gören klinik beslenme kaynakları derlenerek hazırlanmıştır; kişisel tıbbi tavsiye yerine geçmez.<\/p>\n              <div style=\"display:flex;gap:8px;margin-top:10px\">\n                <button class=\"btn btn-sm\" type=\"button\" data-sv-art-docx=\"gut-urik-asit\" style=\"flex:1;justify-content:center\">⬇ Word<\/button>\n                <button class=\"btn btn-sm\" type=\"button\" data-sv-art-pdf=\"gut-urik-asit\" style=\"flex:1;justify-content:center\">⬇ PDF<\/button>\n              <\/div>\n            <\/div>\n          <\/details>\n          <details class=\"sv-art\" data-art-id=\"kabizlik-beslenme\" style=\"border:1px solid var(--line);border-radius:10px;margin-bottom:8px;overflow:hidden\">\n            <summary style=\"list-style:none;cursor:pointer;padding:11px 14px;display:flex;align-items:center;gap:10px;font-weight:600;font-size:13.5px\">\n              <span style=\"font-size:16px\">🚽<\/span>\n              <span style=\"flex:1\">Kabızlık İçin Beslenme<div style=\"font-weight:400;color:var(--muted);font-size:11.5px;margin-top:2px\">Bağırsakları doğal yoldan çalıştırmak.<\/div><\/span>\n              <span class=\"sv-art-car\" style=\"color:var(--muted);font-size:11px\">▾<\/span>\n            <\/summary>\n            <div style=\"padding:4px 16px 16px;border-top:1px solid var(--line-2)\">\n              \n              <p style=\"margin:0 0 8px;font-size:13px;line-height:1.7;color:var(--ink-2)\">Kabızlık en sık lif ve su azlığı, hareketsizlik ve düzensiz tuvalet alışkanlığıyla ilişkilidir.<\/p><div style=\"font-weight:700;color:var(--blue-700);font-size:13.5px;margin:14px 0 6px\">Ne yapılabilir?<\/div><ul style=\"margin:0 0 8px;padding-left:18px;font-size:13px;line-height:1.7\"><li>Günde 25-30 gram lif hedefleyin (sebze, meyve, tam tahıl, baklagil).<\/li><li>Lifi yavaş artırın, aynı anda suyu da artırın.<\/li><li>Kuru kayısı, erik ve keten tohumu faydalı olabilir.<\/li><li>Düzenli yürüyüş yapın.<\/li><\/ul><div style=\"font-weight:700;color:var(--blue-700);font-size:13.5px;margin:14px 0 6px\">Alışkanlık<\/div><p style=\"margin:0 0 8px;font-size:13px;line-height:1.7;color:var(--ink-2)\">Her gün aynı saatte tuvalet için zaman ayırmak bağırsak ritmini oturtur.<\/p><p style=\"margin:0 0 8px;font-size:13px;line-height:1.7;color:var(--ink-2)\">Uzun süren veya yeni başlayan kabızlıkta doktora başvurun.<\/p>\n              <p style=\"margin:10px 0 0;font-size:10.5px;color:var(--muted);font-style:italic\">📎 Kaynak: Güncel genel beslenme bilgisi ve yaygın kabul gören klinik beslenme kaynakları derlenerek hazırlanmıştır; kişisel tıbbi tavsiye yerine geçmez.<\/p>\n              <div style=\"display:flex;gap:8px;margin-top:10px\">\n                <button class=\"btn btn-sm\" type=\"button\" data-sv-art-docx=\"kabizlik-beslenme\" style=\"flex:1;justify-content:center\">⬇ Word<\/button>\n                <button class=\"btn btn-sm\" type=\"button\" data-sv-art-pdf=\"kabizlik-beslenme\" style=\"flex:1;justify-content:center\">⬇ PDF<\/button>\n              <\/div>\n            <\/div>\n          <\/details>\n          <details class=\"sv-art\" data-art-id=\"bobrek-beslenme\" style=\"border:1px solid var(--line);border-radius:10px;margin-bottom:8px;overflow:hidden\">\n            <summary style=\"list-style:none;cursor:pointer;padding:11px 14px;display:flex;align-items:center;gap:10px;font-weight:600;font-size:13.5px\">\n              <span style=\"font-size:16px\">🧪<\/span>\n              <span style=\"flex:1\">Böbrek Sağlığı ve Beslenme<div style=\"font-weight:400;color:var(--muted);font-size:11.5px;margin-top:2px\">Böbreği korumak için temel bilgiler.<\/div><\/span>\n              <span class=\"sv-art-car\" style=\"color:var(--muted);font-size:11px\">▾<\/span>\n            <\/summary>\n            <div style=\"padding:4px 16px 16px;border-top:1px solid var(--line-2)\">\n              \n              <p style=\"margin:0 0 8px;font-size:13px;line-height:1.7;color:var(--ink-2)\">Böbrekler kandaki atıkları süzer. Sağlıklı beslenme, tansiyon ve kan şekeri kontrolü böbrek korumasının temelidir.<\/p><div style=\"font-weight:700;color:var(--blue-700);font-size:13.5px;margin:14px 0 6px\">Koruyucu alışkanlıklar<\/div><ul style=\"margin:0 0 8px;padding-left:18px;font-size:13px;line-height:1.7\"><li>Tuzu azaltmak.<\/li><li>Yeterli sıvı almak (hekimin kısıtlaması yoksa).<\/li><li>Ağrı kesicileri gereksiz ve sık kullanmamak.<\/li><li>Aşırı protein takviyelerinden kaçınmak.<\/li><\/ul><div style=\"font-weight:700;color:var(--blue-700);font-size:13.5px;margin:14px 0 6px\">Böbrek hastalığı varsa<\/div><p style=\"margin:0 0 8px;font-size:13px;line-height:1.7;color:var(--ink-2)\">Protein, potasyum ve fosfor kısıtlamaları kişiye göre değişir; mutlaka nefrolog ve diyetisyen ile planlanmalıdır.<\/p><p style=\"margin:0 0 8px;font-size:13px;line-height:1.7;color:var(--ink-2)\">Kendi başınıza kısıtlama yapmayın; yanlış diyet de zarar verebilir.<\/p>\n              <p style=\"margin:10px 0 0;font-size:10.5px;color:var(--muted);font-style:italic\">📎 Kaynak: Güncel genel beslenme bilgisi ve yaygın kabul gören klinik beslenme kaynakları derlenerek hazırlanmıştır; kişisel tıbbi tavsiye yerine geçmez.<\/p>\n              <div style=\"display:flex;gap:8px;margin-top:10px\">\n                <button class=\"btn btn-sm\" type=\"button\" data-sv-art-docx=\"bobrek-beslenme\" style=\"flex:1;justify-content:center\">⬇ Word<\/button>\n                <button class=\"btn btn-sm\" type=\"button\" data-sv-art-pdf=\"bobrek-beslenme\" style=\"flex:1;justify-content:center\">⬇ PDF<\/button>\n              <\/div>\n            <\/div>\n          <\/details>\n          <details class=\"sv-art\" data-art-id=\"osteoporoz\" style=\"border:1px solid var(--line);border-radius:10px;margin-bottom:8px;overflow:hidden\">\n            <summary style=\"list-style:none;cursor:pointer;padding:11px 14px;display:flex;align-items:center;gap:10px;font-weight:600;font-size:13.5px\">\n              <span style=\"font-size:16px\">🦴<\/span>\n              <span style=\"flex:1\">Osteoporoz ve Beslenme<div style=\"font-weight:400;color:var(--muted);font-size:11.5px;margin-top:2px\">Kemik erimesinin önlenmesinde beslenme.<\/div><\/span>\n              <span class=\"sv-art-car\" style=\"color:var(--muted);font-size:11px\">▾<\/span>\n            <\/summary>\n            <div style=\"padding:4px 16px 16px;border-top:1px solid var(--line-2)\">\n              \n              <p style=\"margin:0 0 8px;font-size:13px;line-height:1.7;color:var(--ink-2)\">Osteoporozda kemikler incelir ve kırılma riski artar. Menopoz sonrası kadınlarda ve ileri yaşta daha sık görülür.<\/p><div style=\"font-weight:700;color:var(--blue-700);font-size:13.5px;margin:14px 0 6px\">Beslenme ve yaşam tarzı<\/div><ul style=\"margin:0 0 8px;padding-left:18px;font-size:13px;line-height:1.7\"><li>Yeterli kalsiyum ve D vitamini.<\/li><li>Yeterli protein.<\/li><li>Direnç ve yük bindiren egzersiz.<\/li><li>Sigara ve aşırı alkolden uzak durmak.<\/li><\/ul><div style=\"font-weight:700;color:var(--blue-700);font-size:13.5px;margin:14px 0 6px\">Dikkat<\/div><p style=\"margin:0 0 8px;font-size:13px;line-height:1.7;color:var(--ink-2)\">Aşırı tuz ve çok fazla kafein kalsiyum kaybını artırabilir.<\/p><p style=\"margin:0 0 8px;font-size:13px;line-height:1.7;color:var(--ink-2)\">Kemik yoğunluğu ölçümü ve tedavi için hekiminize başvurun.<\/p>\n              <p style=\"margin:10px 0 0;font-size:10.5px;color:var(--muted);font-style:italic\">📎 Kaynak: Güncel genel beslenme bilgisi ve yaygın kabul gören klinik beslenme kaynakları derlenerek hazırlanmıştır; kişisel tıbbi tavsiye yerine geçmez.<\/p>\n              <div style=\"display:flex;gap:8px;margin-top:10px\">\n                <button class=\"btn btn-sm\" type=\"button\" data-sv-art-docx=\"osteoporoz\" style=\"flex:1;justify-content:center\">⬇ Word<\/button>\n                <button class=\"btn btn-sm\" type=\"button\" data-sv-art-pdf=\"osteoporoz\" style=\"flex:1;justify-content:center\">⬇ PDF<\/button>\n              <\/div>\n            <\/div>\n          <\/details>\n          <details class=\"sv-art\" data-art-id=\"bagisiklik-beslenme\" style=\"border:1px solid var(--line);border-radius:10px;margin-bottom:8px;overflow:hidden\">\n            <summary style=\"list-style:none;cursor:pointer;padding:11px 14px;display:flex;align-items:center;gap:10px;font-weight:600;font-size:13.5px\">\n              <span style=\"font-size:16px\">🍊<\/span>\n              <span style=\"flex:1\">Bağışıklık ve Beslenme<div style=\"font-weight:400;color:var(--muted);font-size:11.5px;margin-top:2px\">Mucize yok; denge var.<\/div><\/span>\n              <span class=\"sv-art-car\" style=\"color:var(--muted);font-size:11px\">▾<\/span>\n            <\/summary>\n            <div style=\"padding:4px 16px 16px;border-top:1px solid var(--line-2)\">\n              \n              <p style=\"margin:0 0 8px;font-size:13px;line-height:1.7;color:var(--ink-2)\">Bağışıklık sistemini &quot;güçlendiren&quot; tek bir besin ya da takviye yoktur; ancak yetersiz beslenme sistemin zayıflamasına neden olabilir.<\/p><div style=\"font-weight:700;color:var(--blue-700);font-size:13.5px;margin:14px 0 6px\">Destekleyici unsurlar<\/div><ul style=\"margin:0 0 8px;padding-left:18px;font-size:13px;line-height:1.7\"><li>Yeterli protein, C, D vitamini, çinko ve demir.<\/li><li>Renkli sebze-meyve çeşitliliği.<\/li><li>Yeterli uyku ve stres yönetimi.<\/li><li>Düzenli hareket.<\/li><\/ul><div style=\"font-weight:700;color:var(--blue-700);font-size:13.5px;margin:14px 0 6px\">Efsane<\/div><p style=\"margin:0 0 8px;font-size:13px;line-height:1.7;color:var(--ink-2)\">&quot;Detoks&quot; çayları ve ürünleri bağışıklığı artırdığına dair güçlü kanıta sahip değildir.<\/p><p style=\"margin:0 0 8px;font-size:13px;line-height:1.7;color:var(--ink-2)\">Sağlıklı bir yaşam biçimi en iyi bağışıklık desteğidir.<\/p>\n              <p style=\"margin:10px 0 0;font-size:10.5px;color:var(--muted);font-style:italic\">📎 Kaynak: Güncel genel beslenme bilgisi ve yaygın kabul gören klinik beslenme kaynakları derlenerek hazırlanmıştır; kişisel tıbbi tavsiye yerine geçmez.<\/p>\n              <div style=\"display:flex;gap:8px;margin-top:10px\">\n                <button class=\"btn btn-sm\" type=\"button\" data-sv-art-
