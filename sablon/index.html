:700;font-size:12.5px;color:var(--blue-700);margin:14px 0 6px\">🍼 Süt üretimini destekleyen besinler<\/div>\n    <ul style=\"margin:0;padding-left:18px;font-size:13px;line-height:1.75\"><li>Yulaf, çörek otu, kimyon, rezene, susam/tahin ve bakla gibi besinlerin süt üretimini desteklediği geleneksel olarak düşünülür; bilimsel kanıt düzeyleri değişken olsa da dengeli beslenmenin bir parçası olarak tüketilebilirler.<\/li><li>En güvenilir &quot;süt artırıcı&quot; aslında düzenli emzirme/pompalama sıklığı ve yeterli sıvı alımıdır — bol su, ayran ve emzirme döneminde güvenli bitki çaylarını tercih et.<\/li><li>Tek bir mucize besin yoktur; dengeli ve yeterli kalorili beslenme süt üretiminde en belirleyici faktördür.<\/li><\/ul>\n    <div style=\"font-weight:700;font-size:12.5px;color:var(--blue-700);margin:14px 0 6px\">⚠ Dikkat edilmesi gerekenler<\/div>\n    <ul style=\"margin:0;padding-left:18px;font-size:13px;line-height:1.75\"><li>Kafeini günde 2–3 fincanı geçmeyecek şekilde sınırlamak bebeğin huzursuzluğunu azaltabilir.<\/li><li>Alkolden mümkünse tamamen uzak dur; zorunlu bir tüketimde emzirme zamanlamasını doktorunla planla.<\/li><li>Bazı bebeklerde annenin tükettiği gazlı besinler (lahana, brokoli, nohut gibi) huzursuzluğa yol açabilir — bebeğinde bir örüntü fark edersen diyetisyeninle paylaş.<\/li><li>Çok düşük kalorili diyetlerden kaçın; ani ve agresif kilo verme hem enerjini hem süt üretimini olumsuz etkileyebilir.<\/li><\/ul>\n    <div style=\"font-weight:700;font-size:12.5px;color:#b91c1c;margin:14px 0 6px\">🚑 Ne zaman doktora başvurulmalı<\/div>\n    <ul style=\"margin:0;padding-left:18px;font-size:13px;line-height:1.75\"><li>Göğüste şiddetli ağrı, kızarıklık, ateşle birlikte sertlik (mastit belirtisi olabilir)<\/li><li>Aşırı yorgunluk, baş dönmesi, süt üretiminde ani ve belirgin azalma<\/li><li>Loğusalık kanamasında artış veya kötü koku<\/li><\/ul>\n    <p style=\"margin:12px 0 0;font-size:10.5px;color:var(--muted);font-style:italic\">Bu bilgiler genel bilgilendirme amaçlıdır, tıbbi tavsiye yerine geçmez. Emzirme/doğum sonrası beslenmenle ilgili kişiye özel planlama için doktorunu ve diyetisyenini takip et.<\/p><\/div><div class=\"sv-preg-panel\" data-panel=\"ozet\" hidden><div class=\"sv-preg-card\">\n    <img loading=\"lazy\" decoding=\"async\" src=\"img/3690b1b14f.jpg\" alt=\"Sağlıklı bir tabağın formülü\" style=\"width:100%;max-width:460px;display:block;margin:0 auto 14px;border-radius:16px;box-shadow:0 8px 20px -8px rgba(92,34,56,.3)\">\n    <div class=\"sv-preg-card-h\">🍽️ Sağlıklı bir tabağın formülü<\/div>\n    <ul style=\"margin:0;padding-left:18px;font-size:13px;line-height:1.75\"><li>Tabağının yarısı sebze ve salata<\/li><li>Çeyreği protein: et, tavuk, balık, yumurta ya da bakliyat<\/li><li>Çeyreği tam tahıl: tam buğday ekmek, bulgur, yulaf ya da karabuğday<\/li><li>Yanında 1 kase yoğurt/ayran, öğün aralarında meyve ve bir avuç kuruyemiş<\/li><li>Günde 3 ana + 2–3 ara öğün, 2,5–3 litre su<\/li><\/ul>\n    \n  <\/div><div class=\"sv-preg-card\">\n    \n    <div class=\"sv-preg-card-h\">🚨 Bu durumlarda beklemeden doktoruna başvur<\/div>\n    <ul style=\"margin:0;padding-left:18px;font-size:13px;line-height:1.75\"><li>Gün boyu kusma, hiçbir şey tutamama<\/li><li>Yüzde/ellerde ani şişlik, şiddetli baş ağrısı ya da görme bulanıklığı<\/li><li>Hiç kilo alamama ya da çok hızlı kilo alma<\/li><li>Bebek hareketlerinde belirgin azalma<\/li><\/ul>\n    <div class=\"sv-preg-card-tip\">💡 Sağlıklı bir hamilelik, mükemmel beslenmekle değil; dengeli ve sürdürülebilir beslenmekle olur. Kendine iyi bak!<\/div>\n  <\/div><\/div><div class=\"sv-preg-panel\" data-panel=\"motiv\" hidden><p style=\"margin:0;font-size:13.5px;line-height:1.7;font-style:italic;text-align:center\">Bebeğinle tanışacağın gün yaklaşıyor — bu bekleyiş de hikayenizin en özel bölümlerinden biri. ✨<\/p><\/div><\/div><\/div>\n  <\/section><section class=\"sv-card\" id=\"sv-rehber\" style=\"margin-top:16px\"><div class=\"sv-card-h\"><h3>📚 Bilgilendirme Kitapçığı<\/h3><\/div>\n    <div style=\"padding:14px 16px 16px\">\n      <p class=\"hint\" style=\"margin:0 0 12px\">63 konuda kısa, sade yazılar — okumak için başlığa dokun, istersen Word veya PDF olarak indir.<\/p>\n      <input type=\"search\" id=\"svArtQ\" placeholder=\"🔎 Konu ara (örn. diyabet, demir, su)\" style=\"width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:10px;font-size:14px;margin-bottom:6px\">\n      \n        <details class=\"sv-artcat\" style=\"margin-top:12px\"><summary style=\"cursor:pointer;list-style:none;font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--blue-900);padding:9px 2px;border-bottom:1px solid var(--line)\">Genel <span style=\"color:var(--muted);font-weight:600\">· 3<\/span><\/summary><div style=\"padding-top:8px\">\n        \n          <details class=\"sv-art\" data-art-id=\"kilo-temelleri\" style=\"border:1px solid var(--line);border-radius:10px;margin-bottom:8px;overflow:hidden\">\n            <summary style=\"list-style:none;cursor:pointer;padding:11px 14px;display:flex;align-items:center;gap:10px;font-weight:600;font-size:13.5px\">\n              <span style=\"font-size:16px\">⚖️<\/span>\n              <span style=\"flex:1\">Kilo Vermenin Temelleri<div style=\"font-weight:400;color:var(--muted);font-size:11.5px;margin-top:2px\">Kalıcı kilo kontrolünün arkasındaki basit ama sık unutulan ilkeler.<\/div><\/span>\n              <span class=\"sv-art-car\" style=\"color:var(--muted);font-size:11px\">▾<\/span>\n            <\/summary>\n            <div style=\"padding:4px 16px 16px;border-top:1px solid var(--line-2)\">\n              <img src=\"img/bb119314d0.jpg\" loading=\"lazy\" style=\"width:100%;max-width:440px;display:block;margin:12px auto 12px;border-radius:14px;box-shadow:0 6px 16px -8px rgba(92,34,56,.35)\">\n              <p style=\"margin:0 0 8px;font-size:13px;line-height:1.7;color:var(--ink-2)\">Kilo vermek çoğu zaman karmaşık diyetler ya da mucizevi yöntemler aranarak zorlaştırılır. Oysa kalıcı sonuç veren değişim, küçük ve sürdürülebilir alışkanlıklardan geçer.<\/p><div style=\"font-weight:700;color:var(--blue-700);font-size:13.5px;margin:14px 0 6px\">Enerji dengesi<\/div><p style=\"margin:0 0 8px;font-size:13px;line-height:1.7;color:var(--ink-2)\">Vücut, aldığı enerjiden daha azını harcadığında kilo alır; daha fazlasını harcadığında kilo verir. Ancak bu denge yalnızca &quot;az ye, çok hareket et&quot; kadar basit değildir — uyku, stres, hormonal durum ve öğün düzeni de bu dengeyi doğrudan etkiler.<\/p><div style=\"font-weight:700;color:var(--blue-700);font-size:13.5px;margin:14px 0 6px\">Hızlı sonuç beklentisinin riski<\/div><p style=\"margin:0 0 8px;font-size:13px;line-height:1.7;color:var(--ink-2)\">Çok hızlı kilo kaybı genellikle kas kaybıyla birlikte gelir ve metabolizmayı yavaşlatır. Haftada 0,5-1 kg arası bir kayıp, hem sağlıklı hem de kalıcı olma ihtimali en yüksek hızdır.<\/p><div style=\"font-weight:700;color:var(--blue-700);font-size:13.5px;margin:14px 0 6px\">Nelere dikkat etmeli?<\/div><ul style=\"margin:0 0 8px;padding-left:18px;font-size:13px;line-height:1.7\"><li>Öğün atlamaktan kaçının — uzun açlık dönemleri sonraki öğünde kontrolsüz yemeye yol açabilir.<\/li><li>Yeterli protein tüketimi tokluk süresini uzatır.<\/li><li>Su tüketimini artırmak çoğu zaman yanlışlıkla açlık sanılan susuzluğu önler.<\/li><li>Hareketi bir cezadan çok günlük hayatın doğal bir parçası haline getirin.<\/li><\/ul><div style=\"font-weight:700;color:var(--blue-700);font-size:13.5px;margin:14px 0 6px\">Sabır en önemli besin<\/div><p style=\"margin:0 0 8px;font-size:13px;line-height:1.7;color:var(--ink-2)\">Vücudunuz yıllar içinde oluşmuş alışkanlıklara sahip; birkaç haftada tam tersine dönmesini beklemek gerçekçi değildir. Diyetisyeninizle birlikte belirlediğiniz programı istikrarla sürdürmek, uzun vadede en etkili yoldur.<\/p>\n              <p style=\"margin:10px 0 0;font-size:10.5px;color:var(--muted);font-style:italic\">📎 Kaynak: Enerji dengesi ve sürdürülebilir kilo yönetimi konusundaki güncel, genel kabul görmüş beslenme bilimi bilgileri derlenerek hazırlanmıştır.<\/p>\n              <div style=\"display:flex;gap:8px;margin-top:10px\">\n                <button class=\"btn btn-sm\" type=\"button\" data-sv-art-docx=\"kilo-temelleri\" style=\"flex:1;justify-content:center\">⬇ Word<\/button>\n                <button class=\"btn btn-sm\" type=\"button\" data-sv-art-pdf=\"kilo-temelleri\" style=\"flex:1;justify-content:center\">⬇ PDF<\/button>\n              <\/div>\n            <\/div>\n          <\/details>\n          <details class=\"sv-art\" data-art-id=\"protein-tokluk\" style=\"border:1px solid var(--line);border-radius:10px;margin-bottom:8px;overflow:hidden\">\n            <summary style=\"list-style:none;cursor:pointer;padding:11px 14px;display:flex;align-items:center;gap:10px;font-weight:600;font-size:13.5px\">\n              <span style=\"font-size:16px\">🥚<\/span>\n              <span style=\"flex:1\">Protein ve Tokluk Hissi<div style=\"font-weight:400;color:var(--muted);font-size:11.5px;margin-top:2px\">Proteinin iştah kontrolündeki rolü ve günlük beslenmeye nasıl eklenir.<\/div><\/span>\n              <span class=\"sv-art-car\" style=\"color:var(--muted);font-size:11px\">▾<\/span>\n            <\/summary>\n            <div style=\"padding:4px 16px 16px;border-top:1px solid var(--line-2)\">\n              <img src=\"img/0443c13a5f.jpg\" loading=\"lazy\" style=\"width:100%;max-width:440px;display:block;margin:12px auto 12px;border-radius:14px;box-shadow:0 6px 16px -8px rgba(92,34,56,.35)\">\n              <p style=\"margin:0 0 8px;font-size:13px;line-height:1.7;color:var(--ink-2)\">Üç ana besin öğesi (protein, karbonhidrat, yağ) arasında tokluk hissini en uzun süre koruyan protein olduğu bilinir. Bu nedenle kilo yönetiminde protein alımına özen göstermek önemli bir stratejidir.<\/p><div style=\"font-weight:700;color:var(--blue-700);font-size:13.5px;margin:14px 0 6px\">Neden tok tutar?<\/div><p style=\"margin:0 0 8px;font-size:13px;line-height:1.7;color:var(--ink-2)\">Protein, sindirimi en yavaş olan besin öğesidir ve tokluk hormonlarının salgılanmasını destekler. Ayrıca kas kütlesinin korunmasına katkı sağlar — bu da dinlenme halindeki metabolizmayı destekler.<\/p><div style=\"font-weight:700;color:var(--blue-700);font-size:13.5px;margin:14px 0 6px\">Günlük beslenmeye nasıl eklenir?<\/div><ul style=\"margin:0 0 8px;padding-left:18px;font-size:13px;line-height:1.7\"><li>Kahvaltıya yumurta, peynir ya da yoğurt ekleyin.<\/li><li>Ana öğünlerde tabağın bir bölümünü her zaman bir protein kaynağına ayırın.<\/li><li>Ara öğünlerde meyveyi yalnız değil, bir avuç kuruyemiş ya da yoğurtla birlikte tüketin.<\/li><li>Baklagilleri haftada birkaç kez ana öğün olarak değerlendirin — hem protein hem lif kaynağıdır.<\/li><\/ul><p style=\"margin:0 0 8px;font-size:13px;line-height:1.7;color:var(--ink-2)\">Protein miktarı kişinin yaşına, aktivite düzeyine ve sağlık durumuna göre değişir; ihtiyacınıza uygun miktarı diyetisyeninizle birlikte belirlemeniz en sağlıklısıdır.<\/p>\n              <p style=\"margin:10px 0 0;font-size:10.5px;color:var(--muted);font-style:italic\">📎 Kaynak: Proteinin tokluk ve iştah üzerindeki etkisine dair güncel beslenme bilimi literatüründeki genel bilgiler derlenerek hazırlanmıştır.<\/p>\n              <div style=\"display:flex;gap:8px;margin-top:10px\">\n                <button class=\"btn btn-sm\" type=\"button\" data-sv-art-docx=\"protein-tokluk\" style=\"flex:1;justify-content:center\">⬇ Word<\/button>\n                <button class=\"btn btn-sm\" type=\"button\" data-sv-art-pdf=\"protein-tokluk\" style=\"flex:1;justify-content:center\">⬇ PDF<\/button>\n              <\/div>\n            <\/div>\n          <\/details>\n          <details class=\"sv-art\" data-art-id=\"lif-bagirsak\" style=\"border:1px solid var(--line);border-radius:10px;margin-bottom:8px;overflow:hidden\">\n            <summary style=\"list-style:none;cursor:pointer;padding:11px 14px;display:flex;align-items:center;gap:10px;font-weight:600;font-size:13.5px\">\n              <span style=\"font-size:16px\">🌾<\/span>\n              <span style=\"flex:1\">Bağırsak Sağlığı ve Lifli Beslenme<div style=\"font-weight:400;color:var(--muted);font-size:11.5px;margin-top:2px\">Lifin sindirim ve genel sağlık üzerindeki etkisi.<\/div><\/span>\n              <span class=\"sv-art-car\" style=\"color:var(--muted);font-size:11px\">▾<\/span>\n            <\/summary>\n            <div style=\"padding:4px 16px 16px;border-top:1px solid var(--line-2)\">\n              <img src=\"img/e750fd6b13.jpg\" loading=\"lazy\" style=\"width:100%;max-width:440px;display:block;margin:12px auto 12px;border-radius:14px;box-shadow:0 6px 16px -8px rgba(92,34,56,.35)\">\n              <p style=\"margin:0 0 8px;font-size:13px;line-height:1.7;color:var(--ink-2)\">Lif, sindirilemeyen ama bağırsak sağlığı için kritik öneme sahip bir besin öğesidir. Hem düzenli bağırsak hareketlerini destekler hem de bağırsaktaki yararlı bakterileri besler.<\/p><div style=\"font-weight:700;color:var(--blue-700);font-size:13.5px;margin:14px 0 6px\">Çözünür ve çözünmeyen lif<\/div><p style=\"margin:0 0 8px;font-size:13px;line-height:1.7;color:var(--ink-2)\">Çözünür lif (yulaf, elma, baklagiller) kan şekeri ve kolesterol dengesine katkı sağlarken; çözünmeyen lif (tam tahıl kabuğu, sebze kabukları) bağırsak hareketliliğini destekler. İkisi de dengeli şekilde tüketilmelidir.<\/p><div style=\"font-weight:700;color:var(--blue-700);font-size:13.5px;margin:14px 0 6px\">Günlük beslenmeye eklemek için<\/div><ul style=\"margin:0 0 8px;padding-left:18px;font-size:13px;line-height:1.7\"><li>Beyaz ekmek yerine tam tahıllı ekmek tercih edin.<\/li><li>Meyveleri kabuklarıyla (yıkanmış şekilde) tüketin.<\/li><li>Haftada birkaç kez baklagil tüketin.<\/li><li>Lif alımını aniden değil, kademeli artırın — ani artış şişkinlik yapabilir.<\/li><li>Bol su için — lif yeterli suyla birlikte etkili çalışır.<\/li><\/ul><p style=\"margin:0 0 8px;font-size:13px;line-height:1.7;color:var(--ink-2)\">Düzenli lifli beslenme yalnızca sindirimi değil, tokluk hissini ve genel metabolik sağlığı da olumlu etkiler.<\/p>\n              <p style=\"margin:10px 0 0;font-size:10.5px;color:var(--muted);font-style:italic\">📎 Kaynak: Lifli beslenme ve bağırsak sağlığına dair güncel beslenme literatüründeki genel bilgiler derlenerek hazırlanmıştır.<\/p>\n              <div style=\"display:flex;gap:8px;margin-top:10px\">\n                <button class=\"btn btn-sm\" type=\"button\" data-sv-art-docx=\"lif-bagirsak\" style=\"flex:1;justify-content:center\">⬇ Word<\/button>\n                <button class=\"btn btn-sm\" type=\"button\" data-sv-art-pdf=\"lif-bagirsak\" style=\"flex:1;justify-content:center\">⬇ PDF<\/button>\n              <\/div>\n            <\/div>\n          <\/details><\/div><\/details>\n        <details class=\"sv-artcat\" style=\"margin-top:12px\"><summary style=\"cursor:pointer;list-style:none;font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--blue-900);padding:9px 2px;border-bottom:1px solid var(--line)\">Metabolik Sağlık <span style=\"color:var(--muted);font-weight:600\">· 2<\/span><\/summary><div style=\"padding-top:8px\">\n        \n          <details class=\"sv-art\" data-art-id=\"insulin-direnci\" style=\"border:1px solid var(--line);border-radius:10px;margin-bottom:8px;overflow:hidden\">\n            <summary style=\"list-style:none;cursor:pointer;padding:11px 14px;display:flex;align-items:center;gap:10px;font-weight:600;font-size:13.5px\">\n              <span style=\"font-size:16px\">🩸<\/span>\n              <span style=\"flex:1\">İnsülin Direnci ve Beslenme<div style=\"font-weight:400;color:var(--muted);font-size:11.5px;margin-top:2px\">İnsülin direnci nedir, beslenme düzeni bu süreci nasıl destekler?<\/div><\/span>\n              <span class=\"sv-art-car\" style=\"color:var(--muted);font-size:11px\">▾<\/span>\n            <\/summary>\n            <div style=\"padding:4px 16px 16px;border-top:1px solid var(--line-2)\">\n              <img src=\"img/2f04b207c6.jpg\" loading=\"lazy\" style=\"width:100%;max-width:440px;display:block;margin:12px auto 12px;border-radius:14px;box-shadow:0 6px 16px -8px rgba(92,34,56,.35)\">\n              <p style=\"margin:0 0 8px;font-size:13px;line-height:1.7;color:var(--ink-2)\">İnsülin, kan şekerini hücrelere taşıyan bir hormondur. İnsülin direncinde hücreler bu hormona eskisi kadar duyarlı tepki vermez, vücut dengeyi sağlamak için daha fazla insülin salgılar. Zamanla bu durum kilo alımını kolaylaştırabilir ve tip 2 diyabet riskini artırabilir.<\/p><div style=\"font-weight:700;color:var(--blue-700);font-size:13.5px;margin:14px 0 6px\">Belirtiler nelerdir?<\/div><p style=\"margin:0 0 8px;font-size:13px;line-height:1.7;color:var(--ink-2)\">Sürekli yorgunluk, tatlı isteğinde artış, özellikle karın bölgesinde yağlanma ve öğün sonrası uyku hali sık görülen belirtiler arasındadır. Kesin tanı mutlaka kan tahlili ile, bir hekim tarafından konulmalıdır.<\/p><div style=\"font-weight:700;color:var(--blue-700);font-size:13.5px;margin:14px 0 6px\">Beslenmede dikkat edilecek noktalar<\/div><ul style=\"margin:0 0 8px;padding-left:18px;font-size:13px;line-height:1.7\"><li>Rafine şeker ve beyaz un ürünleri yerine tam tahıllı seçenekler tercih edilmeli.<\/li><li>Her öğünde protein, lif ve sağlıklı yağ bir arada bulunmalı — bu, kan şekerindeki ani yükselişleri yumuşatır.<\/li><li>Öğünler arasında çok uzun süre açlıkta kalmaktan kaçınılmalı.<\/li><li>Düzenli fiziksel aktivite, hücrelerin insüline duyarlılığını artırır.<\/li><\/ul><div style=\"font-weight:700;color:var(--blue-700);font-size:13.5px;margin:14px 0 6px\">Besin seçiminde sıralama önemli<\/div><p style=\"margin:0 0 8px;font-size:13px;line-height:1.7;color:var(--ink-2)\">Aynı öğünde önce sebze/lif, sonra protein, en son karbonhidrat tüketmek, kan şekeri yanıtını belirgin şekilde yumuşatabilir. Bu basit sıralama değişikliği bile fark yaratabilir.<\/p><p style=\"margin:0 0 8px;font-size:13px;line-height:1.7;color:var(--ink-2)\">İnsülin direnci, doğru beslenme ve hareket alışkanlıklarıyla büyük ölçüde yönetilebilir bir durumdur — bu süreçte diyetisyeninizle düzenli takip çok değerlidir.<\/p>\n              <p style=\"margin:10px 0 0;font-size:10.5px;color:var(--muted);font-style:italic\">📎 Kaynak: İnsülin direnci ve beslenme ilişkisine dair güncel klinik beslenme literatüründeki genel bilgiler derlenerek hazırlanmıştır.<\/p>\n              <div style=\"display:flex;gap:8px;margin-top:10px\">\n                <button class=\"btn btn-sm\" type=\"button\" data-sv-art-docx=\"insulin-direnci\" style=\"flex:1;justify-content:center\">⬇ Word<\/button>\n                <button class=\"btn btn-sm\" type=\"button\" data-sv-art-pdf=\"insulin-direnci\" style=\"flex:1;justify-content:center\">⬇ PDF<\/button>\n              <\/div>\n            <\/div>\n          <\/details>\n          <details class=\"sv-art\" data-art-id=\"tiroid\" style=\"border:1px solid var(--line);border-radius:10px;margin-bottom:8px;overflow:hidden\">\n            <summary style=\"list-style:none;cursor:pointer;padding:11px 14px;display:flex;align-items:center;gap:10px;font-weight:600;font-size:13.5px\">\n              <span style=\"font-size:16px\">🦋<\/span>\n              <span style=\"flex:1\">Tiroid Fonksiyonu ve Kilo İlişkisi<div style=\"font-weight:400;color:var(--muted);font-size:11.5px;margin-top:2px\">Tiroid bezinin metabolizma ve kilo üzerindeki etkisi.<\/div><\/span>\n              <span class=\"sv-art-car\" style=\"color:var(--muted);font-size:11px\">▾<\/span>\n            <\/summary>\n            <div style=\"padding:4px 16px 16px;border-top:1px solid var(--line-2)\">\n              <img src=\"img/5474449529.jpg\" loading=\"lazy\" style=\"width:100%;max-width:440px;display:block;margin:12px auto 12px;border-radius:14px;box-shadow:0 6px 16px -8px rgba(92,34,56,.35)\">\n              <p style=\"margin:0 0 8px;font-size:13px;line-height:1.7;color:var(--ink-2)\">Boyunda yer alan tiroid bezi, metabolizma hızını düzenleyen hormonlar üretir. Bu hormonların az üretildiği durumda (hipotiroidi) metabolizma yavaşlar ve kilo alımı kolaylaşabilir.<\/p><div style=\"font-weight:700;color:var(--blue-700);font-size:13.5px;margin:14px 0 6px\">Belirtiler<\/div><p style=\"margin:0 0 8px;font-size:13px;line-height:1.7;color:var(--ink-2)\">Yorgunluk, üşüme hissi, saç dökülmesi, kabızlık ve açıklanamayan kilo alımı dikkat çekici belirtiler arasındadır. Tanı yalnızca kan tahlili ile hekim tarafından konulabilir.<\/p><div style=\"font-weight:700;color:var(--blue-700);font-size:13.5px;margin:14px 0 6px\">Beslenme ile desteklemek<\/div><ul style=\"margin:0 0 8px;padding-left:18px;font-size:13px;line-height:1.7\"><li>İyot içeren besinler (iyotlu tuz, deniz ürünleri) tiroid hormonu üretimi için gereklidir.<\/li><li>Selenyum (Brezilya fıstığı, yumurta) tiroid fonksiyonunu destekleyen bir mineraldir.<\/li><li>Aşırı işlenmiş gıdalardan uzak durmak genel hormonal dengeyi destekler.<\/li><li>Lifli besinler, tiroid ilacı kullanan kişilerde ilaç emilimini etkileyebileceğinden ilaçla besin arası genelde belirli bir süre bırakılması önerilir — bu konuda hekiminize danışın.<\/li><\/ul><p style=\"margin:0 0 8px;font-size:13px;line-height:1.7;color:var(--ink-2)\">Tiroid sorunu olan kişilerde beslenme planı, ilaç tedavisiyle birlikte ve hekim-diyetisyen iş birliğiyle kişiselleştirilmelidir.<\/p>\n              <p style=\"margin:10px 0 0;font-size:10.5px;color:var(--muted);font-style:italic\">📎 Kaynak: Tiroid fonksiyonu ile metabolizma ve kilo ilişkisine dair güncel endokrinoloji ve beslenme literatüründeki genel bilgiler derlenerek hazırlanmıştır.<\/p>\n              <div style=\"display:flex;gap:8px;margin-top:10px\">\n                <button class=\"btn btn-sm\" type=\"button\" data-sv-art-docx=\"tiroid\" style=\"flex:1;justify-content:center\">⬇ Word<\/button>\n                <button class=\"btn btn-sm\" type=\"button\" data-sv-art-pdf=\"tiroid\" style=\"flex:1;justify-content:center\">⬇ PDF<\/button>\n              <\/div>\n            <\/div>\n          <\/details><\/div><\/details>\n        <details class=\"sv-artcat\" style=\"margin-top:12px\"><summary style=\"cursor:pointer;list-style:none;font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--blue-900);padding:9px 2px;border-bottom:1px solid var(--line)\">Kadın Sağlığı <span style=\"color:var(--muted);font-weight:600\">· 4<\/span><\/summary><div style=\"padding-top:8px\">\n        \n          <details class=\"sv-art\" data-art-id=\"menopoz\" style=\"border:1px solid var(--line);border-radius:10px;margin-bottom:8px;overflow:hidden\">\n            <summary style=\"list-style:none;cursor:pointer;padding:11px 14px;display:flex;align-items:center;gap:10px;font-weight:600;font-size:13.5px\">\n              <span style=\"font-size:16px\">🌷<\/span>\n              <span style=\"flex:1\">Menopoz Döneminde Beslenme<div style=\"font-weight:400;color:var(--muted);font-size:11.5px;margin-top:2px\">Hormonal değişimin beslenme ihtiyaçlarını nasıl etkilediği.<\/div><\/span>\n              <span class=\"sv-art-car\" style=\"color:var(--muted);font-size:11px\">▾<\/span>\n            <\/summary>\n            <div style=\"padding:4px 16px 16px;border-top:1px solid var(--line-2)\">\n              <img src=\"img/d0636972a1.jpg\" loading=\"lazy\" style=\"width:100%;max-width:440px;display:block;margin:12px auto 12px;border-radius:14px;box-shadow:0 6px 16px -8px rgba(92,34,56,.35)\">\n              <p style=\"margin:0 0 8px;font-size:13px;line-height:1.7;color:var(--ink-2)\">Menopozla birlikte azalan östrojen seviyesi; metabolizma hızında yavaşlama, karın bölgesinde yağlanma eğilimi ve kemik yoğunluğunda azalmaya yol açabilir. Bu dönemde beslenme alışkanlıklarını buna göre uyarlamak önemlidir.<\/p><div style=\"font-weight:700;color:var(--blue-700);font-size:13.5px;margin:14px 0 6px\">Kalsiyum ve D vitamini<\/div><p style=\"margin:0 0 8px;font-size:13px;line-height:1.7;color:var(--ink-2)\">Kemik erimesi riski bu dönemde artar. Süt ürünleri, yeşil yapraklı sebzeler ve güneşlenme (hekim önerisiyle D vitamini desteği gerekebilir) kemik sağlığı için önemlidir.<\/p><div style=\"font-weight:700;color:var(--blue-700);font-size:13.5px;margin:14px 0 6px\">Protein ihtiyacı artar<\/div><p style=\"margin:0 0 8px;font-size:13px;line-height:1.7;color:var(--ink-2)\">Yaşla birlikte azalan kas kütlesini korumak için menopoz sonrası protein ihtiyacı görece artar. Her öğünde kaliteli bir protein kaynağı bulunmasına özen gösterilmelidir.<\/p><div style=\"font-weight:700;color:var(--blue-700);font-size:13.5px;margin:14px 0 6px\">Sıcak basması ve beslenme<\/div><p style=\"margin:0 0 8px;font-size:13px;line-height:1.7;color:var(--ink-2)\">Kafein, alkol ve çok baharatlı yiyecekler bazı kadınlarda sıcak basmalarını tetikleyebilir. Bu besinlerin tüketimini gözlemleyip azaltmak rahatlama sağlayabilir.<\/p><div style=\"font-weight:700;color:var(--blue-700);font-size:13.5px;margin:14px 0 6px\">Öneriler<\/div><ul style=\"margin:0 0 8px;padding-left:18px;font-size:13px;line-height:1.7\"><li>Haftada en az 2-3 gün kalsiyum kaynağı tüketin (süt, yoğurt, badem vb.).<\/li><li>Kemik ve kas sağlığı için düzenli direnç egzersizlerini beslenmeyle birlikte sürdürün.<\/li><li>Rafine şekerden uzak durarak ani kilo alımının önüne geçin.<\/li><li>Bol su için — hormonal değişim cilt ve mukoza kuruluğunu artırabilir.<\/li><\/ul>\n              <p style=\"margin:10px 0 0;font-size:10.5px;color:var(--muted);font-style:italic\">📎 Kaynak: Menopoz döneminde hormonal değişim ve beslenme ihtiyaçlarına dair güncel kadın sağlığı ve beslenme literatüründeki genel bilgiler derlenerek hazırlanmıştır.<\/p>\n              <div style=\"display:flex;gap:8px;margin-top:10px\">\n                <button class=\"btn btn-sm\" type=\"button\" data-sv-art-docx=\"menopoz\" style=\"flex:1;justify-content:center\">⬇ Word<\/button>\n                <button class=\"btn btn-sm\" type=\"button\" data-sv-art-pdf=\"menopoz\" style=\"flex:1;justify-content:center\">⬇ PDF<\/button>\n              <\/div>\n            <\/div>\n          <\/details>\n          <details class=\"sv-art\" data-art-id=\"hamilelik-rehberi\" style=\"border:1px solid var(--line);border-radius:10px;margin-bottom:8px;overflow:hidden\">\n            <summary style=\"list-style:none;cursor:pointer;padding:11px 14px;display:flex;align-items:center;gap:10px;font-weight:600;font-size:13.5px\">\n              <span style=\"font-size:16px\">🤰<\/span>\n              <span style=\"flex:1\">Hamilelik Rehberi<div style=\"font-weight:400;color:var(--muted);font-size:11.5px;margin-top:2px\">Gebelik boyunca trimesterlere göre beslenme, doğuma hazırlık ve sık sorulan konular.<\/div><\/span>\n              <span class=\"sv-art-car\" style=\"color:var(--muted);font-size:11px\">▾<\/span>\n            <\/summary>\n            <div style=\"padding:4px 16px 16px;border-top:1px solid var(--line-2)\">\n              \n              <p style=\"margin:0 0 8px;font-size:13px;line-height:1.7;color:var(--ink-2)\">Gebelik, hem bebeğin sağlıklı gelişimi hem de annenin kendi sağlığı için beslenmenin her zamankinden daha önemli hale geldiği özel bir dönemdir. Bu rehber, trimesterlere göre değişen ihtiyaçları ve sık merak edilen konuları özetler.<\/p><div style=\"font-weight:700;color:var(--blue-700);font-size:13.5px;margin:14px 0 6px\">1. Trimester (1–13. hafta)<\/div><ul style=\"margin:0 0 8px;padding-left:18px;font-size:13px;line-height:1.7\"><li>Folik asit (yeşil yapraklı sebzeler, kurubaklagil) bebeğin nöral tüp gelişimi için bu dönemde özellikle önemlidir.<\/li><li>Bulantı oluyorsa az ve sık öğünler, ağır/yağlı yemeklerden uzak durmak rahatlatabilir.<\/li><li>Kafeini azaltmak, sigara ve alkolden tamamen uzak durmak kritik önemdedir.<\/li><li>Bol su için; zencefilli çay bulantıyı hafifletmeye yardımcı olabilir.<\/li><\/ul><div style=\"font-weight:700;color:var(--blue-700);font-size:13.5px;margin:14px 0 6px\">2. Trimester (14–27. hafta)<\/div><ul style=\"margin:0 0 8px;padding-left:18px;font-size:13px;line-height:1.7\"><li>Demir (kırmızı et, mercimek, pekmez) ve kalsiyum (süt ürünleri, susam) ihtiyacı bu dönemde artar.<\/li><li>Protein alımına özen gösterin — bebeğin hızlı büyüme dönemidir.<\/li><li>Omega-3 kaynakları (somon, ceviz, keten tohumu) bebeğin beyin gelişimini destekler.<\/li><li>Doktorun onayladığı ölçüde düzenli, hafif yürüyüşler sindirimi ve enerjiyi destekler.<\/li><\/ul><div style=\"font-weight:700;color:var(--blue-700);font-size:13.5px;margin:14px 0 6px\">3. Trimester (28–40. hafta)<\/div><ul style=\"margin:0 0 8px;padding-left:18px;font-size:13px;line-height:1.7\"><li>Kalsiyum ve D vitamini ihtiyacı en yüksek seviyededir; güneşlenme ve süt ürünlerine özen gösterin.<\/li><li>Küçük, sık öğünler mide yanmasını ve şişkinliği azaltabilir.<\/li><li>Lif açısından zengin besinler (tam tahıl, sebze, meyve) bu dönemde sık görülen kabızlığa iyi gelir.<\/li><li>Doğuma enerji biriktirmek için kompleks karbonhidratları ihmal etmeyin, ama porsiyon kontrolüne dikkat edin.<\/li><\/ul><div style=\"font-weight:700;color:var(--blue-700);font-size:13.5px;margin:14px 0 6px\">Doğuma hazırlık ve beslenme<\/div><ul style=\"margin:0 0 8px;padding-left:18px;font-size:13px;line-height:1.7\"><li>Doğuma yaklaşırken hurma tüketiminin doğum sürecini desteklediğine dair gözlemler var — doktorunuzun onayıyla düzenli küçük porsiyonlar deneyebilirsiniz.<\/li><li>Doğum eylemi sırasında enerjinizi korumak için hafif, hızlı sindirilen atıştırmalıklar (muz, hurma, bal) faydalı olabilir — hastane politikasını önceden öğrenin.<\/li><li>Doğumdan hemen sonra (özellikle emzirecekseniz) protein ve bol sıvı alımına devam etmek iyileşmeyi ve süt üretimini destekler.<\/li><\/ul><div style=\"font-weight:700;color:var(--blue-700);font-size:13.5px;margin:14px 0 6px\">💉 Oksapar ve benzeri kan sulandırıcı iğne kullananlar için<\/div><p style=\"margin:0 0 8px;font-size:13px;line-height:1.7;color:var(--ink-2)\">Oksapar (enoksaparin) gibi kan sulandırıcı iğneler doktorunuzun belirlediği bir tedavi planının parçasıdır — dozunu veya kullanım sıklığını kendi kararınızla değiştirmeyin ya da bırakmayın.<\/p><ul style=\"margin:0 0 8px;padding-left:18px;font-size:13px;line-height:1.7\"><li>Enjeksiyon bölgesinde morarma, hafif şişlik ya da sertlik görülebilir; bölgeyi her uygulamada biraz değiştirmek bunu azaltabilir.<\/li><li>Beslenme açısından: K vitamini çok yüksek besinleri (ıspanak, lahana, brokoli gibi) günden güne ani ve büyük miktarlarda değiştirmemek genelde önerilir — alışılmış, dengeli tüketiminize sadık kalmanız yeterlidir; büyük bir değişiklik planlıyorsanız önce doktorunuza sorun.<\/li><li>Olağan dışı/aşırı kanama, idrarda-dışkıda kan, şiddetli baş ağrısı, ani şişlik gibi bir durum fark ederseniz vakit kaybetmeden doktorunuzu ya da acil servisi arayın.<\/li><\/ul><div style=\"font-weight:700;color:var(--blue-700);font-size:13.5px;margin:14px 0 6px\">Unutmayın<\/div><p style=\"margin:0 0 8px;font-size:13px;line-height:1.7;color:var(--ink-2)\">Gebelikte alınan kiloların çoğu doğumdan sonraki ilk aylarda kademeli olarak geri döner; aceleci, çok düşük kalorili diyetlerden özellikle emzirme döneminde uzak durun. Bu rehberdeki bilgiler genel bilgilendirme amaçlıdır, tıbbi tavsiye yerine geçmez — gebeliğinizle ilgili her durum için doktorunuzu ve diyetisyeninizi takip edin.<\/p>\n              <p style=\"margin:10px 0 0;font-size:10.5px;color:var(--muted);font-style:italic\">📎 Kaynak: Güncel genel beslenme bilgisi ve yaygın kabul gören klinik beslenme kaynakları derlenerek hazırlanmıştır; kişisel tıbbi tavsiye yerine geçmez.<\/p>\n              <div style=\"display:flex;gap:8px;margin-top:10px\">\n                <button class=\"btn btn-sm\" type=\"button\" data-sv-art-docx=\"hamilelik-rehberi\" style=\"flex:1;justify-content:center\">⬇ Word<\/button>\n                <button class=\"btn btn-sm\" type=\"button\" data-sv-art-pdf=\"hamilelik-rehberi\" style=\"flex:1;justify-content:center\">⬇ PDF<\/button>\n              <\/div>\n            <\/div>\n          <\/details>\n          <details class=\"sv-art\" data-art-id=\"logusalik\" style=\"border:1px solid var(--line);border-radius:10px;margin-bottom:8px;overflow:hidden\">\n            <summary style=\"list-style:none;cursor:pointer;padding:11px 14px;display:flex;align-items:center;gap:10px;font-weight:600;font-size:13.5px\">\n              <span style=\"font-size:16px\">🤱<\/span>\n              <span style=\"flex:1\">Doğum Sonrası (Loğusalık) Döneminde Beslenme<div style=\"font-weight:400;color:var(--muted);font-size:11.5px;margin-top:2px\">Yeni doğum yapan anneler için iyileşme ve emzirme döneminde beslenme.<\/div><\/span>\n              <span class=\"sv-art-car\" style=\"color:var(--muted);font-size:11px\">▾<\/span>\n            <\/summary>\n            <div style=\"padding:4px 16px 16px;border-top:1px solid var(--line-2)\">\n              <img src=\"img/4b4e62a6ba.jpg\" loading=\"lazy\" style=\"width:100%;max-width:440px;display:block;margin:12px auto 12px;border-radius:14px;box-shadow:0 6px 16px -8px rgba(92,34,56,.35)\">\n              <p style=\"margin:0 0 8px;font-size:13px;line-height:1.7;color:var(--ink-2)\">Doğum sonrası dönem, bedenin hem iyileştiği hem de (emziriyorsa) bebeğini beslediği, enerji ve besin öğesi ihtiyacının arttığı özel bir dönemdir. Bu süreçte hızlı kilo verme hedefi değil, dengeli ve besleyici beslenme öncelikli olmalıdır.<\/p><div style=\"font-weight:700;color:var(--blue-700);font-size:13.5px;margin:14px 0 6px\">Neden acele etmemeli?<\/div><p style=\"margin:0 0 8px;font-size:13px;line-height:1.7;color:var(--ink-2)\">Gebelikte alınan kiloların çoğu, doğumdan sonraki ilk aylarda kademeli olarak geri döner. Çok düşük kalorili diyetler, özellikle emziren annelerde süt üretimini ve anne sağlığını olumsuz etkileyebilir.<\/p><div style=\"font-weight:700;color:var(--blue-700);font-size:13.5px;margin:14px 0 6px\">Emziren anneler için öncelikli besinler<\/div><ul style=\"margin:0 0 8px;padding-left:18px;font-size:13px;line-height:1.7\"><li>Yeterli protein (et, yumurta, baklagiller, süt ürünleri)<\/li><li>Demir açısından zengin besinler — doğum sonrası demir kaybını desteklemek için<\/li><li>Omega-3 kaynakları (balık, ceviz) — bebeğin gelişimi için de önemlidir<\/li><li>Bol sıvı tüketimi — süt üretimi su ihtiyacını belirgin artırır<\/li><li>Lifli besinler — doğum sonrası sindirim sistemini desteklemek için<\/li><\/ul><div style=\"font-weight:700;color:var(--blue-700);font-size:13.5px;margin:14px 0 6px\">Enerjiyi geri kazanmak<\/div><p style=\"margin:0 0 8px;font-size:13px;line-height:1.7;color:var(--ink-2)\">Uyku düzensizliği ve yorgunluk bu dönemde kaçınılmazdır. Sık aralıklarla, küçük ama besin değeri yüksek öğünler tüketmek, enerjiyi daha dengeli tutmaya yardımcı olur.<\/p><p style=\"margin:0 0 8px;font-size:13px;line-height:1.7;color:var(--ink-2)\">Her anne ve her doğum süreci farklıdır — bu dönemde beslenme planı mutlaka kişiye özel şekilde, hekim ve diyetisyen iş birliğiyle oluşturulmalıdır.<\/p>\n              <p style=\"margin:10px 0 0;font-size:10.5px;color:var(--muted);font-style:italic\">📎 Kaynak: Doğum sonrası iyileşme, emzirme ve beslenme ihtiyaçlarına dair güncel klinik beslenme literatüründeki genel bilgiler derlenerek hazırlanmıştır.<\/p>\n              <div style=\"display:flex;gap:8px;margin-top:10px\">\n                <button class=\"btn btn-sm\" type=\"button\" data-sv-art-docx=\"logusalik\" style=\"flex:1;justify-content:center\">⬇ Word<\/button>\n                <button class=\"btn btn-sm\" type=\"button\" data-sv-art-pdf=\"logusalik\" style=\"flex:1;justify-content:center\">⬇ PDF<\/button>\n              <\/div>\n            <\/div>\n          <\/details>\n          <details class=\"sv-art\" data-art-id=\"pcos\" style=\"border:1px solid var(--line);border-radius:10px;margin-bottom:8px;overflow:hidden\">\n            <summary style=\"list-style:none;cursor:pointer;padding:11px 14px;display:flex;align-items:center;gap:10px;font-weight:600;font-size:13.5px\">\n              <span style=\"font-size:16px\">🌙<\/span>\n              <span style=\"flex:1\">PCOS (Polikistik Over Sendromu) ve Beslenme<div style=\"font-weight:400;color:var(--muted);font-size:11.5px;margin-top:2px\">PCOS&#39;ta beslenmenin hormonal dengeye katkısı.<\/div><\/span>\n              <span class=\"sv-art-car\" style=\"color:var(--muted);font-size:11px\">▾<\/span>\n            <\/summary>\n            <div style=\"padding:4px 16px 16px;border-top:1px solid var(--line-2)\">\n              <img src=\"img/772afdfad0.jpg\" loading=\"lazy\" style=\"width:100%;max-width:440px;display:block;margin:12px auto 12px;border-radius:14px;box-shadow:0 6px 16px -8px rgba(92,34,56,.35)\">\n              <p style=\"margin:0 0 8px;font-size:13px;line-height:1.7;color:var(--ink-2)\">Polikistik over sendromu (PCOS), üreme çağındaki kadınlarda sık görülen, hormonal dengesizlikle seyreden bir durumdur. Çoğu PCOS&#39;lu kadında insülin direnci de birlikte görülür — bu da beslenmeyi tedavinin önemli bir parçası haline getirir.<\/p><div style=\"font-weight:700;color:var(--blue-700);font-size:13.5px;margin:14px 0 6px\">Beslenme neden bu kadar önemli?<\/div><p style=\"margin:0 0 8px;font-size:13px;line-height:1.7;color:var(--ink-2)\">Kan şekerini dengede tutan bir beslenme düzeni, hem insülin direncini hem de buna bağlı hormonal dengesizlikleri yönetmeye yardımcı olabilir. Kilo kaybının (mevcutsa) adet düzeninde bile olumlu etkisi görülebilir.<\/p><div style=\"font-weight:700;color:var(--blue-700);font-size:13.5px;margin:14px 0 6px\">Öneriler<\/div><ul style=\"margin:0 0 8px;padding-left:18px;font-size:13px;line-height:1.7\"><li>Düşük glisemik indeksli besinler (tam tahıllar, baklagiller) tercih edin.<\/li><li>Her öğünde protein ve lif bulunmasına özen gösterin.<\/li><li>Şekerli içecek ve atıştırmalıklardan mümkün olduğunca uzak durun.<\/li><li>Düzenli fiziksel aktivite insülin duyarlılığını destekler.<\/li><li>İltihabı azaltabilecek omega-3 kaynaklarını (balık, keten tohumu) beslenmeye dahil edin.<\/li><\/ul><p style=\"margin:0 0 8px;font-size:13px;line-height:1.7;color:var(--ink-2)\">PCOS yönetimi kişiye özeldir — semptomlar ve laboratuvar değerleri kişiden kişiye farklılık gösterir, bu yüzden beslenme planı da kişiselleştirilmelidir.<\/p>\n              <p style=\"margin:10px 0 0;font-size:10.5px;color:var(--muted);font-style:italic\">📎 Kaynak: PCOS ve beslenme ilişkisine dair güncel kadın sağlığı ve beslenme literatüründeki genel bilgiler derlenerek hazırlanmıştır.<\/p>\n              <div style=\"display:flex;gap:8px;margin-top:10px\">\n                <button class=\"btn btn-sm\" type=\"button\" data-sv-art-docx=\"pcos\" style=\"flex:1;justify-content:center\">⬇ Word<\/button>\n                <button class=\"btn btn-sm\" type=\"button\" data-sv-art-pdf=\"pcos\" style=\"flex:1;justify-content:center\">⬇ PDF<\/button>\n              <\/div>\n            <\/div>\n          <\/details><\/div><\/details>\n        <details class=\"sv-artcat\" style=\"margin-top:12px\"><summary style=\"cursor:pointer;list-style:none;font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--blue-900);padding:9px 2px;border-bottom:1px solid var(--line)\">Beslenme Yöntemleri <span style=\"color:var(--muted);font-weight:600\">· 1<\/span><\/summary><div style=\"padding-top:8px\">\n        \n          <details class=\"sv-art\" data-art-id=\"araliklı-oruc\" style=\"border:1px solid var(--line);border-radius:10px;margin-bottom:8px;overflow:hidden\">\n            <summary style=\"list-style:none;cursor:pointer;padding:11px 14px;display:flex;align-items:center;gap:10px;font-weight:600;font-size:13.5px\">\n              <span style=\"font-size:16px\">⏱️<\/span>\n              <span style=\"flex:1\">Aralıklı Oruç: Kime Uygun, Kime Değil?<div style=\"font-weight:400;color:var(--muted);font-size:11.5px;margin-top:2px\">Popüler bir yöntemin avantajları, sınırları ve uygun olmadığı durumlar.<\/div><\/span>\n              <span class=\"sv-art-car\" style=\"color:var(--muted);font-size:11px\">▾<\/span>\n            <\/summary>\n            <div style=\"padding:4px 16px 16px;border-top:1px solid var(--line-2)\">\n              \n              <p style=\"margin:0 0 8px;font-size:13px;line-height:1.7;color:var(--ink-2)\">Aralıklı oruç (intermittent fasting), belirli saatlerde yemek yiyip belirli saatlerde yememeyi temel alan bir beslenme modelidir. Herkese uygun, tek bir &quot;doğru&quot; yöntem değildir.<\/p><div style=\"font-weight:700;color:var(--blue-700);font-size:13.5px;margin:14px 0 6px\">Olası faydaları<\/div><p style=\"margin:0 0 8px;font-size:13px;line-height:1.7;color:var(--ink-2)\">Bazı kişilerde öğün sayısının azalması, toplam kalori alımını kontrol etmeyi kolaylaştırabilir. Düzenli uygulandığında insülin duyarlılığına olumlu katkısı olduğunu gösteren çalışmalar vardır.<\/p><div style=\"font-weight:700;color:var(--blue-700);font-size:13.5px;margin:14px 0 6px\">Kimler dikkatli olmalı?<\/div><ul style=\"margin:0 0 8px;padding-left:18px;font-size:13px;line-height:1.7\"><li>Gebe ve emziren kadınlar<\/li><li>Yeme bozukluğu geçmişi olanlar<\/li><li>Diyabet gibi kan şekeri dengesini ilaçla yöneten kişiler (hekim onayı şart)<\/li><li>Büyüme çağındaki çocuk ve ergenler<\/li><li>Düşük tansiyon veya mide rahatsızlığı olanlar<\/li><\/ul><div style=\"font-weight:700;color:var(--blue-700);font-size:13.5px;margin:14px 0 6px\">Nasıl başlanmalı?<\/div><p style=\"margin:0 0 8px;font-size:13px;line-height:1.7;color:var(--ink-2)\">Aniden uzun açlık sürelerine geçmek yerine, açlık penceresini kademeli olarak uzatmak vücudun uyumunu kolaylaştırır. Aç kalınan saatlerde bol su, bitki çayı tüketmek rahatlatıcıdır.<\/p><p style=\"margin:0 0 8px;font-size:13px;line-height:1.7;color:var(--ink-2)\">Bu yöntemi denemeden önce mevcut sağlık durumunuzu diyetisyeninizle paylaşmanız, size uygun olup olmadığının netleşmesi açısından önemlidir.<\/p>\n              <p style=\"margin:10px 0 0;font-size:10.5px;color:var(--muted);font-style:italic\">📎 Kaynak: Aralıklı oruç yöntemleri ve etkilerine dair güncel beslenme literatüründeki genel bulgular derlenerek hazırlanmıştır.<\/p>\n              <div style=\"display:flex;gap:8px;margin-top:10px\">\n                <button class=\"btn btn-sm\" type=\"button\" data-sv-art-docx=\"araliklı-oruc\" style=\"flex:1;justify-content:center\">⬇ Word<\/button>\n                <button class=\"btn btn-sm\" type=\"button\" data-sv-art-pdf=\"araliklı-oruc\" style=\"flex:1;justify-content:center\">⬇ PDF<\/button>\n              <\/div>\n            <\/div>\n          <\/details><\/div><\/details>\n        <details class=\"sv-artcat\" style=\"margin-top:12px\"><summary style=\"cursor:pointer;list-style:none;font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--blue-900);padding:9px 2px;border-bottom:1px solid var(--line)\">Davranış <span style=\"color:var(--muted);font-weight:600\">· 4<\/span><\/summary><div style=\"padding-top:8px\">\n        \n          <details class=\"sv-art\" data-art-id=\"duygusal-yeme\" style=\"border:1px solid var(--line);border-radius:10px;margin-bottom:8px;overflow:hidden\">\n            <summary style=\"list-style:none;cursor:pointer;padding:11px 14px;display:flex;align-items:center;gap:10px;font-weight:600;font-size:13.5px\">\n              <span style=\"font-size:16px\">💭<\/span>\n              <span style=\"flex:1\">Duygusal Yeme ile Baş Etmek<div style=\"font-weight:400;color:var(--muted);font-size:11.5px;margin-top:2px\">Açlık hissi ile duygusal açlığı ayırt etmenin yolları.<\/div><\/span>\n              <span class=\"sv-art-car\" style=\"color:var(--muted);font-size:11px\">▾<\/span>\n            <\/summary>\n            <div style=\"padding:4px 16px 16px;border-top:1px solid var(--line-2)\">\n              <img src=\"img/00078128c7.jpg\" loading=\"lazy\" style=\"width:100%;max-width:440px;display:block;margin:12px auto 12px;border-radius:14px;box-shadow:0 6px 16px -8px rgba(92,34,56,.35)\">\n              <p style=\"margin:0 0 8px;font-size:13px;line-height:1.7;color:var(--ink-2)\">Stres, üzüntü, sıkıntı ya da yalnızca alışkanlık sonucu yemek yemek, çoğu insanın hayatında zaman zaman yaşadığı bir durumdur. Bunu fark etmek, yönetmenin ilk adımıdır.<\/p><div style=\"font-weight:700;color:var(--blue-700);font-size:13.5px;margin:14px 0 6px\">Fiziksel açlık ile duygusal açlığın farkı<\/div><p style=\"margin:0 0 8px;font-size:13px;line-height:1.7;color:var(--ink-2)\">Fiziksel açlık kademeli gelişir ve herhangi bir besinle tatmin olur. Duygusal açlık ise aniden ortaya çıkar, genellikle belirli bir yiyeceğe (tatlı, cips gibi) yönelir ve yedikten sonra genellikle pişmanlık hissi bırakır.<\/p><div style=\"font-weight:700;color:var(--blue-700);font-size:13.5px;margin:14px 0 6px\">Baş etme yolları<\/div><ul style=\"margin:0 0 8px;padding-left:18px;font-size:13px;line-height:1.7\"><li>Yemek yemeden önce &quot;şu an gerçekten aç mıyım?&quot; diye kendinize sorun.<\/li><li>Yemek dışında rahatlatıcı alternatifler belirleyin: kısa bir yürüyüş, nefes egzersizi, bir arkadaşı aramak.<\/li><li>Mutfakta &quot;tetikleyici&quot; atıştırmalıkları göz önünde bulundurmayın; yerine meyve, yoğurt gibi seçenekleri kolay ulaşılabilir yapın.<\/li><li>Yediklerinizi birkaç gün not almak, hangi duygu durumlarının yeme isteğini tetiklediğini fark etmenizi sağlar.<\/li><\/ul><p style=\"margin:0 0 8px;font-size:13px;line-height:1.7;color:var(--ink-2)\">Duygusal yeme zaman zaman herkeste olabilir — amaç bunu tamamen yok etmek değil, sık ve kontrolsüz hale gelmesini önlemektir. Gerekirse bu konuda bir uzmandan destek almak da değerlidir.<\/p>\n              <p style=\"margin:10px 0 0;font-size:10.5px;color:var(--muted);font-style:italic\">📎 Kaynak: Duygusal yeme davranışına dair güncel beslenme psikolojisi literatüründeki genel bilgiler derlenerek hazırlanmıştır.<\/p>\n              <div style=\"display:flex;gap:8px;margin-top:10px\">\n                <button class=\"btn btn-sm\" type=\"button\" data-sv-art-docx=\"duygusal-yeme\" style=\"flex:1;justify-content:center\">⬇ Word<\/button>\n                <button class=\"btn btn-sm\" type=\"button\" data-sv-art-pdf=\"duygusal-yeme\" style=\"flex:1;justify-content:center\">⬇ PDF<\/button>\n              <\/div>\n            <\/div>\n          <\/details>\n          <details class=\"sv-art\" data-art-id=\"yoyo-diyet\" style=\"border:1px solid var(--line);border-radius:10px;margin-bottom:8px;overflow:hidden\">\n            <summary style=\"list-style:none;cursor:pointer;padding:11px 14px;display:flex;align-items:center;gap:10px;font-weight:600;font-size:13.5px\">\n              <span style=\"font-size:16px\">🔄<\/span>\n              <span style=\"flex:1\">Yo-yo Diyet: Sürekli Kilo Verip Almanın Bedeli<div style=\"font-weight:400;color:var(--muted);font-size:11.5px;margin-top:2px\">Sık diyet-kilo alma döngüsünün metabolizmaya etkisi.<\/div><\/span>\n              <span class=\"sv-art-car\" style=\"color:var(--muted);font-size:11px\">▾<\/span>\n            <\/summary>\n            <div style=\"padding:4px 16px 16px;border-top:1px solid var(--line-2)\">\n              \n              <p style=\"margin:0 0 8px;font-size:13px;line-height:1.7;color:var(--ink-2)\">Çok hızlı kilo verip, kısa süre sonra aynı hızla (hatta fazlasıyla) geri alma döngüsüne &quot;yo-yo diyet&quot; denir. Bu döngü, uzun vadede metabolizma ve vücut kompozisyonu açısından olumsuz sonuçlar doğurabilir.<\/p><div style=\"font-weight:700;color:var(--blue-700);font-size:13.5px;margin:14px 0 6px\">Neden zararlı olabilir?<\/div><p style=\"margin:0 0 8px;font-size:13px;line-height:1.7;color:var(--ink-2)\">Hızlı kilo kaybında genellikle yağ kadar kas kütlesi de kaybedilir. Kilo geri alındığında ise çoğunlukla yağ dokusu olarak geri gelir. Zamanla bu döngü, vücudun yağ oranını artırırken kas kütlesini azaltabilir.<\/p><div style=\"font-weight:700;color:var(--blue-700);font-size:13.5px;margin:14px 0 6px\">Döngüden çıkmanın yolu<\/div><ul style=\"margin:0 0 8px;padding-left:18px;font-size:13px;line-height:1.7\"><li>Çok düşük kalorili, sürdürülemez diyetlerden kaçının.<\/li><li>Kilo kaybını yavaş ama istikrarlı bir süreç olarak planlayın.<\/li><li>Diyet bitince &quot;eski düzene dönme&quot; değil, kalıcı bir yaşam tarzı değişikliği hedefleyin.<\/li><li>Kas kütlesini korumak için direnç egzersizlerini beslenmeyle birlikte sürdürün.<\/li><\/ul><p style=\"margin:0 0 8px;font-size:13px;line-height:1.7;color:var(--ink-2)\">Kalıcı sonuç, hız değil süreklilik ister. Diyetisyeninizle birlikte oluşturduğunuz program, tam olarak bu sürekliliği hedefler.<\/p>\n              <p style=\"margin:10px 0 0;font-size:10.5px;color:var(--muted);font-style:italic\">📎 Kaynak: Tekrarlayan diyet döngülerinin metabolizmaya etkisine dair güncel obezite ve beslenme literatüründeki genel bulgular derlenerek hazırlanmıştır.<\/p>\n              <div style=\"display:flex;gap:8px;margin-top:10px\">\n                <button class=\"btn btn-sm\" type=\"button\" data-sv-art-docx=\"yoyo-diyet\" style=\"flex:1;justify-content:center\">⬇ Word<\/button>\n                <button class=\"btn btn-sm\" type=\"button\" data-sv-art-pdf=\"yoyo-diyet\" style=\"flex:1;justify-content:center\">⬇ PDF<\/button>\n              <\/div>\n            <\/div>\n          <\/details>\n          <details class=\"sv-art\" data-art-id=\"stres-beslenme\" style=\"border:1px solid var(--line);border-radius:10px;margin-bottom:8px;overflow:hidden\">\n            <summary style=\"list-style:none;cursor:pointer;padding:11px 14px;display:flex;align-items:center;gap:10px;font-weight:600;font-size:13.5px\">\n              <span style=\"font-size:16px\">🧘<\/span>\n              <span style=\"flex:1\">Stres ve Beslenme<div style=\"font-weight:400;color:var(--muted);font-size:11.5px;margin-top:2px\">Stres yemeyi nasıl etkiler?<\/div><\/span>\n              <span class=\"sv-art-car\" style=\"color:var(--muted);font-size:11px\">▾<\/span>\n            <\/summary>\n            <div style=\"padding:4px 16px 16px;border-top:1px solid var(--line-2)\">\n              \n              <p style=\"margin:0 0 8px;font-size:13px;line-height:1.7;color:var(--ink-2)\">Stres kimilerinde iştahı artırır, kimilerinde azaltır. Uzun süreli stres kortizolü yükselterek özellikle karın çevresinde yağlanmayı kolaylaştırabilir.<\/p><div style=\"font-weight:700;color:var(--blue-700);font-size:13.5px;margin:14px 0 6px\">Stres yönetimi için<\/div><ul style=\"margin:0 0 8px;padding-left:18px;font-size:13px;line-height:1.7\"><li>Düzenli uyku ve hareket.<\/li><li>Nefes ve gevşeme egzersizleri.<\/li><li>Duygularla başa çıkmak için yemek dışında seçenekler (yürüyüş, arkadaşla konuşma).<\/li><\/ul><div style=\"font-weight:700;color:var(--blue-700);font-size:13.5px;margin:14px 0 6px\">Beslenme ile destek<\/div><p style=\"margin:0 0 8px;font-size:13px;line-height:1.7;color:var(--ink-2)\">Düzenli öğünler, yeterli protein, magnezyum ve omega-3 kaynakları ruh halini destekleyebilir.<\/p><p style=\"margin:0 0 8px;font-size:13px;line-height:1.7;color:var(--ink-2)\">Stres belirtileri günlük yaşamı bozuyorsa psikolojik destek almak da bir seçenektir.<\/p>\n              <p style=\"margin:10px 0 0;font-size:10.5px;color:var(--muted);font-style:italic\">📎 Kaynak: Güncel genel beslenme bilgisi ve yaygın kabul gören klinik beslenme kaynakları derlenerek hazırlanmıştır; kişisel tıbbi tavsiye yerine geçmez.<\/p>\n              <div style=\"display:flex;gap:8px;margin-top:10px\">\n                <button class=\"btn btn-sm\" type=\"button\" data-sv-art-docx=\"stres-beslenme\" style=\"flex:1;justify-content:center\">⬇ Word<\/button>\n                <button class=\"btn btn-sm\" type=\"button\" data-sv-art-pdf=\"stres-beslenme\" style=\"flex:1;justify-content:center\">⬇ PDF<\/button>\n              <\/div>\n            <\/div>\n          <\/details>\n          <details class=\"sv-art\" data-art-id=\"gece-yeme\" style=\"border:1px solid var(--line);border-radius:10px;margin-bottom:8px;overflow:hidden\">\n            <summary style=\"list-style:none;cursor:pointer;padding:11px 14px;display:flex;align-items:center;gap:10px;font-weight:600;font-size:13.5px\">\n              <span style=\"font-size:16px\">🌃<\/span>\n              <span style=\"flex:1\">Gece Yeme ve Atıştırma<div style=\"font-weight:400;color:var(--muted);font-size:11.5px;margin-top:2px\">Akşamları kontrolsüz yemenin nedenleri.<\/div><\/span>\n              <span class=\"sv-art-car\" style=\"color:var(--muted);font-size:11px\">▾<\/span>\n            <\/summary>\n            <div style=\"padding:4px 16px 16px;border-top:1px solid var(--line-2)\">\n              \n              <p style=\"margin:0 0 8px;font-size:13px;line-height:1.7;color:var(--ink-2)\">Gece yeme çoğu zaman gün içinde yetersiz yemek, stres, sıkıntı veya alışkanlıkla ilişkilidir.<\/p><div style=\"font-weight:700;color:var(--blue-700);font-size:13.5px;margin:14px 0 6px\">Neler yardımcı olur?<\/div><ul style=\"margin:0 0 8px;padding-left:18px;font-size:13px;line-height:1.7\"><li>Gün içinde yeterli ve düzenli yemek (özellikle öğle ve ara öğün).<\/li><li>Akşam yemeğinde protein ve lif eklemek.<\/li><li>Yemekten sonra dişleri fırçalamak veya bitki çayı içmek.<\/li><li>Atıştırmalığı gözün önünden kaldırmak.<\/li><\/ul><div style=\"font-weight:700;color:var(--blue-700);font-size:13.5px;margin:14px 0 6px\">Sorgulayın<\/div><p style=\"margin:0 0 8px;font-size:13px;line-height:1.7;color:var(--ink-2)\">Gerçekten aç mıyım, yoksa sıkıldım/stresliyim mi diye kendinize sorun.<\/p><p style=\"margin:0 0 8px;font-size:13px;line-height:1.7;color:var(--ink-2)\">Sık ve kontrolsüz tekrarlıyorsa bir uzmandan destek almak faydalıdır.<\/p>\n              <p style=\"margin:10px 0 0;font-size:10.5px;color:var(--muted);font-style:italic\">📎 Kaynak: Güncel genel beslenme bilgisi ve yaygın kabul gören klinik beslenme kaynakları derlenerek hazırlanmıştır; kişisel tıbbi tavsiye yerine geçmez.<\/p>\n              <div style=\"display:flex;gap:8px;margin-top:10px\">\n                <button class=\"btn btn-sm\" type=\"button\" data-sv-art-docx=\"gece-yeme\" style=\"flex:1;justify-content:center\">⬇ Word<\/button>\n                <button class=\"btn btn-sm\" type=\"button\" data-sv-art-pdf=\"gece-yeme\" style=\"flex:1;justify-content:center\">⬇ PDF<\/button>\n              <\/div>\n            <\/div>\n          <\/details><\/div><\/details>\n        <details class=\"sv-artcat\" style=\"margin-top:12px\"><summary style=\"cursor:pointer;list-style:none;font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--blue-900);padding:9px 2px;border-bottom:1px solid var(--line)\">Yaşam Tarzı <span style=\"color:var(--muted);font-weight:600\">· 12<\/span><\/summary><div style=\"padding-top:8px\">\n        \n          <details class=\"sv-art\" data-art-id=\"uyku-kilo\" style=\"border:1px solid var(--line);border-radius:10px;margin-bottom:8px;overflow:hidden\">\n            <summary style=\"list-style:none;cursor:pointer;padding:11px 14px;display:flex;align-items:center;gap:10px;font-weight:600;font-size:13.5px\">\n              <span style=\"font-size:16px\">😴<\/span>\n              <span style=\"flex:1\">Uyku ve Kilo Yönetimi<div style=\"font-weight:400;color:var(--muted);font-size:11.5px;margin-top:2px\">Yetersiz uykunun iştah ve kilo üzerindeki şaşırtıcı etkisi.<\/div><\/span>\n              <span class=\"sv-art-car\" style=\"color:var(--muted);font-size:11px\">▾<\/span>\n            <\/summary>\n            <div style=\"padding:4px 16px 16px;border-top:1px solid var(--line-2)\">\n              <img src=\"img/b9c8dcf65b.jpg\" loading=\"lazy\" style=\"width:100%;max-width:440px;display:block;margin:12px auto 12px;border-radius:14px;box-shadow:0 6px 16px -8px rgba(92,34,56,.35)\">\n              <p style=\"margin:0 0 8px;font-size:13px;line-height:1.7;color:var(--ink-2)\">Beslenme kadar önemli olan ama çoğu zaman göz ardı edilen bir faktör de uykudur. Yetersiz ve düzensiz uyku, iştahı düzenleyen hormonları doğrudan etkiler.<\/p><div style=\"font-weight:700;color:var(--blue-700);font-size:13.5px;margin:14px 0 6px\">Uyku ile iştah hormonları<\/div><p style=\"margin:0 0 8px;font-size:13px;line-height:1.7;color:var(--ink-2)\">Uyku yetersizliği, açlık hissini artıran grelin hormonunu yükseltirken, tokluk hissini sağlayan leptin hormonunu azaltır. Sonuç olarak yorgun bir bedende iştah artar, özellikle yüksek kalorili besinlere yönelim görülür.<\/p><div style=\"font-weight:700;color:var(--blue-700);font-size:13.5px;margin:14px 0 6px\">Kaliteli uyku için öneriler<\/div><ul style=\"margin:0 0 8px;padding-left:18px;font-size:13px;line-height:1.7\"><li>Her gün benzer saatte yatıp kalkmaya çalışın.<\/li><li>Yatmadan 2-3 saat önce ağır/yağlı yemekten kaçının.<\/li><li>Akşam saatlerinde kafein tüketimini sınırlayın.<\/li><li>Yatak odasını karanlık ve serin tutmak uyku kalitesini artırır.<\/li><li>Ekran süresini yatmadan en az yarım saat önce azaltın.<\/li><\/ul><p style=\"margin:0 0 8px;font-size:13px;line-height:1.7;color:var(--ink-2)\">Düzenli uyku, beslenme programınızın başarısını doğrudan destekleyen, çoğu zaman göz ardı edilen güçlü bir unsurdur.<\/p>\n              <p style=\"margin:10px 0 0;font-size:10.5px;color:var(--muted);font-style:italic\">📎 Kaynak: Uyku ile iştah ve kilo yönetimi ilişkisine dair güncel beslenme ve uyku literatüründeki genel bulgular derlenerek hazırlanmıştır.<\/p>\n              <div style=\"display:flex;gap:8px;margin-top:10px\">\n                <button class=\"btn btn-sm\" type=\"button\" data-sv-art-docx=\"uyku-kilo\" style=\"flex:1;justify-content:center\">⬇ Word<\/button>\n                <button class=\"btn btn-sm\" type=\"button\" data-sv-art-pdf=\"uyku-kilo\" style=\"flex:1;justify-content:center\">⬇ PDF<\/button>\n              <\/div>\n            <\/div>\n          <\/details>\n          <details class=\"sv-art\" data-art-id=\"su-icmek\" style=\"border:1px solid var(--line);border-radius:10px;margin-bottom:8px;overflow:hidden\">\n            <summary style=\"list-style:none;cursor:pointer;padding:11px 14px;display:flex;align-items:center;gap:10px;font-weight:600;font-size:13.5px\">\n              <span style=\"font-size:16px\">💧<\/span>\n              <span style=\"flex:1\">Su İçmenin Önemi<div style=\"font-weight:400;color:var(--muted);font-size:11.5px;margin-top:2px\">Günde ne kadar su yeterli?<\/div><\/span>\n              <span class=\"sv-art-car\" style=\"color:var(--muted);font-size:11px\">▾<\/span>\n            <\/summary>\n            <div style=\"padding:4px 16px 16px;border-top:1px solid var(--line-2)\">\n              \n              <p style=\"margin:0 0 8px;font-size:13px;line-height:1.7;color:var(--ink-2)\">Su vücut sıcaklığının düzenlenmesi, sindirim ve atıkların atılması için gereklidir. İhtiyaç kiloya, hava sıcaklığına ve aktiviteye göre değişir.<\/p><div style=\"font-weight:700;color:var(--blue-700);font-size:13.5px;margin:14px 0 6px\">Genel bir rehber<\/div><p style=\"margin:0 0 8px;font-size:13px;line-height:1.7;color:var(--ink-2)\">Yetişkinlerde günlük sıvı ihtiyacı çoğu zaman 1,5-2,5 litre aralığındadır. İdrarın açık sarı renkte olması iyi bir göstergedir.<\/p><div style=\"font-weight:700;color:var(--blue-700);font-size:13.5px;margin:14px 0 6px\">Alışkanlık haline getirmek<\/div><ul style=\"margin:0 0 8px;padding-left:18px;font-size:13px;line-height:1.7\"><li>Güne bir bardak suyla başlayın.<\/li><li>Yanınızda şişe taşıyın.<\/li><li>Her öğünle bir bardak su için.<\/li><\/ul><p style=\"margin:0 0 8px;font-size:13px;line-height:1.7;color:var(--ink-2)\">Böbrek veya kalp hastalığınız varsa sıvı miktarını hekiminizle konuşun.<\/p>\n              <p style=\"margin:10px 0 0;font-size:10.5px;color:var(--muted);font-style:italic\">📎 Kaynak: Güncel genel beslenme bilgisi ve yaygın kabul gören klinik beslenme kaynakları derlenerek hazırlanmıştır; kişisel tıbbi tavsiye yerine geçmez.<\/p>\n              <div style=\"display:flex;gap:8px;margin-top:10px\">\n                <button class=\"btn btn-sm\" type=\"button\" data-sv-art-docx=\"su-icmek\" style=\"flex:1;justify-content:center\">⬇ Word<\/button>\n                <button class=\"btn btn-sm\" type=\"button\" data-sv-art-pdf=\"su-icmek\" style=\"flex:1;justify-content:center\">⬇ PDF<\/button>\n              <\/div>\n            <\/div>\n          <\/details>\n          <details class=\"sv-art\" data-art-id=\"kahvalti\" style=\"border:1px solid var(--line);border-radius:10px;margin-bottom:8px;overflow:hidden\">\n            <summary style=\"list-style:none;cursor:pointer;padding:11px 14px;display:flex;align-items:center;gap:10px;font-weight:600;font-size:13.5px\">\n              <span style=\"font-size:16px\">🍳<\/span>\n              <span style=\"flex:1\">Kahvaltı Neden Önemli?<div style=\"font-weight:400;color:var(--muted);font-size:11.5px;margin-top:2px\">Güne dengeli başlamak.<\/div><\/span>\n              <span class=\"sv-art-car\" style=\"color:var(--muted);font-size:11px\">▾<\/span>\n            <\/summary>\n            <div style=\"padding:4px 16px 16px;border-top:1px solid var(--line-2)\">\n              \n              <p style=\"margin:0 0 8px;font-size:13px;line-height:1.7;color:var(--ink-2)\">Dengeli bir kahvaltı gün içi enerjiyi, dikkati ve tokluk hissini destekler. Ancak &quot;kahvaltı yapmazsam kilo alırım&quot; gibi kesin bir kural yoktur; önemli olan günün toplam düzenidir.<\/p><div style=\"font-weight:700;color:var(--blue-700);font-size:13.5px;margin:14px 0 6px\">İyi bir kahvaltı tabağı<\/div><ul style=\"margin:0 0 8px;padding-left:18px;font-size:13px;line-height:1.7\"><li>Protein: yumurta, peynir, yoğurt.<\/li><li>Lif: tam tahıllı ekmek, yulaf, sebze.<\/li><li>Sağlıklı yağ: zeytin, ceviz.<\/li><\/ul><div style=\"font-weight:700;color:var(--blue-700);font-size:13.5px;margin:14px 0 6px\">Dikkat<\/div><p style=\"margin:0 0 8px;font-size:13px;line-height:1.7;color:var(--ink-2)\">Sadece beyaz ekmek, reçel ve çay üçlüsü kan şekerini çabuk yükseltip kısa sürede acıktırabilir.<\/p><p style=\"margin:0 0 8px;font-size:13px;line-height:1.7;color:var(--ink-2)\">Kahvaltıda protein eklemek öğle yemeğine kadar tokluğu belirgin uzatır.<\/p>\n              <p style=\"margin:10px 0 0;font-size:10.5px;color:var(--muted);font-style:italic\">📎 Kaynak: Güncel genel beslenme bilgisi ve yaygın kabul gören klinik beslenme kaynakları derlenerek hazırlanmıştır; kişisel tıbbi tavsiye yerine geçmez.<\/p>\n              <div style=\"display:flex;gap:8px;margin-top:10px\">\n                <button class=\"btn btn-sm\" type=\"button\" data-sv-art-docx=\"kahvalti\" style=\"flex:1;justify-content:center\">⬇ Word<\/button>\n                <button class=\"btn btn-sm\" type=\"button\" data-sv-art-pdf=\"kahvalti\" style=\"flex:1;justify-content:center\">⬇ PDF<\/button>\n              <\/div>\n            <\/div>\n          <\/details>\n          <details class=\"sv-art\" data-art-id=\"porsiyon-kontrolu\" style=\"border:1px solid var(--line);border-radius:10px;margin-bottom:8px;overflow:hidden\">\n            <summary style=\"list-style:none;cursor:pointer;padding:11px 14px;display:flex;align-items:center;gap:10px;font-weight:600;font-size:13.5px\">\n              <span style=\"font-size:16px\">🍽️<\/span>\n              <span style=\"flex:1\">Porsiyon Kontrolü<div style=\"font-weight:400;color:var(--muted);font-size:11.5px;margin-top:2px\">Kalori saymadan miktarı ayarlamak.<\/div><\/span>\n              <span class=\"sv-art-car\" style=\"color:var(--muted);font-size:11px\">▾<\/span>\n            <\/summary>\n            <div style=\"padding:4px 16px 16px;border-top:1px solid var(--line-2)\">\n              \n              <p style=\"margin:0 0 8px;font-size:13px;line-height:1.7;color:var(--ink-2)\">Ne yediğimiz kadar ne kadar yediğimiz de önemlidir. Büyük tabaklar ve paket yemek alışkanlığı farkında olmadan fazla yemeye yol açar.<\/p><div style=\"font-weight:700;color:var(--blue-700);font-size:13.5px;margin:14px 0 6px\">Pratik yöntemler<\/div><ul style=\"margin:0 0 8px;padding-left:18px;font-size:13px;line-height:1.7\"><li>Tabağın yarısı sebze, çeyreği protein, çeyreği karbonhidrat olsun.<\/li><li>Daha küçük tabak kullanın.<\/li><li>Atıştırmalığı pakete değil tabağa koyup yiyin.<\/li><li>Yavaş yiyin; tokluk sinyali 15-20 dakikada gelir.<\/li><\/ul><div style=\"font-weight:700;color:var(--blue-700);font-size:13.5px;margin:14px 0 6px\">El ölçüsü<\/div><p style=\"margin:0 0 8px;font-size:13px;line-height:1.7;color:var(--ink-2)\">Avuç içi kadar protein, yumruk kadar karbonhidrat, baş parmak kadar yağ yaklaşık bir porsiyondur.<\/p><p style=\"margin:0 0 8px;font-size:13px;line-height:1.7;color:var(--ink-2)\">Gözle ölçmek zamanla alışkanlık olur.<\/p>\n              <p style=\"margin:10px 0 0;font-size:10.5px;color:var(--muted);font-style:italic\">📎 Kaynak: Güncel genel beslenme bilgisi ve yaygın kabul gören klinik beslenme kaynakları derlenerek hazırlanmıştır; kişisel tıbbi tavsiye yerine geçmez.<\/p>\n              <div style=\"display:flex;gap:8px;margin-top:10px\">\n                <button class=\"btn btn-sm\" type=\"button\" data-sv-art-docx=\"porsiyon-kontrolu\" style=\"flex:1;justify-content:center\">⬇ Word<\/button>\n                <button class=\"btn btn-sm\" type=\"button\" data-sv-art-pdf=\"porsiyon-kontrolu\" style=\"flex:1;justify-content:center\">⬇ PDF<\/button>\n              <\/div>\n            <\/div>\n          <\/details>\n          <details class=\"sv-art\" data-art-id=\"etiket-okuma\" style=\"border:1px solid var(--line);border-radius:10px;margin-bottom:8px;overflow:hidden\">\n            <summary style=\"list-style:none;cursor:pointer;padding:11px 14px;display:flex;align-items:center;gap:10px;font-weight:600;font-size:13.5px\">\n              <span style=\"font-size:16px\">🏷️<\/span>\n              <span style=\"flex:1\">Besin Etiketi Okuma<div style=\"font-weight:400;color:var(--muted);font-size:11.5px;margin-top:2px\">Paketin arkasındaki gerçekler.<\/div><\/span>\n              <span class=\"sv-art-car\" style=\"color:var(--muted);font-size:11px\">▾<\/span>\n            <\/summary>\n            <div style=\"padding:4px 16px 16px;border-top:1px solid var(--line-2)\">\n              \n              <p style=\"margin:0 0 8px;font-size:13px;line-height:1.7;color:var(--ink-2)\">Etiket, ürünün gerçekte ne içerdiğini gösterir. Ön yüzdeki &quot;light&quot;, &quot;doğal&quot;, &quot;fit&quot; gibi ifadeler her zaman sağlıklı olduğu anlamına gelmez.<\/p><div style=\"font-weight:700;color:var(--blue-700);font-size:13.5px;margin:14px 0 6px\">Nelere bakmalı?<\/div><ul style=\"margin:0 0 8px;padding-left:18px;font-size:13px;line-height:1.7\"><li>İçindekiler listesi: en başta yazan en çok bulunan maddedir.<\/li><li>100 gramdaki şeker, doymuş yağ ve tuz miktarı.<\/li><li>Porsiyon büyüklüğü.<\/li><\/ul><div style=\"font-weight:700;color:var(--blue-700);font-size:13.5px;margin:14px 0 6px\">İpucu<\/div><p style=\"margin:0 0 8px;font-size:13px;line-height:1.7;color:var(--ink-2)\">İçindekiler listesi kısa ve tanıdık maddelerden oluşan ürünler genellikle daha az işlenmiştir.<\/p><p style=\"margin:0 0 8px;font-size:13px;line-height:1.7;color:var(--ink-2)\">Şeker; glikoz şurubu, fruktoz, maltodekstrin gibi farklı adlarla da yazılabilir.<\/p>\n              <p style=\"margin:10px 0 0;font-size:10.5px;color:var(--muted);font-style:italic\">📎 Kaynak: Güncel genel beslenme bilgisi ve yaygın kabul gören klinik beslenme kaynakları derlenerek hazırlanmıştır; kişisel tıbbi tavsiye yerine geçmez.<\/p>\n              <div style=\"display:flex;gap:8px;margin-top:10px\">\n                <button class=\"btn btn-sm\" type=\"button\" data-sv-art-docx=\"etiket-okuma\" style=\"flex:1;justify-content:center\">⬇ Word<\/button>\n                <button class=\"btn btn-sm\" type=\"button\" data-sv-art-pdf=\"etiket-okuma\" style=\"flex:1;justify-content:center\">⬇ PDF<\/button>\n              <\/div>\n            <\/div>\n          <\/details>\n          <details class=\"sv-art\" data-art-id=\"islenmis-gida\" style=\"border:1px solid var(--line);border-radius:10px;margin-bottom:8px;overflow:hidden\">\n            <summary style=\"list-style:none;cursor:pointer;padding:11px 14px;display:flex;align-items:center;gap:10px;font-weight:600;font-size:13.5px\">\n              <span style=\"font-size:16px\">🍟<\/span>\n              <span style=\"flex:1\">Ultra İşlenmiş Gıdalar<div style=\"font-weight:400;color:var(--muted);font-size:11.5px;margin-top:2px\">Hazır ürünleri azaltmak neden önemli?<\/div><\/span>\n              <span class=\"sv-art-car\" style=\"color:var(--muted);font-size:11px\">▾<\/span>\n            <\/summary>\n            <div style=\"padding:4px 16px 16px;border-top:1px solid var(--line-2)\">\n              \n              <p style=\"margin:0 0 8px;font-size:13px;line-height:1.7;color:var(--ink-2)\">Gazlı içecekler, hazır çorba, paketli atıştırmalıklar ve fast food ultra işlenmiş gıdalara örnektir. Genellikle şeker, tuz ve yağ bakımından yüksek, lif bakımından düşüktür.<\/p><div style=\"font-weight:700;color:var(--blue-700);font-size:13.5px;margin:14px 0 6px\">Neden sorunlu?<\/div><p style=\"margin:0 0 8px;font-size:13px;line-height:1.7;color:var(--ink-2)\">Aşırı lezzetli ve doyurucu olmayacak şekilde tasarlandıkları için kolay fazla yenir; düzenli tüketimi kilo artışı ve metabolik hastalık riskiyle ilişkilendirilir.<\/p><div style=\"font-weight:700;color:var(--blue-700);font-size:13.5px;margin:14px 0 6px\">Nasıl azaltılır?<\/div><ul style=\"margin:0 0 8px;padding-left:18px;font-size:13px;line-height:1.7\"><li>Evde taze malzemeyle basit yemekler yapın.<\/li><li>Atıştırmalık olarak meyve, kuruyemiş ve yoğurt bulundurun.<\/li><li>Bir anda bırakmak yerine haftada bir ürünü değiştirin.<\/li><\/ul><p style=\"margin:0 0 8px;font-size:13px;line-height:1.7;color:var(--ink-2)\">Tamamen yasak koymak yerine sıklığı azaltmak daha sürdürülebilirdir.<\/p>\n              <p style=\"margin:10px 0 0;font-size:10.5px;color:var(--muted);font-style:italic\">📎 Kaynak: Güncel genel beslenme bilgisi ve yaygın kabul gören klinik beslenme kaynakları derlenerek hazırlanmıştır; kişisel tıbbi tavsiye yerine geçmez.<\/p>\n              <div style=\"display:flex;gap:8px;margin-top:10px\">\n                <button class=\"btn btn-sm\" type=\"button\" data-sv-art-docx=\"islenmis-gida\" style=\"flex:1;justify-content:center\">⬇ Word<\/button>\n                <button class=\"btn btn-sm\" type=\"button\" data-sv-art-pdf=\"islenmis-gida\" style=\"flex:1;justify-content:center\">⬇ PDF<\/button>\n              <\/div>\n            <\/div>\n          <\/details>\n          <details class=\"sv-art\" data-art-id=\"disarida-yemek\" style=\"border:1px solid var(--line);border-radius:10px;margin-bottom:8px;overflow:hidden\">\n            <summary style=\"list-style:none;cursor:pointer;padding:11px 14px;display:flex;align-items:center;gap:10px;font-weight:600;font-size:13.5px\">\n              <span style=\"font-size:16px\">🍴<\/span>\n              <span style=\"flex:1\">Dışarıda Yemek<div style=\"font-weight:400;color:var(--muted);font-size:11.5px;margin-top:2px\">Dengeyi bozmadan dışarıda yemenin yolları.<\/div><\/span>\n              <span class=\"sv-art-car\" style=\"color:var(--muted);font-size:11px\">▾<\/span>\n            <\/summary>\n            <div style=\"padding:4px 16px 16px;border-top:1px solid var(--line-2)\">\n              \n              <p style=\"margin:0 0 8px;font-size:13px;line-height:1.7;color:var(--ink-2)\">Dışarıda yemek sosyal hayatın bir parçasıdır; planlı yaklaşınca diyeti bozmak zorunda değildir.<\/p><div style=\"font-weight:700;color:var(--blue-700);font-size:13.5px;margin:14px 0 6px\">Akıllı seçimler<\/div><ul style=\"margin:0 0 8px;padding-left:18px;font-size:13px;line-height:1.7\"><li>Izgara, haşlama, fırın seçenekleri tercih edin.<\/li><li>Sosları ayrı isteyin.<\/li><li>Yanında salata veya sebze ekleyin.<\/li><li>Ekmek sepetini masadan uzaklaştırın.<\/li><\/ul><div style=\"font-weight:700;color:var(--blue-700);font-size:13.5px;margin:14px 0 6px\">Öncesinde<\/div><p style=\"margin:0 0 8px;font-size:13px;line-height:1.7;color:var(--ink-2)\">Çok aç gitmemek için hafif bir ara öğün yapmak aşırı yemeyi önler.<\/p><p style=\"margin:0 0 8px;font-size:13px;line-height:1.7;color:var(--ink-2)\">Bir öğünün sapması tüm süreci bozmaz; bir sonraki öğünde yola devam edin.<\/p>\n              <p style=\"margin:10px 0 0;font-size:10.5px;color:var(--muted);font-style:italic\">📎 Kaynak: Güncel genel beslenme bilgisi ve yaygın kabul gören klinik beslenme kaynakları derlenerek hazırlanmıştır; kişisel tıbbi tavsiye yerine geçmez.<\/p>\n              <div style=\"display:flex;gap:8px;margin-top:10px\">\n                <button class=\"btn btn-sm\" type=\"button\" data-sv-art-docx=\"disarida-yemek\" style=\"flex:1;justify-content:center\">⬇ Word<\/button>\n                <button class=\"btn btn-sm\" type=\"button\" data-sv-art-pdf=\"disarida-yemek\" style=\"flex:1;justify-content:center\">⬇ PDF<\/button>\n              <\/div>\n            <\/div>\n          <\/details>\n          <details class=\"sv-art\" data-art-id=\"ramazan-beslenme\" style=\"border:1px solid var(--line);border-radius:10px;margin-bottom:8px;overflow:hidden\">\n            <summary style=\"list-style:none;cursor:pointer;padding:11px 14px;display:flex;align-items:center;gap:10px;font-weight:600;font-size:13.5px\">\n              <span style=\"font-size:16px\">🌙<\/span>\n              <span style=\"flex:1\">Ramazanda Sağlıklı Beslenme<div style=\"font-weight:400;color:var(--muted);font-size:11.5px;margin-top:2px\">Sahur ve iftarda dengeyi korumak.<\/div><\/span>\n              <span class=\"sv-art-car\" style=\"color:var(--muted);font-size:11px\">▾<\/span>\n            <\/summary>\n            <div style=\"padding:4px 16px 16px;border-top:1px solid var(--line-2)\">\n              \n              <p style=\"margin:0 0 8px;font-size:13px;line-height:1.7;color:var(--ink-2)\">Ramazanda öğün düzeni değişir; doğru planlanırsa oruç sağlıklı geçirilebilir.<\/p><div style=\"font-weight:700;color:var(--blue-700);font-size:13.5px;margin:14px 0 6px\">Sahur<\/div><ul style=\"margin:0 0 8px;padding-left:18px;font-size:13px;line-height:1.7\"><li>Yulaf, yumurta, peynir, zeytin, tam tahıllı ekmek gibi tok tutan besinler.<\/li><li>Bol su (iftar ile sahur arasında dağıtarak).<\/li><li>Aşırı tuzlu yiyeceklerden kaçının.<\/li><\/ul><div style=\"font-weight:700;color:var(--blue-700);font-size:13.5px;margin:14px 0 6px\">İftar<\/div><ul style=\"margin:0 0 8px;padding-left:18px;font-size:13px;line-height:1.7\"><li>Hurma ve su veya çorba ile yavaş başlayın.<\/li><li>Ana yemeği ölçülü yiyin, kızartmayı azaltın.<\/li><li>Tatlıyı ara sıra ve küçük porsiyon olarak tercih edin.<\/li><\/ul><p style=\"margin:0 0 8px;font-size:13px;line-height:1.7;color:var(--ink-2)\">Kronik hastalığı olanlar ve ilaç kullananlar oruç öncesi hekimlerine danışmalıdır.<\/p>\n              <p style=\"margin:10px 0 0;font-size:10.5px;color:var(--muted);font-style:italic\">📎 Kaynak: Güncel genel beslenme bilgisi ve yaygın kabul gören klinik beslenme kaynakları derlenerek hazırlanmıştır; kişisel tıbbi tavsiye yerine geçmez.<\/p>\n              <div style=\"display:flex;gap:8px;margin-top:10px\">\n                <button class=\"btn btn-sm\" type=\"button\" data-sv-art-docx=\"ramazan-beslenme\" style=\"flex:1;justify-content:center\">⬇ Word<\/button>\n                <button class=\"btn btn-sm\" type=\"button\" data-sv-art-pdf=\"ramazan-beslenme\" style=\"flex:1;justify-content:center\">⬇ PDF<\/button>\n              <\/div>\n            <\/div>\n          <\/details>\n          <details class=\"sv-art\" data-art-id=\"kafein-kahve\" style=\"border:1px solid var(--line);border-radius:10px;margin-bottom:8px;overflow:hidden\">\n            <summary style=\"list-style:none;cursor:pointer;padding:11px 14px;display:flex;align-items:center;gap:10px;font-weight:600;font-size:13.5px\">\n              <span style=\"font-size:16px\">☕<\/span>\n              <span style=\"flex:1\">Kafein ve Kahve<div style=\"font-weight:400;color:var(--muted);font-size:11.5px;margin-top:2px\">Ne kadar kahve fazla?<\/div><\/span>\n              <span class=\"sv-art-car\" style=\"color:var(--muted);font-size:11px\">▾<\/span>\n            <\/summary>\n            <div style=\"padding:4px 16px 16px;border-top:1px solid var(--line-2)\">\n              \n              <p style=\"margin:0 0 8px;font-size:13px;line-height:1.7;color:var(--ink-2)\">Sağlıklı yetişkinler için günlük yaklaşık 400 mg kafein (3-4 fincan kahve) genellikle güvenli kabul edilir; ancak hassasiyet kişiden kişiye değişir.<\/p><div style=\"font-weight:700;color:var(--blue-700);font-size:13.5px;margin:14px 0 6px\">Dikkat edin<\/div><ul style=\"margin:0 0 8px;padding-left:18px;font-size:13px;line-height:1.7\"><li>Uykuya yakın saatlerde kafein almamak uykuyu korur.<\/li><li>Çarpıntı, kaygı, mide yanması yapıyorsa azaltın.<\/li><li>Hamilelikte günlük sınır daha düşüktür (yaklaşık 200 mg).<\/li><li>Şekerli ve kremalı kahveler kalori ekler.<\/li><\/ul><div style=\"font-weight:700;color:var(--blue-700);font-size:13.5px;margin:14px 0 6px\">Not<\/div><p style=\"margin:0 0 8px;font-size:13px;line-height:1.7;color:var(--ink-2)\">Çay, çikolata ve enerji içecekleri de kafein içerir.<\/p><p style=\"margin:0 0 8px;font-size:13px;line-height:1.7;color:var(--ink-2)\">Kahveyi yemekle değil, yemekler arasında içmek demir emilimini daha az etkiler.<\/p>\n              <p style=\"margin:10px 0 0;font-size:10.5px;color:var(--muted);font-style:italic\">📎 Kaynak: Güncel genel beslenme bilgisi ve yaygın kabul gören klinik beslenme kaynakları derlenerek hazırlanmıştır; kişisel tıbbi tavsiye yerine geçmez.<\/p>\n              <div style=\"display:flex;gap:8px;margin-top:10px\">\n                <button class=\"btn btn-sm\" type=\"button\" data-sv-art-docx=\"kafein-kahve\" style=\"flex:1;justify-content:center\">⬇ Word<\/button>\n                <button class=\"btn btn-sm\" type=\"button\" data-sv-art-pdf=\"kafein-kahve\" style=\"flex:1;justify-content:center\">⬇ PDF<\/button>\n              <\/div>\n            <\/div>\n          <\/details>\n          <details class=\"sv-art\" data-art-id=\"yasli-beslenme\" style=\"border:1px solid var(--line);border-radius:10px;margin-bottom:8px;overflow:hidden\">\n            <summary style=\"list-style:none;cursor:pointer;padding:11px 14px;display:flex;align-items:center;gap:10px;font-weight:600;font-size:13.5px\">\n              <span style=\"font-size:16px\">👵<\/span>\n              <span style=\"flex:1\">İleri Yaşta Beslenme<div style=\"font-weight:400;color:var(--muted);font-size:11.5px;margin-top:2px\">Daha az kalori, daha çok besin değeri.<\/div><\/span>\n              <span class=\"sv-art-car\" style=\"color:var(--muted);font-size:11px\">▾<\/span>\n            <\/summary>\n            <div style=\"padding:4px 16px 16px;border-top:1px solid var(--line-2)\">\n              \n              <p style=\"margin:0 0 8px;font-size:13px;line-height:1.7;color:var(--ink-2)\">Yaşla birlikte enerji ihtiyacı azalır ama protein, D vitamini, kalsiyum ve B12 ihtiyacı sürer veya artar.<\/p><div style=\"font-weight:700;color:var(--blue-700);font-size:13.5px;margin:14px 0 6px\">Dikkat edilecekler<\/div><ul style=\"margin:0 0 8px;padding-left:18px;font-size:13px;line-height:1.7\"><li>Kas kaybını önlemek için her öğünde protein alın.<\/li><li>İştah azalıyorsa küçük ve sık öğünler deneyin.<\/li><li>Susama hissi azalabilir; düzenli su için.<\/li><li>Hafif direnç egzersizi yapın.<\/li><\/ul><div style=\"font-weight:700;color:var(--blue-700);font-size:13.5px;margin:14px 0 6px\">Çiğneme ve yutma<\/div><p style=\"margin:0 0 8px;font-size:13px;line-height:1.7;color:var(--ink-2)\">Diş veya yutma sorunları varsa besinlerin kıvamını değiştirin ve uzmana danışın.<\/p><p style=\"margin:0 0 8px;font-size:13px;line-height:1.7;color:var(--ink-2)\">Bilinçsiz kilo kaybı yaşlıda ciddi bir uyarı işaretidir; hek
