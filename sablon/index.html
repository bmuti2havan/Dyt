<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Diyetisyen · Kişiye Özel Beslenme Danışmanlığı</title>
<meta name="description" content="Kişiye özel beslenme danışmanlığı.">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#9C3F60">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Caveat:wght@600&family=Dancing+Script:wght@700&display=swap">
<style>

:root{
  --blue-900:#5C2238; --blue-700:#9C3F60; --blue-600:#C15678; --blue-500:#D98CA0;
  --blue-100:#F6DCE4; --blue-50:#FBEEF2; --canvas:#FBF3F5;
  --ink:#3A222B; --ink-2:#7A5362; --muted:#A4818C; --line:#EAD0D9; --line-2:#F4E4E9;
  --surface:#FFFFFF;
  --protein:#2563C9; --karb:#3E9BC4; --yag:#2E9BAE; --lif:#4A7FD0;
  --ok:#0F7B96; --ok-bg:#E3F4F8; --warn:#9A6B06; --warn-bg:#FCF3E1; --danger:#B23A31; --danger-bg:#FBECEA;
  --r:14px; --r-s:10px;
  --shadow:0 1px 2px rgba(92,34,56,.05), 0 12px 28px -22px rgba(92,34,56,.45);
  --shadow-lg:0 2px 4px rgba(92,34,56,.05), 0 22px 48px -28px rgba(92,34,56,.5);
  --ring:0 0 0 3px rgba(193,86,120,.18);
  --serif:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,ui-serif,serif;
  --sans:ui-sans-serif,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,"Roboto Mono",monospace;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--canvas);color:var(--ink);font-family:var(--sans);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
h1,h2,h3,h4{font-family:var(--serif);font-weight:600;letter-spacing:-.01em;margin:0}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}

.app{display:flex;min-height:100vh}
body{background:radial-gradient(1200px 600px at 78% -10%, #F9DCE4 0%, transparent 60%), var(--canvas)}
#shareView{min-height:100vh;background:var(--canvas)}
.sv-wrap{max-width:640px;margin:0 auto;padding:28px 20px 50px}
@keyframes svFadeUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
.sv-wrap>*{animation:svFadeUp .5s cubic-bezier(.2,.7,.3,1) both}
.sv-wrap>*:nth-child(n+2){animation-delay:.05s}
.sv-wrap>*:nth-child(n+4){animation-delay:.09s}
.sv-wrap>*:nth-child(n+7){animation-delay:.12s}
@media(prefers-reduced-motion:reduce){.sv-wrap>*{animation:none}}
.sv-promo-wrap{background:#fff;border-radius:18px;overflow:hidden;box-shadow:0 10px 40px rgba(92,34,56,.12)}
.sv-promo-hero{background:linear-gradient(135deg,var(--blue-900),var(--blue-600));color:#fff;padding:40px 24px 32px;text-align:center}
.sv-promo-logo{height:48px;margin-bottom:14px;border-radius:8px}
.sv-promo-hero h1{font-family:var(--serif);font-size:26px;margin:0 0 8px;line-height:1.3}
.sv-promo-sub{margin:0;font-size:14px;opacity:.92}
.sv-promo-body{padding:28px 24px 8px}
.sv-promo-lead{font-size:15px;line-height:1.7;margin:0 0 20px}
.sv-promo-feat{display:grid;gap:10px;margin:0 0 24px;padding:16px 18px;background:var(--blue-50);border-radius:12px;font-size:14px}
.sv-promo-body h3{font-family:var(--serif);color:var(--blue-900);font-size:17px;margin:0 0 10px}
.sv-promo-body>p{font-size:14px;line-height:1.7;color:var(--ink-2)}
.sv-promo-preg-btn{display:block;width:100%;margin:22px 0 0;padding:14px 16px;border:1px solid #fbcfe8;background:linear-gradient(135deg,#fdf2f8,#fff);border-radius:12px;font-weight:600;font-size:14px;color:#9d174d;cursor:pointer;text-align:center}
.sv-promo-preg-box{margin-top:14px;padding:18px 18px 8px;border-radius:12px;background:#fdf2f8;border:1px solid #fbcfe8}
.sv-promo-preg-box h3{color:#9d174d}
.sv-promo-preg-box>p{font-size:13.5px;line-height:1.65}
.sv-promo-preg-calc{margin:14px 0;padding:14px;background:#fff;border-radius:10px;border:1px solid #fbcfe8}
.sv-promo-preg-calc label{font-size:12.5px;font-weight:600;color:#9d174d}
.sv-promo-preg-calc input{padding:9px 10px;border:1px solid var(--line);border-radius:8px;font-size:14px}
.sv-promo-preg-result{margin-top:10px;font-size:13.5px;line-height:1.6}
.sv-promo-preg-list{margin:0 0 12px;padding-left:18px;font-size:13.5px;line-height:1.7}
.sv-promo-preg-motiv{font-style:italic;text-align:center;font-size:13.5px}
.sv-promo-cta{margin:26px 0 8px;padding:20px;text-align:center;background:var(--blue-50);border-radius:12px}
.sv-promo-cta p{margin:0 0 14px;font-size:14.5px;line-height:1.6}
.sv-promo-wa-btn{display:inline-block;padding:13px 28px;background:#25D366;color:#fff;border-radius:999px;font-weight:600;font-size:14.5px;text-decoration:none}
.sv-promo-foot{text-align:center;color:var(--muted);font-size:12px;padding:18px 0}
@media(max-width:480px){.sv-promo-hero h1{font-size:22px}}
.sv-promo-bio{padding:22px 24px;background:#fff;border-bottom:1px solid var(--line)}
.sv-promo-bio img{display:block;width:100%;max-width:340px;margin:0 auto 18px;border-radius:16px;box-shadow:0 8px 28px rgba(92,34,56,.18)}
.sv-promo-bio h3{font-family:var(--serif);color:var(--blue-900);font-size:20px;margin:0 0 10px}
.sv-promo-bio p{font-size:14px;line-height:1.75;color:var(--ink-2);margin:0 0 12px}
.sv-promo-bio-quote{font-family:var(--serif);font-style:italic;font-size:16px;color:var(--blue-900);text-align:center;padding:14px 10px;margin:16px 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.sv-promo-bio dl{margin:0;display:grid;gap:10px;font-size:13.5px}
.sv-promo-bio dt{font-weight:700;color:var(--blue-900)}
.sv-promo-bio dd{margin:2px 0 0;color:var(--ink-2)}
.sv-promo-calc{margin:0 0 24px;padding:18px;border-radius:14px;background:linear-gradient(135deg,var(--blue-50),#fff);border:1px solid var(--blue-50)}
.sv-promo-calc input{padding:10px;border:1px solid var(--line);border-radius:8px;font-size:15px;width:100%}
.sv-promo-fab{position:fixed;right:18px;bottom:18px;z-index:40;width:60px;height:60px;border-radius:50%;background:#25D366;display:flex;align-items:center;justify-content:center;box-shadow:0 6px 20px rgba(0,0,0,.28);transition:transform .15s}
.sv-promo-fab:hover{transform:scale(1.08)}
.sv-promo-fab svg{width:34px;height:34px}
.pm{--g:#25D366;max-width:640px;margin:0 auto;color:var(--ink)}
.pm h2{font-family:var(--serif);font-size:22px;color:var(--blue-900);margin:0 0 14px;letter-spacing:-.01em}
.pm p{line-height:1.75}
.pm-muted{color:var(--ink-2);font-size:13.5px;margin:0 0 12px}
.pm-hero{text-align:center;padding:44px 22px 40px;background:linear-gradient(160deg,var(--blue-900),var(--blue-600));color:#fff;border-radius:24px;margin:0 0 8px}
.pm-logo{height:46px;border-radius:8px;margin-bottom:14px}
.pm-eyebrow{display:inline-block;font-size:12px;letter-spacing:.08em;text-transform:uppercase;opacity:.85;margin-bottom:14px}
.pm-hero h1{font-family:var(--serif);font-size:28px;line-height:1.25;margin:0 0 10px;font-weight:700}
.pm-sub{margin:0 0 24px;opacity:.9;font-size:14.5px}
.pm-hero-btns{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.pm-btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:13px 24px;border-radius:999px;font-weight:700;font-size:15px;text-decoration:none;border:0;cursor:pointer}
.pm-btn-wa{background:var(--g);color:#fff}
.pm-btn-ghost{background:rgba(255,255,255,.14);color:#fff;border:1px solid rgba(255,255,255,.4)}
.pm-btn-solid{background:var(--blue-900);color:#fff}
.pm-sec{padding:34px 4px 0}
.pm-about{text-align:left}
.pm-about img{display:block;width:100%;max-width:300px;height:auto;margin:0 auto 22px;border-radius:20px;box-shadow:0 14px 36px rgba(92,34,56,.2)}
.pm-about p{font-size:15px;color:var(--ink-2);margin:0 0 14px}
.pm-about blockquote{margin:22px 0;padding:6px 0 6px 18px;border-left:3px solid var(--blue-500);font-family:var(--serif);font-style:italic;font-size:18px;line-height:1.5;color:var(--blue-900)}
.pm-facts{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pm-facts>div{background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px;font-size:13px;color:var(--ink-2);line-height:1.5}
.pm-facts small{display:block;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-bottom:4px}
.pm-facts b{display:block;color:var(--ink);font-size:14px}
.pm-steps{display:grid;gap:12px}
.pm-steps>div{display:flex;gap:14px;background:#fff;border:1px solid var(--line);border-radius:16px;padding:16px}
.pm-steps span{flex:0 0 34px;height:34px;border-radius:50%;background:var(--blue-900);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700}
.pm-steps b{display:block;margin-bottom:3px}
.pm-steps p{margin:0;font-size:13.5px;color:var(--ink-2);line-height:1.6}
.pm-feat{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.pm-feat>div{background:#fff;border:1px solid var(--line);border-radius:16px;padding:16px}
.pm-feat i{font-style:normal;font-size:24px;display:block;margin-bottom:8px}
.pm-feat b{display:block;font-size:14px;margin-bottom:4px}
.pm-feat p{margin:0;font-size:12.5px;color:var(--ink-2);line-height:1.55}
.pm-card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:18px}
.pm-row{display:flex;gap:10px}
.pm-row input{flex:1;min-width:0;padding:12px;border:1px solid var(--line);border-radius:10px;font-size:15px}
.pm-det{background:#fff;border:1px solid var(--line);border-radius:16px;overflow:hidden}
.pm-det>summary{cursor:pointer;padding:16px 18px;font-weight:600;font-size:14.5px;list-style:none;display:flex;justify-content:space-between;gap:10px}
.pm-det>summary::-webkit-details-marker{display:none}
.pm-det>summary::after{content:'+';font-size:20px;color:var(--muted)}
.pm-det[open]>summary::after{content:'–'}
.pm-det-body{padding:4px 14px 16px}
.pm-faq{background:#fff;border:1px solid var(--line);border-radius:16px;overflow:hidden}
.pm-faq details{border-bottom:1px solid var(--line)}
.pm-faq details:last-child{border-bottom:0}
.pm-faq summary{cursor:pointer;padding:15px 18px;font-weight:600;font-size:14px;list-style:none;display:flex;justify-content:space-between;gap:10px}
.pm-faq summary::-webkit-details-marker{display:none}
.pm-faq summary::after{content:'+';font-size:20px;font-weight:400;color:var(--muted)}
.pm-faq details[open] summary::after{content:'–'}
.pm-faq p{margin:0;padding:0 18px 16px;font-size:13.5px;color:var(--ink-2);line-height:1.6}
.pm-cta{margin:40px 0 0;padding:34px 22px;text-align:center;background:linear-gradient(160deg,var(--blue-900),var(--blue-600));color:#fff;border-radius:24px}
.pm-cta h2{color:#fff;margin:0 0 6px}
.pm-cta p{margin:0 0 20px;opacity:.9}
.pm-foot{text-align:center;color:var(--muted);font-size:12px;padding:20px 0 96px}
@media(max-width:380px){.pm-feat,.pm-facts{grid-template-columns:1fr}}
.pm-guide{display:flex;align-items:center;gap:14px;width:100%;padding:18px 18px;border:0;border-radius:20px;cursor:pointer;text-align:left;color:#fff;background:linear-gradient(135deg,#E8A33D,#D9567B 55%,#9C3F60);box-shadow:0 10px 28px rgba(217,86,123,.38);animation:pmPulse 2.4s ease-in-out infinite}
.pm-guide-ic{font-size:34px;flex:0 0 auto;filter:drop-shadow(0 2px 4px rgba(0,0,0,.2))}
.pm-guide-tx{flex:1;display:flex;flex-direction:column;gap:3px}
.pm-guide-tx b{font-size:18px;font-family:var(--serif)}
.pm-guide-tx small{font-size:12.5px;opacity:.95;line-height:1.4}
.pm-guide-go{flex:0 0 auto;background:#fff;color:#9C3F60;font-weight:800;font-size:13px;padding:9px 16px;border-radius:999px}
@keyframes pmPulse{0%,100%{box-shadow:0 10px 28px rgba(217,86,123,.38),0 0 0 0 rgba(217,86,123,.45)}50%{box-shadow:0 10px 28px rgba(217,86,123,.38),0 0 0 10px rgba(217,86,123,0)}}
@media(prefers-reduced-motion:reduce){.pm-guide{animation:none}}
.pm-kicker{display:inline-block;background:#FFE9C7;color:#8a5a00;font-weight:800;font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;padding:5px 12px;border-radius:999px;margin-bottom:10px}
.pm-ex{padding-top:30px}
.pm-ex-box{padding:14px}
.pm-how{border-radius:20px;padding:22px 20px;line-height:1.7}
.pm-how h3{font-family:var(--serif);font-size:19px;margin:0 0 12px}
.pm-how p{font-size:14.5px;margin:0 0 12px}
.pm-how p:last-child{margin-bottom:0}
.pm-how-a{background:linear-gradient(145deg,#FFF1F5,#FFE0EA);border:1px solid #F8C3D3}
.pm-how-a h3{color:#B2325F}
.pm-how-a b{color:#9C2A52}
.pm-how-b{background:linear-gradient(145deg,#E9F7F3,#D6F0E8);border:1px solid #A9DCCB}
.pm-how-b h3{color:#1D7A62}
.pm-how-b b{color:#176450}
.pm-hero{padding:26px 20px 28px!important;background:radial-gradient(120% 80% at 50% -10%,rgba(255,255,255,.16),transparent 60%),linear-gradient(160deg,var(--blue-900),var(--blue-600))!important}
.pm-avatar{display:block;width:116px;height:116px;border-radius:50%;object-fit:cover;object-position:50% 16%;margin:4px auto 14px;border:4px solid rgba(255,255,255,.9);box-shadow:0 10px 30px rgba(0,0,0,.3)}
.pm-logo{height:34px!important;margin-bottom:8px!important;opacity:.95}
.pm-hero .pm-eyebrow{margin-bottom:4px!important;font-size:11.5px}
.pm-hero h1{font-size:30px!important;margin:0 0 6px!important}
.pm-tag{margin:0 auto 16px;max-width:300px;font-size:15px;line-height:1.5;opacity:.95}
.pm-chips{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin-bottom:20px}
.pm-chips span,.pm-chips a{background:rgba(255,255,255,.15);border:1px solid rgba(255,255,255,.28);padding:6px 11px;border-radius:999px;font-size:12px;font-weight:600}
.pm-hero-btns{flex-wrap:nowrap!important}
.pm-hero-btns{gap:8px!important}.pm-hero-btns .pm-btn{flex:1 1 0;padding:13px 8px;font-size:13.5px;white-space:nowrap;gap:6px}
@media(max-width:360px){.pm-hero-btns{flex-wrap:wrap!important}}
.pm-photo{width:min(62%,250px);margin:4px auto 14px;transform:rotate(-2deg);border-radius:22px;padding:6px;background:linear-gradient(135deg,#FFE29A,#FFB3C7 55%,#FFFFFF);box-shadow:0 16px 36px rgba(0,0,0,.35)}
.pm-photo img{display:block;width:100%;aspect-ratio:4/5;object-fit:cover;object-position:50% 36%;border-radius:17px}
.pm-script{font-family:'Dancing Script','Segoe Script','Brush Script MT',cursive!important;font-size:46px!important;font-weight:700!important;line-height:1.1;margin:2px 0 4px!important;background:linear-gradient(90deg,#FFE29A,#FFC1D6 50%,#FFFFFF);-webkit-background-clip:text;background-clip:text;color:transparent!important;-webkit-text-fill-color:transparent;letter-spacing:0}
.pm-hand{font-family:'Caveat','Segoe Script',cursive;font-size:24px!important;line-height:1.25!important;color:#FFD9A8;max-width:320px!important;opacity:1!important}
.pm-hero .pm-eyebrow{color:#FFD9A8;letter-spacing:.2em}
.pm-dis-grid{display:flex;flex-wrap:wrap;gap:8px}
.pm-dis{display:inline-flex;align-items:center;gap:7px;padding:10px 14px;border:1px solid var(--line);background:#fff;border-radius:999px;font-size:13.5px;font-weight:600;color:var(--blue-900);cursor:pointer}
.pm-dis i{font-style:normal;font-size:16px}
.pm-dis:active{background:var(--blue-50)}
.pm-how-c{background:linear-gradient(145deg,#FFF6E0,#FFE9B8);border:1px solid #F2D28A}
.pm-how-c h3{color:#A86A00}
.pm-how-c b{color:#8A5600}
.pm-how-d{background:linear-gradient(145deg,#F1ECFF,#E2D8FF);border:1px solid #C9B9F5}
.pm-how-d h3{color:#5B3FB0}
.pm-how-d b{color:#4A3092}
.pm-sl-g{margin-bottom:14px}
.pm-sl-g b{display:block;font-size:13px;color:var(--blue-900);margin-bottom:6px}
.pm-sl label{display:flex;align-items:center;gap:10px;padding:8px 2px;border-bottom:1px solid var(--line-2);font-size:14px;cursor:pointer}
.pm-sl input{width:18px;height:18px;accent-color:var(--blue-600);flex:0 0 auto}
.pm-sl input:checked+span{opacity:.45;text-decoration:line-through}
.pm-tips{margin-top:14px;padding:18px;border-radius:18px;background:linear-gradient(145deg,#FFF6E0,#FFE9B8);border:1px solid #F2D28A}
.pm-tips h3{font-family:var(--serif);font-size:18px;color:#A86A00;margin:0 0 10px}
.pm-tips ul{margin:0;padding-left:18px;font-size:14px;line-height:1.65;color:var(--ink-2)}
.pm-tips li{margin-bottom:6px}
.pm-tips b{color:#8A5600}
.pm-prev{display:grid;gap:14px}
.pm-prev-c{background:#fff;border:1px solid var(--line);border-radius:18px;overflow:hidden;box-shadow:0 6px 18px rgba(92,34,56,.08)}
.pm-prev-c img{display:block;width:100%;height:170px;object-fit:cover}
.pm-prev-b{padding:14px 16px 16px}
.pm-prev-b b{display:block;font-size:16px;margin-bottom:5px;color:var(--blue-900)}
.pm-prev-b p{margin:0 0 12px;font-size:13.5px;color:var(--ink-2);line-height:1.55}
.pm-more{display:inline-flex;align-items:center;justify-content:center;border:0;cursor:pointer;color:#fff;font-weight:800;font-size:14px;padding:11px 20px;border-radius:999px;background:linear-gradient(135deg,#E8A33D,#D9567B 60%,#9C3F60);box-shadow:0 6px 16px rgba(217,86,123,.35)}
.pm-more-all{width:100%;margin-top:14px;background:linear-gradient(135deg,#5B3FB0,#9C3F60)}
.pm-fabs{position:fixed;right:18px;bottom:18px;z-index:40;display:flex;flex-direction:column;gap:12px;align-items:center}
.pm-fabs .sv-promo-fab{position:static;color:#fff}
.pm-ig{width:52px;height:52px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:radial-gradient(circle at 30% 107%,#fdf497 0%,#fdf497 5%,#fd5949 45%,#d6249f 60%,#285AEB 90%);box-shadow:0 6px 18px rgba(0,0,0,.28)}
.pm-form{display:grid;gap:10px;margin-top:12px}.pm-form input,.pm-form select{width:100%;box-sizing:border-box;padding:13px 14px;border:1px solid var(--line);border-radius:12px;font:inherit;font-size:15px;background:#fff;color:var(--ink)}
.pm-form .pm-btn{justify-content:center;border:0;cursor:pointer}
.pm-hero{background:radial-gradient(90% 60% at 50% 18%,rgba(255,236,200,.35),transparent 65%),linear-gradient(165deg,#9C3F60 0%,#D2607C 52%,#EE9A72 100%)!important;padding:24px 20px 30px!important}
.pm-glow{position:relative;margin:0 auto 6px}.pm-glow:before{content:"";position:absolute;inset:-14px;border-radius:50%;background:radial-gradient(circle,rgba(255,244,214,.55),transparent 68%);z-index:0}
.pm-glow .pm-photo{position:relative;z-index:1;margin:0 auto}
.pm-name{font-size:32px!important;margin:6px 0 10px!important}
.pm-big{font-family:'Caveat','Segoe Script',cursive!important;font-size:38px!important;line-height:1.08!important;margin:0 0 10px!important;color:#fff;text-shadow:0 2px 10px rgba(92,34,56,.35)}
.pm-big em{font-style:normal;color:#FFF0C2}
.pm-sub{margin:0 auto 12px;max-width:310px;font-size:14px;line-height:1.5;color:#fff;opacity:.95}
.pm-trust{display:flex;flex-wrap:wrap;justify-content:center;gap:4px 12px;font-size:12px;font-weight:600;margin:0 0 16px}.pm-trust span{white-space:nowrap}.pm-hero .pm-photo{width:min(50%,205px)!important}
.pm-btn-main{width:100%;box-sizing:border-box;background:#25D366;color:#fff;font-size:16.5px!important;padding:16px 14px!important;box-shadow:0 10px 24px rgba(20,120,60,.4);animation:pmPulse 2.6s infinite}

.pm-btn-map{width:100%;box-sizing:border-box;background:linear-gradient(135deg,#4285F4,#2B6AD9);color:#fff;box-shadow:0 8px 20px -8px rgba(40,100,220,.6)}
.sv-hero{background:radial-gradient(90% 70% at 85% 0%,rgba(255,236,200,.35),transparent 60%),linear-gradient(165deg,#9C3F60 0%,#D2607C 55%,#EE9A72 100%)!important}

.sv-top{display:flex;align-items:center;gap:12px}
.sv-card{background:#fff;border:1px solid var(--line);border-radius:18px;overflow:hidden;box-shadow:0 2px 3px rgba(92,34,56,.04),0 14px 30px -22px rgba(92,34,56,.35)}

.sv-hero{position:relative;overflow:hidden;background:linear-gradient(135deg,var(--blue-900) 0%,var(--blue-700) 45%,var(--blue-500) 80%,#F0B8C6 100%);color:#fff;border-radius:18px;padding:22px}
.sv-hero::before{content:'';position:absolute;right:-56px;top:-76px;width:220px;height:220px;border-radius:50%;background:rgba(255,255,255,.09)}
.sv-hero::after{content:'';position:absolute;left:-34px;bottom:-66px;width:170px;height:170px;border-radius:50%;background:rgba(255,255,255,.07)}

.sv-brand{display:flex;align-items:center;gap:10px;margin-bottom:16px}

}
.rail{width:262px;flex:0 0 262px;background:linear-gradient(185deg,#FFFFFF 0%,#F3F9FE 100%);border-right:1px solid var(--line);position:sticky;top:0;height:100vh;display:flex;flex-direction:column}
.i{flex:0 0 auto;vertical-align:-3px}

.nav-item[aria-current="page"]::before{content:'';position:absolute;left:-12px;top:50%;transform:translateY(-50%);width:4px;height:20px;border-radius:0 4px 4px 0;background:var(--blue-700)}
.nav-item .ic{width:18px;height:18px;display:grid;place-items:center;opacity:.9}
.nav-item .count{margin-left:auto;font-family:var(--mono);font-size:11px;opacity:.7}
.rail-foot{padding:12px;border-top:1px solid var(--line-2);display:grid;gap:6px}
.savestate{font-size:11.5px;color:var(--muted);display:flex;align-items:center;gap:6px;padding:0 4px}

.main{flex:1;min-width:0;display:flex;flex-direction:column}
.topsearch{max-width:340px;margin-left:18px}

.crumb{font-size:13px;color:var(--muted)}

.top-right{margin-left:auto;display:flex;align-items:center;gap:10px}
.notif-badge{position:absolute;top:-6px;right:-6px;background:var(--danger);color:#fff;font-size:10.5px;font-weight:700;min-width:17px;height:17px;border-radius:999px;display:flex;align-items:center;justify-content:center;padding:0 4px;line-height:1;border:2px solid #fff}
.notif-panel{max-height:60vh;overflow:auto}

.notif-row:last-child{border-bottom:none}
.who{display:flex;align-items:center;gap:9px;padding-left:12px;border-left:1px solid var(--line)}
.avatar{width:36px;height:36px;border-radius:12px;background:linear-gradient(140deg,var(--blue-500),var(--blue-700));color:#fff;display:grid;place-items:center;font-size:12.5px;font-weight:700;letter-spacing:.02em}

.page{padding:26px;max-width:1360px;width:100%;margin:0 auto}

.btn{display:inline-flex;align-items:center;gap:7px;border-radius:var(--r-s);border:1px solid var(--line);background:#fff;padding:9px 14px;font-size:13.5px;font-weight:500;color:var(--ink-2);transition:transform .12s,box-shadow .14s,background .14s,border-color .14s}

.btn-danger{color:var(--danger);border-color:#EFD3CF}

.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:none}
.card-h h3{font-family:var(--serif)}
.card-h h3{display:flex;align-items:center;gap:8px}

.card-h h3{font-size:16px}
.card-b{padding:16px}

table{width:100%;border-collapse:collapse}

tbody tr:last-child td{border-bottom:0}
tbody tr{transition:background .12s}
tbody tr:hover{background:#F6FBFF}
th:first-child{border-top-left-radius:0}
.t-right{text-align:right}
.t-name{font-weight:600}
.t-sub{font-size:12px;color:var(--muted);margin-top:2px}

.tag-ok{background:var(--ok-bg);border-color:#BFE2EC;color:var(--ok)}
.tag-warn{background:var(--warn-bg);border-color:#EEDFB9;color:var(--warn)}
.tag-danger{background:var(--danger-bg);border-color:#F0D2CE;color:var(--danger)}
.tag-plum{background:#F4EDF7;border-color:#E1CBEA;color:#7C4A94}
.tag-sage{background:#EAF2EE;border-color:#C9DED0;color:#3F6B54}
.dot{width:6px;height:6px;border-radius:50%;background:currentColor}

.field{display:flex;flex-direction:column;gap:5px}
.field label{font-size:12px;color:var(--ink-2);font-weight:600}
.field input,.field select,.field textarea{border:1px solid var(--line);background:#fff;border-radius:var(--r-s);padding:9px 11px;outline:0;width:100%}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--blue-500);box-shadow:var(--ring)}
.searchbar:focus-within{border-color:var(--blue-500);box-shadow:var(--ring)}
.field .hint{font-size:11.5px;color:var(--muted)}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.form-grid .full{grid-column:1/-1}
.searchbar{display:flex;align-items:center;gap:9px;background:#fff;border:1px solid var(--line);border-radius:99px;padding:8px 14px;min-width:260px}
.searchbar input{border:0;outline:0;width:100%}
.filters{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:16px}

.macro-bar{height:7px;border-radius:99px;background:var(--line-2);overflow:hidden;display:flex;margin-top:8px}
.macro-bar i{height:100%}
.macro-legend{display:flex;gap:14px;margin-top:7px;font-size:11.5px;color:var(--muted);flex-wrap:wrap}
.macro-legend b{font-family:var(--mono);color:var(--ink)}
.sw{width:8px;height:8px;border-radius:2px;display:inline-block;margin-right:5px}
.goal{display:grid;grid-template-columns:78px 1fr 108px;gap:10px;align-items:center;padding:6px 0}
.g-lbl{font-size:12.5px;color:var(--ink-2)}
.g-track{height:8px;border-radius:99px;background:var(--line-2);overflow:hidden;position:relative}
.g-fill{height:100%;border-radius:99px}
.g-over{position:absolute;top:0;height:100%;background-image:repeating-linear-gradient(45deg,var(--danger) 0 4px,#E7A79F 4px 8px)}
.g-val{font-family:var(--mono);font-size:12px;text-align:right;color:var(--muted)}
.g-val b{color:var(--ink)}

.tabs{display:inline-flex;gap:3px;background:#E9F1F8;border:1px solid var(--line);border-radius:12px;padding:4px;margin-bottom:20px;overflow:auto;max-width:100%}
.tab{border:0;background:none;padding:8px 15px;color:var(--ink-2);border-radius:9px;font-size:13.5px;white-space:nowrap;transition:background .14s,color .14s,box-shadow .14s}
.tab:hover{color:var(--blue-700)}
.tab[aria-selected="true"]{background:#fff;color:var(--blue-700);font-weight:600;box-shadow:0 2px 6px -2px rgba(14,36,56,.25)}
.days{display:flex;gap:7px;overflow:auto;padding-bottom:6px;margin-bottom:14px}
.day{position:relative;flex:0 0 auto;border:1px solid var(--line);background:#fff;border-radius:var(--r-s);
  padding:9px 14px 12px;text-align:center;min-width:90px;overflow:hidden;transition:border-color .16s,transform .16s}
.day:hover{border-color:var(--blue-500)}
.day .d-fill{position:absolute;left:0;bottom:0;height:3px;background:var(--blue-500);transition:width .3s ease}
.day .d-n{font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.day .d-d{font-family:var(--serif);font-size:19px}
.day .d-k{font-family:var(--mono);font-size:10.5px;color:var(--muted)}
.day[aria-pressed="true"]{background:var(--dayc,var(--blue-600));border-color:var(--dayc,var(--blue-600));color:#fff}
.day[aria-pressed="true"] .d-n,.day[aria-pressed="true"] .d-k{color:rgba(255,255,255,.82)}
.day[aria-pressed="true"] .d-fill{background:#fff;opacity:.9}

.swap-table{border-collapse:collapse;width:100%;min-width:760px}
.swap-table th,.swap-table td{padding:5px;text-align:center}
.swap-table thead th{font-size:11px;color:var(--muted);font-weight:600;white-space:nowrap}
.swap-table tbody th{font-size:12px;color:var(--muted);white-space:nowrap;text-align:left;padding-right:10px}
.swap-cell{display:block;width:100%;min-height:52px;border:1px solid var(--line);background:#fff;border-radius:var(--r-s);
  padding:6px 7px;font-size:11.5px;line-height:1.3;cursor:pointer;transition:border-color .15s,background .15s;text-align:left;overflow:hidden}
.swap-cell:hover{border-color:var(--blue-500)}
.swap-cell.sel{border-color:var(--blue-600);background:var(--blue-50);box-shadow:0 0 0 2px var(--blue-500) inset}

.meal-h{display:flex;align-items:center;gap:10px;padding:12px 15px;border-bottom:1px solid var(--line-2);background:var(--blue-50);border-radius:var(--r) var(--r) 0 0}
.meal-h h4{font-size:14.5px;color:var(--blue-900)}
.meal-h .time{font-family:var(--mono);font-size:11.5px;color:var(--muted)}
.meal-h .kcal{font-family:var(--mono);font-size:13px;font-weight:600}
.item{display:grid;grid-template-columns:1fr auto auto;gap:12px;align-items:center;padding:10px 15px;border-bottom:1px solid var(--line-2)}
.item:last-child{border-bottom:0}
.i-q{font-family:var(--mono);font-size:11.5px;color:var(--muted);margin-top:2px}
.i-v{font-family:var(--mono);font-size:11.5px;color:var(--muted);text-align:right;white-space:nowrap}
.i-v b{display:block;color:var(--ink);font-size:13px}
.x{border:0;background:none;color:var(--muted);width:26px;height:26px;border-radius:6px}
.x:hover{background:var(--danger-bg);color:var(--danger)}

.empty{padding:52px 20px;text-align:center}
.empty .eic{width:56px;height:56px;border-radius:18px;background:var(--blue-50);color:var(--blue-600);display:grid;place-items:center;margin:0 auto 14px}
.empty h4{font-size:17px;margin-bottom:6px}
.empty p{color:var(--muted);margin:0 auto 16px;max-width:46ch}

.modal-bg{position:fixed;inset:0;background:rgba(11,59,99,.35);backdrop-filter:blur(2px);display:grid;place-items:center;z-index:60;padding:20px}
.modal{background:#fff;border-radius:14px;width:min(620px,100%);max-height:88vh;overflow:auto;box-shadow:0 30px 60px -20px rgba(11,59,99,.4)}
.modal-h{display:flex;align-items:center;gap:10px;padding:16px 20px;border-bottom:1px solid var(--line-2);position:sticky;top:0;background:#fff}
.modal-h h3{font-size:17px}
.modal-b{padding:20px}
.modal-f{display:flex;gap:10px;justify-content:flex-end;padding:14px 20px;border-top:1px solid var(--line-2);position:sticky;bottom:0;background:#fff}

.toast{position:fixed;right:22px;bottom:22px;background:var(--blue-900);color:#fff;padding:11px 16px;border-radius:10px;font-size:13.5px;z-index:80;box-shadow:0 14px 30px -12px rgba(11,59,99,.6)}
.kv{display:flex;justify-content:space-between;gap:12px;padding:9px 0;border-bottom:1px dashed var(--line);font-size:13.5px}
.kv:last-child{border-bottom:0}
.kv b{font-family:var(--mono)}
.pill-row{display:flex;gap:8px;flex-wrap:wrap}
.hero{position:relative;overflow:hidden;background:linear-gradient(135deg,var(--blue-900) 0%,var(--blue-700) 45%,var(--blue-500) 80%,#F0B8C6 100%);color:#fff;border-radius:18px;padding:24px 26px;box-shadow:0 20px 40px -26px var(--blue-700)}
.hero::after{content:'🌸';position:absolute;top:-8px;right:14px;font-size:52px;opacity:.22;transform:rotate(12deg);pointer-events:none}
.hero::before{content:'🌷';position:absolute;bottom:-14px;left:-6px;font-size:60px;opacity:.16;transform:rotate(-10deg);pointer-events:none}
.hero::after{content:'';position:absolute;right:-60px;top:-90px;width:280px;height:280px;border-radius:50%;background:rgba(255,255,255,.09)}
.hero::before{content:'';position:absolute;right:60px;bottom:-120px;width:200px;height:200px;border-radius:50%;background:rgba(255,255,255,.06)}
.hero>*{position:relative;z-index:1}
.hero h1{color:#fff;font-size:26px}
.hero p{margin:8px 0 0;color:#D9EDFB;max-width:62ch}
.hero .meta{display:flex;gap:20px;flex-wrap:wrap;margin-top:14px;font-size:12.5px;color:#CFE6F8}
.hero .meta b{font-family:var(--mono);color:#fff}
:focus-visible{outline:2px solid var(--blue-500);outline-offset:2px}
#lock{position:fixed;inset:0;z-index:200;display:grid;place-items:center;padding:20px;
  background:radial-gradient(900px 520px at 50% -5%, #E8879C 0%, #9C3F60 55%, #5C2238 100%)}
.lock-card{background:#fff;border-radius:22px;padding:30px 28px;width:min(380px,100%);text-align:center;
  box-shadow:0 40px 80px -30px rgba(6,32,54,.7)}
.lock-card .lg{max-width:260px;width:84%;margin:0 auto 14px;display:block}
.lock-card h2{font-size:18px;color:var(--blue-900)}
.lock-card p{color:var(--muted);font-size:13px;margin:6px 0 20px}
.pin-dots{display:flex;gap:12px;justify-content:center;margin-bottom:18px}
.pin-dots i{width:13px;height:13px;border-radius:50%;background:#DCE7F1;transition:transform .15s,background .15s}
.pin-dots i.on{background:var(--blue-600);transform:scale(1.15)}
#pinInput{position:absolute;opacity:0;pointer-events:none}
.keys{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.keys button{height:52px;border-radius:14px;border:1px solid var(--line);background:#fff;font-size:20px;
  font-family:var(--mono);color:var(--blue-900);transition:transform .1s,background .14s}
.keys button:hover{background:var(--blue-50)}
.keys button:active{transform:scale(.96)}
.keys .fn{font-size:13px;font-family:var(--sans);color:var(--muted)}
.lock-err{color:var(--danger);font-size:13px;min-height:18px;margin-top:12px}
.shake{animation:sh .32s}
@keyframes sh{0%,100%{transform:none}20%{transform:translateX(-8px)}40%{transform:translateX(8px)}60%{transform:translateX(-5px)}80%{transform:translateX(5px)}}
.brand-logo{display:block;width:100%;max-width:210px;margin:0 auto}
.ai-box{margin-top:14px;border:1px solid var(--line);border-radius:14px;background:var(--blue-50);min-height:230px;display:grid;place-items:center;overflow:hidden}
.ai-box{align-items:start}
.ai-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;padding:8px;width:100%}
.ai-pick{position:relative;padding:0;border:2px solid transparent;border-radius:10px;overflow:hidden;background:none;display:block}
.ai-pick img{width:100%;aspect-ratio:1/1;object-fit:cover;display:block}
.ai-pick.on{border-color:var(--blue-600);box-shadow:var(--ring)}
.ai-tick{position:absolute;top:6px;right:6px;width:24px;height:24px;border-radius:50%;background:var(--blue-600);color:#fff;display:grid;place-items:center;font-size:13px}
@media (max-width:520px){.ai-grid{grid-template-columns:1fr 1fr}}
.ai-load{display:grid;place-items:center;gap:8px;padding:34px 16px;text-align:center;color:var(--ink-2)}
.ai-load small{color:var(--muted);font-size:12px}
.spin{width:30px;height:30px;border-radius:50%;border:3px solid #CFE3F5;border-top-color:var(--blue-600);animation:sp .9s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.gal-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:10px}
.gal-item{position:relative}
.gal-item>button:first-child{padding:0;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:none;width:100%;display:block}
.gal-item>button:first-child:hover{border-color:var(--blue-500);box-shadow:var(--ring)}
.gal-item img{width:100%;aspect-ratio:1/1;object-fit:cover;display:block}
.gal-lbl{display:block;font-size:11px;color:var(--muted);margin-top:4px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.gal-x{position:absolute;top:5px;right:5px;width:24px;height:24px;border-radius:8px;border:0;background:rgba(255,255,255,.92);color:var(--danger);font-size:12px;line-height:1;box-shadow:0 2px 6px rgba(0,0,0,.18)}
.fav-sec{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:14px 0 8px}
.fav-item{position:relative;margin-bottom:8px}
.fav-use{display:flex;gap:12px;align-items:center;width:100%;text-align:left;background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.fav-use:hover{border-color:var(--blue-500);background:var(--blue-50)}
.fav-use img{width:52px;height:52px;border-radius:10px;object-fit:cover;flex:0 0 52px}
.fav-noimg{width:52px;height:52px;border-radius:10px;background:var(--blue-50);display:grid;place-items:center;font-size:20px;flex:0 0 52px}
.fav-use small{display:block;color:var(--muted);font-size:12px;margin-top:2px}
.quickadd{display:grid;grid-template-columns:150px 1fr auto;gap:8px;margin-top:10px}
.quickadd input{border:1px solid var(--line);border-radius:var(--r-s);padding:9px 11px;outline:0;background:#fff;width:100%}
.quickadd input:focus{border-color:var(--blue-500);box-shadow:var(--ring)}
@media (max-width:600px){.quickadd{grid-template-columns:1fr 1fr}.quickadd .btn{grid-column:1/-1;justify-content:center}}
.seg{display:flex;gap:6px;background:#E9F1F8;border:1px solid var(--line);border-radius:12px;padding:4px}
.seg-b{flex:1;border:0;background:none;padding:10px;border-radius:9px;font-size:13.5px;color:var(--ink-2)}
.seg-b[aria-pressed="true"]{background:#fff;color:var(--blue-700);font-weight:600;box-shadow:0 2px 6px -2px rgba(14,36,56,.25)}
.cal-head{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-bottom:6px}
.cal-head span{text-align:center;font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.cal-cell{position:relative;aspect-ratio:1/1;border:1px solid var(--line);background:#fff;border-radius:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;padding:2px}
.cal-cell.empty{border:0;background:none}
.cal-cell:hover{border-color:var(--blue-500);background:var(--blue-50)}
.cal-cell.today{border-color:var(--blue-500)}
.cal-cell.sel{background:var(--blue-600);border-color:var(--blue-600);color:#fff}
.cal-n{font-family:var(--mono);font-size:13px}
.cal-dots{display:flex;gap:3px}
.cal-dots i{width:5px;height:5px;border-radius:50%;background:var(--blue-500)}
.cal-dots i.ok{background:var(--ok)} .cal-dots i.no{background:var(--danger)}
.cal-cell.sel .cal-dots i{background:#fff}
.cal-pay{position:absolute;top:3px;right:5px;font-size:10px;color:var(--ok);font-weight:700}
.cal-cell.sel .cal-pay{color:#CFF3E6}
.cal-new{position:absolute;bottom:2px;font-size:8px;letter-spacing:.04em;color:var(--blue-700);background:var(--blue-100);border-radius:4px;padding:0 3px}
.cal-cell.sel .cal-new{background:rgba(255,255,255,.25);color:#fff}
.cal-legend{display:flex;gap:14px;flex-wrap:wrap;margin-top:14px;font-size:11.5px;color:var(--muted);align-items:center}
.cal-legend i.lg{width:8px;height:8px;border-radius:50%;background:var(--blue-500);display:inline-block;margin-right:5px}
.cal-legend i.lg.ok{background:var(--ok)} .cal-legend i.lg.no{background:var(--danger)}
.slot{display:grid;grid-template-columns:64px 1fr auto;gap:12px;align-items:center;padding:14px 16px;border-bottom:1px solid var(--line-2)}
.slot:last-child{border-bottom:0}
.slot-t{font-family:var(--mono);font-size:15px;font-weight:600;color:var(--blue-900)}
.slot-a{display:flex;gap:6px;align-items:center;flex-wrap:wrap;justify-content:flex-end}
@media (max-width:700px){.slot{grid-template-columns:56px 1fr}.slot-a{grid-column:1/-1;justify-content:flex-start}}
.alert-row{display:flex;align-items:center;gap:12px;padding:12px 16px;border-bottom:1px solid var(--line-2)}
.alert-row:last-child{border-bottom:0}
.alert-dot{width:9px;height:9px;border-radius:50%;flex:0 0 9px}
.alert-dot.danger{background:var(--danger)}
.alert-dot.warn{background:var(--warn)}
.alert-dot.info{background:var(--blue-500)}
.day-head{display:grid;grid-template-columns:1fr 280px;gap:18px;align-items:start}
.day-fields{display:grid;grid-template-columns:210px 1fr;gap:14px}
.lbl-soft{display:block;margin-bottom:6px;font-size:12px;font-weight:600;color:var(--ink-2)}
.tw{width:100%;overflow-x:auto;-webkit-overflow-scrolling:touch}
@media (max-width:900px){
  .day-head{grid-template-columns:1fr}
  .day-fields{grid-template-columns:1fr}
  .day-photo{max-width:420px}
}
@media (max-width:760px){
  .topbar{padding:0 14px;gap:8px}
  .crumb{max-width:38vw;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .who small{display:none}
  .who div div{max-width:96px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .page-head h1{font-size:23px}
  .hero{padding:18px 16px;border-radius:14px}
  .hero h1{font-size:21px}
  .card-b{padding:14px}
  .tw table{min-width:560px}
  .modal{border-radius:16px;max-height:92vh}
  .stats{gap:10px}
  .stat{padding:13px 14px}
  .stat .val{font-size:22px}
  .btn{padding:9px 12px}
}
@media (max-width:520px){
  .topbar .btn span.lbl{display:none}
  .crumb{display:none}
  .stats{grid-template-columns:1fr 1fr}
  .days .day{min-width:74px;padding:7px 10px}
}

@media (max-width:1100px){.g-2{grid-template-columns:1fr}.stats{grid-template-columns:repeat(2,1fr)}.g-3{grid-template-columns:1fr}}
@media (max-width:820px){
  .app{flex-direction:column}
  .rail{width:100%;height:auto;position:static}
  .rail nav{display:flex;overflow:auto;gap:4px;padding:8px}
  .nav-sec{display:none}
  .nav-item{width:auto;white-space:nowrap}
  .nav-item[aria-current="page"]::before{display:none}
  .form-grid{grid-template-columns:1fr}
  .page{padding:16px}
  
  .rail-foot{display:flex;flex-wrap:wrap;align-items:center;gap:8px;padding:8px 12px 10px;border-top:1px solid var(--line-2)}
  .rail-foot .savestate{font-size:11px}
  .rail-foot .btn{flex:1 1 auto;justify-content:center;min-height:38px}
}

@media print{
  .rail,.topbar,.no-print{display:none!important}
  body{background:#fff}
  .page{padding:0;max-width:none}
  .card{box-shadow:none;break-inside:avoid}
  .print-head{display:block!important;margin-bottom:16px;border-bottom:2px solid var(--blue-700);padding-bottom:10px}
}
.print-head{display:none}
.only-print{display:none}
.meal-edit{display:grid;grid-template-columns:1fr 232px;gap:18px;align-items:start}
.meal-card .meal-h h4{letter-spacing:.03em}
.ph{display:grid;gap:8px}
.ph img{width:100%;aspect-ratio:1/1;object-fit:cover;border-radius:10px;border:1px solid var(--line)}
.ph.wide img,.ph-drop.wide{aspect-ratio:16/9}
.ph-actions{display:flex;gap:6px}
.ph-actions .btn{flex:1;justify-content:center}
.ph-drop{display:grid;gap:4px;place-items:center;text-align:center;aspect-ratio:1/1;border:2px dashed #B9D4EA;border-radius:12px;background:var(--blue-50);color:var(--blue-700);padding:14px;cursor:pointer}
.ph-drop:hover{background:#E4F1FC;border-color:var(--blue-500)}
.ph-plus{font-size:26px;line-height:1}

.logo-box{display:flex;gap:12px;align-items:center}
.logo-box img{height:64px;border-radius:8px;border:1px solid var(--line)}
@media (max-width:900px){.meal-edit{grid-template-columns:1fr}.ph img,.ph-drop{aspect-ratio:16/9}}
.sug-box:empty{display:none}
.sug-h{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:12px 0 6px}
.sug-row{display:grid;grid-template-columns:repeat(2,1fr);gap:7px}
.sug-i{padding:0;border:1px solid var(--line);background:var(--surface);border-radius:10px;overflow:hidden;
  display:block;text-align:left;transition:border-color .14s,box-shadow .14s}
.sug-i:hover{border-color:var(--blue-500);box-shadow:var(--ring)}
.sug-i img{width:100%;aspect-ratio:1/1;object-fit:cover;display:block}
.sug-i span{display:block;padding:4px 6px;font-size:10.5px;color:var(--ink-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fm .fm-grid{display:grid;grid-template-columns:1fr 1fr;gap:0 26px}
.fm-row{display:grid;grid-template-columns:132px 1fr;gap:12px;align-items:center;padding:9px 0;border-bottom:1px solid var(--line-2)}

<script>
const PROMO_HTML="<div class=\"pm\">\n  <section class=\"pm-hero\">\n    <div id=\"pmLogo\"><\/div>\n    <div class=\"pm-glow\"><div class=\"pm-photo\"><img src=\"{{foto}}\" alt=\"{{unvan}}\" width=\"300\" height=\"375\" fetchpriority=\"high\" decoding=\"async\"><\/div><\/div>\n    <span class=\"pm-eyebrow\">Diyetisyen<\/span>\n    <h2 class=\"pm-script pm-name\" data-hide-empty=\"isim\">{{isim}}<\/h2>\n    <h1 class=\"pm-big\">Diyet değil,<br>size uyan bir <em>yaşam düzeni<\/em><\/h1>\n    <p class=\"pm-sub\">Haftalık özel liste · alışveriş listesi · her gün yakın takip<\/p>\n    <div class=\"pm-trust\"><span><a href=\"{{harita}}\" target=\"_blank\" rel=\"noopener\" style=\"color:#fff;text-decoration:underline;text-underline-offset:3px\">📍 {{sehir}}<\/a><\/span><span>💻 Yüz yüze &amp; online<\/span><\/div>\n    <a class=\"pm-btn pm-btn-main\" href=\"{{wa}}\" target=\"_blank\" rel=\"noopener\"><svg viewBox=\"0 0 32 32\" width=\"22\" height=\"22\" fill=\"currentColor\" aria-hidden=\"true\"><path d=\"M16.003 3C8.83 3 3 8.83 3 16c0 2.29.6 4.52 1.74 6.49L3 29l6.7-1.7A12.95 12.95 0 0 0 16 29c7.17 0 13-5.83 13-13S23.17 3 16.003 3zm0 23.7c-1.95 0-3.86-.53-5.53-1.52l-.4-.24-3.98 1.01 1.06-3.88-.26-.4A10.66 10.66 0 0 1 5.3 16c0-5.9 4.8-10.7 10.7-10.7S26.7 10.1 26.7 16s-4.8 10.7-10.7 10.7zm5.87-8c-.32-.16-1.9-.94-2.2-1.04-.3-.11-.51-.16-.73.16-.22.32-.84 1.04-1.03 1.26-.19.21-.38.24-.7.08-.32-.16-1.35-.5-2.57-1.58-.95-.85-1.59-1.9-1.78-2.22-.19-.32-.02-.49.14-.65.14-.14.32-.38.48-.57.16-.19.21-.32.32-.54.11-.21.05-.4-.03-.56-.08-.16-.73-1.76-1-2.4-.26-.63-.53-.55-.73-.56h-.62c-.21 0-.56.08-.85.4-.3.32-1.12 1.1-1.12 2.68s1.15 3.1 1.31 3.32c.16.21 2.26 3.45 5.47 4.84.76.33 1.36.53 1.82.68.77.24 1.46.21 2.01.13.61-.09 1.9-.78 2.17-1.53.27-.75.27-1.4.19-1.53-.08-.13-.3-.21-.62-.37z\"/><\/svg> Tanışalım, birlikte başlayalım 💛<\/a>\n    <p class=\"pm-proud\">Buraya kadar gelmen bile kendin için bir başarı ✨<\/p>\n    <a class=\"pm-morelink\" href=\"#pm-ornek\">Örnek programı gör <span>↓<\/span><\/a>\n  <\/section>\n  <section class=\"pm-daily\" aria-label=\"Günün motivasyonu ve su takibi\">\n    <div class=\"pm-quote\"><span class=\"pm-qh\">✨ Günün sözü<\/span><p id=\"pmQuote\"><\/p><\/div>\n    <div class=\"pm-water\">\n      <div class=\"pm-wh\"><b>💧 Bugün su içtin mi?<\/b><span id=\"pmWaterTxt\"><\/span><\/div>\n      <div class=\"pm-cups\" id=\"pmCups\"><\/div>\n      <p class=\"pm-wnote\">Su; vücudumuzun yarısından fazlasını oluşturur. Yeterli su içmek sindirimi, enerjiyi ve konsantrasyonu destekler; bazen susuzluğu açlıkla karıştırırız. Genel bilgidir, kişiye göre ihtiyaç değişir.<\/p>\n    <\/div>\n  <\/section>\n\n  <section class=\"pm-sec pm-ex\" id=\"pm-ornek\">\n    <span class=\"pm-kicker\">En önemlisi<\/span>\n    <h2>Örnek program<\/h2>\n    <p class=\"pm-muted\">Danışanlarımın takip linkinden gördüğü haftalık programa benzer bir örnek (gösterim amaçlıdır). Günlere dokunarak öğünleri inceleyebilirsiniz.<\/p>\n    <div class=\"pm-card pm-ex-box\"><div id=\"pmPlanBox\"><p class=\"pm-muted\" style=\"margin:0;text-align:center\">Örnek program yükleniyor…<\/p><\/div><\/div>\n    <p class=\"pm-muted\" style=\"margin:18px 0 8px\">Gelişim grafiğiniz de kişisel sayfanızda böyle görünür (örnek gösterimdir):<\/p>\n    <div class=\"sv-card\" style=\"margin:0\"><div style=\"padding:14px\"><svg viewBox=\"0 0 560 170\" style=\"width:100%;height:auto\" role=\"img\" aria-label=\"Kilo değişim grafiği\">\n    <defs><linearGradient id=\"ga\" x1=\"0\" y1=\"0\" x2=\"0\" y2=\"1\"><stop offset=\"0\" stop-color=\"#C15678\" stop-opacity=\".30\"/><stop offset=\"1\" stop-color=\"#C15678\" stop-opacity=\"0\"/><\/linearGradient><\/defs>\n    <line x1=\"40\" x2=\"552\" y1=\"14.0\" y2=\"14.0\" stroke=\"#F4E4E9\"/>\n      <text x=\"4\" y=\"18.0\" font-size=\"9\" fill=\"#A4818C\" font-family=\"ui-monospace,monospace\">79.0<\/text><line x1=\"40\" x2=\"552\" y1=\"76.0\" y2=\"76.0\" stroke=\"#F4E4E9\"/>\n      <text x=\"4\" y=\"80.0\" font-size=\"9\" fill=\"#A4818C\" font-family=\"ui-monospace,monospace\">75.0<\/text><line x1=\"40\" x2=\"552\" y1=\"138.0\" y2=\"138.0\" stroke=\"#F4E4E9\"/>\n      <text x=\"4\" y=\"142.0\" font-size=\"9\" fill=\"#A4818C\" font-family=\"ui-monospace,monospace\">71.0<\/text>\n    <path d=\"M40.0,29.5 L132.5,48.1 L244.8,69.8 L337.2,90.0 L449.5,107.0 L542.0,122.5 L 542.0,144 L 40.0,144 Z\" fill=\"url(#ga)\"/>\n    <path d=\"M40.0,29.5 L132.5,48.1 L244.8,69.8 L337.2,90.0 L449.5,107.0 L542.0,122.5\" fill=\"none\" stroke=\"#9C3F60\" stroke-width=\"2.2\" stroke-linejoin=\"round\"/>\n    <circle cx=\"40.0\" cy=\"29.5\" r=\"3.4\" fill=\"#fff\" stroke=\"#9C3F60\" stroke-width=\"2\"/><circle cx=\"132.5\" cy=\"48.1\" r=\"3.4\" fill=\"#fff\" stroke=\"#9C3F60\" stroke-width=\"2\"/><circle cx=\"244.8\" cy=\"69.8\" r=\"3.4\" fill=\"#fff\" stroke=\"#9C3F60\" stroke-width=\"2\"/><circle cx=\"337.2\" cy=\"90.0\" r=\"3.4\" fill=\"#fff\" stroke=\"#9C3F60\" stroke-width=\"2\"/><circle cx=\"449.5\" cy=\"107.0\" r=\"3.4\" fill=\"#fff\" stroke=\"#9C3F60\" stroke-width=\"2\"/><circle cx=\"542.0\" cy=\"122.5\" r=\"3.4\" fill=\"#fff\" stroke=\"#9C3F60\" stroke-width=\"2\"/>\n    <text x=\"40\" y=\"162\" font-size=\"9.5\" fill=\"#A4818C\">01 Tem 2026<\/text>\n    <text x=\"552\" y=\"162\" font-size=\"9.5\" fill=\"#A4818C\" text-anchor=\"end\">15 Eyl 2026 · kg<\/text>\n  <\/svg><\/div><\/div>\n  <\/section>\n  <section class=\"pm-sec pm-chal\" id=\"pm-meydan\">\n    <h2 class=\"pm-h2\">7 günlük küçük meydan okuma<\/h2>\n    <p class=\"pm-muted\">Her gün tek bir küçük görev. Yaptıkça işaretle, ilerlemeni gör.<\/p>\n    <div class=\"pm-bar\"><i id=\"pmChalBar\"><\/i><\/div>\n    <div class=\"pm-chal-list\" id=\"pmChalList\"><\/div>\n    <div class=\"pm-chal-done\" id=\"pmChalDone\" hidden>🎉 Tebrikler, 7 günü tamamladın! Şimdi sıra sana özel programda.<br><a class=\"pm-btn pm-btn-wa\" href=\"{{wa}}\" target=\"_blank\" rel=\"noopener\" style=\"margin-top:12px\"><svg viewBox=\"0 0 32 32\" width=\"22\" height=\"22\" fill=\"currentColor\" aria-hidden=\"true\"><path d=\"M16.003 3C8.83 3 3 8.83 3 16c0 2.29.6 4.52 1.74 6.49L3 29l6.7-1.7A12.95 12.95 0 0 0 16 29c7.17 0 13-5.83 13-13S23.17 3 16.003 3zm0 23.7c-1.95 0-3.86-.53-5.53-1.52l-.4-.24-3.98 1.01 1.06-3.88-.26-.4A10.66 10.66 0 0 1 5.3 16c0-5.9 4.8-10.7 10.7-10.7S26.7 10.1 26.7 16s-4.8 10.7-10.7 10.7zm5.87-8c-.32-.16-1.9-.94-2.2-1.04-.3-.11-.51-.16-.73.16-.22.32-.84 1.04-1.03 1.26-.19.21-.38.24-.7.08-.32-.16-1.35-.5-2.57-1.58-.95-.85-1.59-1.9-1.78-2.22-.19-.32-.02-.49.14-.65.14-.14.32-.38.48-.57.16-.19.21-.32.32-.54.11-.21.05-.4-.03-.56-.08-.16-.73-1.76-1-2.4-.26-.63-.53-.55-.73-.56h-.62c-.21 0-.56.08-.85.4-.3.32-1.12 1.1-1.12 2.68s1.15 3.1 1.31 3.32c.16.21 2.26 3.45 5.47 4.84.76.33 1.36.53 1.82.68.77.24 1.46.21 2.01.13.61-.09 1.9-.78 2.17-1.53.27-.75.27-1.4.19-1.53-.08-.13-.3-.21-.62-.37z\"/><\/svg> Tanışalım, birlikte başlayalım 💛<\/a><\/div>\n  <\/section>\n\n\n  <div class=\"pm-cheer c1\"><p>İlk adımı atmak en zor kısım,<br>sen attın bile 🌟<\/p><a href=\"#pm-form\">Hadi tanışalım →<\/a><\/div>\n  <section class=\"pm-sec\" id=\"pm-liste\">\n    <h2>Alışveriş listesi örneği<\/h2>\n    <p class=\"pm-muted\">Programınızla birlikte, o haftanın tarifleri için market listenizi de iletirim. Böyle görünür:<\/p>\n    <div class=\"pm-card pm-sl\" id=\"pmShopBox\"><div id=\"pmShopList\"><div class=\"pm-sl-g\"><b>🥬 Sebze & meyve<\/b><label><input type=\"checkbox\"> <span>Domates — 1 kg<\/span><\/label><label><input type=\"checkbox\"> <span>Salatalık — 6 adet<\/span><\/label><label><input type=\"checkbox\"> <span>Yeşil yaprak (marul/roka) — 2 demet<\/span><\/label><label><input type=\"checkbox\"> <span>Limon — 4 adet<\/span><\/label><label><input type=\"checkbox\"> <span>Elma — 1 kg<\/span><\/label><label><input type=\"checkbox\"> <span>Muz — 6 adet<\/span><\/label><\/div><div class=\"pm-sl-g\"><b>🍗 Protein<\/b><label><input type=\"checkbox\"> <span>Yumurta — 10 adet<\/span><\/label><label><input type=\"checkbox\"> <span>Tavuk göğsü — 750 g<\/span><\/label><label><input type=\"checkbox\"> <span>Kıyma (az yağlı) — 400 g<\/span><\/label><label><input type=\"checkbox\"> <span>Ton balığı — 2 konserve<\/span><\/label><\/div><div class=\"pm-sl-g\"><b>🥛 Süt ürünleri<\/b><label><input type=\"checkbox\"> <span>Yoğurt — 1 kg<\/span><\/label><label><input type=\"checkbox\"> <span>Beyaz peynir — 300 g<\/span><\/label><label><input type=\"checkbox\"> <span>Süt — 1 litre<\/span><\/label><\/div><div class=\"pm-sl-g\"><b>🌾 Tahıl & baklagil<\/b><label><input type=\"checkbox\"> <span>Yulaf — 500 g<\/span><\/label><label><input type=\"checkbox\"> <span>Tam tahıllı ekmek — 1 adet<\/span><\/label><label><input type=\"checkbox\"> <span>Mercimek — 500 g<\/span><\/label><label><input type=\"checkbox\"> <span>Bulgur — 500 g<\/span><\/label><\/div><div class=\"pm-sl-g\"><b>🫒 Diğer<\/b><label><input type=\"checkbox\"> <span>Zeytinyağı — 1 şişe<\/span><\/label><label><input type=\"checkbox\"> <span>Ceviz — 200 g<\/span><\/label><label><input type=\"checkbox\"> <span>Tarçın<\/span><\/label><\/div><\/div>\n      <p class=\"pm-muted\" style=\"margin:12px 0 0;font-size:12px\">Örnek gösterimdir; kendi listeniz kendi programınıza göre hazırlanır.<\/p><\/div>\n    <div class=\"pm-tips\">\n      <h3>💡 Alışveriş tüyoları<\/h3>\n      <ul>\n        <li><b>Listeyle gidin, listeye sadık kalın.<\/b> Plansız alışveriş sepete fazladan atıştırmalık ekler.<\/li>\n        <li><b>Tok karnına alışverişe çıkın.<\/b> Aç gidince seçimler çoğu zaman sağlıksızlaşır.<\/li>\n        <li><b>Önce taze reyonları dolaşın:<\/b> sebze, meyve, et, süt. Paketli ürünleri en sona bırakın.<\/li>\n        <li><b>Etiketi çevirin.<\/b> İçindekiler listesi kısa ve tanıdık maddelerden oluşan ürünleri seçin.<\/li>\n        <li><b>Mevsiminde alın.<\/b> Hem daha lezzetli hem daha uygun fiyatlı olur.<\/li>\n        <li><b>Eve gelince hazırlayın.<\/b> Sebzeleri yıkayıp kutulayın, baklagili toplu pişirip dondurun; hafta boyu işiniz kolaylaşır.<\/li>\n        <li><b>Evde olmayan atıştırmalığı yemezsiniz.<\/b> Paketli tatlı ve cipsi sepete hiç koymayın.<\/li>\n      <\/ul>\n    <\/div>\n  <\/section>\n\n  <section class=\"pm-sec\" id=\"pm-onizleme\">\n    <h2>Beslenme rehberinden<\/h2>\n    <p class=\"pm-muted\">Kısa, sade ve bilimsel temelli yazılardan birkaçı:<\/p>\n    <div class=\"pm-prev\">\n      <article class=\"pm-prev-c\">\n        <img src=\"img/bb119314d0.jpg\" alt=\"\" loading=\"lazy\" decoding=\"async\">\n        <div class=\"pm-prev-b\"><b>⚖️ Kilo Vermenin Temelleri<\/b><p>Kalıcı kilo kontrolünün arkasındaki basit ama sık unutulan ilkeler.<\/p>\n          <button type=\"button\" class=\"pm-more\" data-pm-dis=\"kilo-temelleri\">Devamını gör ›<\/button><\/div>\n      <\/article>\n      <article class=\"pm-prev-c\">\n        <img src=\"img/0443c13a5f.jpg\" alt=\"\" loading=\"lazy\" decoding=\"async\">\n        <div class=\"pm-prev-b\"><b>🥚 Protein ve Tokluk Hissi<\/b><p>Proteinin iştah kontrolündeki rolü ve günlük beslenmeye nasıl eklenir.<\/p>\n          <button type=\"button\" class=\"pm-more\" data-pm-dis=\"protein-tokluk\">Devamını gör ›<\/button><\/div>\n      <\/article>\n      <article class=\"pm-prev-c\">\n        <img src=\"img/b9c8dcf65b.jpg\" alt=\"\" loading=\"lazy\" decoding=\"async\">\n        <div class=\"pm-prev-b\"><b>😴 Uyku ve Kilo Yönetimi<\/b><p>Yetersiz uykunun iştah ve kilo üzerindeki şaşırtıcı etkisi.<\/p>\n          <button type=\"button\" class=\"pm-more\" data-pm-dis=\"uyku-kilo\">Devamını gör ›<\/button><\/div>\n      <\/article><\/div>\n    <button type=\"button\" class=\"pm-more pm-more-all\" data-pm-dis=\"\">Tüm rehberi aç (63 konu) ›<\/button>\n  <\/section>\n\n  <section class=\"pm-sec\">\n    <div class=\"pm-how pm-how-a\">\n      <h3>🌸 Programım nasıl işliyor?<\/h3>\n      <p>Sizler için hazırladığım programda her hafta farklı <b>yağ yakıcı tariflerle<\/b> ilerliyoruz. Böylece <i>“Bugün ne pişirsem?”<\/i> derdiniz ortadan kalkıyor ve her gün yaşam tarzınıza, damak tadınıza ve hedeflerinize uygun tariflerle yönlendirme alıyorsunuz.<\/p>\n      <p><b>Her hafta 7 günlük yeni bir liste<\/b> oluşturuyoruz. Liste <b>tamamen size özel hazırlanmış tarifler<\/b> içerir ❤️ ve bu nedenle bir de <b>alışveriş listesi<\/b> iletirim 🌸🙏🏻<\/p>\n      <p>Haftanın sonunda ofisimde analiz alıp değerlendirme yaparak bir sonraki haftayı tamamen ihtiyaçlarınıza göre şekillendiriyoruz. Süreç hem <b>kişisel<\/b> hem de <b>dinamik<\/b> ilerliyor.<\/p>\n    <\/div>\n    <div class=\"pm-how pm-how-c\" style=\"margin-top:14px\">\n      <h3>💬 Her gün yakın takip 👀<\/h3>\n      <p>Günlük olarak iletişimde olup sizi <b>özelden adım adım<\/b> takip ediyorum. Bu sayede <b>motivasyonunuz sürekli yüksek<\/b> kalıyor.<\/p>\n      <p>Ayrıca sizin için oluşturulmuş link üzerinden <b>su, adım<\/b> ve ekstra yaptığınız şeyleri, kaçamakları varsa onların takibini sağlıyorum. Böylelikle her şey daha çok <b>kontrol altında<\/b> oluyor 😍<\/p>\n    <\/div>\n    <div class=\"pm-how pm-how-d\" style=\"margin-top:14px\">\n      <h3>📘 Haftalık beslenme kitapçıkları 🌸<\/h3>\n      <p>Her hafta gönderdiğim mini kitapçıklar sayesinde beslenmeyi yakından öğrenme fırsatı buluyorsunuz.<\/p>\n      <p>Doğru besin seçimlerini, porsiyon kontrolünü, yağ yakımını destekleyen bilimsel noktaları daha iyi kavrıyor ve öğrendiklerinizi <b>kalıcı bir yaşam alışkanlığına<\/b> dönüştürebiliyorsunuz. Sadece listeye uymak değil, <b>süreci anlamak<\/b> da çok önemli.<\/p>\n    <\/div>\n  <\/section>\n\n  <section class=\"pm-sec\" style=\"padding-top:22px\">\n    <button class=\"pm-guide\" id=\"pmGuideBtn\" type=\"button\" aria-expanded=\"false\">\n      <span class=\"pm-guide-ic\">📚<\/span>\n      <span class=\"pm-guide-tx\"><b>Beslenme Rehberi<\/b><small>63 konuda ücretsiz bilgi · merak ettiğini oku<\/small><\/span>\n      <span class=\"pm-guide-go\" id=\"pmGuideGo\">Aç<\/span>\n    <\/button>\n    <div id=\"pmGuideBox\" hidden style=\"margin-top:14px\"><section class=\"sv-card\" id=\"sv-hamilelik\" style=\"margin-top:16px;background:linear-gradient(135deg,#fdf2f8,#fff);border:2px solid #fbcfe8\">\n    <div class=\"sv-card-h\" style=\"padding:20px 20px 16px\"><h3 style=\"font-size:21px!important;display:flex;align-items:center;gap:8px\"><span style=\"font-size:26px\">🤰<\/span> Hamilelik Rehberi<\/h3><\/div>\n    <div style=\"padding:20px\"><div style=\"display:flex;align-items:center;gap:12px;margin-bottom:14px;padding:12px 14px;background:var(--blue-50);border-radius:10px\">\n      <img src=\"img/b5f38ef874.jpg\" style=\"width:52px;height:52px;object-fit:cover;border-radius:10px;flex:0 0 auto\">\n      <div><div style=\"font-weight:700;font-size:14.5px\">Hamilelik ve beslenme rehberi<\/div>\n      <div style=\"color:var(--muted);font-size:12px\">Kendin ya da çevrende birisi için merak ettiğin her şey burada<\/div><\/div>\n    <\/div><div class=\"sv-preg-tabrow\"><button type=\"button\" class=\"sv-preg-tab active\" data-tab=\"beslenme\" onclick=\"svPregTab('beslenme')\">🍽 Beslenme<\/button><button type=\"button\" class=\"sv-preg-tab\" data-tab=\"biliyormuydun\" onclick=\"svPregTab('biliyormuydun')\">💡 Biliyor Muydun<\/button><button type=\"button\" class=\"sv-preg-tab\" data-tab=\"dikkat\" onclick=\"svPregTab('dikkat')\">⚠️ Dikkat Et<\/button><button type=\"button\" class=\"sv-preg-tab\" data-tab=\"dertler\" onclick=\"svPregTab('dertler')\">🩹 Küçük Dertler<\/button><button type=\"button\" class=\"sv-preg-tab\" data-tab=\"dogrumu\" onclick=\"svPregTab('dogrumu')\">🧐 Doğru mu Yanlış mı<\/button><button type=\"button\" class=\"sv-preg-tab\" data-tab=\"tabak\" onclick=\"svPregTab('tabak')\">🍽 Akıllı Tabak<\/button><button type=\"button\" class=\"sv-preg-tab\" data-tab=\"dogum\" onclick=\"svPregTab('dogum')\">🎂 Doğuma Hazırlık<\/button><button type=\"button\" class=\"sv-preg-tab\" data-tab=\"sonrasi\" onclick=\"svPregTab('sonrasi')\">🤱 Doğum Sonrası & Emzirme<\/button><button type=\"button\" class=\"sv-preg-tab\" data-tab=\"ozet\" onclick=\"svPregTab('ozet')\">📋 Özetle<\/button><button type=\"button\" class=\"sv-preg-tab\" data-tab=\"motiv\" onclick=\"svPregTab('motiv')\">💌 Motivasyon<\/button><\/div>\n    <div class=\"sv-preg-panels\"><div class=\"sv-preg-panel\" data-panel=\"beslenme\" ><div style=\"font-weight:700;font-size:12.5px;color:var(--blue-700);margin-bottom:6px\">1. Trimester (1–13. hafta)<\/div><ul style=\"margin:0;padding-left:18px;font-size:13px;line-height:1.75\"><li>Folik asit (yeşil yapraklı sebzeler, kurubaklagil) bebeğin nöral tüp gelişimi için bu dönemde özellikle önemlidir.<\/li><li>Bulantı oluyorsa az ve sık öğünler, ağır/yağlı yemeklerden uzak durmak rahatlatabilir.<\/li><li>Kafeini azaltmak, sigara ve alkolden tamamen uzak durmak bu dönemde kritik önemdedir.<\/li><li>Bol su iç; zencefilli çay bulantıyı hafifletmeye yardımcı olabilir.<\/li><\/ul><div style=\"margin-top:12px\"><div class=\"sv-preg-card\">\n    \n    <div class=\"sv-preg-card-h\">🍽️ &quot;Artık iki kişilik yemelisin&quot; efsanesi<\/div>\n    <ul style=\"margin:0;padding-left:18px;font-size:13px;line-height:1.75\"><li>İlk 3 ayda ekstra kaloriye neredeyse hiç ihtiyacın yok — bebek şu an bir mercimek, sonra bir erik büyüklüğünde.<\/li><li>4–6. aylarda günde yaklaşık 340 kalorilik bir fazla yeterli: 1 dilim ekmek + 1 dilim peynir + 1 bardak süt kadar.<\/li><li>Son 3 ayda günde yaklaşık 450 kalorilik bir fazla yeterli: 1 kase yoğurt + 1 avuç ceviz + 1 meyve kadar.<\/li><\/ul>\n    <div class=\"sv-preg-card-tip\">💡 İki kişilik değil, iki kişi için iki kat KALİTELİ ye.<\/div>\n  <\/div><div class=\"sv-preg-card\">\n    \n    <div class=\"sv-preg-card-h\">⚖️ Ne kadar kilo almalısın?<\/div>\n    <ul style=\"margin:0;padding-left:18px;font-size:13px;line-height:1.75\"><li>Gebelik öncesi zayıfsan (BKİ 18,5 altı): toplamda 12,5–18 kg<\/li><li>Normal kilodaysan (BKİ 18,5–24,9): toplamda 11,5–16 kg<\/li><li>Fazla kiloluysan (BKİ 25–29,9): toplamda 7–11,5 kg<\/li><li>Obezsen (BKİ 30 ve üzeri): toplamda 5–9 kg<\/li><\/ul>\n    <div class=\"sv-preg-card-tip\">💡 Bu kiloların büyük kısmı bebek, plasenta, artan kan ve vücut sıvısına gider — sadece birkaç kilosu yağ deposu, o da emzirme için ayrılmış bir kumbara.<\/div>\n  <\/div><\/div><\/div><div class=\"sv-preg-panel\" data-panel=\"biliyormuydun\" hidden><div class=\"sv-preg-card\">\n    \n    <div class=\"sv-preg-card-h\">👅 Bebeğin damak zevki karnında başlıyor<\/div>\n    <ul style=\"margin:0;padding-left:18px;font-size:13px;line-height:1.75\"><li>Bebek 4. aydan itibaren içinde yüzdüğü suyu yutmaya başlar; bu su senin yediklerinin kokusunu ve tadını taşır.<\/li><li>Araştırmalarda, son 3 ayda düzenli havuç suyu içen annelerin bebeklerinin havuçlu mamayı daha severek yediği gözlenmiş.<\/li><\/ul>\n    <div class=\"sv-preg-card-tip\">💡 Bebeğin ileride sebze sevsin istiyorsan, tanışmayı şimdiden başlat.<\/div>\n  <\/div><div class=\"sv-preg-card\">\n    \n    <div class=\"sv-preg-card-h\">🧂 İyotlu tuzun iyodu uçabiliyor<\/div>\n    <ul style=\"margin:0;padding-left:18px;font-size:13px;line-height:1.75\"><li>İyot bebeğin beyin gelişimi için önemli; Türkiye&#39;de en kolay kaynağı iyotlu sofra tuzu.<\/li><li>İyot ışık, nem ve sıcaktan kaçar — tuzu ocağın yanında, açık/şeffaf kapta tutmak bir kısmını kaybettirir.<\/li><li>Tuzu kapalı, ışık almayan bir kapta sakla ve yemeğe pişirmenin sonunda ekle.<\/li><\/ul>\n    <div class=\"sv-preg-card-tip\">💡 Kaya tuzu ve deniz tuzu genelde iyotsuzdur; hamilelikte iyotlu sofra tuzunu az miktarda tercih et.<\/div>\n  <\/div><div class=\"sv-preg-card\">\n    \n    <div class=\"sv-preg-card-h\">🫖 Çay demiri &quot;çalar&quot;<\/div>\n    <ul style=\"margin:0;padding-left:18px;font-size:13px;line-height:1.75\"><li>Çaydaki tanenler, yemekteki demirin emilimini belirgin şekilde azaltabilir.<\/li><li>Yemekten hemen sonra içilen çay, tabaktaki demirin bir kısmını bloke eder.<\/li><li>Demir takviyeni süt/yoğurt/çayla değil, su ya da portakal suyuyla al.<\/li><\/ul>\n    <div class=\"sv-preg-card-tip\">💡 Çayı yemekten en az 1 saat sonra iç; yemeğine limon sıkmak demir emilimini artırır.<\/div>\n  <\/div><div class=\"sv-preg-card\">\n    <img loading=\"lazy\" decoding=\"async\" src=\"img/9dc78e5065.jpg\" alt=\"Cam arkasındaki güneş D vitamini yapmıyor\" style=\"width:100%;max-width:460px;display:block;margin:0 auto 14px;border-radius:16px;box-shadow:0 8px 20px -8px rgba(92,34,56,.3)\">\n    <div class=\"sv-preg-card-h\">☀️ Cam arkasındaki güneş D vitamini yapmıyor<\/div>\n    <ul style=\"margin:0;padding-left:18px;font-size:13px;line-height:1.75\"><li>Vücut D vitaminini güneşin UVB ışınlarıyla üretir; pencere camı bu ışınları büyük ölçüde geçirmez.<\/li><li>Sağlık otoriteleri gebelere genelde 12. haftadan itibaren D vitamini desteği önerir — doktorunun verdiği dozu aksatma.<\/li><\/ul>\n    \n  <\/div><div class=\"sv-preg-card\">\n    <img loading=\"lazy\" decoding=\"async\" src=\"img/a7730f4247.jpg\" alt=\"Yumurta sarısındaki gizli kahraman: Kolin\" style=\"width:100%;max-width:460px;display:block;margin:0 auto 14px;border-radius:16px;box-shadow:0 8px 20px -8px rgba(92,34,56,.3)\">\n    <div class=\"sv-preg-card-h\">🥚 Yumurta sarısındaki gizli kahraman: Kolin<\/div>\n    <ul style=\"margin:0;padding-left:18px;font-size:13px;line-height:1.75\"><li>Kolin, bebeğin beyin ve hafıza gelişiminde rol oynayan, adı az bilinen bir besin öğesi.<\/li><li>Gebelikte günlük ihtiyaç yaklaşık 450 mg; 1 yumurta ortalama 150 mg kolin içerir, çoğu sarısındadır.<\/li><li>Diğer kaynaklar: et, tavuk, balık, süt ve bakliyat.<\/li><\/ul>\n    <div class=\"sv-preg-card-tip\">💡 Yumurtanın sarısını atma — iyice pişmiş olması yeterli.<\/div>\n  <\/div><div class=\"sv-preg-card\">\n    <img loading=\"lazy\" decoding=\"async\" src=\"img/68e11dd975.jpg\" alt=\"Folik asit için &quot;hamileyim&quot; demeyi bekleme\" style=\"width:100%;max-width:460px;display:block;margin:0 auto 14px;border-radius:16px;box-shadow:0 8px 20px -8px rgba(92,34,56,.3)\">\n    <div class=\"sv-preg-card-h\">🌱 Folik asit için &quot;hamileyim&quot; demeyi bekleme<\/div>\n    <ul style=\"margin:0;padding-left:18px;font-size:13px;line-height:1.75\"><li>Bebeğin omurilik ve beyin yapısı (nöral tüp) ilk 4 hafta içinde kapanır — çoğu kadın bu dönemde hamile olduğunu henüz bilmez.<\/li><li>Bu yüzden folik asit idealde gebelik planlanırken başlanmalı; yeşil yapraklı sebzeler, bakliyat ve portakal da iyi kaynaklardır.<\/li><\/ul>\n    \n  <\/div><div class=\"sv-preg-card\">\n    \n    <div class=\"sv-preg-card-h\">🧊 Buz, toprak ya da kireç yeme isteği (pika)<\/div>\n    <ul style=\"margin:0;padding-left:18px;font-size:13px;line-height:1.75\"><li>Bazı gebelerde buz çiğneme, toprak/kil/kireç/tebeşir yeme isteği görülebilir — buna &quot;pika&quot; denir.<\/li><li>Bu istek çoğu zaman demir eksikliğinin bir işaretidir.<\/li><\/ul>\n    <div class=\"sv-preg-card-tip\">💡 Böyle bir istek hissedersen utanma, doktoruna söyle — basit bir kan tahliliyle anlaşılır.<\/div>\n  <\/div><\/div><div class=\"sv-preg-panel\" data-panel=\"dikkat\" hidden><div class=\"sv-preg-card\">\n    <img loading=\"lazy\" decoding=\"async\" src=\"img/296a79dcef.jpg\" alt=\"Buzdolabı her mikrobu durdurmaz: Listeria\" style=\"width:100%;max-width:460px;display:block;margin:0 auto 14px;border-radius:16px;box-shadow:0 8px 20px -8px rgba(92,34,56,.3)\">\n    <div class=\"sv-preg-card-h\">🧀 Buzdolabı her mikrobu durdurmaz: Listeria<\/div>\n    <ul style=\"margin:0;padding-left:18px;font-size:13px;line-height:1.75\"><li>Listeria buzdolabı soğuğunda bile çoğalabilen nadir bir mikrop; gebelerde daha kolay hastalık yapar ve bebeğe geçebilir.<\/li><li>Pastörize edilmemiş süt, köy peyniri ve kaymaktan uzak dur; köy sütünü mutlaka kaynat.<\/li><li>Küflü peynirler (rokfor, brie, camembert), hazır ezmeler (pate) ve soğuk tüketilen şarküteri (sucuk, salam, pastırma) riskli — iyice pişmişse sorun yok.<\/li><\/ul>\n    <div class=\"sv-preg-card-tip\">💡 Kural basit: şüphelendiğin şeyi buharı çıkana kadar ısıt, sonra ye.<\/div>\n  <\/div><div class=\"sv-preg-card\">\n    \n    <div class=\"sv-preg-card-h\">🐱 Kedini sevebilirsin ama kumunu başkası değiştirsin<\/div>\n    <ul style=\"margin:0;padding-left:18px;font-size:13px;line-height:1.75\"><li>Toksoplazma adlı parazit kedi dışkısı, toprak, iyi yıkanmamış sebze ve az pişmiş etle bulaşabilir.<\/li><li>Kediyi sevmek sorun değil — kum kabını başkası temizlesin, mecbursan eldivenle ve her gün temizle.<\/li><li>Sebze/meyveyi bol suyla yıka, eti pembelik kalmayacak şekilde pişir; bu dönemde çiğ köfteden uzak dur.<\/li><\/ul>\n    \n  <\/div><div class=\"sv-preg-card\">\n    \n    <div class=\"sv-preg-card-h\">🐟 Balıkta &quot;küçük olan iyidir&quot;<\/div>\n    <ul style=\"margin:0;padding-left:18px;font-size:13px;line-height:1.75\"><li>Balık, bebeğin beyni ve gözleri için önemli bir omega-3 kaynağı — haftada 2 porsiyon hedefle.<\/li><li>Büyük/uzun yaşayan balıklar (kılıç balığı, köpek balığı) daha fazla cıva biriktirir — bu dönemde tüketme.<\/li><li>Hamsi, istavrit, sardalya, palamut, çipura, levrek ve somon iyi seçimler; konserve ton balığını haftada 2 kutuyu geçirme.<\/li><li>Suşi, çiğ midye ve füme somonu bu dönemde yeme.<\/li><\/ul>\n    \n  <\/div><div class=\"sv-preg-card\">\n    <img loading=\"lazy\" decoding=\"async\" src=\"img/995b91f393.jpg\" alt=\"&quot;Bitkiseldir, zararı olmaz&quot; demeyelim\" style=\"width:100%;max-width:460px;display:block;margin:0 auto 14px;border-radius:16px;box-shadow:0 8px 20px -8px rgba(92,34,56,.3)\">\n    <div class=\"sv-preg-card-h\">🌿 &quot;Bitkiseldir, zararı olmaz&quot; demeyelim<\/div>\n    <ul style=\"margin:0;padding-left:18px;font-size:13px;line-height:1.75\"><li>Maydanoz suyu kürü ve meyan kökü şerbeti bu dönemde önerilmez; salatadaki birkaç dal maydanoz sorun değil.<\/li><li>Adaçayını düzenli ve bol içme.<\/li><li>Ihlamur, papatya, rezene gibi bitki çaylarını günde 1–2 fincanı geçmeden iç.<\/li><\/ul>\n    <div class=\"sv-preg-card-tip\">💡 Hiçbir bitkisel karışımı, kürü ya da takviyeyi doktoruna sormadan kullanma.<\/div>\n  <\/div><div class=\"sv-preg-card\">\n    <img loading=\"lazy\" decoding=\"async\" src=\"img/7ba3ba0396.jpg\" alt=\"Kahve ve çayda sınır\" style=\"width:100%;max-width:460px;display:block;margin:0 auto 14px;border-radius:16px;box-shadow:0 8px 20px -8px rgba(92,34,56,.3)\">\n    <div class=\"sv-preg-card-h\">☕ Kahve ve çayda sınır<\/div>\n    <ul style=\"margin:0;padding-left:18px;font-size:13px;line-height:1.75\"><li>Kafein plasentadan bebeğe geçer; günlük sınır genelde 200 mg kabul edilir.<\/li><li>Bu, yaklaşık 2 fincan Türk kahvesi ya da 4 bardak demli çaya denk gelir.<\/li><li>Kola, enerji içeceği, yeşil çay ve çikolatada da kafein olduğunu unutma; enerji içeceklerinden bu dönemde tamamen uzak dur.<\/li><\/ul>\n    \n  <\/div><\/div><div class=\"sv-preg-panel\" data-panel=\"dertler\" hidden><div class=\"sv-preg-card\">\n    <img loading=\"lazy\" decoding=\"async\" src=\"img/450696b489.jpg\" alt=\"Bulantı\" style=\"width:100%;max-width:460px;display:block;margin:0 auto 14px;border-radius:16px;box-shadow:0 8px 20px -8px rgba(92,34,56,.3)\">\n    <div class=\"sv-preg-card-h\">🤢 Bulantı<\/div>\n    <ul style=\"margin:0;padding-left:18px;font-size:13px;line-height:1.75\"><li>Sabah yataktan kalkmadan önce birkaç galeta ya da bir avuç leblebi ye — boş mide bulantıyı artırır.<\/li><li>Az az ve sık ye, 2–3 saatten uzun aç kalma.<\/li><li>Zencefil çayı ya da zencefilli limonata bulantıya iyi gelebilir.<\/li><li>Sıcak yemek kokusu rahatsız ediyorsa soğuk/ılık yiyecekleri tercih et.<\/li><\/ul>\n    \n  <\/div><div class=\"sv-preg-card\">\n    <img loading=\"lazy\" decoding=\"async\" src=\"img/bb70d7ed5a.jpg\" alt=\"Mide yanması\" style=\"width:100%;max-width:460px;display:block;margin:0 auto 14px;border-radius:16px;box-shadow:0 8px 20px -8px rgba(92,34,56,.3)\">\n    <div class=\"sv-preg-card-h\">🔥 Mide yanması<\/div>\n    <ul style=\"margin:0;padding-left:18px;font-size:13px;line-height:1.75\"><li>Yemekle birlikte değil, öğün aralarında sıvı iç.<\/li><li>Yemekten sonra hemen uzanma; akşam yemeğini yatmadan 2–3 saat önce bitir.<\/li><li>Sol yanına yat, başını birkaç yastıkla yükselt.<\/li><li>Kızartma, acı, çok ekşi yiyecek ve gazlı içecekleri azalt.<\/li><\/ul>\n    <div class=\"sv-preg-card-tip\">💡 Pişmiş elma/armut/ayvayı birkaç bademle yemek mideyi rahatlatabilir.<\/div>\n  <\/div><div class=\"sv-preg-card\">\n    <img loading=\"lazy\" decoding=\"async\" src=\"img/0bb5d508b4.jpg\" alt=\"Kabızlık\" style=\"width:100%;max-width:460px;display:block;margin:0 auto 14px;border-radius:16px;box-shadow:0 8px 20px -8px rgba(92,34,56,.3)\">\n    <div class=\"sv-preg-card-h\">🚽 Kabızlık<\/div>\n    <ul style=\"margin:0;padding-left:18px;font-size:13px;line-height:1.75\"><li>Hamilelik hormonları bağırsakları yavaşlatır; demir hapı da kabızlığı artırabilir.<\/li><li>Sabah aç karnına ılık su, ardından birkaç kuru erik ya da kayısı dene.<\/li><li>Tam buğday ekmek, yulaf, sebze, meyve ve kefiri eksik etme.<\/li><li>Günde 2,5–3 litre su iç, her gün kısa yürüyüşler yap.<\/li><\/ul>\n    \n  <\/div><div class=\"sv-preg-card\">\n    <img loading=\"lazy\" decoding=\"async\" src=\"img/47bbc284c1.jpg\" alt=\"Gece krampları ve ödem\" style=\"width:100%;max-width:460px;display:block;margin:0 auto 14px;border-radius:16px;box-shadow:0 8px 20px -8px rgba(92,34,56,.3)\">\n    <div class=\"sv-preg-card-h\">🦵 Gece krampları ve ödem<\/div>\n    <ul style=\"margin:0;padding-left:18px;font-size:13px;line-height:1.75\"><li>Kramp için gün boyu su iç; süt ürünleri, yeşil yapraklılar, kuruyemiş ve bakliyatı eksik etme, yatmadan önce baldırlarını esnet.<\/li><li>Ödem için tuzu, turşuyu, salamura zeytini ve hazır gıdaları azalt; ayaklarını gün içinde yükseltip dinlendir.<\/li><\/ul>\n    <div class=\"sv-preg-card-tip\">💡 Ödem varsa su içmeyi azaltma — az su içmek tam tersine vücudun suyu tutmasına neden olur.<\/div>\n  <\/div><\/div><div class=\"sv-preg-panel\" data-panel=\"dogrumu\" hidden><div class=\"sv-preg-card\">\n    <img loading=\"lazy\" decoding=\"async\" src=\"img/dfc31b2e27.jpg\" alt=\"Halk arasında söylenenler — doğru mu, yanlış mı?\" style=\"width:100%;max-width:460px;display:block;margin:0 auto 14px;border-radius:16px;box-shadow:0 8px 20px -8px rgba(92,34,56,.3)\">\n    <div class=\"sv-preg-card-h\">🧐 Halk arasında söylenenler — doğru mu, yanlış mı?<\/div>\n    <ul style=\"margin:0;padding-left:18px;font-size:13px;line-height:1.75\"><li>❌ &quot;Ayva yersen bebeğin gamzeli olur&quot; — gamze genetiktir, ama ayva lifli ve sağlıklı, gönül rahatlığıyla ye.<\/li><li>❌ &quot;Bol süt içersen bebeğin teni beyaz olur&quot; — ten rengini genler belirler; süt bebeğin kemikleri için değerlidir.<\/li><li>❌ &quot;Tatlı istiyorsan kız, ekşi istiyorsan erkek&quot; — canının çektiğiyle bebeğin cinsiyeti arasında bir bağ yok.<\/li><li>❌ &quot;Canının çektiğini yemezsen bebekte leke olur&quot; — doğum lekelerinin aşermeyle ilgisi yok.<\/li><li>✅ &quot;Son haftalarda hurma ye, doğum kolay olur&quot; — kısmen doğru: bazı çalışmalarda 36. haftadan sonra düzenli hurma tüketen annelerde doğumun daha rahat başladığı görülmüş (gebelik şekerin varsa önce doktoruna sor).<\/li><li>⚠️ &quot;Her çocuk bir diş götürür&quot; — yarı doğru: bebek dişini almaz ama kalsiyum yetersizse ihtiyacını senin kemiklerinden karşılar; süt ürünlerini ve diş fırçanı ihmal etme.<\/li><\/ul>\n    \n  <\/div><\/div><div class=\"sv-preg-panel\" data-panel=\"tabak\" hidden><div class=\"sv-preg-card\">\n    <img loading=\"lazy\" decoding=\"async\" src=\"img/b0df3c3c7b.jpg\" alt=\"Domatesi zeytinyağıyla buluştur: Likopen\" style=\"width:100%;max-width:460px;display:block;margin:0 auto 14px;border-radius:16px;box-shadow:0 8px 20px -8px rgba(92,34,56,.3)\">\n    <div class=\"sv-preg-card-h\">🍅 Domatesi zeytinyağıyla buluştur: Likopen<\/div>\n    <ul style=\"margin:0;padding-left:18px;font-size:13px;line-height:1.75\"><li>Likopen domates, salça, karpuz ve pembe greyfurtta bulunan, hücreleri koruyan kırmızı bir bileşen.<\/li><li>Yağda çözünür — yanında biraz yağ olursa vücut çok daha iyi emer.<\/li><li>Domates pişince hücre duvarları açılır; zeytinyağlı domates sosu çiğ domatesten daha çok likopen verir.<\/li><\/ul>\n    \n  <\/div><div class=\"sv-preg-card\">\n    \n    <div class=\"sv-preg-card-h\">🥕 Havuç ve balkabağını yağsız bırakma: Beta-karoten<\/div>\n    <ul style=\"margin:0;padding-left:18px;font-size:13px;line-height:1.75\"><li>Havuç, balkabağı, tatlı patates ve kayısıdaki beta-karoten vücutta A vitaminine dönüşür — o da yağda çözünür.<\/li><li>Havuç salatasına zeytinyağı ya da birkaç ceviz ekle; hafif pişirmek de emilimi artırır.<\/li><\/ul>\n    <div class=\"sv-preg-card-tip\">💡 Bitkilerden gelen beta-karoten, takviyedeki A vitamini gibi fazla birikmez — güvenlidir.<\/div>\n  <\/div><div class=\"sv-preg-card\">\n    \n    <div class=\"sv-preg-card-h\">🍋 Demirin en iyi arkadaşı C vitamini<\/div>\n    <ul style=\"margin:0;padding-left:18px;font-size:13px;line-height:1.75\"><li>Bitkisel demirin emilimi düşüktür; yanına C vitamini eklersen emilim belirgin artar.<\/li><li>Mercimek çorbasına limon sık; ıspanak/pazı/kuru fasulye yanına biberli-domatesli salata ekle.<\/li><li>Kahvaltıda yumurtanın yanına domates/biber/mandalina koy.<\/li><\/ul>\n    \n  <\/div><div class=\"sv-preg-card\">\n    \n    <div class=\"sv-preg-card-h\">🥛 Bazı besinler birbirini sevmez<\/div>\n    <ul style=\"margin:0;padding-left:18px;font-size:13px;line-height:1.75\"><li>Süt/yoğurt/peynirdeki kalsiyum demirin emilimini azaltabilir — demir hapını süt ürünlerinden en az 2 saat ayır.<\/li><li>Kırmızı etli yemeğin yanına yoğurt yerine salata koyabilir, yoğurdu ara öğüne kaydırabilirsin.<\/li><li>Ispanak kalsiyumdan zengin görünür ama içindeki oksalat bu kalsiyumu bağlar — kalsiyum için süt ürünlerine güven.<\/li><\/ul>\n    \n  <\/div><div class=\"sv-preg-card\">\n    \n    <div class=\"sv-preg-card-h\">🌾 Bakliyat + tahıl = Tam protein<\/div>\n    <ul style=\"margin:0;padding-left:18px;font-size:13px;line-height:1.75\"><li>Bakliyat ve tahıllar tek başına eksik protein içerir, birlikte yenince birbirini tamamlar.<\/li><li>Mercimekli bulgur pilavı, nohutlu pilav, ezogelin çorbası bu yüzden değerli.<\/li><li>Yanına yoğurt/ayran eklersen protein kalitesi daha da artar.<\/li><\/ul>\n    \n  <\/div><div class=\"sv-preg-card\">\n    <img loading=\"lazy\" decoding=\"async\" src=\"img/fd3ce752fc.jpg\" alt=\"Zerdeçal + karabiber + yağ üçlüsü\" style=\"width:100%;max-width:460px;display:block;margin:0 auto 14px;border-radius:16px;box-shadow:0 8px 20px -8px rgba(92,34,56,.3)\">\n    <div class=\"sv-preg-card-h\">🌿 Zerdeçal + karabiber + yağ üçlüsü<\/div>\n    <ul style=\"margin:0;padding-left:18px;font-size:13px;line-height:1.75\"><li>Zerdeçaldaki kurkumin tek başına çok az emilir; bir tutam karabiber ve biraz yağ emilimi artırır.<\/li><li>Çorbaya, yumurtaya ya da sebze yemeğine zerdeçal eklerken karabiberi de unutma.<\/li><\/ul>\n    <div class=\"sv-preg-card-tip\">💡 Yemekteki zerdeçal güvenlidir; kapsül/takviyesini doktoruna sormadan kullanma.<\/div>\n  <\/div><div class=\"sv-preg-card\">\n    <img loading=\"lazy\" decoding=\"async\" src=\"img/7970595fb7.jpg\" alt=\"Bağırsak dostu ikili: Probiyotik + Prebiyotik\" style=\"width:100%;max-width:460px;display:block;margin:0 auto 14px;border-radius:16px;box-shadow:0 8px 20px -8px rgba(92,34,56,.3)\">\n    <div class=\"sv-preg-card-h\">🦠 Bağırsak dostu ikili: Probiyotik + Prebiyotik<\/div>\n    <ul style=\"margin:0;padding-left:18px;font-size:13px;line-height:1.75\"><li>Kefir ve yoğurttaki faydalı bakteriler (probiyotik), lifli besinlerle (prebiyotik) beslenerek güçlenir.<\/li><li>Yoğurda yulaf/muz/rendelenmiş elma ekle; kefirin yanına bir avuç kuruyemiş ya da meyve al.<\/li><\/ul>\n    <div class=\"sv-preg-card-tip\">💡 Bu ikili kabızlığa da çok iyi gelir.<\/div>\n  <\/div><\/div><div class=\"sv-preg-panel\" data-panel=\"dogum\" hidden><img loading=\"lazy\" decoding=\"async\" src=\"img/db0aaeae93.jpg\" alt=\"Doğuma hazırlık sofrası\" style=\"width:100%;max-width:460px;display:block;margin:0 auto 16px;border-radius:16px;box-shadow:0 8px 20px -8px rgba(92,34,56,.3)\"><ul style=\"margin:0;padding-left:18px;font-size:13px;line-height:1.75\"><li>Doğuma yaklaşırken hurma tüketiminin doğum sürecini desteklediğine dair gözlemler var — doktorunun onayıyla düzenli küçük porsiyonlar deneyebilirsin.<\/li><li>Doğum eylemi sırasında enerjini korumak için hafif, hızlı sindirilen atıştırmalıklar (muz, hurma, bal) faydalı olabilir — hastane politikasını önceden öğren.<\/li><li>Doğumdan hemen sonra (özellikle emzirecaksan) protein ve bol sıvı alımına devam etmek iyileşmeyi ve süt üretimini destekler.<\/li><li>Lohusalık döneminde demir ve B12 takviyeleri doktorun önerisiyle önem kazanabilir — kan kaybı sonrası enerji düşüklüğünü azaltmaya yardımcı olur.<\/li><li>Gebelikte alınan kiloların çoğu doğumdan sonraki ilk aylarda kademeli olarak geri döner; aceleci, çok düşük kalorili diyetlerden özellikle emzirme döneminde uzak dur.<\/li><\/ul><\/div><div class=\"sv-preg-panel\" data-panel=\"sonrasi\" hidden><img loading=\"lazy\" decoding=\"async\" src=\"img/d30c2bb99d.jpg\" alt=\"Doğum sonrası ve emzirme\" style=\"width:100%;max-width:460px;display:block;margin:0 auto 16px;border-radius:16px;box-shadow:0 8px 20px -8px rgba(92,34,56,.3)\"><div style=\"font-weight:700;font-size:12.5px;color:var(--blue-700);margin-bottom:6px\">⚡ Enerji ve temel besin ihtiyacı<\/div>\n    <ul style=\"margin:0;padding-left:18px;font-size:13px;line-height:1.75\"><li>Emzirme döneminde günlük enerji ihtiyacın genelde 400–500 kcal kadar artar — bu farkı diyetisyeninle birlikte, kişiye özel olarak planlamak en sağlıklısı.<\/li><li>Protein ihtiyacın gebelik dönemine göre de artar; her öğünde kaliteli bir protein kaynağı (et, yumurta, baklagil, süt ürünleri) bulunmasına özen göster.<\/li><li>Doğumdaki kan kaybı nedeniyle demir ve B12 depoların azalmış olabilir — kırmızı et, yeşil yapraklılar, kurubaklagil bu dönemde önemini korur.<\/li><li>Kalsiyum ve D vitamini hem senin kemik sağlığın hem de süt içeriği için önemini sürdürür.<\/li><\/ul>\n    <div style=\"font-weight
