ici olabilir.<\/p><p style=\"margin:0 0 8px;font-size:13px;line-height:1.7;color:var(--ink-2)\">Sık veya şiddetli baş ağrılarında nöroloji değerlendirmesi gerekir.<\/p>\n              <p style=\"margin:10px 0 0;font-size:10.5px;color:var(--muted);font-style:italic\">📎 Kaynak: Güncel genel beslenme bilgisi ve yaygın kabul gören klinik beslenme kaynakları derlenerek hazırlanmıştır; kişisel tıbbi tavsiye yerine geçmez.<\/p>\n              <div style=\"display:flex;gap:8px;margin-top:10px\">\n                <button class=\"btn btn-sm\" type=\"button\" data-sv-art-docx=\"migren-beslenme\" style=\"flex:1;justify-content:center\">⬇ Word<\/button>\n                <button class=\"btn btn-sm\" type=\"button\" data-sv-art-pdf=\"migren-beslenme\" style=\"flex:1;justify-content:center\">⬇ PDF<\/button>\n              <\/div>\n            <\/div>\n          <\/details><\/div><\/details>\n        <details class=\"sv-artcat\" style=\"margin-top:12px\"><summary style=\"cursor:pointer;list-style:none;font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--blue-900);padding:9px 2px;border-bottom:1px solid var(--line)\">Mutfak ve Pratik <span style=\"color:var(--muted);font-weight:600\">· 4<\/span><\/summary><div style=\"padding-top:8px\">\n        \n          <details class=\"sv-art\" data-art-id=\"market-alisveris\" style=\"border:1px solid var(--line);border-radius:10px;margin-bottom:8px;overflow:hidden\">\n            <summary style=\"list-style:none;cursor:pointer;padding:11px 14px;display:flex;align-items:center;gap:10px;font-weight:600;font-size:13.5px\">\n              <span style=\"font-size:16px\">🛒<\/span>\n              <span style=\"flex:1\">Akıllı Market Alışverişi<div style=\"font-weight:400;color:var(--muted);font-size:11.5px;margin-top:2px\">Listeyle gidin, dengeli dönün.<\/div><\/span>\n              <span class=\"sv-art-car\" style=\"color:var(--muted);font-size:11px\">▾<\/span>\n            <\/summary>\n            <div style=\"padding:4px 16px 16px;border-top:1px solid var(--line-2)\">\n              \n              <p style=\"margin:0 0 8px;font-size:13px;line-height:1.7;color:var(--ink-2)\">Sağlıklı beslenme çoğu zaman marketten başlar: evde ne varsa onu yeriz.<\/p><div style=\"font-weight:700;color:var(--blue-700);font-size:13.5px;margin:14px 0 6px\">İpuçları<\/div><ul style=\"margin:0 0 8px;padding-left:18px;font-size:13px;line-height:1.7\"><li>Haftalık menüye göre liste yapın.<\/li><li>Tok karnına alışverişe gidin.<\/li><li>Taze reyonlarla (sebze, meyve, et, süt) başlayın.<\/li><li>Etiket okuyun.<\/li><\/ul><div style=\"font-weight:700;color:var(--blue-700);font-size:13.5px;margin:14px 0 6px\">Evde bulundurun<\/div><p style=\"margin:0 0 8px;font-size:13px;line-height:1.7;color:var(--ink-2)\">Yumurta, yoğurt, baklagil, donmuş sebze, yulaf, kuruyemiş ve zeytinyağı iyi bir temel stok oluşturur.<\/p><p style=\"margin:0 0 8px;font-size:13px;line-height:1.7;color:var(--ink-2)\">Evde olmayan atıştırmalığı yemek zorlaşır; bu en basit ama en etkili stratejidir.<\/p>\n              <p style=\"margin:10px 0 0;font-size:10.5px;color:var(--muted);font-style:italic\">📎 Kaynak: Güncel genel beslenme bilgisi ve yaygın kabul gören klinik beslenme kaynakları derlenerek hazırlanmıştır; kişisel tıbbi tavsiye yerine geçmez.<\/p>\n              <div style=\"display:flex;gap:8px;margin-top:10px\">\n                <button class=\"btn btn-sm\" type=\"button\" data-sv-art-docx=\"market-alisveris\" style=\"flex:1;justify-content:center\">⬇ Word<\/button>\n                <button class=\"btn btn-sm\" type=\"button\" data-sv-art-pdf=\"market-alisveris\" style=\"flex:1;justify-content:center\">⬇ PDF<\/button>\n              <\/div>\n            <\/div>\n          <\/details>\n          <details class=\"sv-art\" data-art-id=\"meal-prep\" style=\"border:1px solid var(--line);border-radius:10px;margin-bottom:8px;overflow:hidden\">\n            <summary style=\"list-style:none;cursor:pointer;padding:11px 14px;display:flex;align-items:center;gap:10px;font-weight:600;font-size:13.5px\">\n              <span style=\"font-size:16px\">🥡<\/span>\n              <span style=\"flex:1\">Haftalık Yemek Hazırlığı<div style=\"font-weight:400;color:var(--muted);font-size:11.5px;margin-top:2px\">Vakti az olanlar için pratik plan.<\/div><\/span>\n              <span class=\"sv-art-car\" style=\"color:var(--muted);font-size:11px\">▾<\/span>\n            <\/summary>\n            <div style=\"padding:4px 16px 16px;border-top:1px solid var(--line-2)\">\n              \n              <p style=\"margin:0 0 8px;font-size:13px;line-height:1.7;color:var(--ink-2)\">Haftalık yemek hazırlığı, &quot;bugün ne pişirsem&quot; stresini ve sağlıksız hazır seçeneklere yönelmeyi azaltır.<\/p><div style=\"font-weight:700;color:var(--blue-700);font-size:13.5px;margin:14px 0 6px\">Nasıl yapılır?<\/div><ul style=\"margin:0 0 8px;padding-left:18px;font-size:13px;line-height:1.7\"><li>Hafta sonu 1-2 saat ayırın.<\/li><li>Baklagil, tahıl ve protein kaynağını toplu pişirin.<\/li><li>Sebzeleri yıkayıp doğrayın, kutularda saklayın.<\/li><li>Porsiyonlara bölüp dondurun.<\/li><\/ul><div style=\"font-weight:700;color:var(--blue-700);font-size:13.5px;margin:14px 0 6px\">Güvenlik<\/div><p style=\"margin:0 0 8px;font-size:13px;line-height:1.7;color:var(--ink-2)\">Pişmiş yemekleri hızlıca soğutup buzdolabında en fazla 3-4 gün saklayın.<\/p><p style=\"margin:0 0 8px;font-size:13px;line-height:1.7;color:var(--ink-2)\">Basit başlayın: önce sadece öğle yemeğini hazırlayın.<\/p>\n              <p style=\"margin:10px 0 0;font-size:10.5px;color:var(--muted);font-style:italic\">📎 Kaynak: Güncel genel beslenme bilgisi ve yaygın kabul gören klinik beslenme kaynakları derlenerek hazırlanmıştır; kişisel tıbbi tavsiye yerine geçmez.<\/p>\n              <div style=\"display:flex;gap:8px;margin-top:10px\">\n                <button class=\"btn btn-sm\" type=\"button\" data-sv-art-docx=\"meal-prep\" style=\"flex:1;justify-content:center\">⬇ Word<\/button>\n                <button class=\"btn btn-sm\" type=\"button\" data-sv-art-pdf=\"meal-prep\" style=\"flex:1;justify-content:center\">⬇ PDF<\/button>\n              <\/div>\n            <\/div>\n          <\/details>\n          <details class=\"sv-art\" data-art-id=\"mevsimsel-beslenme\" style=\"border:1px solid var(--line);border-radius:10px;margin-bottom:8px;overflow:hidden\">\n            <summary style=\"list-style:none;cursor:pointer;padding:11px 14px;display:flex;align-items:center;gap:10px;font-weight:600;font-size:13.5px\">\n              <span style=\"font-size:16px\">🍅<\/span>\n              <span style=\"flex:1\">Mevsiminde Beslenme<div style=\"font-weight:400;color:var(--muted);font-size:11.5px;margin-top:2px\">Taze, ucuz ve besleyici.<\/div><\/span>\n              <span class=\"sv-art-car\" style=\"color:var(--muted);font-size:11px\">▾<\/span>\n            <\/summary>\n            <div style=\"padding:4px 16px 16px;border-top:1px solid var(--line-2)\">\n              \n              <p style=\"margin:0 0 8px;font-size:13px;line-height:1.7;color:var(--ink-2)\">Mevsiminde yetişen sebze ve meyveler hem daha lezzetli hem daha uygun fiyatlı hem de çoğu zaman besin değeri açısından daha zengindir.<\/p><div style=\"font-weight:700;color:var(--blue-700);font-size:13.5px;margin:14px 0 6px\">Örnekler<\/div><ul style=\"margin:0 0 8px;padding-left:18px;font-size:13px;line-height:1.7\"><li>Kış: lahana, karnabahar, portakal, mandalina, pırasa.<\/li><li>İlkbahar: enginar, taze fasulye, çilek.<\/li><li>Yaz: domates, salatalık, şeftali, karpuz.<\/li><li>Sonbahar: kabak, nar, elma, ayva.<\/li><\/ul><div style=\"font-weight:700;color:var(--blue-700);font-size:13.5px;margin:14px 0 6px\">Pratik<\/div><p style=\"margin:0 0 8px;font-size:13px;line-height:1.7;color:var(--ink-2)\">Mevsim dışı ürünlerde dondurulmuş sebze iyi ve hesaplı bir alternatiftir.<\/p><p style=\"margin:0 0 8px;font-size:13px;line-height:1.7;color:var(--ink-2)\">Pazara gitmek tabağınızı çeşitlendirmenin en kolay yoludur.<\/p>\n              <p style=\"margin:10px 0 0;font-size:10.5px;color:var(--muted);font-style:italic\">📎 Kaynak: Güncel genel beslenme bilgisi ve yaygın kabul gören klinik beslenme kaynakları derlenerek hazırlanmıştır; kişisel tıbbi tavsiye yerine geçmez.<\/p>\n              <div style=\"display:flex;gap:8px;margin-top:10px\">\n                <button class=\"btn btn-sm\" type=\"button\" data-sv-art-docx=\"mevsimsel-beslenme\" style=\"flex:1;justify-content:center\">⬇ Word<\/button>\n                <button class=\"btn btn-sm\" type=\"button\" data-sv-art-pdf=\"mevsimsel-beslenme\" style=\"flex:1;justify-content:center\">⬇ PDF<\/button>\n              <\/div>\n            <\/div>\n          <\/details>\n          <details class=\"sv-art\" data-art-id=\"akdeniz-diyeti\" style=\"border:1px solid var(--line);border-radius:10px;margin-bottom:8px;overflow:hidden\">\n            <summary style=\"list-style:none;cursor:pointer;padding:11px 14px;display:flex;align-items:center;gap:10px;font-weight:600;font-size:13.5px\">\n              <span style=\"font-size:16px\">🌿<\/span>\n              <span style=\"flex:1\">Akdeniz Tarzı Beslenme<div style=\"font-weight:400;color:var(--muted);font-size:11.5px;margin-top:2px\">Bölgemizin mutfağı zaten sağlıklı.<\/div><\/span>\n              <span class=\"sv-art-car\" style=\"color:var(--muted);font-size:11px\">▾<\/span>\n            <\/summary>\n            <div style=\"padding:4px 16px 16px;border-top:1px solid var(--line-2)\">\n              \n              <p style=\"margin:0 0 8px;font-size:13px;line-height:1.7;color:var(--ink-2)\">Akdeniz beslenmesi; sebze, meyve, baklagil, tam tahıl, zeytinyağı ve balığı temel alır; kırmızı eti ve işlenmiş gıdayı azaltır.<\/p><div style=\"font-weight:700;color:var(--blue-700);font-size:13.5px;margin:14px 0 6px\">Temel özellikler<\/div><ul style=\"margin:0 0 8px;padding-left:18px;font-size:13px;line-height:1.7\"><li>Bol sebze ve zeytinyağı.<\/li><li>Haftada birkaç kez balık.<\/li><li>Baklagil ve kuruyemiş.<\/li><li>Ölçülü süt ürünü, az kırmızı et.<\/li><\/ul><div style=\"font-weight:700;color:var(--blue-700);font-size:13.5px;margin:14px 0 6px\">Faydaları<\/div><p style=\"margin:0 0 8px;font-size:13px;line-height:1.7;color:var(--ink-2)\">Kalp sağlığı, kilo kontrolü ve metabolik sağlıkla ilişkili olduğu pek çok çalışmada gösterilmiştir.<\/p><p style=\"margin:0 0 8px;font-size:13px;line-height:1.7;color:var(--ink-2)\">Akdeniz bölgesinde yaşıyorsanız bu mutfağın malzemelerine zaten kolayca ulaşabilirsiniz.<\/p>\n              <p style=\"margin:10px 0 0;font-size:10.5px;color:var(--muted);font-style:italic\">📎 Kaynak: Güncel genel beslenme bilgisi ve yaygın kabul gören klinik beslenme kaynakları derlenerek hazırlanmıştır; kişisel tıbbi tavsiye yerine geçmez.<\/p>\n              <div style=\"display:flex;gap:8px;margin-top:10px\">\n                <button class=\"btn btn-sm\" type=\"button\" data-sv-art-docx=\"akdeniz-diyeti\" style=\"flex:1;justify-content:center\">⬇ Word<\/button>\n                <button class=\"btn btn-sm\" type=\"button\" data-sv-art-pdf=\"akdeniz-diyeti\" style=\"flex:1;justify-content:center\">⬇ PDF<\/button>\n              <\/div>\n            <\/div>\n          <\/details><\/div><\/details>\n        <details class=\"sv-artcat\" style=\"margin-top:12px\"><summary style=\"cursor:pointer;list-style:none;font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--blue-900);padding:9px 2px;border-bottom:1px solid var(--line)\">Çocuk ve Aile <span style=\"color:var(--muted);font-weight:600\">· 2<\/span><\/summary><div style=\"padding-top:8px\">\n        \n          <details class=\"sv-art\" data-art-id=\"cocuk-beslenme\" style=\"border:1px solid var(--line);border-radius:10px;margin-bottom:8px;overflow:hidden\">\n            <summary style=\"list-style:none;cursor:pointer;padding:11px 14px;display:flex;align-items:center;gap:10px;font-weight:600;font-size:13.5px\">\n              <span style=\"font-size:16px\">🧒<\/span>\n              <span style=\"flex:1\">Çocuklarda Sağlıklı Beslenme<div style=\"font-weight:400;color:var(--muted);font-size:11.5px;margin-top:2px\">Sağlıklı alışkanlıkları erken kazandırmak.<\/div><\/span>\n              <span class=\"sv-art-car\" style=\"color:var(--muted);font-size:11px\">▾<\/span>\n            <\/summary>\n            <div style=\"padding:4px 16px 16px;border-top:1px solid var(--line-2)\">\n              \n              <p style=\"margin:0 0 8px;font-size:13px;line-height:1.7;color:var(--ink-2)\">Çocukluk döneminde kazanılan beslenme alışkanlıkları yetişkinlikte de büyük oranda sürer.<\/p><div style=\"font-weight:700;color:var(--blue-700);font-size:13.5px;margin:14px 0 6px\">Ebeveynlere öneriler<\/div><ul style=\"margin:0 0 8px;padding-left:18px;font-size:13px;line-height:1.7\"><li>Aile birlikte, düzenli ve masada yesin.<\/li><li>Yemeği ödül veya ceza aracı yapmayın.<\/li><li>Yeni besini 10-15 kez farklı şekillerde sunmak gerekebilir.<\/li><li>Evde sağlıklı atıştırmalık bulundurun, şekerli içeceği sınırlayın.<\/li><\/ul><div style=\"font-weight:700;color:var(--blue-700);font-size:13.5px;margin:14px 0 6px\">Ekran<\/div><p style=\"margin:0 0 8px;font-size:13px;line-height:1.7;color:var(--ink-2)\">Yemek sırasında televizyon veya telefon, tokluk sinyalini fark etmeyi zorlaştırır.<\/p><p style=\"margin:0 0 8px;font-size:13px;line-height:1.7;color:var(--ink-2)\">Çocuğun büyüme takibi için hekim ve diyetisyen kontrolü önemlidir.<\/p>\n              <p style=\"margin:10px 0 0;font-size:10.5px;color:var(--muted);font-style:italic\">📎 Kaynak: Güncel genel beslenme bilgisi ve yaygın kabul gören klinik beslenme kaynakları derlenerek hazırlanmıştır; kişisel tıbbi tavsiye yerine geçmez.<\/p>\n              <div style=\"display:flex;gap:8px;margin-top:10px\">\n                <button class=\"btn btn-sm\" type=\"button\" data-sv-art-docx=\"cocuk-beslenme\" style=\"flex:1;justify-content:center\">⬇ Word<\/button>\n                <button class=\"btn btn-sm\" type=\"button\" data-sv-art-pdf=\"cocuk-beslenme\" style=\"flex:1;justify-content:center\">⬇ PDF<\/button>\n              <\/div>\n            <\/div>\n          <\/details>\n          <details class=\"sv-art\" data-art-id=\"beslenme-cantasi\" style=\"border:1px solid var(--line);border-radius:10px;margin-bottom:8px;overflow:hidden\">\n            <summary style=\"list-style:none;cursor:pointer;padding:11px 14px;display:flex;align-items:center;gap:10px;font-weight:600;font-size:13.5px\">\n              <span style=\"font-size:16px\">🎒<\/span>\n              <span style=\"flex:1\">Okul Çantası Beslenme Fikirleri<div style=\"font-weight:400;color:var(--muted);font-size:11.5px;margin-top:2px\">Çocuğunuzun çantasına neler koyabilirsiniz?<\/div><\/span>\n              <span class=\"sv-art-car\" style=\"color:var(--muted);font-size:11px\">▾<\/span>\n            <\/summary>\n            <div style=\"padding:4px 16px 16px;border-top:1px solid var(--line-2)\">\n              \n              <p style=\"margin:0 0 8px;font-size:13px;line-height:1.7;color:var(--ink-2)\">Okulda enerjik ve dikkatli olmak için çantadaki beslenmenin dengeli olması gerekir.<\/p><div style=\"font-weight:700;color:var(--blue-700);font-size:13.5px;margin:14px 0 6px\">Fikirler<\/div><ul style=\"margin:0 0 8px;padding-left:18px;font-size:13px;line-height:1.7\"><li>Peynirli veya haşlanmış yumurtalı tam tahıllı sandviç.<\/li><li>Meyve dilimleri, havuç çubukları.<\/li><li>Küçük kutuda ceviz, fındık, kuru kayısı (alerji ve boğulma riskine dikkat).<\/li><li>Yoğurt veya ayran, su.<\/li><\/ul><div style=\"font-weight:700;color:var(--blue-700);font-size:13.5px;margin:14px 0 6px\">Kaçının<\/div><p style=\"margin:0 0 8px;font-size:13px;line-height:1.7;color:var(--ink-2)\">Paketli bisküvi, kek, şekerli içecek ve meyve suyu.<\/p><p style=\"margin:0 0 8px;font-size:13px;line-height:1.7;color:var(--ink-2)\">Çocuğun kendi seçimine katılması yemeyi sahiplenmesini artırır.<\/p>\n              <p style=\"margin:10px 0 0;font-size:10.5px;color:var(--muted);font-style:italic\">📎 Kaynak: Güncel genel beslenme bilgisi ve yaygın kabul gören klinik beslenme kaynakları derlenerek hazırlanmıştır; kişisel tıbbi tavsiye yerine geçmez.<\/p>\n              <div style=\"display:flex;gap:8px;margin-top:10px\">\n                <button class=\"btn btn-sm\" type=\"button\" data-sv-art-docx=\"beslenme-cantasi\" style=\"flex:1;justify-content:center\">⬇ Word<\/button>\n                <button class=\"btn btn-sm\" type=\"button\" data-sv-art-pdf=\"beslenme-cantasi\" style=\"flex:1;justify-content:center\">⬇ PDF<\/button>\n              <\/div>\n            <\/div>\n          <\/details><\/div><\/details>\n        <details class=\"sv-artcat\" style=\"margin-top:12px\"><summary style=\"cursor:pointer;list-style:none;font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--blue-900);padding:9px 2px;border-bottom:1px solid var(--line)\">Spor ve Aktivite <span style=\"color:var(--muted);font-weight:600\">· 1<\/span><\/summary><div style=\"padding-top:8px\">\n        \n          <details class=\"sv-art\" data-art-id=\"spor-beslenme\" style=\"border:1px solid var(--line);border-radius:10px;margin-bottom:8px;overflow:hidden\">\n            <summary style=\"list-style:none;cursor:pointer;padding:11px 14px;display:flex;align-items:center;gap:10px;font-weight:600;font-size:13.5px\">\n              <span style=\"font-size:16px\">🏃<\/span>\n              <span style=\"flex:1\">Spor Öncesi ve Sonrası Beslenme<div style=\"font-weight:400;color:var(--muted);font-size:11.5px;margin-top:2px\">Performans ve toparlanma için ne yemeli?<\/div><\/span>\n              <span class=\"sv-art-car\" style=\"color:var(--muted);font-size:11px\">▾<\/span>\n            <\/summary>\n            <div style=\"padding:4px 16px 16px;border-top:1px solid var(--line-2)\">\n              \n              <p style=\"margin:0 0 8px;font-size:13px;line-height:1.7;color:var(--ink-2)\">Egzersizin etkisini artırmak ve toparlanmayı hızlandırmak için zamanlama ve bileşim önemlidir.<\/p><div style=\"font-weight:700;color:var(--blue-700);font-size:13.5px;margin:14px 0 6px\">Antrenman öncesi (1-3 saat)<\/div><p style=\"margin:0 0 8px;font-size:13px;line-height:1.7;color:var(--ink-2)\">Muz, yulaf, tam tahıllı ekmek gibi kolay sindirilen karbonhidrat ve az miktarda protein.<\/p><div style=\"font-weight:700;color:var(--blue-700);font-size:13.5px;margin:14px 0 6px\">Antrenman sonrası (1-2 saat içinde)<\/div><p style=\"margin:0 0 8px;font-size:13px;line-height:1.7;color:var(--ink-2)\">Protein ve karbonhidrat birlikte: yoğurt-meyve, yumurta-ekmek, tavuk-pilav gibi.<\/p><div style=\"font-weight:700;color:var(--blue-700);font-size:13.5px;margin:14px 0 6px\">Sıvı<\/div><p style=\"margin:0 0 8px;font-size:13px;line-height:1.7;color:var(--ink-2)\">Egzersiz öncesi, sırasında ve sonrasında yeterli su içmek önemlidir.<\/p><p style=\"margin:0 0 8px;font-size:13px;line-height:1.7;color:var(--ink-2)\">Çoğu kişi için özel takviyeye gerek yoktur; dengeli beslenme yeterlidir.<\/p>\n              <p style=\"margin:10px 0 0;font-size:10.5px;color:var(--muted);font-style:italic\">📎 Kaynak: Güncel genel beslenme bilgisi ve yaygın kabul gören klinik beslenme kaynakları derlenerek hazırlanmıştır; kişisel tıbbi tavsiye yerine geçmez.<\/p>\n              <div style=\"display:flex;gap:8px;margin-top:10px\">\n                <button class=\"btn btn-sm\" type=\"button\" data-sv-art-docx=\"spor-beslenme\" style=\"flex:1;justify-content:center\">⬇ Word<\/button>\n                <button class=\"btn btn-sm\" type=\"button\" data-sv-art-pdf=\"spor-beslenme\" style=\"flex:1;justify-content:center\">⬇ PDF<\/button>\n              <\/div>\n            <\/div>\n          <\/details><\/div><\/details>\n    <\/div>\n  <\/section><\/div>\n  <\/section>\n\n  <section class=\"pm-sec\" id=\"pm-hastalik\">\n    <h2>Hastalıklara göre beslenme<\/h2>\n    <p class=\"pm-muted\">Merak ettiğiniz konuya dokunun, o hastalıkta beslenmeyle ilgili kısa ve sade bilgiyi okuyun.<\/p>\n    <div class=\"pm-dis-grid\"><button type=\"button\" class=\"pm-dis\" data-pm-dis=\"tip2-diyabet\"><i>🩺<\/i>Diyabet<\/button><button type=\"button\" class=\"pm-dis\" data-pm-dis=\"insulin-direnci\"><i>🩸<\/i>İnsülin direnci<\/button><button type=\"button\" class=\"pm-dis\" data-pm-dis=\"tiroid\"><i>🦋<\/i>Tiroid<\/button><button type=\"button\" class=\"pm-dis\" data-pm-dis=\"pcos\"><i>🌙<\/i>PKOS<\/button><button type=\"button\" class=\"pm-dis\" data-pm-dis=\"tansiyon-dash\"><i>💓<\/i>Yüksek tansiyon<\/button><button type=\"button\" class=\"pm-dis\" data-pm-dis=\"kolesterol\"><i>🫀<\/i>Kolesterol<\/button><button type=\"button\" class=\"pm-dis\" data-pm-dis=\"karaciger-yaglanma\"><i>🫁<\/i>Yağlı karaciğer<\/button><button type=\"button\" class=\"pm-dis\" data-pm-dis=\"reflu\"><i>🔥<\/i>Reflü<\/button><button type=\"button\" class=\"pm-dis\" data-pm-dis=\"gastrit\"><i>🥣<\/i>Gastrit<\/button><button type=\"button\" class=\"pm-dis\" data-pm-dis=\"ibs\"><i>🌀<\/i>IBS (bağırsak)<\/button><button type=\"button\" class=\"pm-dis\" data-pm-dis=\"kabizlik-beslenme\"><i>🚽<\/i>Kabızlık<\/button><button type=\"button\" class=\"pm-dis\" data-pm-dis=\"colyak-gluten\"><i>🌾<\/i>Çölyak<\/button><button type=\"button\" class=\"pm-dis\" data-pm-dis=\"laktoz-intoleransi\"><i>🥛<\/i>Laktoz intoleransı<\/button><button type=\"button\" class=\"pm-dis\" data-pm-dis=\"gut-urik-asit\"><i>🦶<\/i>Gut<\/button><button type=\"button\" class=\"pm-dis\" data-pm-dis=\"bobrek-beslenme\"><i>🧪<\/i>Böbrek<\/button><button type=\"button\" class=\"pm-dis\" data-pm-dis=\"osteoporoz\"><i>🦴<\/i>Osteoporoz<\/button><button type=\"button\" class=\"pm-dis\" data-pm-dis=\"demir-anemi\"><i>🩸<\/i>Anemi (demir)<\/button><button type=\"button\" class=\"pm-dis\" data-pm-dis=\"menopoz\"><i>🌸<\/i>Menopoz<\/button><button type=\"button\" class=\"pm-dis\" data-pm-dis=\"bagisiklik-beslenme\"><i>🍊<\/i>Bağışıklık<\/button><button type=\"button\" class=\"pm-dis\" data-pm-dis=\"migren-beslenme\"><i>🤕<\/i>Migren<\/button><\/div>\n    <p class=\"pm-muted\" style=\"margin:12px 0 0;font-size:12px\">Bu bilgiler genel bilgilendirme amaçlıdır; tanı ve tedavi yerine geçmez. Kişiye özel plan için görüşme yapmak gerekir.<\/p>\n  <\/section>\n\n  <div class=\"pm-cheer c2\"><p>Kendin için buradasın,<br>bu çok değerli 💪<\/p><a href=\"#pm-form\">Hadi tanışalım →<\/a><\/div>\n  <section class=\"pm-sec pm-about\" id=\"pm-kimdir\">\n    <img src=\"{{foto}}\" alt=\"{{unvan}}\" width=\"306\" height=\"543\" decoding=\"async\">\n    <h2>{{unvan}} kimdir?<\/h2>\n    {{biyo}}\n    <blockquote>{{alinti}}<\/blockquote>\n    <div class=\"pm-facts\">{{bilgiler}}<\/div>\n    <div class=\"pm-how pm-how-b\" style=\"margin-top:22px\">\n      <h3>🧒 Çocuklar için program nasıl işliyor?<\/h3>\n      <p>Her hafta <b>7 günlük yeni bir liste<\/b> oluşturuyoruz. Liste <b>tamamen size özel hazırlanmış tarifler<\/b> içerir ❤️ ve bu nedenle bir de <b>alışveriş listesi<\/b> iletirim 🌸🙏🏻 Tarifleri <b>tüm ailenin keyifle yiyebileceği<\/b> şekilde hazırlıyorum, böylece çocuğunuz kendini farklı hissetmeden süreci kolayca benimsiyor.<\/p>\n      <p>Haftanın sonunda ofisimde <b>ölçümlerini yapıp büyüme eğrisine göre<\/b> değerlendirerek bir sonraki haftayı tamamen ihtiyaçlarına göre şekillendiriyoruz. Süreç hem <b>kişisel<\/b> hem de <b>dinamik<\/b> ilerliyor 💪🏻❤️<\/p>\n    <\/div>\n  <\/section>\n\n  <section class=\"pm-sec\">\n    <h2>Nasıl başlıyoruz?<\/h2>\n    <div class=\"pm-steps\">\n      <div><span>1<\/span><div><b>Tanışma görüşmesi<\/b><p>WhatsApp'tan ya da yüz yüze kısa bir görüşmeyle hedeflerinizi ve alışkanlıklarınızı konuşuruz.<\/p><\/div><\/div>\n      <div><span>2<\/span><div><b>Size özel ilk program<\/b><p>Sevdiklerinize, bütçenize ve temponuza göre hazırlanmış ilk haftalık programınız ve alışveriş listeniz elinizde olur.<\/p><\/div><\/div>\n      <div><span>3<\/span><div><b>Haftalık takip<\/b><p>Ölçümlerinizi kişisel sayfanızdan paylaşırsınız; program her hafta yeniden şekillenir.<\/p><\/div><\/div>\n    <\/div>\n  <\/section>\n\n  <section class=\"pm-sec\">\n    <h2>Neler sunuyorum?<\/h2>\n    <div class=\"pm-feat\"><div><i>🥗<\/i><b>Size özel program<\/b><p>Sevdiğiniz besinlere ve günlük temponuza göre hazırlanan haftalık tarif listesi.<\/p><\/div><div><i>🛒<\/i><b>Alışveriş listesi<\/b><p>Programla birlikte market listeniz de hazır gelir.<\/p><\/div><div><i>💬<\/i><b>WhatsApp desteği<\/b><p>Aklınıza takılan her konuda yazabilirsiniz.<\/p><\/div><div><i>🔄<\/i><b>Haftalık güncelleme<\/b><p>Program her hafta ihtiyaçlarınıza göre yeniden şekillenir.<\/p><\/div><div><i>📘<\/i><b>Mini kitapçıklar<\/b><p>Doğru besin seçimlerini ve porsiyon kontrolünü öğrenirsiniz.<\/p><\/div><div><i>📱<\/i><b>Kişisel takip sayfası<\/b><p>Kilo grafiği, program, öğün fotoğrafları — uygulama indirmeden.<\/p><\/div><\/div>\n  <\/section>\n\n  <section class=\"pm-sec\">\n    <h2>Ücretsiz hesaplayıcı<\/h2>\n    <div class=\"pm-card\">\n      <p class=\"pm-muted\">Kilo ve boyunuzu girin; vücut kitle indeksinizi ve günlük yaklaşık su ihtiyacınızı görün.<\/p>\n      <div class=\"pm-row\"><input type=\"number\" id=\"svPcKg\" placeholder=\"Kilo (kg)\" min=\"20\" max=\"300\" inputmode=\"decimal\"><input type=\"number\" id=\"svPcCm\" placeholder=\"Boy (cm)\" min=\"100\" max=\"230\" inputmode=\"decimal\"><\/div>\n      <button class=\"pm-btn pm-btn-solid\" id=\"svPcBtn\" type=\"button\" style=\"width:100%;margin-top:10px\">Hesapla<\/button>\n      <div id=\"svPcRes\" style=\"margin-top:12px;font-size:14px;line-height:1.6\"><\/div>\n    <\/div>\n  <\/section>\n\n\n  <section class=\"pm-sec\">\n    <button class=\"sv-promo-preg-btn\" id=\"svPromoPregBtn\" type=\"button\" style=\"margin:0\">🤰 Hamile misiniz? Gebeliğe özel programımızı görün<\/button>\n    <div id=\"svPromoPregBox\" class=\"sv-promo-preg-box\" hidden>\n      <h3>🤰 Gebeliğinize Özel Beslenme Programı<\/h3>\n      <p>Gebeliğinize özel olarak her hafta farklı, dengeli ve besleyici tariflerle ilerliyoruz — her gün hem damak tadınıza hem de bu dönemdeki artan besin ihtiyaçlarınıza (demir, kalsiyum, folat, protein vb.) uygun yönlendirme alıyorsunuz.<\/p>\n      <div class=\"sv-promo-preg-calc\">\n        <label>Şu an kaçıncı haftadasınız?<\/label>\n        <div style=\"display:flex;gap:8px;margin-top:6px\">\n          <input type=\"number\" id=\"svPromoPregWeek\" min=\"1\" max=\"42\" placeholder=\"örn. 23\" style=\"flex:1\">\n          <button class=\"btn btn-sm\" id=\"svPromoPregCalcBtn\" type=\"button\">Göster<\/button>\n        <\/div>\n        <div id=\"svPromoPregResult\"><\/div>\n      <\/div>\n      <ul class=\"sv-promo-preg-list\">\n        <li>Doğuma yaklaşırken hurma gibi doğal besinlerin doğum sürecini desteklediğine dair gözlemler var — doktorunuzun onayıyla deneyebilirsiniz.<\/li>\n        <li>Doğumdan sonra (özellikle emzirecekseniz) protein ve bol sıvı alımı iyileşmeyi ve süt üretimini destekler.<\/li>\n        <li>Oksapar gibi doktor onaylı bir kan sulandırıcı iğne kullanıyorsanız da, programınız buna uygun ve dengeli şekilde planlanır — bu tür ilaçlarla ilgili her soru için mutlaka doktorunuza danışın.<\/li>\n      <\/ul>\n      <p class=\"sv-promo-preg-motiv\">\"Her geçen hafta bebeğinize bir adım daha yaklaşıyorsunuz — bu özel süreçte yanınızdayım.\" 🌸<\/p>\n    <\/div>\n  <\/section>\n\n\n  <section class=\"pm-sec\">\n    <h2>Sık sorulan sorular<\/h2>\n    <div class=\"pm-faq\">\n      <details><summary>İlk görüşmede neler oluyor?<\/summary><p>Hedefinizi, günlük düzeninizi, sevdiğiniz ve sevmediğiniz besinleri, varsa sağlık durumunuzu ve kullandığınız ilaçları konuşuruz. Ölçümlerinizi alırım. Bunların ardından size özel ilk programınızı ve alışveriş listenizi hazırlarım.<\/p><\/details>\n      <details><summary>Ne kadar sürede sonuç alırım?<\/summary><p>Sağlıklı ve kalıcı kilo kaybı genellikle haftada 0,5-1 kg civarındadır. Hızı kişiye göre değişir; önemli olan hızlı değil, geri gelmeyen bir sonuç almaktır. Her hafta ölçümlerinize bakıp programı buna göre ayarlıyoruz.<\/p><\/details>\n      <details><summary>Sevmediğim besinleri yemek zorunda kalır mıyım?<\/summary><p>Hayır. Sevmediğiniz ya da alerjiniz olan besinler programa girmez; yerine sevdiğiniz ve dengeyi bozmayan seçenekler konur. Yasak listesi değil, sizin sofranıza uyan bir düzen kurarız.<\/p><\/details>\n      <details><summary>İşim yoğun ya da evde yemek yapamıyorum, yine de olur mu?<\/summary><p>Olur. Program, günlük temponuza ve mutfakta ayırabildiğiniz vakte göre hazırlanır. Pratik tarifler, dışarıda yeme ya da hazır yemek durumlarına uygun seçenekler de konuşulur.<\/p><\/details>\n      <details><summary>Diyabet, tiroid, PKOS gibi rahatsızlığım var; program yapılır mı?<\/summary><p>Yapılır. Programı bu durumunuza uygun hazırlarım. İlaç kullanıyorsanız ya da tedavi gören bir hastalığınız varsa, bunu ilk görüşmede mutlaka belirtin; gerektiğinde doktorunuzla uyumlu ilerleriz.<\/p><\/details>\n      <details><summary>Hamile, emziren ya da çocuk için de danışmanlık veriyor musunuz?<\/summary><p>Evet. Hamilelik, emzirme ve çocuklarda büyüme dönemi için ayrı ihtiyaçları dikkate alan programlar hazırlıyorum. Çocuklarda tarifleri tüm ailenin yiyebileceği şekilde kurarız.<\/p><\/details>\n      <details><summary>Görüşmeler yüz yüze mi, online mı?<\/summary><p>İkisi de mümkün. Ofiste yüz yüze görüşebiliriz; uzaktaysanız online devam ederiz.<\/p><\/details>\n      <details><summary>Randevu ve ücret için ne yapmalıyım?<\/summary><p>WhatsApp'tan yazmanız yeterli. Size uygun gün ve saati, ücret ve süreç hakkındaki bilgiyi oradan paylaşırım.<\/p><\/details>\n    <\/div>\n  <\/section>\n\n  <section class=\"pm-sec pm-loc\" id=\"pm-konum\">\n    <h2 class=\"pm-h2\">📍 Konum<\/h2>\n    <p class=\"pm-addr\"><b>{{unvan}}<\/b><br>{{adres1}}<br>{{adres2}}<\/p>\n    <a class=\"pm-btn pm-btn-map\" href=\"{{harita}}\" target=\"_blank\" rel=\"noopener\">🗺️ Google Haritalar'da aç · Yol tarifi al<\/a>\n  <\/section>\n\n  <section class=\"pm-sec\" id=\"pm-form\">\n    <h2 class=\"pm-h2\">Tanışalım, birlikte başlayalım 💛<\/h2>\n    <p class=\"pm-muted\">Kısa bilgilerinizi yazın, WhatsApp'ta hazır mesaj olarak açılsın. Size uygun günü birlikte belirleyelim.<\/p>\n    <div class=\"pm-form\">\n      <input id=\"pmfName\" placeholder=\"Adınız\" autocomplete=\"given-name\">\n      <select id=\"pmfGoal\"><option>Kilo vermek istiyorum<\/option><option>Kilo almak istiyorum<\/option><option>Sağlıklı beslenmek istiyorum<\/option><option>Hamileyim / emziriyorum<\/option><option>Çocuğum için<\/option><option>Hastalığım için beslenme<\/option><\/select>\n      <input id=\"pmfNote\" placeholder=\"Eklemek istediğiniz not (isteğe bağlı)\">\n      <button type=\"button\" class=\"pm-btn pm-btn-wa\" id=\"pmfBtn\">WhatsApp'ta gönder<\/button>\n    <\/div>\n  <\/section>\n\n  <section class=\"pm-cta\">\n    <h2>Hazırsanız başlayalım<\/h2>\n    <p>Buraya kadar gelmen bile bir başarı. Şimdi küçük bir adım daha ✨<\/p>\n    <a class=\"pm-btn pm-btn-wa\" href=\"{{wa}}\" target=\"_blank\" rel=\"noopener\"><svg viewBox=\"0 0 32 32\" width=\"22\" height=\"22\" fill=\"currentColor\" aria-hidden=\"true\"><path d=\"M16.003 3C8.83 3 3 8.83 3 16c0 2.29.6 4.52 1.74 6.49L3 29l6.7-1.7A12.95 12.95 0 0 0 16 29c7.17 0 13-5.83 13-13S23.17 3 16.003 3zm0 23.7c-1.95 0-3.86-.53-5.53-1.52l-.4-.24-3.98 1.01 1.06-3.88-.26-.4A10.66 10.66 0 0 1 5.3 16c0-5.9 4.8-10.7 10.7-10.7S26.7 10.1 26.7 16s-4.8 10.7-10.7 10.7zm5.87-8c-.32-.16-1.9-.94-2.2-1.04-.3-.11-.51-.16-.73.16-.22.32-.84 1.04-1.03 1.26-.19.21-.38.24-.7.08-.32-.16-1.35-.5-2.57-1.58-.95-.85-1.59-1.9-1.78-2.22-.19-.32-.02-.49.14-.65.14-.14.32-.38.48-.57.16-.19.21-.32.32-.54.11-.21.05-.4-.03-.56-.08-.16-.73-1.76-1-2.4-.26-.63-.53-.55-.73-.56h-.62c-.21 0-.56.08-.85.4-.3.32-1.12 1.1-1.12 2.68s1.15 3.1 1.31 3.32c.16.21 2.26 3.45 5.47 4.84.76.33 1.36.53 1.82.68.77.24 1.46.21 2.01.13.61-.09 1.9-.78 2.17-1.53.27-.75.27-1.4.19-1.53-.08-.13-.3-.21-.62-.37z\"/><\/svg> Tanışalım, birlikte başlayalım 💛<\/a>\n  <\/section>\n  <p class= const SV_PROMO_PREG_TRIMESTER_HINT=[
  {max:13,label:'İlk trimester',hint:'Bu dönemde folik asit ve hafif, sık öğünler önceliğimiz olur.'},
  {max:27,label:'İkinci trimester',hint:'Demir, kalsiyum ve protein ihtiyacınız artıyor — programınız buna göre şekillenir.'},
  {max:42,label:'Üçüncü trimester',hint:'Kalsiyum, D vitamini ve doğuma hazırlık beslenmesi ön planda olur.'}
];
function svPromoPregCalc(week){
  const w=Math.max(1,Math.min(42,+week||0));
  const totalDays=w*7;
  const daysLeft=Math.max(0,280-totalDays);
  const edd=new Date(); edd.setDate(edd.getDate()+daysLeft);
  const tri=SV_PROMO_PREG_TRIMESTER_HINT.find(t=>w<=t.max)||SV_PROMO_PREG_TRIMESTER_HINT[2];
  return {w,daysLeft,eddISO:localISODate(edd),tri};
}
function localISODate(d){ d=d||new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
const trDate=s=>{ if(!s) return '—'; const d=new Date(s); return d.toLocaleDateString('tr-TR',{day:'2-digit',month:'short',year:'numeric'}); };
const PM_QUOTES=["Küçük adımlar, büyük değişimlerin başlangıcıdır.","Bugün kendine iyi bakmak için harika bir gün.","Mükemmel olmak değil, devam etmek önemli.","Bedenin, ona verdiğin değeri hisseder.","Her sağlıklı öğün, kendine verdiğin bir sözdür.","Dün değil, bugün başla. Bugün değil, şimdi başla.","Kendine nazik ol; değişim sabırla gelir.","Yemek düşman değil, dost olduğunda hafifler.","Bir bardak su ile başlayan gün daha enerjik geçer.","Sen başlayınca yol görünür.","Sağlık, yarına bırakılmayacak kadar değerli.","Hedefin yavaşsa bile ilerliyorsan kazanıyorsun.","Sevdiğin yiyecekler de dengeli bir planın parçası olabilir.","Bugünkü seçimin, yarınki enerjin.","Kendini başkalarıyla değil, dünkü haline göre kıyasla.","Her gün yeni bir başlangıçtır.","Aç kalmak değil, doğru beslenmek.","Vücuduna iyi bak, ömür boyu seninle yaşayacak.","Disiplin, motivasyon bittiğinde de devam edebilmektir.","Bir kez kaçırdıysan sorun yok, bir sonraki öğünde yeniden başla.","Güçlü olmak, kendine inanmakla başlar.","Mutfağın dolabı, sağlığının ilk eczanesidir.","Şimdi iyi hissetmek için yarın değil, bugün adım at.","Sabır, en iyi besin takviyesidir.","Kendine sakin ve sevgili davran.","Tabağındaki renkler, enerjinin rengidir.","Hareket et, nefes al, gülümse.","Sen yeterlisin; plan sana uysun.","İyi uyku, iyi beslenme, iyi hissetme.","Küçük bir ilerleme, hiç ilerlememekten iyidir.","Bugünü güzel yap; bedenin teşekkür edecek."];
const PM_CHAL=["💧 Gün boyu 2 litre su iç","🥗 Her ana öğünde bir porsiyon sebze ye","🚶 20 dakika tempolu yürüyüş yap","🍬 Şekerli içecek yerine su ya da ayran seç","😴 Bu gece 7-8 saat uyumaya çalış","🍽️ Yavaş ye: bir öğünü en az 20 dakikada bitir","📝 Bugün yediklerini bir deftere yaz"];
function pmLS(k,v){ try{ if(v===undefined) return localStorage.getItem(k); localStorage.setItem(k,v); }catch(e){ return null; } }
function pmDailyInit(){
  const q=document.getElementById('pmQuote');
  if(q){ const d=new Date(); const n=Math.floor((Date.UTC(d.getFullYear(),d.getMonth(),d.getDate())-Date.UTC(d.getFullYear(),0,0))/864e5); q.textContent='“'+PM_QUOTES[n%PM_QUOTES.length]+'”'; }
  const cups=document.getElementById('pmCups');
  if(cups){
    const key='pm-su-'+localISODate(new Date());
    let n=Math.min(8,Math.max(0,parseInt(pmLS(key)||'0',10)||0));
    const msg=['Güne bir bardakla başla 💧','Güzel başlangıç!','Devam, harika gidiyorsun','Yarısına yaklaştın','Yarıyı geçtin!','Çok iyi gidiyorsun','Neredeyse tamam','Bir bardak kaldı!','Hedef tamam! Süpersin 🎉'];
    const draw=()=>{ cups.innerHTML=''; for(let i=1;i<=8;i++){ const b=document.createElement('button'); b.type='button'; b.textContent='💧'; b.setAttribute('aria-label',i+'. bardak'); if(i<=n) b.className='on'; b.onclick=()=>{ n=(n===i)?i-1:i; pmLS(key,String(n)); draw(); }; cups.appendChild(b); }
      document.getElementById('pmWaterTxt').textContent=n+'/8 bardak · '+msg[n]; };
    draw();
  }
  const list=document.getElementById('pmChalList');
  if(list){
    let done=[]; try{ done=JSON.parse(pmLS('pm-chal')||'[]'); }catch(e){}
    const draw=()=>{
      list.innerHTML=PM_CHAL.map((t,i)=>`<label class="${done.includes(i)?'on':''}"><input type="checkbox" data-i="${i}" ${done.includes(i)?'checked':''}><span><b>${i+1}. GÜN</b>${t}</span></label>`).join('');
      list.querySelectorAll('input').forEach(c=>c.onchange=()=>{ const i=+c.dataset.i; done=c.checked?[...new Set([...done,i])]:done.filter(x=>x!==i); pmLS('pm-chal',JSON.stringify(done)); draw(); });
      document.getElementById('pmChalBar').style.width=Math.round(done.length/7*100)+'%';
      document.getElementById('pmChalDone').hidden=done.length<7;
    };
    draw();
  }
}
document.addEventListener('input',e=>{
  if(!e.target||e.target.id!=='svArtQ') return;
  const q=e.target.value.trim().toLocaleLowerCase('tr');
  document.querySelectorAll('.sv-artcat').forEach(c=>{
    let any=false;
    c.querySelectorAll('.sv-art').forEach(a=>{ const hit=!q||a.textContent.toLocaleLowerCase('tr').includes(q)&&true; a.style.display=hit?'':'none'; if(hit) any=true; });

  });
});

function demoGunHtml(i){

function demoProgramInit(){
  const box=document.getElementById('pmPlanBox'); if(!box) return;
  box.innerHTML='<div class="days" style="margin-bottom:14px" id="svDaysRow"></div><div id="svDayBody"></div>';
  const row=document.getElementById('svDaysRow'), body=document.getElementById('svDayBody');
  row.innerHTML=DEMO_GUNLER.map((d,i)=>`<button class="day sv-day" data-sv-day="${i}" aria-pressed="${i===0}" style="--dayc:${DAY_WEB[i%DAY_WEB.length]}">
      <div class="d-n">${DAY_EMOJI[i%DAY_EMOJI.length]} ${DAY_FULL[i%7]}</div><div class="d-d">${i+1}</div><div class="d-k">4/5</div></button>`).join('');
  const show=i=>{ body.innerHTML=demoGunHtml(i); };
  row.querySelectorAll('[data-sv-day]').forEach(b=>b.addEventListener('click',()=>{

/* ───── Ayarları sayfaya işle ───── */
const CFG=Object.assign({isim:'',foto:'',whatsapp:'',whatsappMesaj:'',instagram:'',sehir:'',adres1:'',adres2:'',harita:'',footer:'',biyo:[],alinti:'',bilgiler:[]},window.SABLON||{});
const PLACEHOLDER_FOTO='data:image/svg+xml;utf8,'+encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500"><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#F6DCE4"/><stop offset="1" stop-color="#F5B7A0"/></linearGradient></defs><rect width="400" height="500" fill="url(#g)"/><circle cx="200" cy="190" r="70" fill="#fff" fill-opacity=".85"/><path d="M60 500c0-95 60-150 140-150s140 55 140 150z" fill="#fff" fill-opacity=".85"/></svg>');
function waLink(msg){ return 'https://wa.me/'+String(CFG.whatsapp).replace(/\D/g,'')+'?text='+encodeURIComponent(msg||CFG.whatsappMesaj||''); }
function mapsLink(){
  if(CFG.harita) return CFG.harita;
  const q=[CFG.isim?('Diyetisyen '+CFG.isim):'Diyetisyen',CFG.adres1,CFG.adres2].filter(Boolean).join(', ');
  return 'https://www.google.com/maps/search/?api=1&query='+encodeURIComponent(q);
}
function render(){
  const unvan=CFG.isim?('Diyetisyen '+CFG.isim):'Diyetisyen';
  const map={unvan:esc(unvan),isim:esc(CFG.isim),foto:CFG.foto||PLACEHOLDER_FOTO,sehir:esc(CFG.sehir),wa:waLink(),instagram:CFG.instagram,
    adres1:esc(CFG.adres1),adres2:esc(CFG.adres2),harita:mapsLink(),footer:esc(CFG.footer),
    alinti:esc(CFG.alinti),
    biyo:(CFG.biyo||[]).map(p=>'<p>'+esc(p)+'</p>').join(''),
    bilgiler:(CFG.bilgiler||[]).map(b=>'<div><small>'+esc(b[0]||'')+'</small><b>'+esc(b[1]||'')+'</b>'+esc(b[2]||'')+'</div>').join('')};
  let html=PROMO_HTML.replace(/\{\{(\w+)\}\}/g,(m,k)=>map[k]!==undefined?map[k]:'');
  const root=document.getElementById('shareView');
  root.innerHTML='<div class="sv-wrap">'+html+'</div>';
  if(!CFG.isim){ const n=root.querySelector('[data-hide-empty="isim"]'); if(n) n.remove(); }
  if(!CFG.instagram){ root.querySelectorAll('.pm-ig').forEach(x=>x.remove()); }
  if(!(CFG.adres1||CFG.adres2||CFG.harita)){ const k=document.getElementById('pm-konum'); if(k) k.remove(); const ft=root.querySelector('.pm-foot a'); if(ft) ft.parentNode.remove(); }
  document.title=CFG.title||'Diyetisyen';
  const md=document.querySelector('meta[name=description]'); if(md) md.content=CFG.description||'';
}
function wire(){
  demoProgramInit();
  pmDailyInit();
  const pfb=document.getElementById('pmfBtn');
  if(pfb) pfb.addEventListener('click',()=>{
    const n=(document.getElementById('pmfName').value||'').trim(), g=document.getElementById('pmfGoal').value, nt=(document.getElementById('pmfNote').value||'').trim();
    const msg='Merhaba'+(n?', ben '+n:'')+'. Tanışıp birlikte başlamak istiyorum. Hedefim: '+g+'.'+(nt?' Not: '+nt:'');
    window.open(waLink(msg),'_blank','noopener');
  });
  document.querySelectorAll('[data-pm-dis]').forEach(b=>b.addEventListener('click',()=>{
    const gb=document.getElementById('pmGuideBtn'), gx=document.getElementById('pmGuideBox');
    if(gx&&gx.hidden&&gb) gb.click();
    const q=document.getElementById('svArtQ'); if(q&&q.value){ q.value=''; q.dispatchEvent(new Event('input',{bubbles:true})); }
    if(!b.dataset.pmDis){ setTimeout(()=>{ const g=document.getElementById('pmGuideBox'); if(g) g.scrollIntoView({behavior:'smooth',block:'start'}); },120); return; }
    const art=document.querySelector('.sv-art[data-art-id="'+b.dataset.pmDis+'"]'); if(!art) return;
    const cat=art.closest('.sv-artcat'); if(cat) cat.open=true; art.open=true;
    setTimeout(()=>art.scrollIntoView({behavior:'smooth',block:'start'}),120);
  }));
  const gb=document.getElementById('pmGuideBtn'), gx=document.getElementById('pmGuideBox');
  if(gb&&gx) gb.addEventListener('click',()=>{
    gx.hidden=!gx.hidden; gb.setAttribute('aria-expanded',String(!gx.hidden));
    document.getElementById('pmGuideGo').textContent=gx.hidden?'Aç':'Kapat';
    if(!gx.hidden) gx.scrollIntoView({behavior:'smooth',block:'start'});
  });
  const pcb=document.getElementById('svPcBtn');
  if(pcb) pcb.addEventListener('click',()=>{
    const kg=+document.getElementById('svPcKg').value, cm=+document.getElementById('svPcCm').value;
    const res=document.getElementById('svPcRes');
    if(!(kg>=20&&kg<=300&&cm>=100&&cm<=230)){ res.innerHTML='<span style="color:var(--muted)">Lütfen kilo ve boyu doğru girin.</span>'; return; }
    const bmi=kg/Math.pow(cm/100,2);
    const cat=bmi<18.5?'Zayıf':bmi<25?'Normal':bmi<30?'Fazla kilolu':'Obezite aralığında';
    const water=(kg*0.033).toFixed(1).replace('.',',');
    res.innerHTML='<b>VKİ: '+bmi.toFixed(1).replace('.',',')+'</b> — '+cat+'<br><b>Günlük su ihtiyacı:</b> yaklaşık '+water+' litre<br><span style="font-size:12px;color:var(--muted)">Bu değerler genel bilgidir; kişiye özel değerlendirme için diyetisyeninizle görüşün.</span>';
  });
  const btn=document.getElementById('svPromoPregBtn'), box=document.getElementById('svPromoPregBox');
  if(btn&&box) btn.addEventListener('click',()=>{
    box.hidden=!box.hidden;
    btn.textContent=box.hidden?'🤰 Hamile misiniz? Gebeliğe özel programımızı görün':'▲ Gizle';
    if(!box.hidden) box.scrollIntoView({behavior:'smooth',block:'nearest'});
  });
  const calcBtn=document.getElementById('svPromoPregCalcBtn');
  if(calcBtn) calcBtn.addEventListener('click',()=>{
    const w=+document.getElementById('svPromoPregWeek').value||0;
    const res=document.getElementById('svPromoPregResult');
    if(!w){ res.innerHTML='<p class="hint" style="margin:8px 0 0">Önce hafta sayısını girin.</p>'; return; }
    const r=svPromoPregCalc(w);
    res.innerHTML='<div class="sv-promo-preg-result"><b>'+w+'. hafta</b> — '+esc(r.tri.label)+'<br><span style="color:var(--muted);font-size:12.5px">'+esc(r.tri.hint)+'</span><br><span style="font-size:12.5px">Tahmini doğum tarihi: <b>'+trDate(r.eddISO)+'</b> · '+r.daysLeft+' gün kaldı</span></div>';
  });
}
render(); wire();
