function pageFoods(){
  const q=S.q.toLocaleLowerCase('tr');
  const cats=[...new Set(DB.foods.map(f=>f.cat))].sort((a,b)=>a.localeCompare(b,'tr'));
  const cat=S.foodCat||'';
  const view=S.foodView||'makro';
  const list=DB.foods.filter(f=>f.n.toLocaleLowerCase('tr').includes(q)&&(!cat||f.cat===cat))
    .sort((a,b)=>a.n.localeCompare(b.n,'tr'));
  const cols=NUTRIENTS.filter(x=>view==='makro'? x.grp==='makro' : x.grp==='mineral');
  const unitTxt=f=>{
    const parts=[];
    if(f.g) parts.push('1 porsiyon ≈ '+f.g+' g');
    Object.keys(f.u||{}).slice(0,2).forEach(k=>parts.push('1 '+k+' ≈ '+f.u[k]+' g'));
    return parts.join(' · ')||'—';
  };
  return `<div class="page-head"><div><h1>Besin kütüphanesi</h1>
    <p>100 gram başına değerler. Program yazarken satırlarınız buradaki kayıtlarla eşleştirilip hesaplanır.</p></div>
  <div class="spacer"></div><button class="btn btn-primary" data-modal="food">${ic('plus',15)} Besin ekle</button></div>
  <div class="filters"><div class="searchbar">${ic('search',17)}<input id="q" value="${esc(S.q)}" placeholder="Besin adı ara"></div>
    <div class="seg">${[['makro','Makro besinler'],['mineral','Mineral ve vitamin']].map(v=>
      `<button class="seg-b" data-foodview="${v[0]}" aria-pressed="${view===v[0]}">${v[1]}</button>`).join('')}</div>
    <span style="color:var(--muted);font-size:12.5px">${list.length} kayıt</span></div>
  <div class="chip-row">
    <button class="chip" data-foodcat="" aria-pressed="${!cat}">Tümü</button>
    ${cats.map(x=>`<button class="chip" data-foodcat="${esc(x)}" aria-pressed="${cat===x}">${esc(x)}</button>`).join('')}</div>
  <section class="card"><div class="tw"><table>
    <thead><tr><th>Besin</th><th>Kategori</th><th>Ölçü karşılığı</th>
      ${cols.map(x=>`<th class="t-right" title="${x.t}">${x.short} <small style="color:var(--muted);font-weight:400">${x.u}</small></th>`).join('')}
      <th></th></tr></thead>
    <tbody>${list.length? list.map(f=>`<tr>
      <td class="t-name">${esc(f.n)}</td><td><span class="tag">${esc(f.cat)}</span></td>
      <td style="color:var(--muted);font-size:12px">${esc(unitTxt(f))}</td>
      ${cols.map(x=>`<td class="t-right num"${x.col?` style="color:${x.col}"`:''}>${nv(f[x.k],x.dec)}</td>`).join('')}
      <td class="t-right" style="white-space:nowrap">
        <button class="btn btn-sm" data-edit-food="${f.id}">Düzenle</button>
        <button class="x" data-del-food="${f.id}" title="Sil">✕</button></td></tr>`).join('')
      :`<tr><td colspan="${cols.length+4}"><div class="empty"><div class="eic">${ic('plus',24)}</div><h4>Eşleşen besin yok</h4>
        <p>Aramanıza uyan kayıt bulunamadı. Kendi besininizi ekleyebilirsiniz.</p>
        <button class="btn btn-primary" data-modal="food">${ic('plus',15)} Besin ekle</button></div></td></tr>`}
    </tbody></table></div></section>`;
}

function modal(title,bodyHTML,okLabel,okAct,size){
  document.getElementById('modalRoot').innerHTML=`<div class="modal-bg"><div class="modal" style="${size?'width:min('+size+',100%)':''}" role="dialog" aria-modal="true">
    <div class="modal-h"><h3>${title}</h3><div class="spacer"></div><button class="x" data-close="1">✕</button></div>
    <div class="modal-b">${bodyHTML}</div>
    <div class="modal-f"><button class="btn" data-close="1">Vazgeç</button><button class="btn btn-primary" data-ok="${okAct}">${okLabel}</button></div>
  </div></div>`;
  const f=document.querySelector('.modal-b input,.modal-b select,.modal-b textarea'); if(f) f.focus();
}
const closeModal=()=>document.getElementById('modalRoot').innerHTML='';

  const card=f=>`<div class="fav-item">
      <button class="fav-use" data-fav-use="${f.id}">

/* ══════════════ Kaydetme işlemleri ══════════════ */
async function handleOk(act){
  if(act==='close') return closeModal();
  if(act==='wa-save') return waSave(S.waEdit||'');
  const c=clientOf(S.client);
  if(act==='client'||act==='client-edit'){
    const d=readClient();
    if(!d.name) return toast('Ad soyad zorunlu');
    if(act==='client'){
      const nc={id:uid('c'),created:todayISO(),measures:[],notes:[],...d};
      if(nc.weight) nc.measures.push({id:uid('m'),date:todayISO(),weight:nc.weight,note:'İlk ölçüm'});
      DB.clients.push(nc); S.client=nc.id; S.page='client'; S.tab='form'; toast('Danışan eklendi — bilgi formunu tamamlayabilirsiniz');
    } else { Object.assign(c,d); toast('Bilgiler güncellendi'); }
  }
  if(act==='measure'){
    if(!val('m-weight')) return toast('Kilo zorunlu');
    c.measures=c.measures||[];
    c.measures.push({id:uid('m'),date:val('m-date')||todayISO(),weight:val('m-weight'),waist:val('m-waist'),hip:val('m-hip'),fat:val('m-fat'),muscle:val('m-muscle'),note:val('m-note')});
    c.weight=val('m-weight'); toast('Ölçüm kaydedildi');
  }
  if(act==='appt'){
    if(!val('a-when')) return toast('Tarih zorunlu');
    DB.appts.push({id:uid('a'),clientId:val('a-client'),when:val('a-when'),type:val('a-type'),note:val('a-note'),
      status:'',first:!!(document.getElementById('a-first')&&document.getElementById('a-first').checked)});
    toast('Randevu eklendi');
  }
  if(act==='fix-meal'){
    DB.foodMap=DB.foodMap||{};
    document.querySelectorAll('[data-fx-key]').forEach(el=>{
      const key=el.getAttribute('data-fx-key'), v=el.value;
      if(key&&v) DB.foodMap[key]=v;
    });
    toast('Eşleştirme kaydedildi — bundan sonra otomatik tanınacak');
  }
  if(act==='lab'){
    const rec={id:uid('l'),date:val('lb-date')||todayISO(),note:val('lb-note')};
    let any=false;
    LABS.forEach(L=>{ const v=val('lb-'+L.k); if(v!==''&&v!==null&&v!==undefined){ rec[L.k]=+v; any=true; } });
    if(!any) return toast('En az bir değer girin');
    c.labs=c.labs||[]; c.labs.push(rec); toast('Laboratuvar sonucu kaydedildi');
  }
  if(act==='scale-run'){
    const p=DB.plans.find(x=>x.id===S.plan);
    const tgt=+val('sc-target');
    if(!tgt||tgt<400) return toast('Geçerli bir hedef kalori girin');
    const all=val('sc-scope')==='all';
    const lock=document.getElementById('sc-lock')&&document.getElementById('sc-lock').checked;
    const days=all? p.days.map((_,i)=>i) : [S.day];
    let touched=0;
    days.forEach(di=>{
      const cur=dayNutri(p.days[di]).tot.kcal;
      if(cur<50) return;
      const f=tgt/cur;
      if(Math.abs(f-1)<0.02) return;
      p.days[di].meals.forEach(m=>{
        m.lines=(m.lines||[]).map(line=>{
          const pr=parseLine(line);
          if(!pr.food) return line;
          if(lock && (pr.food.cat==='İçecekler' || (pr.qty===1 && !pr.unit))) return line;
          const nl=rescaleLine(line,f);
          if(nl!==line) touched++;
          return nl;
        });
      });
    });
    toast(touched? touched+' satır yeniden ölçeklendi — kontrol edin' : 'Ölçeklenecek satır bulunamadı');
  }
  if(act==='import-read'){
    const ta=val('impText'), fEl=document.getElementById('impFile');
    const go=txt=>{
      const rows=parseCSV(txt);
      if(rows.length<2) return toast('En az bir başlık ve bir veri satırı gerekiyor');
      IMP={head:rows[0].map(x=>String(x).trim()),rows:rows.slice(1)};
      IMP.map=guessCols(IMP.head);
      if(IMP.map.n===undefined) toast('Besin adı sütununu elle seçmeniz gerekebilir');
      drawImportMap();
    };
    if(fEl&&fEl.files&&fEl.files[0]){
      const r=new FileReader();
      r.onload=()=>go(r.result);
      r.onerror=()=>toast('Dosya okunamadı');
      r.readAsText(fEl.files[0],'utf-8');
      return;
    }
    if(!ta) return toast('Dosya seçin veya içeriği yapıştırın');
    go(ta); return;
  }
  if(act==='import-run'){
    const gi=k=>{ const el=document.getElementById('imp-'+k); return el&&el.value!==''? +el.value : null; };
    const ni=gi('n');
    if(ni===null) return toast('Besin adı sütunu seçilmeli');
    const dup=val('imp-dup')||'skip';
    let added=0,updated=0,skipped=0;
    IMP.rows.forEach(r=>{
      const name=String(r[ni]||'').trim();
      if(!name) return;
      const rec={n:name,cat:(gi('cat')!==null? String(r[gi('cat')]||'').trim():'')||'İçe aktarılan',g:100,u:{}};
      NUTRIENTS.forEach(x=>{ const i=gi(x.k); rec[x.k]= i!==null? numTR(r[i]) : 0; });
      const g=gi('gi'); rec.gi= g!==null? numTR(r[g]) : 0;
      const ex=DB.foods.find(f=>FOLD(f.n)===FOLD(name));
      if(ex){
        if(dup==='update'){ Object.assign(ex,rec,{u:ex.u||{},g:ex.g||100}); updated++; }
        else if(dup==='add'){ DB.foods.push({id:uid('f'),...rec}); added++; }
        else skipped++;
      } else { DB.foods.push({id:uid('f'),...rec}); added++; }
    });
    dropFoodIndex(); IMP=null;
    toast(added+' besin eklendi'+(updated?', '+updated+' güncellendi':'')+(skipped?', '+skipped+' atlandı':''));
  }
  if(act==='receipt-run'){
    const cid=val('rc-client'), cc=clientOf(cid);
    const d={no:val('rc-no'),date:val('rc-date')||todayISO(),gross:+val('rc-gross')||0,
      tax:+val('rc-tax')||0,vat:+val('rc-vat')||0,desc:val('rc-desc'),taxId:val('rc-tax-id'),
      clientName:cc?cc.name:'—',clientPhone:cc?cc.phone:''};
    if(!d.gross) return toast('Tutar girilmeli');
    DB.receiptNo=+d.no||((DB.receiptNo||0)+1);
    DB.profile.taxId=d.taxId;
    closeModal(); await save();
    printReceipt(d);
    return;
  }
  if(act==='note'){
    if(!val('n-text')) return toast('Not boş olamaz');
    c.notes=c.notes||[]; c.notes.push({id:uid('n'),date:val('n-date')||todayISO(),type:val('n-type'),text:val('n-text')});
    toast('Not kaydedildi');
  }
  if(act==='note-edit'){
    if(!val('n-text')) return toast('Not boş olamaz');
    const n0=(c.notes||[]).find(x=>x.id===S.editNote);
    if(!n0) return toast('Not bulunamadı');
    n0.date=val('n-date')||n0.date; n0.type=val('n-type')||n0.type; n0.text=val('n-text');
    n0.edited=Date.now();
    toast('Not güncellendi');
  }
  if(act==='food'||act==='food-edit'){
    if(!val('f-n')) return toast('Besin adı zorunlu');
    const u={};
    String(val('f-u')||'').split(',').forEach(part=>{
      const kv=part.split('='); if(kv.length!==2) return;
      const key=kv[0].trim().toLocaleLowerCase('tr'), g=parseFloat(kv[1].replace(',','.'));
      if(key&&!isNaN(g)) u[FOLD(key)]=g;
    });
    const rec={n:val('f-n'),cat:val('f-cat')||'Diğer',g:+val('f-g')||100,u,gi:+val('f-gi')||0};
    NUTRIENTS.forEach(x=>rec[x.k]=+val('f-'+x.k)||0);
    if(act==='food-edit'){ const t=DB.foods.find(x=>x.id===S.editFood); if(t) Object.assign(t,rec); toast('Besin güncellendi'); }
    else { DB.foods.push({id:uid('f'),...rec}); toast('Besin eklendi'); }
    dropFoodIndex();
  }
  if(act==='close-appt'){
    const a=DB.appts.find(x=>x.id===S.closeAppt); if(!a) return closeModal();
    const came=document.querySelector('[data-seg="came:gelmedi"][aria-pressed="true"]')?'gelmedi':'geldi';
    a.status=came;
    const amt=+val('ca-amount')||0;
    if(amt>0) a.pay={amount:amt,type:val('ca-paytype'),at:todayISO()};
    else a.pay=null;
    const wantNext=!!document.querySelector('[data-seg="next:1"][aria-pressed="true"]');
    if(wantNext && val('ca-next')){
      DB.appts.push({id:uid('a'),clientId:a.clientId,when:val('ca-next'),type:val('ca-nexttype'),note:'',status:'',first:false});
      S.calDay=isoOf(val('ca-next')); S.calYM=ymOf(val('ca-next'));
      toast('Seans kapatıldı, yeni randevu oluşturuldu');
    } else toast('Seans kapatıldı');
  }
  if(act==='plan-copy'){
    const src=DB.plans.find(x=>x.id===S.plan);
    const days=JSON.parse(JSON.stringify(src.days));
    if(!document.getElementById('cp-photos').checked)
      days.forEach(d=>{d.photo=''; d.meals.forEach(m=>m.photo='');});
    const np={...JSON.parse(JSON.stringify(src)),id:uid('p'),days,
      name:val('cp-name')||src.name,start:val('cp-start')||todayISO(),
      firstDay:+val('cp-firstday'),clientId:val('cp-client'),status:'Aktif'};
    DB.plans.unshift(np);
    if(document.getElementById('cp-close').checked) src.status='Tamamlandı';
    S.plan=np.id; S.day=0; toast('Program kopyalandı');
  }
  if(act==='plan-tpl'){
    const p=DB.plans.find(x=>x.id===S.plan);
    if(!val('tp-name')) return toast('Şablon adı gerekli');
    const days=JSON.parse(JSON.stringify(p.days));
    if(!document.getElementById('tp-photos').checked)
      days.forEach(d=>{d.photo=''; d.meals.forEach(m=>m.photo='');});
    DB.planTpls=DB.planTpls||[];
    DB.planTpls.unshift({id:uid('t'),name:val('tp-name'),sub:p.sub,purpose:(p.purpose||[]).slice(),closing:p.closing,days});
    toast('Şablon kaydedildi');
  }
  if(act==='plan-new'){
    if(!val('p-name')) return toast('Program başlığı zorunlu');
    const p={id:uid('p'),clientId:val('p-client'),name:val('p-name'),sub:val('p-sub'),start:val('p-start')||todayISO(),
      status:val('p-status'),desc:val('p-desc'),footer:'',firstDay:+val('p-firstday'),
      purpose:val('p-purpose').split('\n').map(x=>x.trim()).filter(Boolean),closing:TPL.closing,days:newDays()};
    const tplId=val('p-tpl');
    if(tplId){ const t=(DB.planTpls||[]).find(x=>x.id===tplId);
      if(t){ p.days=JSON.parse(JSON.stringify(t.days)); if(t.sub) p.sub=t.sub; if((t.purpose||[]).length) p.purpose=t.purpose.slice(); if(t.closing) p.closing=t.closing; } }
    const tid=val('p-tpl');
    if(tid){ const t=(DB.templates||[]).find(x=>x.id===tid);
      if(t){ const d=JSON.parse(JSON.stringify(t.data));
        p.days=d.days; if(d.purpose&&d.purpose.length) p.purpose=d.purpose;
        if(d.closing) p.closing=d.closing; if(d.footer) p.footer=d.footer; } }
    DB.plans.push(p); S.plan=p.id; S.day=0; S.page='planEdit'; toast('Program oluşturuldu');
  }
  if(act==='plan-edit'){
    const p=DB.plans.find(x=>x.id===S.plan);
    Object.assign(p,{name:val('p-name'),sub:val('p-sub'),start:val('p-start'),status:val('p-status'),desc:val('p-desc'),firstDay:+val('p-firstday'),
      purpose:val('p-purpose').split('\n').map(x=>x.trim()).filter(Boolean)});
    toast('Program güncellendi');
  }
  if(act==='meal'){
    if(!val('ml-n')) return toast('Öğün adı zorunlu');
    DB.plans.find(x=>x.id===S.plan).days[S.day].meals.push({name:val('ml-n'),time:val('ml-t'),items:[]});
    toast('Öğün eklendi');
  }
  if(act==='item'){
    const name=val('it-food'); if(!name) return toast('Besin adı zorunlu');
    const p=DB.plans.find(x=>x.id===S.plan);
    const q=val('it-q')|| (val('it-gram')? val('it-gram')+' g':'1 porsiyon');
    p.days[S.day].meals[S.mealIdx].items.push({n:name,q,kcal:+val('it-kcal')||0,p:+val('it-p')||0,k:+val('it-k')||0,y:+val('it-y')||0});
    toast('Besin eklendi');
  }
  closeModal(); await save(); render();
}

const ymOf=d=>String(d).slice(0,7);
const isoOf=d=>String(d).slice(0,10);
const trMonth=ym=>{const [y,m]=ym.split('-');return new Date(+y,+m-1,1).toLocaleDateString('tr-TR',{month:'long',year:'numeric'});};
const shiftYM=(ym,n)=>{const [y,m]=ym.split('-').map(Number);const d=new Date(y,m-1+n,1);return d.toISOString().slice(0,7);};
const hhmm=w=>new Date(w).toLocaleTimeString('tr-TR',{hour:'2-digit',minute:'2-digit'});
const apptsOf=iso=>DB.appts.filter(a=>isoOf(a.when)===iso).sort((a,b)=>new Date(a.when)-new Date(b.when));
const payOf=a=>(a.pay&&+a.pay.amount)||0;
function clientMoney(id){
  const as=DB.appts.filter(a=>a.clientId===id);
  const paid=as.reduce((t,a)=>t+payOf(a),0);
  const done=as.filter(a=>a.status==='geldi').length;
  const c=clientOf(id)||{};
  const total=+c.pkgCount||0, price=+c.pkgPrice||0;
  return {paid,done,total,price,due:Math.max(0,price-paid),left:total?Math.max(0,total-done):0};
}

async function waSave(id){
  const ad=val('wa-ad'), tel=val('wa-tel');
  if(!ad) return toast('Ad zorunlu');
  if(!phoneIntl(tel)) return toast('Geçerli bir numara girin');
  const rec={ad,soyad:val('wa-soyad'),tel,tag:val('wa-tag')};
  const list=waList();
  if(id){ const i=list.findIndex(y=>y.id===id); if(i>=0) Object.assign(list[i],rec); }
  else {
    if(list.some(y=>phoneIntl(y.tel)===phoneIntl(tel))) return toast('Bu numara zaten listede');
    list.push({id:uid('w'),...rec});
  }
  await save(); toast('Kaydedildi'); closeModal(); render();
}
async function waImport(){
  const list=waList(); let n=0;
  DB.clients.forEach(c=>{
    if(!c.phone||!phoneIntl(c.phone)) return;
    if(list.some(y=>phoneIntl(y.tel)===phoneIntl(c.phone))) return;
    const parts=String(c.name||'').trim().split(/\s+/);
    list.push({id:uid('w'),ad:parts[0]||c.name,soyad:parts.slice(1).join(' '),tel:c.phone,
      tag:c.archived?'Eski danışan':'Danışan'});
    n++;
  });
  await save(); toast(n?n+' kişi aktarıldı':'Aktarılacak yeni numara yok'); render();
}
function waText(x){
  const raw=S.waMsg||'';
  return raw.replace(/\{ad\}/g,x.ad||'').replace(/\{adsoyad\}/g,((x.ad||'')+' '+(x.soyad||'')).trim());
}
function waStart(){
  const sel=S.waSel||{};
  const q=waList().filter(x=>sel[x.id]);
  if(!q.length) return toast('Önce kişi seçin');
  if(!String(S.waMsg||'').trim() && !S.waImg) return toast('Önce mesaj yazın ya da görsel ekleyin');
  S.waQ=q.map(x=>x.id); S.waI=0; S.waDone=[];
  drawSend();
}
function drawSend(){
  const list=waList();
  const q=(S.waQ||[]).map(id=>list.find(y=>y.id===id)).filter(Boolean);
  const i=S.waI||0;
  if(i>=q.length){
    return modal('Gönderim tamamlandı',
      `<div class="ai-load"><span style="font-size:34px">✅</span><b>${q.length} kişi tamamlandı</b>
        <small>Listeyi istediğin zaman yeniden gönderime alabilirsin</small></div>`,
      'Kapat','close','520px');
  }
  const x=q[i], txt=waText(x), tel=phoneIntl(x.tel);
  const pct=Math.round(i/q.length*100);
  modal('Gönderim — '+(i+1)+' / '+q.length,`
    <div style="height:8px;background:var(--line);border-radius:99px;overflow:hidden;margin-bottom:14px">
      <div style="height:100%;width:${pct}%;background:#1E7B4D;transition:width .3s"></div></div>
    <div style="border:1px solid var(--line);border-radius:12px;padding:14px">
      <b style="font-size:15px">${esc(x.ad)} ${esc(x.soyad||'')}</b>
      <div class="num" style="color:var(--muted);font-size:13px">${esc(x.tel)}</div>
      <div style="white-space:pre-wrap;margin-top:10px;font-size:13.5px;line-height:1.7">${esc(txt)}</div>
      ${S.waImg?`<div class="hint" style="margin-top:8px">Görsel WhatsApp'ta ayrıca eklenmeli — "Görseli paylaş" ile gönderebilirsin.</div>`:''}
    </div>
    <div class="ai-actions" style="margin-top:14px">
      <button class="btn" data-wa-skip="1">Atla</button>
      <a class="btn btn-primary" target="_blank" rel="noopener" data-wa-next="1"
         href="https://wa.me/${tel}?text=${encodeURIComponent(txt)}">WhatsApp'ta aç ve gönder</a>
    </div>
    <p class="hint" style="margin-top:10px">WhatsApp açılır, gönder tuşuna sen basarsın. Buraya dönünce sıradaki kişiye geçilir.</p>`,
    'Durdur','close','560px');
}
async function waShareImg(){
  if(!S.waImg) return;
  try{
    const b=await (await fetch(S.waImg)).blob();
    const f=new File([b],'gorsel.jpg',{type:b.type||'image/jpeg'});
    try{ await navigator.clipboard.writeText(S.waMsg||''); }catch(e){}
    if(navigator.canShare&&navigator.canShare({files:[f]})){
      await navigator.share({files:[f],text:S.waMsg||''});
      return toast('Paylaş menüsünden WhatsApp ve kişileri seç');
    }
    const a=document.createElement('a'); a.href=S.waImg; a.download='gorsel.jpg'; a.click();
    toast('Görsel indirildi, metin panoya kopyalandı');
  }catch(e){ toast('Paylaşılamadı'); }
}

'JSON ŞEMASI: {"mesajlar":[{"metin":"","emoji":"","gorsel":""}]}'].join('\n'),2048));

const CT_TYPES={

  story:{t:'Story / kısa metin',ic:'⚡',d:'3-4 kareye bölünmüş kısa metin'},
  blog:{t:'Blog yazısı',ic:'📝',d:'Başlıklı, SEO açıklamalı uzun yazı'},

function ctPrompt(type,topic,tone,extra){
  const who=(DB.profile&&DB.profile.name)||'bir diyetisyen';
  const base=[
'Sen '+who+' adına içerik yazan bir metin yazarısın. Konu: beslenme ve diyetisyenlik.','',
'GENEL KURALLAR:',
'- Yanıtı SADECE geçerli JSON olarak ver. Markdown, kod bloğu, açıklama ekleme.',
'- Türkçe yaz. '+TONE_TXT(tone),
'- Bilimsel olarak desteklenmeyen iddia kurma. "Tedavi eder", "yağ yakar", "detoks" gibi ifadeler kullanma.',
'- Mucize vaat etme, korkutucu dil kullanma, kişiye özel tıbbi tavsiye verme.',
'- Gerektiğinde okuyucuyu bir uzmana danışmaya yönlendir.',
'- Emoji kullan ama abartma.'];
  const per={
post:['','ÇIKTI: Instagram gönderisi.',
'- "baslik": dikkat çeken ilk satır, en fazla 60 karakter.',
'- "metin": 120-200 kelime, kısa paragraflar ve satır aralarıyla.',
'- "hashtag": 12-18 arası, Türkçe ve İngilizce karışık, # işaretiyle.',
'- "gorsel": bu gönderi için önerilen fotoğrafın tek cümlelik tarifi (İngilizce, fotoğraf üretimi için).','',
'JSON ŞEMASI: {"baslik":"","metin":"","hashtag":[""],"gorsel":""}'],
story:['','ÇIKTI: 3-4 kareden oluşan story metni.',
'- "kareler": her biri en fazla 25 kelimelik dizi.',
'- "kapanis": son karede yer alacak çağrı cümlesi.','',
'JSON ŞEMASI: {"kareler":[""],"kapanis":""}'],
blog:['','ÇIKTI: Blog yazısı.',
'- "baslik": ilgi çekici ve arama dostu.',
'- "giris": 2-3 cümlelik giriş.',
'- "bolumler": 4-6 bölüm; her biri {"h":"ara başlık","metin":"80-150 kelime"}.',
'- "sonuc": 2-3 cümlelik kapanış.',
'- "seo": {"aciklama":"en fazla 155 karakter","anahtar":["5-8 anahtar kelime"]}','',
'JSON ŞEMASI: {"baslik":"","giris":"","bolumler":[{"h":"","metin":""}],"sonuc":"","seo":{"aciklama":"","anahtar":[""]}}'],
msg:['','ÇIKTI: Danışanlara gönderilecek toplu WhatsApp mesajı.',
'- "mesaj": en fazla 8 cümle, tek parça metin. Başlık ve madde işareti kullanma.',
'- Kişiye özel tıbbi yönlendirme yapma, genel bilgi ver.','',
'JSON ŞEMASI: {"mesaj":""}']
  }[type]||[];
  return base.concat(per,['','KONU:',String(topic).slice(0,600),
    extra?('\nEK NOT:\n'+String(extra).slice(0,600)):'']).join('\n');
}

  S.ctTone=(document.getElementById('ct-tone')||{}).value||S.ctTone||'samimi';

  if(String(topic).trim().length<3) return toast('Önce bir konu yazın');
  const type=S.ctType||'post';

  try{

'KURALLAR:','- Yanıtı SADECE geçerli JSON olarak ver.',

function drawIdeas(state,err){
  const body = state==='done'&&S.ctIdeas
   ? `<p style="margin:0 0 10px;color:var(--muted);font-size:13px">Birine dokun, konu alanına yazılsın.</p>
      ${S.ctIdeas.map(x=>`<button class="btn" data-ct-pick="${esc(x)}" style="width:100%;justify-content:flex-start;margin-bottom:8px;text-align:left">${esc(x)}</button>`).join('')}
      <button class="btn btn-sm" data-ct-ideas="1" style="width:100%;justify-content:center;margin-top:4px">↻ Başka öneriler</button>`
   : state==='loading' ? `<div class="ai-load"><span class="spin"></span><b>Konular hazırlanıyor…</b></div>`
   : `<div class="ai-load"><span style="font-size:30px">⚠️</span><b style="color:var(--danger)">${esc(err||'Olmadı')}</b></div>`;
  modal('Konu önerileri',body,'Kapat','close','560px');
}
async function ctImage(id){
  const x=(DB.contents||[]).find(y=>y.id===id); if(!x) return;
  const desc=(x.data||{}).gorsel; if(!desc) return;
  toast('Görsel üretiliyor…');
  try{
    const img=await geminiImage('professional photography for a nutrition social media post, '+desc+', natural light, high detail, no text, no words, no letters', S.gemModel||'gemini-3.1-flash-image');
    x.img=img; addToGallery(img,(x.baslik||'İçerik')+' (Gemini)');
    await save(); toast('Görsel eklendi'); drawContent('done',null,x);
  }catch(e){ toast(e.message||'Görsel üretilemedi'); }
}

function pageTrash(){
  trashPurge();
  const list=(DB.trash||[]).slice().sort((a,b)=>(+b.at||0)-(+a.at||0));
  const rows=list.map(it=>{
    const left=trashLeft(it);
    return `<tr><td class="t-name">${TRASH_ICON[it.type]||'🗑'} ${esc(it.label)}</td>
      <td>${TRASH_LBL[it.type]||it.type}</td>
      <td class="num">${new Date(+it.at||0).toLocaleDateString('tr-TR')}</td>
      <td class="t-right"><span class="tag ${left<=2?'tag-danger':left<=5?'tag-warn':''}"><i class="dot"></i>${left} gün</span></td>
      <td class="t-right no-print">
        <button class="btn btn-sm btn-primary" data-trash-restore="${it.id}">Geri al</button>
        <button class="x" data-trash-drop="${it.id}" title="Kalıcı sil">✕</button></td></tr>`;
  }).join('');
  return `<div class="page-head"><div><h1>Çöp kutusu</h1>
    <p>Sildiğiniz kayıtlar ${TRASH_DAYS} gün burada bekler, sonra kendiliğinden kalıcı olarak silinir.</p></div>
    ${list.length?`<button class="btn btn-danger" data-act="trash-empty">Çöp kutusunu boşalt</button>`:''}</div>
  <section class="card">
    <div class="card-h"><h3>Silinen kayıtlar</h3><div class="spacer"></div><span class="tag">${list.length}</span></div>
    ${list.length?`<div class="tw"><table><thead><tr><th>Kayıt</th><th>Tür</th><th>Silindi</th><th class="t-right">Kalan süre</th><th></th></tr></thead>
      <tbody>${rows}</tbody></table></div>`
     :`<div class="empty"><div class="eic">🗑</div><h4>Çöp kutusu boş</h4><p>Sildiğiniz danışan, program, ölçüm, randevu ve besin kayıtları burada görünür.</p></div>`}
  </section>`;
}

      <button class="btn btn-sm ${c.invoiced?'btn-danger':'btn-primary'}" data-inv-toggle="${c.id}">${c.invoiced?'Geri al':'Kesildi'}</button></td></tr>`;

    <div class="stat"><div class="badge">${ic('chart')}</div><div class="lbl">Toplam tutar</div><div class="val">${total.toLocaleString('tr-TR')} ₺</div><div class="sub">kesilen faturalar</div></div>
    <div class="stat"><div class="badge">${ic('clients')}</div><div class="lbl">Bekleyen</div><div class="val">${non.length}</div><div class="sub">fatura kesilmedi</div></div>
  </div>
  <section class="card" style="margin-bottom:16px"><div class="card-h"><h3>Faturası kesilenler</h3><div class="spacer"></div><span class="tag tag-ok"><i class="dot"></i>${inv.length}</span></div>
  ${inv.length?`<div class="tw"><table><thead><tr><th>Danışan</th><th>Fatura no</th><th>Tarih</th><th class="t-right">Tutar</th><th></th></tr></thead>
    <tbody>${inv.map(row).join('')}</tbody></table></div>`
   :`<div class="empty"><div class="eic">🧾</div><h4>Henüz fatura kesilmedi</h4><p>Danışan bilgilerinde "Fatura kesildi" kutusunu işaretlediğinde burada listelenir.</p></div>`}
  </section>
  <section class="card"><div class="card-h"><h3>Fatura bekleyenler</h3><div class="spacer"></div><span class="tag ${non.length?'tag-warn':''}">${non.length}</span></div>

      <td class="t-right num">${c.pkgPrice?(+c.pkgPrice).toLocaleString('tr-TR')+' ₺':'—'}</td>
      <td class="t-right"><button class="btn btn-sm" data-client="${c.id}">Aç</button>
        <button class="btn btn-sm btn-primary" data-inv-toggle="${c.id}">Kesildi</button></td></tr>`).join('')}</tbody></table></div>`

function render(){
  document.getElementById('nav').innerHTML=NAV.map(i=>i.s?`<div class="nav-sec">${i.s}</div>`:
    `<button class="nav-item" data-go="${i.id}" ${S.page===i.id||(i.id==='clients'&&S.page==='client')||(i.id==='plans'&&S.page==='planEdit')?'aria-current="page"':''}>
      <span class="ic">${ic(i.ic)}</span>${i.t}${i.id==='clients'&&DB.clients.length?`<span class="count">${DB.clients.length}</span>`:''}${i.id==='plans'&&DB.plans.length?`<span class="count">${DB.plans.length}</span>`:''}</button>`).join('');
  const bl=document.getElementById('brandLogo');
  if(DB.profile.logo){ bl.src=DB.profile.logo; bl.style.display=''; } else bl.style.display='none';
  document.getElementById('brandName').textContent=DB.profile.name;
  document.getElementById('brandSub').textContent=DB.profile.clinic;
  document.getElementById('whoName').textContent=DB.profile.name;
  let cr='<b>'+TITLES[S.page]+'</b>';
  if(S.page==='client'){const c=clientOf(S.client); cr='Danışanlar / <b>'+esc(c?c.name:'')+'</b>';}
  if(S.page==='planEdit'){const p=DB.plans.find(x=>x.id===S.plan); cr='Programlar / <b>'+esc(p?p.name:'')+'</b>';}
  document.getElementById('crumb').innerHTML=cr;
  document.getElementById('view').innerHTML=`<div class="page">${PAGES[S.page]()}</div>`;
  window.scrollTo(0,0);
}

  const bs=t.closest('[data-batch-stop]'); if(bs){ S.bqStop=true; toast('Durduruluyor…'); return; }
  const ao=t.closest('[data-ai-open]'); if(ao){ return openAiPhoto(+ao.dataset.aiOpen); }
  const ast=t.closest('[data-ai-pick]'); if(ast){ S.aiPick=+ast.dataset.aiPick; drawAiModal('done'); return; }
  const ar=t.closest('[data-ai-run]'); if(ar){
    const styleSel=(document.getElementById('ai-style')||{}).value;
    if(styleSel && styleSel!==S.aiStyle){ S.aiStyle=styleSel; S.aiPrompt=aiPrompt(S.aiMeal,styleSel); }
    else S.aiPrompt=(document.getElementById('ai-prompt')||{}).value||S.aiPrompt;
    S.gemModel=(document.getElementById('gem-model')||{}).value||S.gemModel||'gemini-3.1-flash-image';
    S.aiImgs=[]; S.aiPick=-1;
    drawAiModal('loading');
    try{
      const got=await Promise.allSettled([1].map(()=>geminiImage(S.aiPrompt,S.gemModel)));
      S.aiImgs=got.filter(x=>x.status==='fulfilled').map(x=>x.value);
      if(S.aiImgs.length===1) S.aiPick=0;
      if(!S.aiImgs.length){
        const bad=got.find(x=>x.status==='rejected');
        throw new Error((bad&&bad.reason&&bad.reason.message)||'Görsel alınamadı');
      }
      drawAiModal('done');
    }catch(err){ drawAiModal('error',err.message); }
    return; }
  const au=t.closest('[data-ai-use]'); if(au){
    const pick=(S.aiImgs||[])[S.aiPick]; if(!pick) return toast('Önce bir kare seç');
    const p=DB.plans.find(x=>x.id===S.plan), m=p.days[S.day].meals[S.aiTarget];
    m.photo=pick; addToGallery(pick,(m.title||m.name)+' (yapay zekâ)');
    closeModal(); await save(); toast('Görsel eklendi'); return render(); }
  const go1=t.closest('[data-gal-open]'); if(go1){ return openGallery({type:'meal',mi:+go1.dataset.galOpen}); }
  const gu=t.closest('[data-gal-use]'); if(gu){
    const g=(DB.gallery||[]).find(x=>x.id===gu.dataset.galUse); if(!g) return;
    const p=DB.plans.find(x=>x.id===S.plan), tg=S.galTarget||{};
    if(tg.type==='day') p.days[S.day].photo=g.d; else p.days[S.day].meals[tg.mi].photo=g.d;
    g.at=Date.now(); closeModal(); await save(); toast('Fotoğraf eklendi'); return render(); }
  const gd=t.closest('[data-gal-del]'); if(gd){
    DB.gallery=(DB.gallery||[]).filter(x=>x.id!==gd.dataset.galDel);
    await save(); openGallery(S.galTarget); return; }

  const qa=t.closest('[data-qa-add]'); if(qa){
    const mi=+qa.dataset.qaAdd;
    const amtEl=document.querySelector(`[data-qa-amt="${mi}"]`), fdEl=document.querySelector(`[data-qa-food="${mi}"]`);
    const food=(fdEl.value||'').trim(); if(!food) return toast('Besin adı yazın');
    const line=[(amtEl.value||'').trim(),food].filter(Boolean).join(' ');
    const p=DB.plans.find(x=>x.id===S.plan);
    p.days[S.day].meals[mi].lines.push(line);
    amtEl.value=''; fdEl.value='';
    await save(); render(); return; }
  const td=t.closest('[data-tpl-del]'); if(td){
    DB.planTpls=(DB.planTpls||[]).filter(x=>x.id!==td.dataset.tplDel);
    await save(); openModal('plan-tpl'); return; }
  const fo=t.closest('[data-fav-open]'); if(fo){ return openFavs(+fo.dataset.favOpen); }
  const fa=t.closest('[data-fav-add]'); if(fa){
    const p=DB.plans.find(x=>x.id===S.plan), m=p.days[S.day].meals[+fa.dataset.favAdd];
    if(!m.lines.length && !m.title) return toast('Önce öğünü doldurun');
    DB.favMeals=DB.favMeals||[];
    DB.favMeals.unshift({id:uid('fv'),name:m.name,title:m.title,lines:m.lines.slice(),photo:m.photo||''});
    if(m.photo) addToGallery(m.photo,m.title||m.name);
    await save(); toast('Favorilere kaydedildi'); return render(); }
  const fu=t.closest('[data-fav-use]'); if(fu){
    const f=(DB.favMeals||[]).find(x=>x.id===fu.dataset.favUse); if(!f) return;
    const p=DB.plans.find(x=>x.id===S.plan), m=p.days[S.day].meals[S.favTarget];
    m.title=f.title; m.lines=f.lines.slice(); if(f.photo) m.photo=f.photo;
    closeModal(); await save(); toast('Öğün dolduruldu'); return render(); }
  const fd=t.closest('[data-fav-del]'); if(fd){
    DB.favMeals=(DB.favMeals||[]).filter(x=>x.id!==fd.dataset.favDel);
    await save(); openFavs(S.favTarget); return; }

  const ddp=t.closest('[data-deldayphoto]'); if(ddp){
    const p=DB.plans.find(x=>x.id===S.plan); p.days[S.day].photo='';
    await save(); return render(); }
  const dph=t.closest('[data-delphoto]'); if(dph){
    const p=DB.plans.find(x=>x.id===S.plan); p.days[S.day].meals[+dph.dataset.delphoto].photo='';
    await save(); return render(); }
  const dp=t.closest('[data-del-plan]'); if(dp){ if(!confirm('Bu program çöp kutusuna taşınsın mı? '+TRASH_DAYS+' gün geri alabilirsiniz.')) return;
    const it=DB.plans.find(x=>x.id===dp.dataset.delPlan);
    if(it){ const c=clientOf(it.clientId); trashPush('plan',it.name+(c?' · '+c.name:''),it); }
    DB.plans=DB.plans.filter(x=>x.id!==dp.dataset.delPlan); S.page='plans'; await save(); toast('Çöp kutusuna taşındı'); return render(); }
  const dc=t.closest('[data-del-client]'); if(dc){
    const cid=dc.dataset.delClient, cc=clientOf(cid);
    if(!confirm('Danışan ve tüm kayıtları çöp kutusuna taşınsın mı? '+TRASH_DAYS+' gün içinde geri alabilirsiniz.')) return;
    const pls=DB.plans.filter(x=>x.clientId===cid), aps=DB.appts.filter(x=>x.clientId===cid);
    if(cc) trashPush('client',cc.name+' ('+pls.length+' program, '+aps.length+' randevu)',{client:cc,plans:pls,appts:aps});
    DB.clients=DB.clients.filter(x=>x.id!==cid);
    DB.plans=DB.plans.filter(x=>x.clientId!==cid);
    DB.appts=DB.appts.filter(x=>x.clientId!==cid);
    S.page='clients'; await save(); toast('Çöp kutusuna taşındı'); return render(); }

  const act=t.closest('[data-act]'); if(act){
    const a=act.dataset.act;
    if(a==='print') window.print();
    if(a==='lock'){ lockApp(); return; }
    if(a==='cloud-connect'){
      const api=val('cl-api')||CLOUD_API, bk=(val('cl-bucket')||CLOUD_DB).replace(/\/+$/,''), ml=val('cl-mail'), ps=val('cl-pass');
      if(!ml||!ps) return toast('E-posta ve şifre gerekli');
      toast('Bağlanılıyor…');
      try{
        await cloudSignIn(api,bk,ml,ps);
        await cloudSync(true);
        toast('Bulut bağlandı'); render();
      }catch(err){ toast(err.message||'Bağlanamadı'); }
      return;
    }
    if(a==='cloud-sync'){ await cloudSync(true); return; }
    if(a==='cloud-off'){
      if(!confirm('Bu cihazda bulut bağlantısı kesilsin mi? Veriler cihazda kalır.')) return;
      DB.cloud=null; await save({noCloud:true}); paintSync('Bulut kapalı','var(--muted)'); render(); return;
    }
    if(a==='copy-day'){
      const pl=DB.plans.find(x=>x.id===S.plan);
      S.clip={from:S.day,data:JSON.parse(JSON.stringify(pl.days[S.day]))};
      toast((S.day+1)+'. gün kopyalandı'); return render();
    }
    if(a==='paste-day'){
      if(!S.clip) return toast('Önce bir gün kopyalayın');
      const pl=DB.plans.find(x=>x.id===S.plan);
      pl.days[S.day]=JSON.parse(JSON.stringify(S.clip.data));
      await save(); toast('Yapıştırıldı'); return render();
    }
    if(a==='clear-day'){
      if(!confirm((S.day+1)+'. günün tüm öğünleri silinsin mi?')) return;
      const pl=DB.plans.find(x=>x.id===S.plan);
      pl.days[S.day].meals.forEach(m=>{m.title='';m.lines=[];m.photo='';});
      pl.days[S.day].photo='';
      await save(); toast('Gün temizlendi'); return render();
    }
    if(a==='save-tpl'){
      const pl=DB.plans.find(x=>x.id===S.plan);
      const nm=prompt('Şablon adı:', pl.name); if(!nm) return;
      DB.templates=DB.templates||[];
      DB.templates.push({id:uid('t'),name:nm,created:todayISO(),
        data:JSON.parse(JSON.stringify({sub:pl.sub,purpose:pl.purpose,closing:pl.closing,footer:pl.footer,days:pl.days}))});
      await save(); toast('Şablon kaydedildi'); return;
    }
    if(a==='del-tpl'){
      const id=act.dataset.tpl; DB.templates=(DB.templates||[]).filter(t=>t.id!==id);
      await save(); return render();
    }
    if(a==='share'||a==='share-docx'){ openShare(); return; }
  if(a==='scale'){ openScale(); return; }
  if(a==='shopping'){ openShopping(); return; }
  if(a==='food-import'){ openImport(); return; }
  if(a==='receipt'){ openReceipt(); return; }
  if(a==='ics'){
    const fut=DB.appts.filter(x=>new Date(x.when)>=new Date(Date.now()-864e5))
      .sort((x,y)=>new Date(x.when)-new Date(y.when));
    if(!fut.length) return toast('Aktarılacak randevu yok');
    icsFor(fut,'Randevular'); toast(fut.length+' randevu takvim dosyasına aktarıldı'); return;
  }
    if(a==='save-pin'){
      const a1=val('pin-new'), a2=val('pin-new2');
      if(!/^[0-9]{4,8}$/.test(a1)) return toast('Şifre 4-8 rakam olmalı');
      if(a1!==a2) return toast('Şifreler eşleşmiyor');
      DB.profile.pin=a1; await save(); toast('Şifre güncellendi'); render(); return;
    }
    if(a==='progress-docx'){ try{ exportProgressDocx(); }catch(err){ console.error(err); toast('Rapor oluşturulamadı'); } return; }
    if(a==='form-docx'){ try{ exportFormDocx(false); }catch(err){ console.error(err); toast('Word dosyası oluşturulamadı'); } return; }
    if(a==='form-docx-blank'){ try{ exportFormDocx(true); }catch(err){ toast('Word dosyası oluşturulamadı'); } return; }
    if(a==='docx'){ try{ await exportDocx(); }catch(err){ console.error(err); toast('Word dosyası oluşturulamadı'); } return; }
    if(a==='save-form'){
      const c2=clientOf(S.client);
      Object.assign(c2,{name:val('fm-name')||c2.name,age:val('fm-age'),city:val('fm-city'),height:val('fm-height'),
        job:val('fm-job'),phone:val('fm-phone'),health:val('fm-health'),meds:val('fm-meds'),dislikes:val('fm-dislikes'),
        likes:val('fm-likes'),allergy:val('fm-allergy'),blood:val('fm-blood'),important:val('fm-important')});
      await save(); toast('Bilgi formu kaydedildi'); render(); return;
    }
    if(a==='add-session'){
      const c2=clientOf(S.client);
      if(!val('s-weight')&&!val('s-note')) return toast('Kilo veya not girin');
      c2.measures=c2.measures||[];
      c2.measures.push({id:uid('m'),date:val('s-date')||todayISO(),weight:val('s-weight')||c2.weight||0,note:val('s-note')});
      if(val('s-weight')) c2.weight=val('s-weight');
      await save(); toast('Görüşme kaydedildi'); render(); return;
    }
    if(a==='print-blank'){
      const v=document.getElementById('view'), old=v.innerHTML;
      v.innerHTML=`<div class="page">${blankForm()}</div>`; window.print(); v.innerHTML=old; return;
    }
    if(a==='save-note'){ DB.plans.find(x=>x.id===S.plan).note=document.getElementById('planNote').value; await save(); toast('Not kaydedildi'); render(); }
    if(a==='batch-photo'){ return openBatch(); }
    if(a==='paste-plan'){ return openPaste(); }
    if(a==='ai-plan'){ return openGenPlan(); }
    if(a==='ai-cover'){ return runCover(); }
    if(a==='ai-check'){ return runCheck(); }
    if(a==='doc-theme'){ return openDocTheme(); }
    if(a==='nu-detail'){ return openDayAnalysis(); }
    if(a==='trash-empty'){
      if(!confirm('Çöp kutusundaki tüm kayıtlar kalıcı olarak silinsin mi? Geri alınamaz.')) return;
      DB.trash=[]; await save(); toast('Çöp kutusu boşaltıldı'); return render(); }
    if(a==='gem-diag'){ S.gemDiag=null; return gemDiagModal(); }
    if(a==='save-profile'){ Object.assign(DB.profile,{name:val('pf-name'),clinic:val('pf-clinic'),phone:val('pf-phone'),mail:val('pf-mail'),note:val('pf-note'),gemini:val('pf-gemini')}); await save(); toast('Bilgiler kaydedildi'); render(); }
    if(a==='export'){ const b=new Blob([JSON.stringify(DB,null,2)],{type:'application/json'});
      const u=URL.createObjectURL(b), l=document.createElement('a'); l.href=u; l.download='diyet-yedek-'+todayISO()+'.json'; l.click(); URL.revokeObjectURL(u); toast('Yedek indirildi'); }
    if(a==='import') document.getElementById('importFile').click();
    if(a==='del-logo'){ DB.profile.logo=''; await save(); render(); }
    if(a==='reset'){ if(confirm('Tüm danışanlar, programlar ve randevular silinecek. Emin misiniz?')){ DB=seed(); S.page='panel'; await save(); render(); } }
  }
});
document.addEventListener('input',e=>{
  if(e.target.id==='gsearch'){
    S.gq=e.target.value;
    if(S.gq.trim().length>=2){ S.page='search'; render();
      const g=document.getElementById('gsearch'); if(g){ g.value=S.gq; g.focus(); g.setSelectionRange(S.gq.length,S.gq.length); } }
    return;
  }
  if(e.target.id==='q'){ S.q=e.target.value; render();
    const i=document.getElementById('q'); if(i){ i.focus(); i.setSelectionRange(i.value.length,i.value.length); } }
  if(e.target.id==='it-food'||e.target.id==='it-gram'){
    const f=DB.foods.find(x=>x.n.toLocaleLowerCase('tr')===val('it-food').toLocaleLowerCase('tr'));
    const gr=+val('it-gram');
    if(f&&gr){ const r=gr/100;
      document.getElementById('it-kcal').value=Math.round(f.kcal*r);
      document.getElementById('it-p').value=(f.p*r).toFixed(1);
      document.getElementById('it-k').value=(f.k*r).toFixed(1);
      document.getElementById('it-y').value=(f.y*r).toFixed(1); }
  }
});
document.addEventListener('change',async e=>{
  if(e.target.id==='dt-fh'||e.target.id==='dt-fb'){ return paintPreview(); }
  if(e.target.closest('[data-dt-opt]')){
    const pl2=DB.plans.find(x=>x.id===S.plan); if(!pl2) return;
    if(e.target.id==='dt-sum') pl2.docSummary=e.target.checked;
    if(e.target.id==='dt-shop') pl2.docShopping=e.target.checked;
    await save(); return paintPreview(); }
  const wc=e.target.closest('[data-wa-chk]');
  if(wc){ S.waSel=S.waSel||{}; S.waSel[wc.dataset.waChk]=e.target.checked; return; }
  if(e.target.id==='wa-file'){
    const f=e.target.files&&e.target.files[0]; if(!f) return;
    try{ S.waImg=await shrinkData(await blobToData(f),900,.85); toast('Görsel eklendi'); render(); }
    catch(err){ toast('Görsel okunamadı'); }
    return; }
  if(e.target.id==='bq-scope'){ S.bqScope=e.target.value; return drawBatch('idle'); }
  const f=e.target.closest('[data-f]');
  if(f){
    const p=DB.plans.find(x=>x.id===S.plan); if(!p) return;
    const [k,i]=f.dataset.f.split(':'), v=e.target.value;
    if(k==='title')  p.days[S.day].meals[+i].title=v;
    if(k==='lines')  p.days[S.day].meals[+i].lines=v.split('\n').map(x=>x.trim()).filter(Boolean);
    if(k==='tip')    p.days[S.day].meals[+i].tip=v;
    if(k==='daysub') p.days[+i].sub=v;
    if(k==='firstday'){ p.firstDay=+v; await save(); return render(); }
    if(k==='purpose') p.purpose=v.split('\n').map(x=>x.trim()).filter(Boolean);
    if(k==='closing') p.closing=v;
    if(k==='footer') p.footer=v;
    await save(); return;
  }
  const dph2=e.target.closest('[data-dayphoto]');
  if(dph2 && dph2.files && dph2.files[0]){
    try{ const d=await shrink(dph2.files[0],1100,0.72,false);
      const p=DB.plans.find(x=>x.id===S.plan); p.days[S.day].photo=d; addToGallery(d,(S.day+1)+'. gün tabağı');
      await save(); toast('Gün fotoğrafı eklendi'); render();
    }catch(err){ toast('Fotoğraf okunamadı'); }
    return;
  }
  const ph=e.target.closest('[data-photo]');
  if(ph && ph.files && ph.files[0]){
    try{
      const d=await shrink(ph.files[0],620,0.72,true);
      const p=DB.plans.find(x=>x.id===S.plan);
      const mm=p.days[S.day].meals[+ph.dataset.photo];
      mm.photo=d; addToGallery(d, mm.title||mm.name);
      await save(); toast('Fotoğraf eklendi'); render();
    }catch(err){ toast('Fotoğraf okunamadı'); }
    return;
  }
  if(e.target.id==='logoFile' && e.target.files && e.target.files[0]){
    try{ DB.profile.logo=await shrink(e.target.files[0],760,0.82,false); await save(); toast('Logo kaydedildi'); render(); }
    catch(err){ toast('Görsel okunamadı'); }
  }
});

document.getElementById('importFile').addEventListener('change',e=>{
  const f=e.target.files[0]; if(!f) return;
  const r=new FileReader();
  r.onload=async()=>{ try{ const d=JSON.parse(r.result); if(!d.clients) throw 0; DB=d; await save(); S.page='panel'; render(); toast('Yedek yüklendi'); }
    catch(err){ toast('Dosya okunamadı'); } };
  r.readAsText(f); e.target.value='';
});
document.addEventListener('keydown',e=>{ if(e.key==='Escape') closeModal(); });

/* ══════════════ Şifre kilidi ══════════════ */
let PIN='';
const realPin=()=>String(DB.profile.pin||'0508');
function pinPaint(){
  document.getElementById('pinDots').innerHTML=
    Array.from({length:realPin().length},(_,i)=>`<i class="${i<PIN.length?'on':''}"></i>`).join('');
}
function unlock(){
  const lock=document.getElementById('lock'), app=document.querySelector('.app');
  lock.hidden=true; lock.style.display='none';
  if(app) app.style.display='flex';
  try{ render(); paintSave('Hazır','var(--ok)');
       if(cloudReady()){ if(CL()) CL().enabled=true; cloudSync(false);
         setInterval(()=>{ if(!document.hidden && cloudReady() && document.getElementById('lock').hidden) cloudSync(false); },60000); }
       if(trashPurge()>0) save({noCloud:true}); }
  catch(err){
    console.error(err);
    document.getElementById('view').innerHTML='<div class="page"><section class="card"><div class="card-b">'
      +'<b>Bir sorun oluştu:</b><br><span style="font-family:var(--mono);font-size:12px">'+String(err.message||err)+'</span>'
      +'<br><br><button class="btn" data-act="reset">Verileri sıfırla</button></div></section></div>';
  }
}
function pinTry(force){
  if(!force && PIN.length<realPin().length) return;
  if(PIN===realPin()){ unlock(); }
  else{
    const c=document.getElementById('lockCard');
    document.getElementById('lockErr').textContent='Şifre hatalı, tekrar deneyin';
    c.classList.add('shake'); setTimeout(()=>c.classList.remove('shake'),350);
    PIN=''; pinPaint();
  }
}
function pinKey(k){
  document.getElementById('lockErr').textContent='';
  if(k==='del') PIN=PIN.slice(0,-1);
  else if(k==='clear') PIN='';
  else if(k==='ok'){ pinPaint(); return pinTry(true); }
  else if(/^[0-9]$/.test(k)&&PIN.length<8) PIN+=k;
  pinPaint(); pinTry();
}
function lockApp(){
  PIN='';
  document.getElementById('lockName').textContent=DB.profile.name||'Giriş';
  const lg=document.getElementById('lockLogo');
  if(DB.profile.logo){ lg.src=DB.profile.logo; lg.style.display=''; } else lg.style.display='none';
  document.getElementById('lockErr').textContent='';
  const lock=document.getElementById('lock');
  lock.hidden=false; lock.style.display='grid';
  const app=document.querySelector('.app'); if(app) app.style.display='none';
  pinPaint();
}
document.getElementById('keys').addEventListener('click',e=>{
  const b=e.target.closest('[data-k]'); if(b){ e.preventDefault(); pinKey(b.dataset.k); }
});
document.getElementById('btnEnter').addEventListener('click',e=>{ e.preventDefault(); pinKey('ok'); });
document.addEventListener('visibilitychange',()=>{
  if(!document.hidden && document.getElementById('lock').hidden && cloudReady()){
    if(CL()) CL().enabled=true;
    cloudSync(false);
  }
});
document.addEventListener('keydown',e=>{
  const qf=e.target.closest && e.target.closest('[data-qa-food],[data-qa-amt]');
  if(qf && e.key==='Enter'){
    e.preventDefault();
    const mi=qf.dataset.qaFood!==undefined?qf.dataset.qaFood:qf.dataset.qaAmt;
    const btn=document.querySelector(`[data-qa-add="${mi}"]`); if(btn) btn.click();
    return;
  }
  if(document.getElementById('lock').hidden) return;
  if(/^[0-9]$/.test(e.key)) pinKey(e.key);
  else if(e.key==='Backspace'){ e.preventDefault(); pinKey('del'); }
  else if(e.key==='Enter') pinTry();
});

(async()=>{
  try{ await loadDB(); }catch(err){ DB=seed(); }
  if(DB.profile.pin===undefined||DB.profile.pin==='') DB.profile.pin='0508';
  lockApp();
})();
</script>
