/* ══════════════ Öğün analizi — yalnızca panelde görünür ══════════════ */
/* Danışana giden Word ve yazdırma çıktısı bu bölümden etkilenmez. */

const TRLOW=s=>String(s||'').toLocaleLowerCase('tr');
const DIA=s=>TRLOW(s).replace(/ı/g,'i').replace(/ş/g,'s').replace(/ğ/g,'g')
  .replace(/ü/g,'u').replace(/ö/g,'o').replace(/ç/g,'c');
const FOLD=s=>DIA(s).replace(/[^a-z0-9 ]/g,' ').replace(/\s+/g,' ').trim();
/* Satır çözümlemesi kesir ve ondalık ayracını korur */
const LINEFOLD=s=>DIA(s).replace(/(\d)\s*[,]\s*(\d)/g,'$1.$2')
  .replace(/[^a-z0-9 ./]/g,' ').replace(/\s+/g,' ').trim();

const NUM_WORD={'yarim':.5,'yarım':.5,'ceyrek':.25,'bir':1,'birer':1,'iki':2,'ikişer':2,'uc':3,'dort':4,'bes':5,
  'alti':6,'yedi':7,'sekiz':8,'dokuz':9,'on':10,'birbucuk':1.5};
const SIZE_ADJ={'kucuk':.75,'ufak':.75,'mini':.6,'orta':1,'buyuk':1.35,'iri':1.35,'kocaman':1.5,
  'ince':.8,'kalin':1.35,'tepeleme':1.5,'silme':1,'dolu':1.2,'az':.6,'bol':1.4};
/* Genel ev ölçüleri (gram). Besinin kendi u tablosu varsa o önceliklidir. */
const UNIT_G={'g':1,'gr':1,'gram':1,'ml':1,'mililitre':1,'kg':1000,'lt':1000,'litre':1000,
  'su bardagi':200,'bardak':200,'cay bardagi':100,'fincan':70,'kase':200,'kucuk kase':150,
  'yemek kasigi':15,'tatli kasigi':7,'cay kasigi':5,'kasik':15,
  'dilim':30,'adet':0,'tane':0,'avuc':20,'porsiyon':0,'kepce':100,'top':50,'paket':100,
  'demet':50,'dis':3,'yaprak':15,'salkim':100,'kibrit kutusu':30,'parca':50,'kutu':100,'sise':330};
const UNIT_KEYS=Object.keys(UNIT_G).sort((a,b)=>b.length-a.length);
/* Sık yazılan kısa adların karşılığı */
const ALIAS={'ekmek':'Tam buğday ekmeği','tam bugday':'Tam buğday ekmeği','peynir':'Beyaz peynir',
  'yumurta':'Yumurta (tam)','yogurt':'Yoğurt (yağlı)','sut':'Süt (yarım yağlı)','tavuk':'Tavuk göğsü (ızgara)',
  'et':'Dana kıyma (yağsız)','kiyma':'Dana kıyma (yağsız)','balik':'Levrek (ızgara)','ton':'Ton balığı (suda)',
  'zeytin':'Zeytin (siyah)','yag':'Zeytinyağı','zeytin yagi':'Zeytinyağı','pilav':'Pirinç (pilav)',
  'mercimek':'Yeşil mercimek (haşlanmış)','salatalik':'Salatalık','yesillik':'Marul','salata':'Marul',
  'meyve':'Elma','ceviz':'Ceviz içi','yulaf':'Yulaf ezmesi','muzlu':'Muz','cay':null,'kahve':null,
  'su':null,'bitki cayi':null,'yesil cay':null,'tarcin':null,'limon':null,'baharat':null,'tuz':null,'karabiber':null};

/* Ölçü anahtarlarını arama biçimine çevir: 'yemek kaşığı' → 'yemek kasigi' */
/* Eski sürümden gelen besin kayıtlarını yeni profile taşır:
   kütüphanedeki karşılığı varsa değerleri tamamlar, yoksa eksik alanları sıfırlar. */
function migrateFoods(){
  if(!DB.foods) return;
  let changed=false;
  DB.foods.forEach(f=>{
    if(f.g!==undefined&&f.u!==undefined) { normUnits(f); return; }
    const ref=SEED_FOODS.find(x=>x.n===f.n);
    if(ref){ NUTRIENTS.forEach(x=>{ if(!f[x.k]) f[x.k]=ref[x.k]||0; });
      if(!f.gi) f.gi=ref.gi||0; f.g=ref.g||100; f.u=Object.assign({},ref.u); }
    else { NUTRIENTS.forEach(x=>{ if(f[x.k]===undefined) f[x.k]=0; });
      if(f.gi===undefined) f.gi=0; if(f.g===undefined) f.g=100; f.u=f.u||{}; normUnits(f); }
    changed=true;
  });
  /* Kütüphanede olmayan yeni besinleri ekle */
  SEED_FOODS.forEach(ref=>{
    if(!DB.foods.some(f=>f.n===ref.n)){ DB.foods.push(Object.assign({},ref,{id:uid('f')})); changed=true; }
  });
  if(changed) dropFoodIndex();
}

function normUnits(f){
  if(!f||!f.u) return f;
  const o={}; Object.keys(f.u).forEach(k=>o[FOLD(k)]=f.u[k]); f.u=o; return f;
}
SEED_FOODS.forEach(normUnits);

let FOOD_IDX=null;
function foodIndex(){
  if(FOOD_IDX) return FOOD_IDX;
  FOOD_IDX=DB.foods.map(f=>({f,fold:FOLD(f.n),toks:FOLD(f.n).split(' ').filter(x=>x.length>2)}));
  return FOOD_IDX;
}
const dropFoodIndex=()=>{FOOD_IDX=null;};

/* Çay, baharat gibi enerji taşımayan satırlar sessizce atlanır */
function isIgnored(q){
  const s=FOLD(q); if(!s) return false;
  if((DB.foodMap||{})[s]==='__yok__') return true;
  return Object.prototype.hasOwnProperty.call(ALIAS,s)&&ALIAS[s]===null;
}
function findFood(q){
  const s=FOLD(q); if(!s) return null;
  const man=(DB.foodMap||{})[s];
  if(man==='__yok__') return null;
  if(man){ const hit=DB.foods.find(f=>f.id===man); if(hit) return hit; }
  if(Object.prototype.hasOwnProperty.call(ALIAS,s)){
    const t=ALIAS[s]; if(t===null) return null;
    const hit=DB.foods.find(f=>f.n===t); if(hit) return hit;
  }
  const idx=foodIndex();
  let best=null,score=0;
  idx.forEach(it=>{
    let sc=0;
    if(it.fold===s) sc=100;
    else if(it.fold.startsWith(s+' ')||it.fold.startsWith(s+'(')) sc=80;
    else if(it.fold.includes(s)) sc=60+Math.min(15,s.length);
    else{
      const qt=s.split(' ').filter(x=>x.length>2);
      const hit=qt.filter(t=>it.toks.some(w=>w.startsWith(t)||t.startsWith(w)));
      if(hit.length) sc=25*hit.length/Math.max(qt.length,1)+10*hit.length;
    }
    if(sc>score){score=sc;best=it.f;}
  });
  return score>=25? best : null;
}

/* "2 yemek kaşığı yulaf" → {qty, unit, name, g, food} */
function parseLine(raw){
  const out={raw:String(raw||''),qty:1,unit:'',name:'',g:0,food:null,mult:1};
  let s=LINEFOLD(raw);
  if(!s) return out;
  s=s.replace(/^[-•*\d]+[.)]\s*/,'');
  let m=s.match(/^(\d+)\s*[\/]\s*(\d+)\s+/);
  if(m){ out.qty=(+m[1])/(+m[2]||1); s=s.slice(m[0].length); }
  else{
    m=s.match(/^(\d+([.,]\d+)?)\s*/);
    if(m){ out.qty=parseFloat(m[1].replace(',','.')); s=s.slice(m[0].length); }
    else{
      const w=s.split(' ')[0];
      if(NUM_WORD[w]!==undefined){ out.qty=NUM_WORD[w]; s=s.slice(w.length).trim(); }
    }
  }
  Object.keys(SIZE_ADJ).forEach(a=>{
    const re=new RegExp('(^|\\s)'+a+'(\\s|$)');
    if(re.test(s)){ out.mult*=SIZE_ADJ[a]; s=s.replace(re,' ').trim(); }
  });
  for(const u of UNIT_KEYS){
    const re=new RegExp('(^|\\s)'+u.replace(/ /g,'\\s+')+'(\\s|$)');
    if(re.test(s)){ out.unit=u; s=s.replace(re,' ').replace(/\s+/g,' ').trim(); break; }
  }
  out.name=FOLD(s.replace(/\b(ve|ile|az|biraz|kadar|tane)\b/g,' '));
  out.ignored=isIgnored(out.name);
  const f=findFood(out.name);
  if(!f) return out;
  out.food=f;
  let per;
  const fu=f.u||{};
  if(out.unit==='g'||out.unit==='gr'||out.unit==='gram'||out.unit==='ml'||out.unit==='mililitre') per=1;
  else if(out.unit==='kg'||out.unit==='lt'||out.unit==='litre') per=1000;
  else if(out.unit && fu[out.unit]!==undefined) per=fu[out.unit];
  else if(out.unit==='adet'||out.unit==='tane'||out.unit==='porsiyon') per=+f.g||100;
  else if(out.unit && UNIT_G[out.unit]) per=UNIT_G[out.unit];
  else if(out.unit) per=+f.g||100;
  else per=+f.g||100;
  out.g=Math.round(out.qty*out.mult*per);
  return out;
}

const NUTRI_KEYS=NUTRIENTS.map(x=>x.k);
function emptyNutri(){ const o={}; NUTRI_KEYS.forEach(k=>o[k]=0); return o; }

function mealNutri(meal){
  const tot=emptyNutri(); const rows=[]; const miss=[];
  (meal.lines||[]).forEach(line=>{
    if(!String(line).trim()) return;
    const pr=parseLine(line);
    rows.push(pr);
    if(!pr.food){ if(!pr.ignored) miss.push(pr); return; }
    const f=pr.food, r=pr.g/100;
    NUTRI_KEYS.forEach(k=>{ tot[k]+= (+f[k]||0)*r; });
  });
  const ign=rows.filter(x=>x.ignored).length;
  return {tot,rows,miss,matched:rows.length-miss.length-ign};
}
function dayNutri(day){
  const tot=emptyNutri(); let miss=0, matched=0;
  (day.meals||[]).forEach(m=>{ const r=mealNutri(m); NUTRI_KEYS.forEach(k=>tot[k]+=r.tot[k]); miss+=r.miss.length; matched+=r.matched; });
  return {tot,miss,matched};
}
/* Öğün hedefi dağılımı — ayarlardan değiştirilebilir */
const MEAL_SHARE={'Kahvaltı':.25,'Ara Öğün':.10,'Öğle':.28,'Akşam':.27};
function dailyTarget(c){
  if(!c) return null;
  const v=+c.kcalTarget || tdee(c);
  return v? Math.round(v) : null;
}
const nv=(val,dec)=>(+val||0).toFixed(dec||0).replace('.',',');
function macroPct(t){
  const kc=(t.p*4)+(t.k*4)+(t.y*9);
  if(kc<1) return null;
  return {p:Math.round(t.p*4/kc*100),k:Math.round(t.k*4/kc*100),y:Math.round(t.y*9/kc*100)};
}

/* Öğün kartının altındaki özet şerit */
function mealAnalysis(meal,mi,client){
  const r=mealNutri(meal);
  if(!r.rows.length) return '';
  const t=r.tot, pct=macroPct(t);
  const tgtDay=dailyTarget(client);
  const share=MEAL_SHARE[meal.name]!==undefined?MEAL_SHARE[meal.name]:.15;
  const tgt=tgtDay? Math.round(tgtDay*share) : null;
  let diffTag='';
  if(tgt&&t.kcal>0){
    const d=Math.round((t.kcal-tgt)/tgt*100);
    const cls=Math.abs(d)<=15?'tag-ok':Math.abs(d)<=30?'tag-warn':'tag-danger';
    diffTag=`<span class="tag ${cls}"><i class="dot"></i>hedef ~${tgt} kcal · ${d>0?'+':''}${d}%</span>`;
  }
  const chips=NUTRIENTS.filter(x=>x.grp==='makro'&&x.k!=='kcal'&&x.k!=='chol')
    .map(x=>`<span class="nu-chip"${x.col?` style="--c:${x.col}"`:''}><i>${x.short}</i>${nv(t[x.k],x.dec)} ${x.u}</span>`).join('');
  const mins=NUTRIENTS.filter(x=>x.grp==='mineral')
    .map(x=>`<span class="nu-chip soft"><i>${x.short}</i>${nv(t[x.k],x.dec)} ${x.u}</span>`).join('');
  if(!S.nuAll) return '';
  return `<div class="nutri no-print">
    <div class="nu-head">
      <b>${esc(meal.name)} için ~<span class="num">${nv(t.kcal)}</span> kcal, <span class="num">${nv(t.p,1)}</span> g proteinli bir öğün yazdınız.</b>
      ${diffTag}
      <div class="spacer"></div>
      ${r.miss.length?`<button class="btn btn-sm" data-fix-meal="${mi}">${r.miss.length} satır tanınmadı</button>`:`<span class="tag tag-ok"><i class="dot"></i>${r.matched} satır hesaplandı</span>`}
    </div>
    <div class="nu-chips">${chips}${pct?`<span class="nu-chip"><i>Dağılım</i>${pct.p}/${pct.k}/${pct.y}</span>`:''}</div>
    <div class="nu-chips">${mins}</div>
    ${r.miss.length?`<div class="nu-miss">Hesaba katılmayan: ${r.miss.map(x=>esc(x.raw)).join(' · ')}</div>`:''}
  </div>`;
}

/* Günün toplam analiz kartı */
function dayAnalysis(p,client){
  const day=p.days[S.day], r=dayNutri(day);
  const t=r.tot, pct=macroPct(t), tgt=dailyTarget(client);
  const diff=tgt? Math.round(t.kcal-tgt) : null;
  const cells=NUTRIENTS.map(x=>{
    const ref=RDA[x.k], val=t[x.k];
    const p100=ref? Math.round(val/ref*100) : null;
    return `<tr><td>${x.t}</td>
      <td class="t-right num"${x.col?` style="color:${x.col};font-weight:600"`:''}>${nv(val,x.dec)} ${x.u}</td>
      <td class="t-right num" style="color:var(--muted)">${p100!==null?p100+'%':'—'}</td></tr>`;
  }).join('');
  const perMeal=day.meals.map((m,i)=>{
    const mr=mealNutri(m); if(!mr.rows.length) return '';
    return `<tr><td>${m.emoji} ${esc(m.name)}</td><td class="t-right num">${nv(mr.tot.kcal)} kcal</td>
      <td class="t-right num" style="color:var(--protein)">${nv(mr.tot.p,1)} g</td>
      <td class="t-right num" style="color:var(--karb)">${nv(mr.tot.k,1)} g</td>
      <td class="t-right num" style="color:var(--yag)">${nv(mr.tot.y,1)} g</td></tr>`;
  }).join('');
  const missTot=day.meals.reduce((a,m)=>a+mealNutri(m).miss.length,0);
  return `<div class="kcal-bar no-print">
    <span class="kb-lbl">${S.day+1}. günün toplamı</span>
    <b class="num kb-val">${nv(t.kcal)}</b><span class="kb-u">kcal</span>
    ${tgt?`<span class="tag ${Math.abs(diff)<=tgt*.1?'tag-ok':'tag-warn'}"><i class="dot"></i>hedef ${tgt} · ${diff>0?'+':''}${diff}</span>`:''}
    <div class="spacer"></div>
    ${missTot?`<span class="tag tag-warn"><i class="dot"></i>${missTot} satır tanınmadı</span>`:''}
    <button class="btn btn-sm" data-act="nu-detail">Ayrıntılı analiz</button>
  </div>`;

function planText(p){
  const c=clientOf(p.clientId), pr=DB.profile;
  const L=[];
  L.push(p.name.toLocaleUpperCase('tr'));
  if(p.sub) L.push(p.sub);
  if(c) L.push('Danışan: '+c.name);
  L.push('Başlangıç: '+trDate(p.start));
  L.push('');
  if((p.purpose||[]).length){ p.purpose.forEach(x=>L.push(x)); if(p.closing) L.push(p.closing); L.push(''); }
  p.days.forEach((d,i)=>{
    L.push('── '+(i+1)+'. GÜN · '+dFull(p,i).toLocaleUpperCase('tr')+' ──');
    if(d.sub) L.push(d.sub);
    d.meals.forEach(m=>{
      if(!m.lines.length&&!m.title) return;
      L.push('');
      L.push(m.emoji+' '+m.name.toLocaleUpperCase('tr')+(m.title?' — '+m.title:''));
      m.lines.forEach(x=>{ if(String(x).trim()) L.push('• '+x); });
      if(m.tip) L.push('  '+m.tip);
    });
    L.push('');
  });
  L.push(p.footer||('Bu beslenme planı '+pr.name+' tarafından kişiye özel olarak hazırlanmıştır.'));
  if(pr.note) L.push(pr.note);
  if(pr.phone) L.push('İletişim: '+pr.phone);
  return L.join('\n');
}

  const p=DB.plans.find(x=>x.id===S.plan); if(!p) return;

/* ══════════════ Besin kütüphanesi içe aktarma (CSV) ══════════════ */
function parseCSV(text){
  const rows=[]; let row=[], cell='', q=false;
  const t=String(text).replace(/\r\n/g,'\n').replace(/\r/g,'\n');
  for(let i=0;i<t.length;i++){
    const c=t[i];
    if(q){ if(c==='"'){ if(t[i+1]==='"'){cell+='"';i++;} else q=false; } else cell+=c; }
    else if(c==='"') q=true;
    else if(c===','||c===';'||c==='\t'){ row.push(cell); cell=''; }
    else if(c==='\n'){ row.push(cell); rows.push(row); row=[]; cell=''; }
    else cell+=c;
  }
  if(cell||row.length){ row.push(cell); rows.push(row); }
  return rows.filter(r=>r.some(x=>String(x).trim()));
}

/* Satırdaki miktarı çarpanla yeniden yazar: "2 yemek kaşığı yulaf" → "3 yemek kaşığı yulaf" */
function niceQty(v){
  if(v<=0) return '';
  if(v<1){ const halves=Math.round(v*4)/4; return halves===0.5?'yarım':halves===0.25?'çeyrek':String(halves).replace('.',','); }
  const r=Math.round(v*2)/2;
  return (r%1===0? String(r) : String(r).replace('.',','));
}
function rescaleLine(raw,factor){
  const pr=parseLine(raw);
  if(!pr.food||!pr.g) return raw;
  const s=String(raw);
  const m=s.match(/^\s*(\d+\s*\/\s*\d+|\d+[.,]?\d*)/);
  const nq=niceQty(pr.qty*factor);
  if(!nq) return raw;
  if(m) return s.replace(m[1],nq);
  const w=s.trim().split(/\s+/)[0];
  if(NUM_WORD[FOLD(w)]!==undefined) return s.replace(w,nq);
  return nq+' '+s.trim();
}

/* ══════════════ Alışveriş listesi ══════════════ */
const SHOP_UNIT=g=>g>=1000? (g/1000).toFixed(1).replace('.',',')+' kg' : Math.round(g)+' g';
/* ══ Ev ölçüsü — "600 g" yerine "12 adet", "7 kase" ══ */
/* Anahtarlar aksansız tutulur (kayıtlarda böyle saklanıyor), etiket okunaklı yazılır */
const HOUSE_LBL={'adet':'adet','tane':'adet','dilim':'dilim','ince dilim':'ince dilim',
  'kase':'kase','kucuk kase':'küçük kase','su bardagi':'su bardağı','cay bardagi':'çay bardağı',
  'fincan':'fincan','kepce':'kepçe','yemek kasigi':'yemek kaşığı','tatli kasigi':'tatlı kaşığı',
  'cay kasigi':'çay kaşığı','avuc':'avuç','demet':'demet','yaprak':'yaprak','salkim':'salkım',
  'dis':'diş','kibrit kutusu':'kibrit kutusu','top':'top','paket':'paket','kutu':'kutu',
  'parca':'parça','sise':'şişe','bardak':'bardak','kasik':'kaşık','porsiyon':'porsiyon'};
const HOUSE_RANK=Object.keys(HOUSE_LBL).reduce((a,k,i)=>(a[k]=i,a),{});
function niceCount(n){
  if(n>=10) return Math.round(n);
  if(n>=3)  return Math.round(n*2)/2;
  return Math.round(n*4)/4;
}
function fmtCount(n){
  const r=Math.round(n*100)/100;
  return (Math.abs(r-Math.round(r))<0.01? String(Math.round(r)) : String(r)).replace('.',',');
}
function houseUnit(f,g){
  const fu=(f&&f.u)||{};
  let best=null;
  Object.keys(fu).forEach(raw=>{
    const k=FOLD(raw);
    if(HOUSE_RANK[k]===undefined) return;
    const per=+fu[raw];
    if(!per||per<=0) return;
    const n=g/per;
    if(n<0.25||n>30) return;                 // "40 avuç badem" demek anlamsız
    let sc=(n>=1&&n<=12)? 0 : (n<1? (1-n)*4 : (n-12)*0.35);
    sc+=HOUSE_RANK[k]*0.05;                  // eşitlikte tercih sırası
    if(!best||sc<best.sc) best={k,n,sc};
  });
  return best? fmtCount(niceCount(best.n))+' '+HOUSE_LBL[best.k] : null;
}
/* Danışana giden ölçü: varsa ev ölçüsü, yoksa kg/g */
const SHOP_HOUSE=(f,g)=>houseUnit(f,g)||SHOP_UNIT(g);
function buildShopping(p){
  const acc={}, miss=[];
  p.days.forEach((d,di)=>d.meals.forEach(m=>(m.lines||[]).forEach(line=>{
    if(!String(line).trim()) return;
    const pr=parseLine(line);
    if(!pr.food){ if(!pr.ignored) miss.push(String(line).trim()); return; }
    const key=pr.food.id;
    if(!acc[key]) acc[key]={f:pr.food,g:0,days:new Set()};
    acc[key].g+=pr.g; acc[key].days.add(di);
  })));
  const groups={};
  Object.values(acc).forEach(it=>{ (groups[it.f.cat]=groups[it.f.cat]||[]).push(it); });
  Object.values(groups).forEach(list=>list.sort((a,b)=>a.f.n.localeCompare(b.f.n,'tr')));
  return {groups,miss:[...new Set(miss)]};
}
function shoppingText(p){
  const {groups,miss}=buildShopping(p);
  const c=clientOf(p.clientId);
  const L=['HAFTALIK ALIŞVERİŞ LİSTESİ'];
  if(c) L.push(c.name);
  L.push(esc?trDate(p.start):p.start); L.push('');
  Object.keys(groups).sort((a,b)=>a.localeCompare(b,'tr')).forEach(cat=>{
    L.push('── '+cat.toLocaleUpperCase('tr')+' ──');
    groups[cat].forEach(it=>L.push('• '+it.f.n+' — '+SHOP_HOUSE(it.f,it.g)));
    L.push('');
  });
  if(miss.length){ L.push('── AYRICA ──'); miss.forEach(x=>L.push('• '+x)); }
  return L.join('\n');
}

/* ══════════════ Laboratuvar takibi ══════════════ */
/* ref: [alt, üst] yetişkin referans aralığı — laboratuvara göre değişir */
const LABS=[
  {k:'glu', t:'Açlık glukozu',      u:'mg/dL', ref:[70,99]},
  {k:'ins', t:'Açlık insülini',     u:'µIU/mL',ref:[2.6,24.9]},
  {k:'hba1c',t:'HbA1c',             u:'%',     ref:[4,5.6]},
  {k:'tkol',t:'Total kolesterol',   u:'mg/dL', ref:[0,200]},
  {k:'ldl', t:'LDL kolesterol',     u:'mg/dL', ref:[0,130]},
  {k:'hdl', t:'HDL kolesterol',     u:'mg/dL', ref:[40,100]},
  {k:'tg',  t:'Trigliserit',        u:'mg/dL', ref:[0,150]},
  {k:'tsh', t:'TSH',                u:'mIU/L', ref:[0.4,4.0]},
  {k:'ft4', t:'Serbest T4',         u:'ng/dL', ref:[0.8,1.8]},
  {k:'d',   t:'25-OH D vitamini',   u:'ng/mL', ref:[30,100]},
  {k:'b12l',t:'B12 vitamini',       u:'pg/mL', ref:[200,900]},
  {k:'fer', t:'Ferritin',           u:'ng/mL', ref:[15,150]},
  {k:'hgb', t:'Hemoglobin',         u:'g/dL',  ref:[12,16]},
  {k:'kre', t:'Kreatinin',          u:'mg/dL', ref:[0.5,1.1]},
  {k:'alt', t:'ALT',                u:'U/L',   ref:[0,35]},
  {k:'ua',  t:'Ürik asit',          u:'mg/dL', ref:[2.4,6.0]}
];
const homaIR=r=>(r.glu&&r.ins)? (+r.glu*+r.ins)/405 : null;
function labFlag(k,v){
  if(v==='' || v===undefined || v===null) return '';
  const L=LABS.find(x=>x.k===k); if(!L) return '';
  const n=+v;
  if(n<L.ref[0]) return 'low';
  if(n>L.ref[1]) return 'high';
  return 'ok';
}
function labForm(){
  return `<div class="form-grid">
    <div class="field"><label>Tetkik tarihi</label><input id="lb-date" type="date" value="${todayISO()}"></div>
    <div class="field"><label>Laboratuvar / not</label><input id="lb-note" placeholder="isteğe bağlı"></div>
  </div>
  <p style="margin:14px 0 10px;color:var(--muted);font-size:12.5px">Yalnızca elinizdeki değerleri girin; boş bıraktıklarınız kaydedilmez.</p>
  <div class="form-grid">
    ${LABS.map(L=>`<div class="field"><label>${L.t} <small style="color:var(--muted)">${L.u}</small></label>
      <input id="lb-${L.k}" type="number" step="0.01" placeholder="${L.ref[0]}–${L.ref[1]}"></div>`).join('')}
  </div>`;
}
function pageClientLab(c){
  const ls=[...(c.labs||[])].sort((a,b)=>new Date(b.date)-new Date(a.date));
  if(!ls.length) return `<section class="card"><div class="card-h"><h3>Laboratuvar</h3><div class="spacer"></div>
    <button class="btn btn-sm btn-primary" data-modal="lab">${ic('plus',15)} Sonuç ekle</button></div>
    <div class="empty"><div class="eic">${ic('plus',24)}</div><h4>Tetkik kaydı yok</h4>
    <p>Kan değerlerini girdiğinizde referans aralığına göre işaretlenir, HOMA-IR otomatik hesaplanır ve zaman içindeki seyri görünür.</p>
    <button class="btn btn-primary" data-modal="lab">${ic('plus',15)} İlk sonucu ekle</button></div></section>`;
  const last=ls[0], prev=ls[1];
  const shown=LABS.filter(L=>ls.some(r=>r[L.k]!==undefined&&r[L.k]!==''));
  const hi=homaIR(last);
  const arrow=(k)=>{
    if(!prev||prev[k]===undefined||last[k]===undefined) return '';
    const d=+last[k]-+prev[k]; if(Math.abs(d)<0.001) return '';
    return `<span class="lab-d ${d>0?'up':'down'}">${d>0?'▲':'▼'} ${nv(Math.abs(d),2)}</span>`;
  };
  return `
  <div class="stats" style="grid-template-columns:repeat(3,1fr);margin-bottom:16px">
    <div class="stat"><div class="badge">${ic('chart')}</div><div class="lbl">Son tetkik</div>
      <div class="val" style="font-size:19px;font-family:var(--sans)">${trDate(last.date)}</div>
      <div class="sub">${ls.length} kayıt</div></div>
    ${hi!==null?`<div class="stat" style="${hi>=2.5?'border-left:3px solid var(--warn)':''}">
      <div class="badge">${ic('chart')}</div><div class="lbl">HOMA-IR</div>
      <div class="val">${nv(hi,2)}</div>
      <div class="sub">${hi>=2.5?'İnsülin direnci sınırının üstünde':'Sınır değerin altında'}</div></div>`:''}
    <div class="stat"><div class="badge">${ic('plans')}</div><div class="lbl">Aralık dışı</div>
      <div class="val">${shown.filter(L=>['low','high'].includes(labFlag(L.k,last[L.k]))).length}</div>
      <div class="sub">son tetkikte</div></div>
  </div>
  <section class="card"><div class="card-h"><h3>Laboratuvar sonuçları</h3><div class="spacer"></div>
    <button class="btn btn-sm btn-primary" data-modal="lab">${ic('plus',15)} Sonuç ekle</button></div>
    <div class="tw"><table><thead><tr><th>Tetkik</th><th class="t-right">Referans</th>
      ${ls.slice(0,6).map(r=>`<th class="t-right">${trDate(r.date)}</th>`).join('')}</tr></thead>
      <tbody>${shown.map(L=>`<tr>
        <td class="t-name">${L.t} <small style="color:var(--muted);font-weight:400">${L.u}</small></td>
        <td class="t-right num" style="color:var(--muted)">${L.ref[0]}–${L.ref[1]}</td>
        ${ls.slice(0,6).map((r,i)=>{const f=labFlag(L.k,r[L.k]);
          return `<td class="t-right num lab-${f}">${r[L.k]!==undefined&&r[L.k]!==''?nv(r[L.k],2):'—'}${i===0?arrow(L.k):''}</td>`;}).join('')}
      </tr>`).join('')}
      ${hi!==null?`<tr><td class="t-name">HOMA-IR <small style="color:var(--muted);font-weight:400">hesaplanan</small></td>
        <td class="t-right num" style="color:var(--muted)">&lt; 2,5</td>
        ${ls.slice(0,6).map(r=>{const h=homaIR(r);
          return `<td class="t-right num ${h!==null&&h>=2.5?'lab-high':h!==null?'lab-ok':''}">${h!==null?nv(h,2):'—'}</td>`;}).join('')}</tr>`:''}
      </tbody></table></div>
    <div class="card-b" style="border-top:1px solid var(--line-2)">
      <p style="margin:0;font-size:12px;color:var(--muted)">
        Referans aralıkları genel yetişkin değerleridir ve laboratuvara göre değişir; yorumu daima raporun kendi aralığına ve hekim değerlendirmesine göre yapın.</p>
    </div>
  </section>
  ${ls.length>1? `<section class="card" style="margin-top:16px"><div class="card-h"><h3>Seyir</h3></div>
    <div class="card-b">${labChart(ls)}</div></section>`:''}`;
}
function labChart(ls){
  const pick=LABS.filter(L=>ls.filter(r=>r[L.k]!==undefined&&r[L.k]!=='').length>1).slice(0,4);
  if(!pick.length) return '<p style="color:var(--muted);margin:0">Seyir için aynı tetkikten en az iki kayıt gerekir.</p>';
  return pick.map(L=>{
    const pts=ls.filter(r=>r[L.k]!==undefined&&r[L.k]!=='').map(r=>({date:r.date,weight:+r[L.k]})).reverse();
    return `<div style="margin-bottom:18px"><b style="font-size:13px;font-family:var(--sans)">${L.t} (${L.u})</b>
      ${lineChart(pts,{unit:L.u})}</div>`;
  }).join('');
}

const icsDT=d=>new Date(d).toISOString().replace(/[-:]/g,'').split('.')[0]+'Z';
const icsEsc=t=>String(t||'').replace(/\\/g,'\\\\').replace(/;/g,'\\;').replace(/,/g,'\\,').replace(/\n/g,'\\n');
function icsFor(appts,name){
  const L=['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//Dyt Panel//TR','CALSCALE:GREGORIAN','METHOD:PUBLISH'];
  appts.forEach(a=>{
    const c=clientOf(a.clientId);
    const st=new Date(a.when), en=new Date(st.getTime()+45*60000);
    L.push('BEGIN:VEVENT','UID:'+a.id+'@dytpanel','DTSTAMP:'+icsDT(new Date()),
      'DTSTART:'+icsDT(st),'DTEND:'+icsDT(en),
      'SUMMARY:'+icsEsc((c?c.name:'Danışan')+' — '+(a.type||'Görüşme')),
      'DESCRIPTION:'+icsEsc(a.note||''),
      'BEGIN:VALARM','TRIGGER:-PT60M','ACTION:DISPLAY','DESCRIPTION:'+icsEsc('Randevu hatırlatması'),'END:VALARM',
      'END:VEVENT');
  });
  L.push('END:VCALENDAR');
  const b=new Blob([L.join('\r\n')],{type:'text/calendar;charset=utf-8'});
  const el=document.createElement('a'); el.href=URL.createObjectURL(b);
  el.download=(name||'randevular').replace(/[\\/:*?"<>|]/g,'')+'.ics';
  el.click(); setTimeout(()=>URL.revokeObjectURL(el.href),4000);
}

function planTotals(plan,dayIdx){
  const day=plan.days[dayIdx]||{meals:[]};
  return day.meals.flatMap(m=>m.items).reduce((a,i)=>[a[0]+ +i.kcal,a[1]+ +i.p,a[2]+ +i.k,a[3]+ +i.y],[0,0,0,0]);
}
const clientOf=id=>DB.clients.find(c=>c.id===id);
const plansOf=id=>DB.plans.filter(p=>p.clientId===id);

function buildAlerts(){
  const out=[], now=new Date(), day=864e5;
  const actives=DB.clients.filter(c=>!c.archived);
  actives.forEach(c=>{
    const ps=plansOf(c.id).filter(x=>x.status==='Aktif');
    ps.forEach(p=>{
      const end=new Date(p.start); end.setDate(end.getDate()+7);
      const over=Math.floor((now-end)/day);
      if(over>=0) out.push({sev:over>=3?'danger':'warn',t:`${c.name} · programı ${over===0?'bugün bitti':over+' gün önce bitti'}`,
        s:esc(p.name),btn:'Yenile',act:`data-plan="${p.id}"`});
    });
    if(!ps.length) out.push({sev:'warn',t:`${c.name} · aktif programı yok`,s:'Yeni program hazırlanabilir',btn:'Program aç',act:`data-newplan="${c.id}"`});
    const mny=clientMoney(c.id);
    if(mny.price && mny.due>0 && mny.done>0)
      out.push({sev:mny.done>=mny.total&&mny.total?'danger':'warn',t:`${c.name} · ${mny.due.toLocaleString('tr-TR')} ₺ tahsil edilmedi`,
        s:`${mny.done}${mny.total?'/'+mny.total:''} seans yapıldı`,btn:'Seanslar',act:`data-client="${c.id}" data-tab-go="odeme"`});
    const ms=(c.measures||[]).slice().sort((a,b)=>new Date(b.date)-new Date(a.date));
    if(ms.length){
      const gap=Math.floor((now-new Date(ms[0].date))/day);
      if(gap>=14) out.push({sev:gap>=30?'danger':'warn',t:`${c.name} · ${gap} gündür ölçüm girilmedi`,s:'Son ölçüm '+trDate(ms[0].date),btn:'Dosyayı aç',act:`data-client="${c.id}"`});
    }
  });
  DB.appts.filter(a=>{const d=new Date(a.when); return d>=now && d-now<=2*day;})
    .sort((a,b)=>new Date(a.when)-new Date(b.when))
    .forEach(a=>{const c=clientOf(a.clientId);
      out.push({sev:'info',t:`${c?c.name:'—'} · ${trDT(a.when)}`,s:esc(a.type||'Görüşme'),btn:'Dosyayı aç',act:`data-client="${a.clientId}"`});});
  DB.plans.filter(p=>p.status==='Taslak').forEach(p=>{const c=clientOf(p.clientId);
    out.push({sev:'info',t:`${esc(p.name)} · taslak`,s:c?c.name:'Danışan atanmadı',btn:'Aç',act:`data-plan="${p.id}"`});});
  const rank={danger:0,warn:1,info:2};
  return out.sort((a,b)=>rank[a.sev]-rank[b.sev]).slice(0,8);
}

function greetKey(h){
  if(h>=5&&h<11) return 'sabah';
  if(h>=11&&h<14) return 'ogle';
  if(h>=14&&h<18) return 'ikindi';
  if(h>=18&&h<22) return 'aksam';
  return 'gece';
}
const rnd=a=>a[Math.floor(Math.random()*a.length)];
function greetBlock(){
  const now=new Date(), g=GREET[greetKey(now.getHours())];
  const gun=now.toLocaleDateString('tr-TR',{weekday:'long',day:'numeric',month:'long'});
  return {when:g.lbl+' · '+gun, msg:rnd(g.msg), sub:rnd(g.sub)};
}

function spark(vals,color){
  const v=vals.filter(x=>x!=null&&x!=='').map(Number);
  if(v.length<2) return '';
  const w=120,h=30,mn=Math.min(...v),mx=Math.max(...v),rg=(mx-mn)||1;
  const d=v.map((y,i)=>(i?'L':'M')+(i/(v.length-1)*w).toFixed(1)+','+(h-2-((y-mn)/rg)*(h-6)).toFixed(1)).join(' ');
  return `<svg viewBox="0 0 ${w} ${h}" style="width:100%;height:30px;margin-top:6px" aria-hidden="true">
    <path d="${d}" fill="none" stroke="${color}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" opacity=".85"/></svg>`;
}
function miniMetric(lbl,unit,ms,key,color,lowerBetter){
  const pts=ms.filter(m=>m[key]!=null&&m[key]!=='').map(m=>+m[key]);
  if(!pts.length) return `<div class="mini"><b>${lbl}</b><div class="mv">—</div><div class="md zero">Kayıt yok</div></div>`;
  const last=pts[pts.length-1], first=pts[0], d=last-first;
  const cls=pts.length<2||Math.abs(d)<0.05?'zero':((lowerBetter? d<0 : d>0)?'pos':'neg');
  return `<div class="mini"><b>${lbl}</b><div class="mv">${n1(last)} ${unit}</div>
    <div class="md ${cls}">${pts.length<2?'İlk kayıt':(d>0?'+':'')+n1(d)+' '+unit+' (başlangıca göre)'}</div>
    ${spark(pts,color)}</div>`;
}
function nextApptOf(cid){
  return DB.appts.filter(a=>a.clientId===cid&&new Date(a.when)>=new Date(Date.now()-36e5))
    .sort((a,b)=>new Date(a.when)-new Date(b.when))[0]||null;
}
function pageClientControl(c){

  const nowW=last? +last.weight : (+c.weight||0);
  const diff=(startW&&nowW)? nowW-startW : null;
  const b=bmi(nowW,c.height), lbl=bmiLabel(b);

  const lose=(c.goal||'').includes('verme');

  // hedefe ilerleme
  let prog=null;

function pageClient(){

    const pays=as.filter(a=>payOf(a));

      </tbody></table></div>`:`<div class="empty"><div class="eic">${ic('appts',24)}</div><h4>Seans kaydı yok</h4><p>Randevu ekleyip seansı kapattığında burada listelenir.</p></div>`}

        ${n.edited?`<div class="hint" style="margin-top:6px">${new Date(n.edited).toLocaleString('tr-TR')} tarihinde düzenlendi</div>`:''}</div>`).join('')
      :`<div class="empty"><div class="eic">${ic('plus',24)}</div><h4>Not yok</h4><p>Her görüşmenin kararlarını yazın; sonraki seansta dosyayı açtığınızda kaldığınız yerden devam edin.</p><button class="btn btn-primary" data-modal="note">${ic('plus',15)} Not ekle</button></div>`}

function pagePlans(){
  const ps=DB.plans, flt=S.season||'';
  const keyOf=x=>seasonOf(x.season)?x.season:'none';
  const inF=x=>!flt||keyOf(x)===flt;
  const cnt=k=>ps.filter(x=>keyOf(x)===k).length;
  const shown=ps.filter(inF);
  const allT=tplAll(), tpls=allT.filter(inF);
  const sw=t=>{ const th=DOC_THEMES[t.theme]; return th? th.strip.slice(0,7).map(c=>`<i style="background:#${c}"></i>`).join('') : '<i style="background:#E4EAF0"></i>'; };
  return `<div class="page-head"><div><h1>Beslenme programları</h1><p>Danışana özel hazırlanan 7 günlük programlar. Yazdırıp PDF olarak paylaşabilirsiniz.</p></div>
  <div class="spacer"></div>${DB.clients.length?`<button class="btn btn-primary" data-newplan="">${ic('plus',15)} Yeni program</button>`:''}</div>
  ${(ps.length||allT.length)?`<div class="chip-row">
    <button class="chip" data-season-f="" aria-pressed="${!flt}">Tümü (${ps.length})</button>
    ${SEASONS.map(x=>`<button class="chip" data-season-f="${x.k}" aria-pressed="${flt===x.k}">${x.em} ${x.ad} (${cnt(x.k)})</button>`).join('')}
    <button class="chip" data-season-f="none" aria-pressed="${flt==='none'}">Mevsimsiz (${cnt('none')})</button></div>`:''}
  ${tpls.length?`<section class="card" style="margin-bottom:16px"><div class="card-h"><h3>Şablonlarım</h3>
    <div class="spacer"></div><span class="tag">${tpls.length}</span></div>
    ${tpls.map(t=>{ const th=DOC_THEMES[t.theme]; return `<div class="tpl-row">
      <span class="tpl-sw" title="${th?esc(th.ad)+' teması':'Renk seçilmemiş'}">${sw(t)}</span>
      <div class="tpl-main"><div class="t-name">${esc(t.name)}</div>
        <div class="t-sub">${th?esc(th.ad)+' teması':'<span style="color:var(--danger)">Renk seçilmemiş — Düzenle’den seç</span>'} · ${tplDays(t)} dolu gün</div>
        ${t.privNote?`<div class="t-sub priv-snip" title="${esc(t.privNote)}">🔒 ${esc(oneLine(t.privNote,110))}</div>`:''}</div>
      <select class="season-sel" data-tpl-season="${t.id}" title="Mevsim">${seasonOpts(t.season||'')}</select>

const STOPW=new Set(['ile','ve','bir','veya','yada','ya','tam','light','adet','gram','tane','porsiyon','yemek','kasigi','kasik','bardak','dilim','kase','tabak','icin','sade','buyuk','kucuk','orta']);
function trNorm(x){
  return String(x||'').toLocaleLowerCase('tr')
    .replace(/ı/g,'i').replace(/ş/g,'s').replace(/ğ/g,'g').replace(/ü/g,'u').replace(/ö/g,'o').replace(/ç/g,'c')
    .replace(/[^a-z0-9 ]/g,' ').replace(/\s+/g,' ').trim();
}
function tokens(x){ return trNorm(x).split(' ').filter(w=>w.length>2&&!STOPW.has(w)); }
/* Öğün adına ve içeriğine en çok benzeyen galeri fotoğraflarını bulur */
function photoSuggest(m,limit){
  const g=DB.gallery||[]; if(!g.length) return [];
  const want=tokens(m.title);
  const lines=tokens((m.lines||[]).slice(0,4).join(' '));
  if(!want.length&&!lines.length) return [];
  const seen=new Set();
  const out=[];
  g.forEach(x=>{
    if(!isPhoto(x.d)||seen.has(x.k)) return;
    const lab=tokens(x.label);
    if(!lab.length) return;
    let sc=0;
    want.forEach(w=>{ if(lab.includes(w)) sc+=10; else if(lab.some(l=>l.startsWith(w)||w.startsWith(l))) sc+=6; });
    const wn=trNorm(m.title), ln=trNorm(x.label);
    if(wn&&ln&&(wn===ln)) sc+=40; else if(wn&&ln&&(ln.includes(wn)||wn.includes(ln))) sc+=14;
    lines.forEach(w=>{ if(lab.includes(w)) sc+=3; });
    if(sc>0){ seen.add(x.k); out.push({x,sc}); }
  });
  out.sort((a,b)=>b.sc-a.sc||(b.x.at||0)-(a.x.at||0));
  return out.slice(0,limit||4).map(o=>o.x);
}
function sugHTML(mi,m){
  const list=photoSuggest(m,4);
  if(!list.length) return '';
  return `<div class="sug-h">✨ Bu öğüne uyan fotoğraflar</div>
    <div class="sug-row">${list.map(x=>`<button class="sug-i" data-sug-use="${mi}:${x.id}" title="${esc(x.label||'')}">
      <img src="${x.d}" alt=""><span>${esc((x.label||'').slice(0,22))}</span></button>`).join('')}</div>`;
}
function paintSug(mi){
  const box=document.getElementById('sug-'+mi); if(!box) return;
  const p=DB.plans.find(x=>x.id===S.plan); if(!p) return;
  const m=p.days[S.day].meals[mi]; if(!m) return;
  box.innerHTML = m.photo? '' : sugHTML(mi,m);
}

}

function pageAppts(){

  const row=a=>{const c=clientOf(a.clientId);return `<tr><td class="num">${trDT(a.when)}</td><td class="t-name">${esc(c?c.name:'—')}</td>

function modal(title,bodyHTML,okLabel,okAct,size){
  document.getElementById('modalRoot').innerHTML=`<div class="modal-bg"><div class="modal" style="${size?'width:min('+size+',100%)':''}" role="dialog" aria-modal="true">
    <div class="modal-h"><h3>${title}</h3><div class="spacer"></div><button class="x" data-close="1">✕</button></div>
    <div class="modal-b">${bodyHTML}</div>
    <div class="modal-f"><button class="btn" data-close="1">Vazgeç</button><button class="btn btn-primary" data-ok="${okAct}">${okLabel}</button></div>
  </div></div>`;
  const f=document.querySelector('.modal-b input,.modal-b select,.modal-b textarea'); if(f) f.focus();
}
const closeModal=()=>document.getElementById('modalRoot').innerHTML='';
const val=id=>{const e=document.getElementById(id);return e?e.value.trim():'';};
function toast(t,ms){ const r=document.getElementById('toastRoot'); r.innerHTML=`<div class="toast">${esc(t)}</div>`; clearTimeout(window.__toastT); window.__toastT=setTimeout(()=>r.innerHTML='',ms||2200); }

function openFavs(mi){
  S.favTarget=mi;

  const card=f=>`<div class="fav-item">
      <button class="fav-use" data-fav-use="${f.id}">
        ${f.photo?`<img src="${f.photo}" alt="">`:'<span class="fav-noimg">🍽</span>'}

      </button>
      <button class="gal-x" data-fav-del="${f.id}" title="Favorilerden sil">✕</button></div>`;
  const body = all.length
    ? `<p style="margin:0 0 12px;color:var(--muted);font-size:13px">Bir favoriye dokun, ${esc(meal.name)} öğününe yazılsın. Mevcut içerik değişir.</p>
       ${mine.length?`<div class="fav-sec">${esc(meal.name)} için</div>${mine.map(card).join('')}`:''}

/* ══════════════ Kaydetme işlemleri ══════════════ */
async function handleOk(act){
  if(act==='close') return closeModal();
  if(act==='wa-save') return waSave(S.waEdit||'');
  if(act==='wa-tpl-save') return waTplSave(S.waTplEdit||'');
  if(act==='appt-reminder-save') return apptReminderSave();
  if(act==='wa-quick-send') return waQuickSendGo();
  const c=clientOf(S.client);
  if(act==='client'||act==='client-edit'){
    const d=readClient();
    if(!d.name) return toast('Ad soyad zorunlu');
    if(act==='client'){
      const nc={id:uid('c'),created:todayISO(),measures:[],notes:[],...d};
      if(nc.weight) nc.measures.push({id:uid('m'),date:todayISO(),weight:nc.weight,note:'İlk ölçüm'});
      DB.clients.push(nc); S.client=nc.id; S.page='client'; S.tab='form'; toast('Danışan eklendi — bilgi formunu tamamlayabilirsiniz 💗');
    } else { Object.assign(c,d); toast('Bilgiler güncellendi'); }
  }
  if(act==='measure'){
    if(!val('m-weight')) return toast('Kilo zorunlu');
    c.measures=c.measures||[];
    c.measures.push({id:uid('m'),date:val('m-date')||todayISO(),weight:val('m-weight'),waist:val('m-waist'),hip:val('m-hip'),fat:val('m-fat'),muscle:val('m-muscle'),note:val('m-note')});
    c.weight=val('m-weight'); toast('Ölçüm kaydedildi');
  }
  if(act==='appt'){
    if(!val('a-when')) return toast('Tarih zorunlu');
    DB.appts.push({id:uid('a'),clientId:val('a-client'),when:val('a-when'),type:val('a-type'),note:val('a-note'),
      status:'',first:!!(document.getElementById('a-first')&&document.getElementById('a-first').checked)});
    toast('Randevu eklendi 🌷');
  }
  if(act==='fix-meal'){
    DB.foodMap=DB.foodMap||{};
    document.querySelectorAll('[data-fx-key]').forEach(el=>{
      const key=el.getAttribute('data-fx-key'), v=el.value;
      if(key&&v) DB.foodMap[key]=v;
    });
    toast('Eşleştirme kaydedildi — bundan sonra otomatik tanınacak');
  }
  if(act==='lab'){
    const rec={id:uid('l'),date:val('lb-date')||todayISO(),note:val('lb-note')};
    let any=false;
    LABS.forEach(L=>{ const v=val('lb-'+L.k); if(v!==''&&v!==null&&v!==undefined){ rec[L.k]=+v; any=true; } });
    if(!any) return toast('En az bir değer girin');
    c.labs=c.labs||[]; c.labs.push(rec); toast('Laboratuvar sonucu kaydedildi');
  }
  if(act==='scale-run'){
    const p=DB.plans.find(x=>x.id===S.plan);
    const tgt=+val('sc-target');
    if(!tgt||tgt<400) return toast('Geçerli bir hedef kalori girin');
    const all=val('sc-scope')==='all';
    const lock=document.getElementById('sc-lock')&&document.getElementById('sc-lock').checked;
    const days=all? p.days.map((_,i)=>i) : [S.day];
    let touched=0;
    days.forEach(di=>{
      const cur=dayNutri(p.days[di]).tot.kcal;
      if(cur<50) return;
      const f=tgt/cur;
      if(Math.abs(f-1)<0.02) return;
      p.days[di].meals.forEach(m=>{
        m.lines=(m.lines||[]).map(line=>{
          const pr=parseLine(line);
          if(!pr.food) return line;
          if(lock && (pr.food.cat==='İçecekler' || (pr.qty===1 && !pr.unit))) return line;
          const nl=rescaleLine(line,f);
          if(nl!==line) touched++;
          return nl;
        });
      });
    });
    toast(touched? touched+' satır yeniden ölçeklendi — kontrol edin' : 'Ölçeklenecek satır bulunamadı');
  }
  if(act==='import-read'){
    const ta=val('impText'), fEl=document.getElementById('impFile');
    const go=txt=>{
      const rows=parseCSV(txt);
      if(rows.length<2) return toast('En az bir başlık ve bir veri satırı gerekiyor');
      IMP={head:rows[0].map(x=>String(x).trim()),rows:rows.slice(1)};
      IMP.map=guessCols(IMP.head);
      if(IMP.map.n===undefined) toast('Besin adı sütununu elle seçmeniz gerekebilir');
      drawImportMap();
    };
    if(fEl&&fEl.files&&fEl.files[0]){
      const r=new FileReader();
      r.onload=()=>go(r.result);
      r.onerror=()=>toast('Dosya okunamadı');
      r.readAsText(fEl.files[0],'utf-8');
      return;
    }
    if(!ta) return toast('Dosya seçin veya içeriği yapıştırın');
    go(ta); return;
  }
  if(act==='import-run'){
    const gi=k=>{ const el=document.getElementById('imp-'+k); return el&&el.value!==''? +el.value : null; };
    const ni=gi('n');
    if(ni===null) return toast('Besin adı sütunu seçilmeli');
    const dup=val('imp-dup')||'skip';
    let added=0,updated=0,skipped=0;
    IMP.rows.forEach(r=>{
      const name=String(r[ni]||'').trim();
      if(!name) return;
      const rec={n:name,cat:(gi('cat')!==null? String(r[gi('cat')]||'').trim():'')||'İçe aktarılan',g:100,u:{}};
      NUTRIENTS.forEach(x=>{ const i=gi(x.k); rec[x.k]= i!==null? numTR(r[i]) : 0; });
      const g=gi('gi'); rec.gi= g!==null? numTR(r[g]) : 0;
      const ex=DB.foods.find(f=>FOLD(f.n)===FOLD(name));
      if(ex){
        if(dup==='update'){ Object.assign(ex,rec,{u:ex.u||{},g:ex.g||100}); updated++; }
        else if(dup==='add'){ DB.foods.push({id:uid('f'),...rec}); added++; }
        else skipped++;
      } else { DB.foods.push({id:uid('f'),...rec}); added++; }
    });
    dropFoodIndex(); IMP=null;
    toast(added+' besin eklendi'+(updated?', '+updated+' güncellendi':'')+(skipped?', '+skipped+' atlandı':''));

      tax:+val('rc-tax')||0,vat:+val('rc-vat')||0,desc:val('rc-desc'),taxId:val('rc-tax-id'),

    DB.receiptNo=+d.no||((DB.receiptNo||0)+1);
    DB.profile.taxId=d.taxId;

    printReceipt(d);
    return;

  if(act==='note'){
    if(!val('n-text')) return toast('Not boş olamaz');
    c.notes=c.notes||[]; c.notes.push({id:uid('n'),date:val('n-date')||todayISO(),type:val('n-type'),text:val('n-text')});
    toast('Not kaydedildi');

  if(act==='note-edit'){
    if(!val('n-text')) return toast('Not boş olamaz');

    n0.edited=Date.now();
    toast('Not güncellendi');
  }
  if(act==='food'||act==='food-edit'){

    const u={};

      const kv=part.split('='); if(kv.length!==2) return;
      const key=kv[0].trim().toLocaleLowerCase('tr'), g=parseFloat(kv[1].replace(',','.'));
      if(key&&!isNaN(g)) u[FOLD(key)]=g;
    });
    const rec={n:val('f-n'),cat:val('f-cat')||'Diğer',g:+val('f-g')||100,u,gi:+val('f-gi')||0};
    NUTRIENTS.forEach(x=>rec[x.k]=+val('f-'+x.k)||0);
    if(act==='food-edit'){ const t=DB.foods.find(x=>x.id===S.editFood); if(t) Object.assign(t,rec); toast('Besin güncellendi'); }

    dropFoodIndex();

  if(act==='close-appt'){
    const a=DB.appts.find(x=>x.id===S.closeAppt); if(!a) return closeModal();

  }
  if(act==='plan-copy'){
    const src=DB.plans.find(x=>x.id===S.plan);
    const days=JSON.parse(JSON.stringify(src.days));
    if(!document.getElementById('cp-photos').checked)
      days.forEach(d=>{d.photo=''; d.meals.forEach(m=>m.photo='');});
    const np={...JSON.parse(JSON.stringify(src)),id:uid('p'),days,
      name:val('cp-name')||src.name,start:val('cp-start')||todayISO(),
      firstDay:+val('cp-firstday'),clientId:val('cp-client'),status:'Aktif'};
    DB.plans.unshift(np);

    S.plan=np.id; S.day=0; toast('Program kopyalandı');
  }
  if(act==='plan-tpl'){
    const p=DB.plans.find(x=>x.id===S.plan);
    if(!val('tp-name')) return toast('Şablon adı gerekli');
    DB.planTpls=DB.planTpls||[];
    DB.planTpls.unshift(tplFromPlan(p,val('tp-name'),document.getElementById('tp-photos').checked,val('tp-season'),val('tp-note')));
    toast('Şablon kaydedildi — renkler de dahil');
  }
  if(act==='tpl-edit'){
    const T=tplGet(S.editTpl); if(!T) return closeModal();
    if(!val('te-name')) return toast('Şablon adı gerekli');
    Object.assign(T.t,{name:val('te-name'),season:val('te-season'),theme:val('te-theme'),privNote:val('te-note')});
    toast('Şablon güncellendi');
  }
  if(act==='plan-new'){
    if(!val('p-name')) return toast('Program başlığı zorunlu');
    const start=val('p-start')||todayISO();
    const p={id:uid('p'),clientId:val('p-client'),name:val('p-name'),sub:val('p-sub'),start,
      status:val('p-status'),privNote:val('p-note'),footer:'',firstDay:+val('p-firstday'),
      purpose:val('p-purpose').split('\n').map(x=>x.trim()).filter(Boolean),closing:TPL.closing,days:newDays()};
    const T0=val('p-tpl')?tplGet(val('p-tpl')):null;
    if(T0){ applyTplToPlan(p,T0,val('p-sub')===TPL.sub); if(!p.privNote) p.privNote=String(T0.t.privNote||''); }
    const sv=val('p-season');
    p.season= sv==='auto' ? ((T0&&seasonOf(T0.t.season))? T0.t.season : seasonFromDate(start)) : sv;
    DB.plans.push(p); S.plan=p.id; S.day=0; S.page='planEdit'; toast('Program oluşturuldu ✨');
  }
  if(act==='plan-edit'){
    const p=DB.plans.find(x=>x.id===S.plan);
    Object.assign(p,{name:val('p-name'),sub:val('p-sub'),start:val('p-start'),status:val('p-status'),season:val('p-season'),firstDay:+val('p-firstday'),
      purpose:val('p-purpose').split('\n').map(x=>x.trim()).filter(Boolean)});
    toast('Program güncellendi 💫');
  }
  if(act==='meal'){
    if(!val('ml-n')) return toast('Öğün adı zorunlu');
    DB.plans.find(x=>x.id===S.plan).days[S.day].meals.push({name:val('ml-n'),time:val('ml-t'),items:[]});

  }
  if(act==='item'){
    const name=val('it-food'); if(!name) return toast('Besin adı zorunlu');
    const p=DB.plans.find(x=>x.id===S.plan);
    const q=val('it-q')|| (val('it-gram')? val('it-gram')+' g':'1 porsiyon');
    p.days[S.day].meals[S.mealIdx].items.push({n:name,q,kcal:+val('it-kcal')||0,p:+val('it-p')||0,k:+val('it-k')||0,y:+val('it-y')||0});

  }
  closeModal(); await save(); render();
}

const ymOf=d=>String(d).slice(0,7);
const isoOf=d=>String(d).slice(0,10);
const trMonth=ym=>{const [y,m]=ym.split('-');return new Date(+y,+m-1,1).toLocaleDateString('tr-TR',{month:'long',year:'numeric'});};
const shiftYM=(ym,n)=>{const [y,m]=ym.split('-').map(Number);const d=new Date(y,m-1+n,1);return d.toISOString().slice(0,7);};
const hhmm=w=>new Date(w).toLocaleTimeString('tr-TR',{hour:'2-digit',minute:'2-digit'});
const apptsOf=iso=>DB.appts.filter(a=>isoOf(a.when)===iso).sort((a,b)=>new Date(a.when)-new Date(b.when));
const payOf=a=>(a.pay&&+a.pay.amount)||0;
function clientMoney(id){
  const as=DB.appts.filter(a=>a.clientId===id);
  const paid=as.reduce((t,a)=>t+payOf(a),0);
  const done=as.filter(a=>a.status==='geldi').length;
  const c=clientOf(id)||{};
  const total=+c.pkgCount||0, price=+c.pkgPrice||0;
  return {paid,done,total,price,due:Math.max(0,price-paid),left:total?Math.max(0,total-done):0};
}

async function waSave(id){
  const ad=val('wa-ad'), tel=val('wa-tel'), grup=S.waFormGrp||'';
  if(!ad) return toast('Ad zorunlu');
  if(!phoneIntl(tel)) return toast('Geçerli bir numara girin');
  if(!grup) return toast('Grup seçin');
  const rec={ad,soyad:val('wa-soyad'),tel,grup};
  const list=waList();
  if(id){ const i=list.findIndex(y=>y.id===id); if(i>=0) Object.assign(list[i],rec); }
  else {
    if(list.some(y=>phoneIntl(y.tel)===phoneIntl(tel))) return toast('Bu numara zaten listede');
    list.push({id:uid('w'),...rec});
  }
  await save(); toast('Kaydedildi'); closeModal(); render();
}
async function waImport(){
  const list=waList(); let n=0;
  DB.clients.forEach(c=>{
    if(!c.phone||!phoneIntl(c.phone)) return;
    if(list.some(y=>phoneIntl(y.tel)===phoneIntl(c.phone))) return;
    const parts=String(c.name||'').trim().split(/\s+/);
    list.push({id:uid('w'),ad:parts[0]||c.name,soyad:parts.slice(1).join(' '),tel:c.phone,grup:'yeni'});
    n++;
  });
  await save(); toast(n?n+' kişi aktarıldı (Yeni danışan grubuna eklendi, gerekirse Düzenle ile grubunu değiştir)':'Aktarılacak yeni numara yok'); render();
}
function waText(x){
  const raw=S.waMsg||'';

  if(!String(S.waMsg||'').trim() && !S.waImg) return toast('Önce mesaj yazın ya da görsel ekleyin');

function drawSend(){
  const list=waList();
  const q=(S.waQ||[]).map(id=>list.find(y=>y.id===id)).filter(Boolean);
  const i=S.waI||0;
  if(i>=q.length){
    return modal('Gönderim tamamlandı',
      `<div class="ai-load"><span style="font-size:34px">✅</span><b>${q.length} kişi tamamlandı</b>
        <small>Listeyi istediğin zaman yeniden gönderime alabilirsin</small></div>`,
      'Kapat','close','520px');
  }
  const x=q[i], txt=waText(x), tel=phoneIntl(x.tel);
  const pct=Math.round(i/q.length*100);
  const busy=S.waSendingBusy;
  modal('Gönderim — '+(i+1)+' / '+q.length,`
    <div style="height:8px;background:var(--line);border-radius:99px;overflow:hidden;margin-bottom:14px">
      <div style="height:100%;width:${pct}%;background:#1E7B4D;transition:width .3s"></div></div>
    <div style="border:1px solid var(--line);border-radius:12px;padding:14px">
      <b style="font-size:15px">${esc(x.ad)} ${esc(x.soyad||'')}</b>
      <div class="num" style="color:var(--muted);font-size:13px">${esc(x.tel)}</div>
      <div style="white-space:pre-wrap;margin-top:10px;font-size:13.5px;line-height:1.7">${esc(txt)}</div>
      ${S.waImg?`<div class="hint" style="margin-top:8px">Görsel WhatsApp'ta ayrıca eklenmeli — "Görseli paylaş" ile gönderebilirsin.</div>`:''}
    </div>
    <div class="ai-actions" style="margin-top:14px">
      <button class="btn" data-wa-skip="1" ${busy?'disabled':''}>Atla</button>
      <button class="btn btn-primary" data-wa-realsend="1" ${busy?'disabled':''}>${busy?'Gönderiliyor…':'Şimdi gönder'}</button>
    </div>
    <p class="hint" style="margin-top:10px">Mesaj doğrudan WhatsApp API üzerinden otomatik gönderilir, buton haricinde bir şey yapmanız gerekmez.</p>
    <details style="margin-top:10px"><summary class="hint" style="cursor:pointer">Alternatif: WhatsApp uygulamasında elle aç</summary>
      <a class="btn" style="margin-top:8px" target="_blank" rel="noopener"
         href="https://wa.me/${tel}?text=${encodeURIComponent(txt)}">WhatsApp'ta aç</a>
    </details>`,
    'Durdur','close','560px');
}
async function waSendReal(){
  const list=waList();
  const q=(S.waQ||[]).map(id=>list.find(y=>y.id===id)).filter(Boolean);
  const i=S.waI||0;
  const x=q[i]; if(!x) return;
  const txt=waText(x);
  S.waSendingBusy=true; drawSend();
  const ok=await sendWA(x.tel, txt, {name:(x.ad+' '+(x.soyad||'')).trim(), type:'toplu'});
  S.waSendingBusy=false;
  if(ok){ S.waI=(S.waI||0)+1; }
  drawSend();
}
async function waShareImg(){
  if(!S.waImg) return;
  try{
    const b=await (await fetch(S.waImg)).blob();
    const f=new File([b],'gorsel.jpg',{type:b.type||'image/jpeg'});
    try{ await navigator.clipboard.writeText(S.waMsg||''); }catch(e){}
    if(navigator.canShare&&navigator.canShare({files:[f]})){
      await navigator.share({files:[f],text:S.waMsg||''});
      return toast('Paylaş menüsünden WhatsApp ve kişileri seç');
    }
    const a=document.createElement('a'); a.href=S.waImg; a.download='gorsel.jpg'; a.click();
    toast('Görsel indirildi, metin panoya kopyalandı');
  }catch(e){ toast('Paylaşılamadı'); }
}

async function waDaily(force){
  if(!gemKey()){ S.gemDiag=null; return gemDiagModal(); }
  if(!force && DB.waDaily && DB.waDaily.date===todayISO()) return;
  S.waBusy=true; toast('Bugünün önerileri hazırlanıyor…');
  try{
    const j=gemJson(await geminiText([
'Bir diyetisyenin danışanlarına sabah göndereceği kısa motivasyon mesajları yaz.','',
'KURALLAR:','- Yanıtı SADECE geçerli JSON olarak ver.',
'- 5 farklı mesaj üret. Her biri 2-3 cümle, en fazla 35 kelime.',
'- Ton: sıcak, esprili, hafif. Güldürsün ama alay etmesin, kilo ya da beden üzerinden şaka yapma.',
'- Suçlayıcı, utandırıcı ya da korkutucu dil kullanma. "Detoks", "yağ yakar", "mucize" gibi ifadeler yasak.',
'- Beşi birbirinden farklı temada olsun: su, kahvaltı, hareket, uyku, sabır gibi.',
'- Her mesaja uygun bir emoji seç.',
'- "gorsel" alanı o mesaja uygun fotoğrafın İngilizce tek cümlelik tarifi olsun; içinde yazı/harf olmasın.',
'- Bugün '+trDate(todayISO())+'. Mevsime uygun ol.','',
'JSON ŞEMASI: {"mesajlar":[{"metin":"","emoji":"","gorsel":""}]}'].join('\n'),2048));
    const items=(j.mesajlar||[]).slice(0,5).map(x=>({metin:String(x.metin||'').slice(0,300),
      emoji:String(x.emoji||'💬').slice(0,4),gorsel:String(x.gorsel||'').slice(0,200),img:''}));

const CT_TYPES={

function ctPrompt(type,topic,tone,extra){
  const who=(DB.profile&&DB.profile.name)||'bir diyetisyen';
  const base=[
'Sen '+who+' adına içerik yazan bir metin yazarısın. Konu: beslenme ve diyetisyenlik.','',
'GENEL KURALLAR:',
'- Yanıtı SADECE geçerli JSON olarak ver. Markdown, kod bloğu, açıklama ekleme.',
'- Türkçe yaz. '+TONE_TXT(tone),
'- Bilimsel olarak desteklenmeyen iddia kurma. "Tedavi eder", "yağ yakar", "detoks" gibi ifadeler kullanma.',
'- Mucize vaat etme, korkutucu dil kullanma, kişiye özel tıbbi tavsiye verme.',
'- Gerektiğinde okuyucuyu bir uzmana danışmaya yönlendir.',
'- Emoji kullan ama abartma.'];
  const per={
post:['','ÇIKTI: Instagram gönderisi.',
'- "baslik": dikkat çeken ilk satır, en fazla 60 karakter.',
'- "metin": 120-200 kelime, kısa paragraflar ve satır aralarıyla.',
'- "hashtag": 12-18 arası, Türkçe ve İngilizce karışık, # işaretiyle.',
'- "gorsel": bu gönderi için önerilen fotoğrafın tek cümlelik tarifi (İngilizce, fotoğraf üretimi için).','',
'JSON ŞEMASI: {"baslik":"","metin":"","hashtag":[""],"gorsel":""}'],
story:['','ÇIKTI: 3-4 kareden oluşan story metni.',
'- "kareler": her biri en fazla 25 kelimelik dizi.',
'- "kapanis": son karede yer alacak çağrı cümlesi.','',
'JSON ŞEMASI: {"kareler":[""],"kapanis":""}'],
blog:['','ÇIKTI: Blog yazısı.',
'- "baslik": ilgi çekici ve arama dostu.',
'- "giris": 2-3 cümlelik giriş.',
'- "bolumler": 4-6 bölüm; her biri {"h":"ara başlık","metin":"80-150 kelime"}.',
'- "sonuc": 2-3 cümlelik kapanış.',
'- "seo": {"aciklama":"en fazla 155 karakter","anahtar":["5-8 anahtar kelime"]}','',
'JSON ŞEMASI: {"baslik":"","giris":"","bolumler":[{"h":"","metin":""}],"sonuc":"","seo":{"aciklama":"","anahtar":[""]}}'],
msg:['','ÇIKTI: Danışanlara gönderilecek toplu WhatsApp mesajı.',
'- "mesaj": en fazla 8 cümle, tek parça metin. Başlık ve madde işareti kullanma.',
'- Kişiye özel tıbbi yönlendirme yapma, genel bilgi ver.','',
'JSON ŞEMASI: {"mesaj":""}']
  }[type]||[];
  return base.concat(per,['','KONU:',String(topic).slice(0,600),
    extra?('\nEK NOT:\n'+String(extra).slice(0,600)):'']).join('\n');
}

async function runContent(){
  if(!gemKey()){ S.gemDiag=null; return gemDiagModal(); }
  const topic=(document.getElementById('ct-topic')||{}).value||S.ctTopic||'';
  S.ctTopic=topic;
  S.ctTone=(document.getElementById('ct-tone')||{}).value||S.ctTone||'samimi';
  S.ctExtra=(document.getElementById('ct-extra')||{}).value||S.ctExtra||'';
  if(String(topic).trim().length<3) return toast('Önce bir konu yazın');
  const type=S.ctType||'post';
  drawContent('loading');
  try{
    const d=gemJson(await geminiText(ctPrompt(type,topic,S.ctTone,S.ctExtra),4096));

    const item={id:uid('ct'),type,topic:String(topic).slice(0,200),baslik,at:Date.now(),data:d,img:''};

document.addEventListener('click',async e=>{
  const t=e.target;
  if(t.classList.contains('modal-bg')) return closeModal();
  if(t.closest('button[data-close]')) return closeModal();
  const ok=t.closest('[data-ok]'); if(ok) return handleOk(ok.dataset.ok);
  const go=t.closest('[data-go]'); if(go){ S.page=go.dataset.go; S.q=''; return render(); }
  const md=t.closest('[data-modal]'); if(md) return openModal(md.dataset.modal);
  const sg=t.closest('[data-seg]'); if(sg){
    const [grp,v]=sg.dataset.seg.split(':');
    sg.parentElement.querySelectorAll('.seg-b').forEach(b=>b.setAttribute('aria-pressed','false'));
    sg.setAttribute('aria-pressed','true');
    if(grp==='next'){ const box=document.getElementById('nextBox'); if(box) box.style.display = v==='1'?'':'none'; }
    return; }
  const ca=t.closest('[data-close-appt]'); if(ca){ return openCloseAppt(ca.dataset.closeAppt); }

    if(a==='cloud-backup'){ await cloudBackupNow(); return; }
    if(a==='cloud-backups'){ await openCloudBackups(); return; }
    if(a==='cloud-off'){
      if(!confirm('Bu cihazda bulut bağlantısı kesilsin mi? Veriler cihazda kalır.')) return;
      DB.cloud=null; await save({noCloud:true}); paintSync('Bulut kapalı','var(--muted)'); render(); return;
    }
    if(a==='copy-day'){
      const pl=DB.plans.find(x=>x.id===S.plan);
      S.clip={from:S.day,data:JSON.parse(JSON.stringify(pl.days[S.day]))};
      toast((S.day+1)+'. gün kopyalandı'); return render();
    }
    if(a==='paste-day'){
      if(!S.clip) return toast('Önce bir gün kopyalayın');
      const pl=DB.plans.find(x=>x.id===S.plan);
      pl.days[S.day]=JSON.parse(JSON.stringify(S.clip.data));
      await save(); toast('Yapıştırıldı'); return render();
    }
    if(a==='clear-day'){
      if(!confirm((S.day+1)+'. günün tüm öğünleri silinsin mi?')) return;
      const pl=DB.plans.find(x=>x.id===S.plan);
      pl.days[S.day].meals.forEach(m=>{m.title='';m.lines=[];m.photo='';});
      pl.days[S.day].photo='';
      await save(); toast('Gün temizlendi'); return render();
    }
    if(a==='save-tpl'){ return openModal('plan-tpl'); }
    if(a==='del-tpl'){
      const id=act.dataset.tpl; DB.templates=(DB.templates||[]).filter(t=>t.id!==id);
      await save(); return render();
    }
    if(a==='share'||a==='share-docx'){ openShare(); return; }
  if(a==='scale'){ openScale(); return; }
  if(a==='shopping'){ openShopping(); return; }
  if(a==='food-import'){ openImport(); return; }
  if(a==='receipt'){ openReceipt(); return; }
  if(a==='ics'){
    const fut=DB.appts.filter(x=>new Date(x.when)>=new Date(Date.now()-864e5))
      .sort((x,y)=>new Date(x.when)-new Date(y.when));
    if(!fut.length) return toast('Aktarılacak randevu yok');
    icsFor(fut,'Randevular'); toast(fut.length+' randevu takvim dosyasına aktarıldı'); return;
  }
    if(a==='save-pin'){
      const a1=val('pin-new'), a2=val('pin-new2');
      if(!/^[0-9]{4,8}$/.test(a1)) return toast('Şifre 4-8 rakam olmalı');
      if(a1!==a2) return toast('Şifreler eşleşmiyor');
      DB.profile.pin=a1; await save(); toast('Şifre güncellendi'); render(); return;
    }
    if(a==='progress-docx'){ try{ exportProgressDocx(); }catch(err){ console.error(err); toast('Rapor oluşturulamadı'); } return; }
    if(a==='form-docx'){ try{ exportFormDocx(false); }catch(err){ console.error(err); toast('Word dosyası oluşturulamadı'); } return; }
    if(a==='form-docx-blank'){ try{ exportFormDocx(true); }catch(err){ toast('Word dosyası oluşturulamadı'); } return; }
    if(a==='docx'){ try{ await exportDocx(); }catch(err){ console.error(err); toast('Word dosyası oluşturulamadı'); } return; }
    if(a==='save-form'){
      const c2=clientOf(S.client);
      Object.assign(c2,{name:val('fm-name')||c2.name,age:val('fm-age'),city:val('fm-city'),height:val('fm-height'),
        job:val('fm-job'),phone:val('fm-phone'),health:val('fm-health'),meds:val('fm-meds'),dislikes:val('fm-dislikes'),
        likes:val('fm-likes'),allergy:val('fm-allergy'),blood:val('fm-blood'),important:val('fm-important')});
      await save(); toast('Bilgi formu kaydedildi'); render(); return;
    }
    if(a==='add-session'){
      const c2=clientOf(S.client);
      if(!val('s-weight')&&!val('s-note')) return toast('Kilo veya not girin');
      c2.measures=c2.measures||[];
      c2.measures.push({id:uid('m'),date:val('s-date')||todayISO(),weight:val('s-weight')||c2.weight||0,note:val('s-note')});
      if(val('s-weight')) c2.weight=val('s-weight');
      await save(); toast('Görüşme kaydedildi'); render(); return;
    }
    if(a==='print-blank'){
      const v=document.getElementById('view'), old=v.innerHTML;
      v.innerHTML=`<div class="page">${blankForm()}</div>`; window.print(); v.innerHTML=old; return;
    }
    if(a==='save-note'){ DB.plans.find(x=>x.id===S.plan).note=document.getElementById('planNote').value; await save(); toast('Not kaydedildi'); render(); }
    if(a==='batch-photo'){ return openBatch(); }
    if(a==='paste-plan'){ return openPaste(); }
    if(a==='ai-plan'){ return openGenPlan(); }
    if(a==='ai-cover'){ return runCover(); }
    if(a==='ai-check'){ return runCheck(); }
    if(a==='doc-theme'){ return openDocTheme(); }
    if(a==='nu-detail'){ return openDayAnalysis(); }
    if(a==='trash-empty'){
      if(!confirm('Çöp kutusundaki tüm kayıtlar kalıcı olarak silinsin mi? Geri alınamaz.')) return;
      DB.trash=[]; await save(); toast('Çöp kutusu boşaltıldı'); return render(); }
    if(a==='gem-diag'){ S.gemDiag=null; return gemDiagModal(); }
    if(a==='save-profile'){ Object.assign(DB.profile,{name:val('pf-name'),clinic:val('pf-clinic'),phone:val('pf-phone'),mail:val('pf-mail'),note:val('pf-note'),gemini:val('pf-gemini')}); await save(); toast('Bilgiler kaydedildi'); render(); }
    if(a==='greet-new'){ return render(); }
    if(a==='open-gallery'){ return openGallery({type:'browse'}); }
    if(a==='export'){ const b=new Blob([JSON.stringify(DB,null,2)],{type:'application/json'});
      const u=URL.createObjectURL(b), l=document.createElement('a'); l.href=u; l.download='diyet-yedek-'+todayISO()+'.json'; l.click(); URL.revokeObjectURL(u);
      DB.profile.lastBackup=todayISO(); await save(); toast('Yedek indirildi'); if(S.page==='panel') render(); }
    if(a==='import') document.getElementById('importFile').click();
    if(a==='del-logo'){ DB.profile.logo=''; await save(); render(); }
    if(a==='reset'){ if(confirm('Tüm danışanlar, programlar ve randevular silinecek. Emin misiniz?')){ DB=seed(); S.page='panel'; await save(); render(); } }
  }
});
document.addEventListener('input',e=>{
  if(e.target.id==='gsearch'){
    S.gq=e.target.value;
    if(S.gq.trim().length>=2){ S.page='search'; render();
      const g=document.getElementById('gsearch'); if(g){ g.value=S.gq; g.focus(); g.setSelectionRange(S.gq.length,S.gq.length); } }
    return;
  }
  if(e.target.id==='q'){ S.q=e.target.value; render();
    const i=document.getElementById('q'); if(i){ i.focus(); i.setSelectionRange(i.value.length,i.value.length); } }
  if(e.target.id==='it-food'||e.target.id==='it-gram'){
    const f=DB.foods.find(x=>x.n.toLocaleLowerCase('tr')===val('it-food').toLocaleLowerCase('tr'));
    const gr=+val('it-gram');
    if(f&&gr){ const r=gr/100;
      document.getElementById('it-kcal').value=Math.round(f.kcal*r);
      document.getElementById('it-p').value=(f.p*r).toFixed(1);
      document.getElementById('it-k').value=(f.k*r).toFixed(1);
      document.getElementById('it-y').value=(f.y*r).toFixed(1); }
  }
});
document.addEventListener('change',async e=>{
  const ssel=e.target.closest('[data-plan-season],[data-tpl-season]');
  if(ssel){
    const y=window.scrollY, v=e.target.value;
    if(ssel.dataset.planSeason){ const pp=DB.plans.find(x=>x.id===ssel.dataset.planSeason); if(pp) pp.season=v; }
    else { const T=tplGet(ssel.dataset.tplSeason); if(T) T.t.season=v; }
    await save(); toast(v? seasonTag(v)+' olarak işaretlendi' : 'Mevsim kaldırıldı');
    render(); window.scrollTo(0,y); return; }
  if(e.target.id==='dt-fh'||e.target.id==='dt-fb'){ return paintPreview(); }
  if(e.target.closest('[data-dt-opt]')){
    const pl2=DB.plans.find(x=>x.id===S.plan); if(!pl2) return;
    if(e.target.id==='dt-sum') pl2.docSummary=e.target.checked;
    if(e.target.id==='dt-shop') pl2.docShopping=e.target.checked;
    await save(); return paintPreview(); }
  if(e.target.id==='galq'){
    const q=trNorm(e.target.value);
    document.querySelectorAll('#galGrid .gal-item').forEach(it=>{
      it.style.display = !q || (it.dataset.gk||'').includes(q) ? '' : 'none';
    });
    return; }
  const wc=e.target.closest('[data-wa-chk]');
  if(wc){
    S.waSel=S.waSel||{}; S.waSel[wc.dataset.waChk]=e.target.checked;
    const n=waList().filter(x=>S.waSel[x.id]).length;
    const btn=document.getElementById('wa-start-btn');
    if(btn){ btn.disabled=!n; btn.textContent='▶ Gönderime başla'+(n?' ('+n+' kişi)':''); }
    return; }
  if(e.target.id==='wa-file'){
    const f=e.target.files&&e.target.files[0]; if(!f) return;
    try{ S.waImg=await shrinkData(await blobToData(f),900,.85); toast('Görsel eklendi'); render(); }
    catch(err){ toast('Görsel okunamadı'); }
    return; }
  if(e.target.id==='bq-scope'){ S.bqScope=e.target.value; return drawBatch('idle'); }
  const f=e.target.closest('[data-f]');
  if(f){
    const p=DB.plans.find(x=>x.id===S.plan); if(!p) return;
    const [k,i]=f.dataset.f.split(':'), v=e.target.value;
    if(k==='title'){ p.days[S.day].meals[+i].title=v; paintSug(+i); }
    if(k==='lines'){ p.days[S.day].meals[+i].lines=v.split('\n').map(x=>x.trim()).filter(Boolean); paintSug(+i); }
    if(k==='tip')    p.days[S.day].meals[+i].tip=v;
    if(k==='daysub') p.days[+i].sub=v;
    if(k==='firstday'){ p.firstDay=+v; await save(); return render(); }
    if(k==='purpose') p.purpose=v.split('\n').map(x=>x.trim()).filter(Boolean);
    if(k==='closing') p.closing=v;
    if(k==='footer') p.footer=v;
    if(k==='privnote') p.privNote=v;
    await save(); return;
  }
  const dph2=e.target.closest('[data-dayphoto]');
  if(dph2 && dph2.files && dph2.files[0]){
    try{ const d=await shrink(dph2.files[0],1100,0.72,false);
      const p=DB.plans.find(x=>x.id===S.plan); p.days[S.day].photo=d; addToGallery(d,(S.day+1)+'. gün tabağı');
      await save(); toast('Gün fotoğrafı eklendi'); render();
    }catch(err){ toast('Fotoğraf okunamadı'); }
    return;
  }
  const ph=e.target.closest('[data-photo]');
  if(ph && ph.files && ph.files[0]){
    try{
      const d=await shrink(ph.files[0],620,0.72,true);
      const p=DB.plans.find(x=>x.id===S.plan);
      const mm=p.days[S.day].meals[+ph.dataset.photo];
      mm.photo=d; addToGallery(d, mm.title||mm.name);
      await save(); toast('Fotoğraf eklendi'); render();
    }catch(err){ toast('Fotoğraf okunamadı'); }
    return;
  }
  if(e.target.id==='logoFile' && e.target.files && e.target.files[0]){
    try{ DB.profile.logo=await shrink(e.target.files[0],760,0.82,false); await save(); toast('Logo kaydedildi'); render(); }
    catch(err){ toast('Görsel okunamadı'); }
  }
});

document.getElementById('importFile').addEventListener('change',e=>{
  const f=e.target.files[0]; if(!f) return;
  const r=new FileReader();
  r.onload=async()=>{ try{ const d=JSON.parse(r.result); if(!d.clients) throw 0; DB=d; logoUpgrade(); await save(); S.page='panel'; render(); toast('Yedek yüklendi'); }
    catch(err){ toast('Dosya okunamadı'); } };
  r.readAsText(f); e.target.value='';
});
document.addEventListener('keydown',e=>{ if(e.key==='Escape') closeModal(); });
/* Kasada bulunamayan fotoğraf referansları bozuk resim yerine yer tutucu gösterir */
document.addEventListener('error',e=>{
  const t=e.target;
  if(t&&t.tagName==='IMG'&&String(t.getAttribute('src')||'').slice(0,5)==='ph://'){
    t.src=PH_MISS; t.title='Bu fotoğraf bu cihazın kasasında yok — kayıt korunuyor';
  }
},true);

/* ══════════════ Şifre kilidi ══════════════ */
let PIN='';
const realPin=()=>String(DB.profile.pin||'0508');
function pinPaint(){
  document.getElementById('pinDots').innerHTML=
    Array.from({length:realPin().length},(_,i)=>`<i class="${i<PIN.length?'on':''}"></i>`).join('');
}
function unlock(){
  const lock=document.getElementById('lock'), app=document.querySelector('.app');
  lock.hidden=true; lock.style.display='none';
  if(app) app.style.display='flex';
  try{ render(); paintSave('Hazır','var(--ok)');
       if(cloudReady()){ if(CL()) CL().enabled=true; cloudSync(false);
         setInterval(()=>{ if(!document.hidden && cloudReady() && document.getElementById('lock').hidden) cloudSync(false); },60000); }
       if(trashPurge()>0) save({noCloud:true}); }
  catch(err){
    console.error(err);
    document.getElementById('view').innerHTML='<div class="page"><section class="card"><div class="card-b">'
      +'<b>Bir sorun oluştu:</b><br><span style="font-family:var(--mono);font-size:12px">'+String(err.message||err)+'</span>'
      +'<br><br><button class="btn" data-act="reset">Verileri sıfırla</button></div></section></div>';
  }
}
function pinTry(force){
  if(!force && PIN.length<realPin().length) return;
  if(PIN===realPin()){ unlock(); }
  else{
    const c=document.getElementById('lockCard');
    document.getElementById('lockErr').textContent='Şifre hatalı, tekrar deneyin';
    c.classList.add('shake'); setTimeout(()=>c.classList.remove('shake'),350);
    PIN=''; pinPaint();
  }
}
function pinKey(k){
  document.getElementById('lockErr').textContent='';
  if(k==='del') PIN=PIN.slice(0,-1);
  else if(k==='clear') PIN='';
  else if(k==='ok'){ pinPaint(); return pinTry(true); }
  else if(/^[0-9]$/.test(k)&&PIN.length<8) PIN+=k;
  pinPaint(); pinTry();
}
function lockApp(){
  PIN='';
  document.getElementById('lockName').textContent=DB.profile.name||'Giriş';
  const lg=document.getElementById('lockLogo');
  if(DB.profile.logo){ lg.src=DB.profile.logo; lg.style.display=''; } else lg.style.display='none';
  document.getElementById('lockErr').textContent='';
  const lock=document.getElementById('lock');
  lock.hidden=false; lock.style.display='grid';
  const app=document.querySelector('.app'); if(app) app.style.display='none';
  pinPaint();
}
document.getElementById('keys').addEventListener('click',e=>{
  const b=e.target.closest('[data-k]'); if(b){ e.preventDefault(); pinKey(b.dataset.k); }
});
document.getElementById('btnEnter').addEventListener('click',e=>{ e.preventDefault(); pinKey('ok'); });
document.addEventListener('visibilitychange',()=>{
  if(!document.hidden && document.getElementById('lock').hidden && cloudReady()){
    if(CL()) CL().enabled=true;
    cloudSync(false);
  }
});
document.addEventListener('keydown',e=>{
  const qf=e.target.closest && e.target.closest('[data-qa-food],[data-qa-amt]');
  if(qf && e.key==='Enter'){
    e.preventDefault();
    const mi=qf.dataset.qaFood!==undefined?qf.dataset.qaFood:qf.dataset.qaAmt;
    const btn=document.querySelector(`[data-qa-add="${mi}"]`); if(btn) btn.click();
    return;
  }
  if(document.getElementById('lock').hidden) return;
  if(/^[0-9]$/.test(e.key)) pinKey(e.key);
  else if(e.key==='Backspace'){ e.preventDefault(); pinKey('del'); }
  else if(e.key==='Enter') pinTry();
});

(async()=>{
  try{ await pvOpen(); }catch(e){}
  try{ await loadDB(); }catch(err){ DB=seed(); }
  if(DB.profile.pin===undefined||DB.profile.pin==='') DB.profile.pin='0508';
  lockApp();
})();

/* Panel açıkken selamlama saat dilimi değişince kendini tazelesin */
let GREET_LAST=greetKey(new Date().getHours());
setInterval(()=>{
  const k=greetKey(new Date().getHours());
  if(k!==GREET_LAST){
    GREET_LAST=k;
    if(S.page==='panel' && document.getElementById('lock').hidden && !document.querySelector('.modal-bg')) render();
  }
},60000);
