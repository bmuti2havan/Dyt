<style>
:root{
  --blue-900:#0B3B63; --blue-700:#125A96; --blue-600:#1B72BC; --blue-500:#2E8BD8;
  --blue-100:#DDEDFA; --blue-50:#EFF7FD; --canvas:#F1F7FC;
  --ink:#0E2438; --ink-2:#41586E; --muted:#7A90A6; --line:#D9E6F2; --line-2:#EAF2F9;
  --surface:#FFFFFF;
  --protein:#2563C9; --karb:#3E9BC4; --yag:#2E9BAE; --lif:#4A7FD0;
  --ok:#0F7B96; --ok-bg:#E3F4F8; --warn:#9A6B06; --warn-bg:#FCF3E1; --danger:#B23A31; --danger-bg:#FBECEA;
  --r:14px; --r-s:10px;
  --shadow:0 1px 2px rgba(14,36,56,.04), 0 12px 28px -22px rgba(14,36,56,.5);
  --shadow-lg:0 2px 4px rgba(14,36,56,.04), 0 22px 48px -28px rgba(14,36,56,.55);
  --ring:0 0 0 3px rgba(46,139,216,.16);
  --serif:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,ui-serif,serif;
  --sans:ui-sans-serif,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,"Roboto Mono",monospace;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--canvas);color:var(--ink);font-family:var(--sans);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
h1,h2,h3,h4{font-family:var(--serif);font-weight:600;letter-spacing:-.01em;margin:0}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}

.app{display:flex;min-height:100vh}
body{background:radial-gradient(1200px 600px at 78% -10%, #E7F1FB 0%, transparent 60%), var(--canvas)}
.rail{width:262px;flex:0 0 262px;background:linear-gradient(185deg,#FFFFFF 0%,#F3F9FE 100%);border-right:1px solid var(--line);position:sticky;top:0;height:100vh;display:flex;flex-direction:column}
.i{flex:0 0 auto;vertical-align:-3px}
.brand{padding:20px 18px 16px;border-bottom:1px solid var(--line-2);display:flex;gap:12px;align-items:center}
.brand .mark{width:42px;height:42px;flex:0 0 42px;border-radius:13px;background:linear-gradient(140deg,var(--blue-500),var(--blue-700));color:#fff;display:grid;place-items:center;font-family:var(--serif);font-size:16px;letter-spacing:.02em;box-shadow:0 8px 18px -10px var(--blue-600)}
.brand>div{min-width:0}
.brand b{display:block;font-family:var(--serif);font-size:15.5px;color:var(--blue-900);line-height:1.25}
.brand span{font-size:10px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
nav{padding:12px 12px 8px;overflow:auto;flex:1}
.nav-sec{font-size:10px;letter-spacing:.13em;text-transform:uppercase;color:var(--muted);padding:14px 10px 6px}
.nav-item{position:relative;display:flex;align-items:center;gap:11px;width:100%;text-align:left;background:none;border:0;padding:10px 12px;border-radius:var(--r-s);color:var(--ink-2);font-size:14px;margin-bottom:3px;transition:background .14s,color .14s}
.nav-item:hover{background:var(--blue-50);color:var(--blue-700)}
.nav-item[aria-current="page"]{background:linear-gradient(100deg,var(--blue-600),var(--blue-500));color:#fff;box-shadow:0 10px 20px -12px var(--blue-600)}
.nav-item[aria-current="page"]::before{content:'';position:absolute;left:-12px;top:50%;transform:translateY(-50%);width:4px;height:20px;border-radius:0 4px 4px 0;background:var(--blue-700)}
.nav-item .ic{width:18px;height:18px;display:grid;place-items:center;opacity:.9}
.nav-item .count{margin-left:auto;font-family:var(--mono);font-size:11px;opacity:.7}
.rail-foot{padding:12px;border-top:1px solid var(--line-2);display:grid;gap:6px}
.savestate{font-size:11.5px;color:var(--muted);display:flex;align-items:center;gap:6px;padding:0 4px}

.main{flex:1;min-width:0;display:flex;flex-direction:column}
.topsearch{max-width:340px;margin-left:18px}
@media (max-width:820px){.topsearch{display:none}}
.topbar{height:62px;background:rgba(255,255,255,.86);backdrop-filter:saturate(160%) blur(8px);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px;padding:0 26px;position:sticky;top:0;z-index:20}
.crumb{font-size:13px;color:var(--muted)}
.crumb b{color:var(--ink);font-weight:600}
.top-right{margin-left:auto;display:flex;align-items:center;gap:10px}
.who{display:flex;align-items:center;gap:9px;padding-left:12px;border-left:1px solid var(--line)}
.avatar{width:36px;height:36px;border-radius:12px;background:linear-gradient(140deg,var(--blue-500),var(--blue-700));color:#fff;display:grid;place-items:center;font-size:12.5px;font-weight:700;letter-spacing:.02em}
.av{width:34px;height:34px;border-radius:11px;display:grid;place-items:center;color:#fff;font-size:12px;font-weight:700;flex:0 0 34px}
.av-row{display:flex;align-items:center;gap:11px}
.who small{display:block;color:var(--muted);font-size:11px}
.page{padding:26px;max-width:1360px;width:100%;margin:0 auto}
.page-head{display:flex;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:20px}
.page-head h1{font-size:29px;color:var(--blue-900);letter-spacing:-.02em}
.page-head p{margin:6px 0 0;color:var(--muted);max-width:70ch}
.spacer{flex:1}

.btn{display:inline-flex;align-items:center;gap:7px;border-radius:var(--r-s);border:1px solid var(--line);background:#fff;padding:9px 14px;font-size:13.5px;font-weight:500;color:var(--ink-2);transition:transform .12s,box-shadow .14s,background .14s,border-color .14s}
.btn:hover{border-color:#BFD6E9;background:var(--blue-50);color:var(--blue-700)}
.btn:active{transform:translateY(1px)}
.btn-primary{background:linear-gradient(100deg,var(--blue-600),var(--blue-500));border-color:transparent;color:#fff;box-shadow:0 10px 20px -12px var(--blue-600)}
.btn-primary:hover{background:linear-gradient(100deg,var(--blue-700),var(--blue-600));color:#fff;box-shadow:0 12px 24px -12px var(--blue-700)}
.btn-ghost{border-color:transparent;background:none}
.btn-sm{padding:6px 10px;font-size:12.5px}
.btn-danger{color:var(--danger);border-color:#EFD3CF}
.btn-danger:hover{background:var(--danger-bg);color:var(--danger);border-color:#E4BDB8}

.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:none}
.card-h h3{font-family:var(--serif)}
.card-h h3{display:flex;align-items:center;gap:8px}
.card-h{display:flex;align-items:center;gap:10px;padding:14px 16px;border-bottom:1px solid var(--line-2)}
.card-h h3{font-size:16px}
.card-b{padding:16px}
.grid{display:grid;gap:16px}
.g-2{grid-template-columns:1fr 340px}
.g-3{grid-template-columns:repeat(3,1fr)}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:20px}
.stat{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;box-shadow:none;overflow:hidden;transition:border-color .16s}
.stat:hover{border-color:var(--blue-500)}
.stat::after{content:none}
.stat .badge{position:relative;z-index:1;width:34px;height:34px;border-radius:11px;background:var(--blue-100);color:var(--blue-700);display:grid;place-items:center;margin-bottom:12px}
.stat .lbl{position:relative;z-index:1;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.stat .val{position:relative;z-index:1;font-family:var(--mono);font-size:27px;font-weight:600;margin-top:5px;color:var(--blue-900);letter-spacing:-.02em}
.stat .sub{position:relative;z-index:1;font-size:12px;color:var(--muted);margin-top:3px}

table{width:100%;border-collapse:collapse}
th{text-align:left;font-size:10.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);font-weight:700;padding:11px 14px;background:var(--blue-50);border-bottom:1px solid var(--line)}
td{padding:12px 14px;border-bottom:1px solid var(--line-2);vertical-align:middle}
tbody tr:last-child td{border-bottom:0}
tbody tr{transition:background .12s}
tbody tr:hover{background:#F6FBFF}
th:first-child{border-top-left-radius:0}
.t-right{text-align:right}
.t-name{font-weight:600}
.t-sub{font-size:12px;color:var(--muted);margin-top:2px}

.tag{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;padding:3px 9px;border-radius:99px;border:1px solid var(--line);background:#fff;color:var(--ink-2);white-space:nowrap}
.tag-blue{background:var(--blue-100);border-color:#C4DFF6;color:var(--blue-700)}
.tag-ok{background:var(--ok-bg);border-color:#BFE2EC;color:var(--ok)}
.tag-warn{background:var(--warn-bg);border-color:#EEDFB9;color:var(--warn)}
.tag-danger{background:var(--danger-bg);border-color:#F0D2CE;color:var(--danger)}
.tag-plum{background:#F4EDF7;border-color:#E1CBEA;color:#7C4A94}
.tag-sage{background:#EAF2EE;border-color:#C9DED0;color:#3F6B54}
.dot{width:6px;height:6px;border-radius:50%;background:currentColor}

.field{display:flex;flex-direction:column;gap:5px}
.field label{font-size:12px;color:var(--ink-2);font-weight:600}
.field input,.field select,.field textarea{border:1px solid var(--line);background:#fff;border-radius:var(--r-s);padding:9px 11px;outline:0;width:100%}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--blue-500);box-shadow:var(--ring)}
.searchbar:focus-within{border-color:var(--blue-500);box-shadow:var(--ring)}
.field .hint{font-size:11.5px;color:var(--muted)}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.form-grid .full{grid-column:1/-1}
.searchbar{display:flex;align-items:center;gap:9px;background:#fff;border:1px solid var(--line);border-radius:99px;padding:8px 14px;min-width:260px}
.searchbar input{border:0;outline:0;width:100%}
.filters{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:16px}

.macro-bar{height:7px;border-radius:99px;background:var(--line-2);overflow:hidden;display:flex;margin-top:8px}
.macro-bar i{height:100%}
.macro-legend{display:flex;gap:14px;margin-top:7px;font-size:11.5px;color:var(--muted);flex-wrap:wrap}
.macro-legend b{font-family:var(--mono);color:var(--ink)}
.sw{width:8px;height:8px;border-radius:2px;display:inline-block;margin-right:5px}
.goal{display:grid;grid-template-columns:78px 1fr 108px;gap:10px;align-items:center;padding:6px 0}
.g-lbl{font-size:12.5px;color:var(--ink-2)}
.g-track{height:8px;border-radius:99px;background:var(--line-2);overflow:hidden;position:relative}
.g-fill{height:100%;border-radius:99px}
.g-over{position:absolute;top:0;height:100%;background-image:repeating-linear-gradient(45deg,var(--danger) 0 4px,#E7A79F 4px 8px)}
.g-val{font-family:var(--mono);font-size:12px;text-align:right;color:var(--muted)}
.g-val b{color:var(--ink)}

.tabs{display:inline-flex;gap:3px;background:#E9F1F8;border:1px solid var(--line);border-radius:12px;padding:4px;margin-bottom:20px;overflow:auto;max-width:100%}
.tab{border:0;background:none;padding:8px 15px;color:var(--ink-2);border-radius:9px;font-size:13.5px;white-space:nowrap;transition:background .14s,color .14s,box-shadow .14s}
.tab:hover{color:var(--blue-700)}
.tab[aria-selected="true"]{background:#fff;color:var(--blue-700);font-weight:600;box-shadow:0 2px 6px -2px rgba(14,36,56,.25)}
.days{display:flex;gap:7px;overflow:auto;padding-bottom:6px;margin-bottom:14px}
.day{position:relative;flex:0 0 auto;border:1px solid var(--line);background:#fff;border-radius:var(--r-s);
  padding:9px 14px 12px;text-align:center;min-width:90px;overflow:hidden;transition:border-color .16s,transform .16s}
.day:hover{border-color:var(--blue-500)}
.day .d-fill{position:absolute;left:0;bottom:0;height:3px;background:var(--blue-500);transition:width .3s ease}
.day .d-n{font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.day .d-d{font-family:var(--serif);font-size:19px}
.day .d-k{font-family:var(--mono);font-size:10.5px;color:var(--muted)}
.day[aria-pressed="true"]{background:var(--dayc,var(--blue-600));border-color:var(--dayc,var(--blue-600));color:#fff}
.day[aria-pressed="true"] .d-n,.day[aria-pressed="true"] .d-k{color:rgba(255,255,255,.82)}
.day[aria-pressed="true"] .d-fill{background:#fff;opacity:.9}

.meal-h{display:flex;align-items:center;gap:10px;padding:12px 15px;border-bottom:1px solid var(--line-2);background:var(--blue-50);border-radius:var(--r) var(--r) 0 0}
.meal-h h4{font-size:14.5px;color:var(--blue-900)}
.meal-h .time{font-family:var(--mono);font-size:11.5px;color:var(--muted)}
.meal-h .kcal{font-family:var(--mono);font-size:13px;font-weight:600}
.item{display:grid;grid-template-columns:1fr auto auto;gap:12px;align-items:center;padding:10px 15px;border-bottom:1px solid var(--line-2)}
.item:last-child{border-bottom:0}
.i-q{font-family:var(--mono);font-size:11.5px;color:var(--muted);margin-top:2px}
.i-v{font-family:var(--mono);font-size:11.5px;color:var(--muted);text-align:right;white-space:nowrap}
.i-v b{display:block;color:var(--ink);font-size:13px}
.x{border:0;background:none;color:var(--muted);width:26px;height:26px;border-radius:6px}
.x:hover{background:var(--danger-bg);color:var(--danger)}

.empty{padding:52px 20px;text-align:center}
.empty .eic{width:56px;height:56px;border-radius:18px;background:var(--blue-50);color:var(--blue-600);display:grid;place-items:center;margin:0 auto 14px}
.empty h4{font-size:17px;margin-bottom:6px}
.empty p{color:var(--muted);margin:0 auto 16px;max-width:46ch}

.modal-bg{position:fixed;inset:0;background:rgba(11,59,99,.35);backdrop-filter:blur(2px);display:grid;place-items:center;z-index:60;padding:20px}
.modal{background:#fff;border-radius:14px;width:min(620px,100%);max-height:88vh;overflow:auto;box-shadow:0 30px 60px -20px rgba(11,59,99,.4)}
.modal-h{display:flex;align-items:center;gap:10px;padding:16px 20px;border-bottom:1px solid var(--line-2);position:sticky;top:0;background:#fff}
.modal-h h3{font-size:17px}
.modal-b{padding:20px}
.modal-f{display:flex;gap:10px;justify-content:flex-end;padding:14px 20px;border-top:1px solid var(--line-2);position:sticky;bottom:0;background:#fff}

.toast{position:fixed;right:22px;bottom:22px;background:var(--blue-900);color:#fff;padding:11px 16px;border-radius:10px;font-size:13.5px;z-index:80;box-shadow:0 14px 30px -12px rgba(11,59,99,.6)}
.kv{display:flex;justify-content:space-between;gap:12px;padding:9px 0;border-bottom:1px dashed var(--line);font-size:13.5px}
.kv:last-child{border-bottom:0}
.kv b{font-family:var(--mono)}
.pill-row{display:flex;gap:8px;flex-wrap:wrap}
.hero{position:relative;overflow:hidden;background:linear-gradient(135deg,var(--blue-700) 0%,var(--blue-500) 55%,#4FA6E0 100%);color:#fff;border-radius:18px;padding:24px 26px;box-shadow:0 20px 40px -26px var(--blue-700)}
.hero::after{content:'🌸';position:absolute;top:-8px;right:14px;font-size:52px;opacity:.22;transform:rotate(12deg);pointer-events:none}
.hero::before{content:'🌷';position:absolute;bottom:-14px;left:-6px;font-size:60px;opacity:.16;transform:rotate(-10deg);pointer-events:none}
.hero::after{content:'';position:absolute;right:-60px;top:-90px;width:280px;height:280px;border-radius:50%;background:rgba(255,255,255,.09)}
.hero::before{content:'';position:absolute;right:60px;bottom:-120px;width:200px;height:200px;border-radius:50%;background:rgba(255,255,255,.06)}
.hero>*{position:relative;z-index:1}
.hero h1{color:#fff;font-size:26px}
.hero p{margin:8px 0 0;color:#D9EDFB;max-width:62ch}
.hero .meta{display:flex;gap:20px;flex-wrap:wrap;margin-top:14px;font-size:12.5px;color:#CFE6F8}
.hero .meta b{font-family:var(--mono);color:#fff}
:focus-visible{outline:2px solid var(--blue-500);outline-offset:2px}
#lock{position:fixed;inset:0;z-index:200;display:grid;place-items:center;padding:20px;
  background:radial-gradient(900px 520px at 50% -5%, #3D97DE 0%, #125A96 55%, #0B3B63 100%)}
.lock-card{background:#fff;border-radius:22px;padding:30px 28px;width:min(380px,100%);text-align:center;
  box-shadow:0 40px 80px -30px rgba(6,32,54,.7)}
.lock-card .lg{max-width:260px;width:84%;margin:0 auto 14px;display:block}
.lock-card h2{font-size:18px;color:var(--blue-900)}
.lock-card p{color:var(--muted);font-size:13px;margin:6px 0 20px}
.pin-dots{display:flex;gap:12px;justify-content:center;margin-bottom:18px}
.pin-dots i{width:13px;height:13px;border-radius:50%;background:#DCE7F1;transition:transform .15s,background .15s}
.pin-dots i.on{background:var(--blue-600);transform:scale(1.15)}
#pinInput{position:absolute;opacity:0;pointer-events:none}
.keys{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.keys button{height:52px;border-radius:14px;border:1px solid var(--line);background:#fff;font-size:20px;
  font-family:var(--mono);color:var(--blue-900);transition:transform .1s,background .14s}
.keys button:hover{background:var(--blue-50)}
.keys button:active{transform:scale(.96)}
.keys .fn{font-size:13px;font-family:var(--sans);color:var(--muted)}
.lock-err{color:var(--danger);font-size:13px;min-height:18px;margin-top:12px}
.shake{animation:sh .32s}
@keyframes sh{0%,100%{transform:none}20%{transform:translateX(-8px)}40%{transform:translateX(8px)}60%{transform:translateX(-5px)}80%{transform:translateX(5px)}}
.brand-logo{display:block;width:100%;max-width:210px;margin:0 auto}
.ai-box{margin-top:14px;border:1px solid var(--line);border-radius:14px;background:var(--blue-50);min-height:230px;display:grid;place-items:center;overflow:hidden}
.ai-box{align-items:start}
.ai-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;padding:8px;width:100%}
.ai-pick{position:relative;padding:0;border:2px solid transparent;border-radius:10px;overflow:hidden;background:none;display:block}
.ai-pick img{width:100%;aspect-ratio:1/1;object-fit:cover;display:block}
.ai-pick.on{border-color:var(--blue-600);box-shadow:var(--ring)}
.ai-tick{position:absolute;top:6px;right:6px;width:24px;height:24px;border-radius:50%;background:var(--blue-600);color:#fff;display:grid;place-items:center;font-size:13px}
@media (max-width:520px){.ai-grid{grid-template-columns:1fr 1fr}}
.ai-load{display:grid;place-items:center;gap:8px;padding:34px 16px;text-align:center;color:var(--ink-2)}
.ai-load small{color:var(--muted);font-size:12px}
.spin{width:30px;height:30px;border-radius:50%;border:3px solid #CFE3F5;border-top-color:var(--blue-600);animation:sp .9s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.gal-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:10px}
.gal-item{position:relative}
.gal-item>button:first-child{padding:0;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:none;width:100%;display:block}
.gal-item>button:first-child:hover{border-color:var(--blue-500);box-shadow:var(--ring)}
.gal-item img{width:100%;aspect-ratio:1/1;object-fit:cover;display:block}
.gal-lbl{display:block;font-size:11px;color:var(--muted);margin-top:4px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.gal-x{position:absolute;top:5px;right:5px;width:24px;height:24px;border-radius:8px;border:0;background:rgba(255,255,255,.92);color:var(--danger);font-size:12px;line-height:1;box-shadow:0 2px 6px rgba(0,0,0,.18)}
.fav-sec{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:14px 0 8px}
.fav-item{position:relative;margin-bottom:8px}
.fav-use{display:flex;gap:12px;align-items:center;width:100%;text-align:left;background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.fav-use:hover{border-color:var(--blue-500);background:var(--blue-50)}
.fav-use img{width:52px;height:52px;border-radius:10px;object-fit:cover;flex:0 0 52px}
.fav-noimg{width:52px;height:52px;border-radius:10px;background:var(--blue-50);display:grid;place-items:center;font-size:20px;flex:0 0 52px}
.fav-use small{display:block;color:var(--muted);font-size:12px;margin-top:2px}
.quickadd{display:grid;grid-template-columns:150px 1fr auto;gap:8px;margin-top:10px}
.quickadd input{border:1px solid var(--line);border-radius:var(--r-s);padding:9px 11px;outline:0;background:#fff;width:100%}
.quickadd input:focus{border-color:var(--blue-500);box-shadow:var(--ring)}
@media (max-width:600px){.quickadd{grid-template-columns:1fr 1fr}.quickadd .btn{grid-column:1/-1;justify-content:center}}
.seg{display:flex;gap:6px;background:#E9F1F8;border:1px solid var(--line);border-radius:12px;padding:4px}
.seg-b{flex:1;border:0;background:none;padding:10px;border-radius:9px;font-size:13.5px;color:var(--ink-2)}
.seg-b[aria-pressed="true"]{background:#fff;color:var(--blue-700);font-weight:600;box-shadow:0 2px 6px -2px rgba(14,36,56,.25)}
.cal-head{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-bottom:6px}
.cal-head span{text-align:center;font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.cal-cell{position:relative;aspect-ratio:1/1;border:1px solid var(--line);background:#fff;border-radius:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;padding:2px}
.cal-cell.empty{border:0;background:none}
.cal-cell:hover{border-color:var(--blue-500);background:var(--blue-50)}
.cal-cell.today{border-color:var(--blue-500)}
.cal-cell.sel{background:var(--blue-600);border-color:var(--blue-600);color:#fff}
.cal-n{font-family:var(--mono);font-size:13px}
.cal-dots{display:flex;gap:3px}
.cal-dots i{width:5px;height:5px;border-radius:50%;background:var(--blue-500)}
.cal-dots i.ok{background:var(--ok)} .cal-dots i.no{background:var(--danger)}
.cal-cell.sel .cal-dots i{background:#fff}
.cal-pay{position:absolute;top:3px;right:5px;font-size:10px;color:var(--ok);font-weight:700}
.cal-cell.sel .cal-pay{color:#CFF3E6}
.cal-new{position:absolute;bottom:2px;font-size:8px;letter-spacing:.04em;color:var(--blue-700);background:var(--blue-100);border-radius:4px;padding:0 3px}
.cal-cell.sel .cal-new{background:rgba(255,255,255,.25);color:#fff}
.cal-legend{display:flex;gap:14px;flex-wrap:wrap;margin-top:14px;font-size:11.5px;color:var(--muted);align-items:center}
.cal-legend i.lg{width:8px;height:8px;border-radius:50%;background:var(--blue-500);display:inline-block;margin-right:5px}
.cal-legend i.lg.ok{background:var(--ok)} .cal-legend i.lg.no{background:var(--danger)}
.slot{display:grid;grid-template-columns:64px 1fr auto;gap:12px;align-items:center;padding:14px 16px;border-bottom:1px solid var(--line-2)}

<script>
/* ═══════ WhatsApp gonderim yardimcisi (Meta Cloud API - dogrudan tarayicidan) ═══════ */
const WA_TOKEN = 'EAAgl62FdbdMBSb2P4RG4X6INmzk0TFlq1O8AGW1ZADbdGL52Qx1m5Jp2bthYeS6r0YGOmoecRvNI8kOer71cHK94A8XZCi7Vtp3AuY8VHZBO0gpUYQJkjhSlDKhRV6S73sRc7k6O6ZBsJUXBsCjYnNyAb1UZBeKKxZASH6oX80XUw9ZAN7p6J784ZA0yiip47z0BdAZDZD';
const WA_PHONE_ID = '1112592015280831';

function waNormalizePhone(raw){
  let n = String(raw||'').replace(/[^\d]/g,'');
  if(n.startsWith('0')) n = n.slice(1);
  if(!n.startsWith('90')) n = '90' + n;
  return n;
}

/* ═══════ Gönderim geçmişi (Gönderim Günlüğü) ═══════
   DB.waLog = [ { id, time, to, name, message, type, ok } ] — en yeni en üstte, en fazla 300 kayıt tutulur. */
function waLogPush(entry){
  if(!Array.isArray(DB.waLog)) DB.waLog=[];
  DB.waLog.unshift({ id: uid('log'), time: new Date().toISOString(), ...entry });
  if(DB.waLog.length>300) DB.waLog.length=300;
}

/* Meta'nın hata kodlarını anlaşılır Türkçeye çevirir */
function waExplain(err){
  const c=err&&err.code;
  if(c===190) return 'Erişim anahtarı (token) süresi dolmuş ya da geçersiz. Meta hesabından yeni bir kalıcı anahtar alıp dosyadaki WA_TOKEN değiştirilmeli.';
  if(c===131047) return 'Danışan son 24 saatte sana yazmadığı için serbest metin gönderilemez; onaylı mesaj şablonu gerekir.';
  if(c===131030) return 'Bu numara, test numarasının izinli alıcı listesinde değil. Meta panelinde alıcı olarak ekle.';
  if(c===131026) return 'Bu numaraya mesaj iletilemiyor (numara WhatsApp kullanmıyor olabilir).';
  if(c===131042) return 'Meta hesabında ödeme yöntemi eksik ya da hesap uygun değil.';
  if(c===131056||c===130429||c===80007) return 'Çok hızlı gönderim yapıldı; biraz bekleyip tekrar dene.';
  if(c===133010) return 'Gönderen numara WhatsApp Cloud API’de kayıtlı değil.';
  if(c===100) return 'İstek reddedildi: numara kimliği (WA_PHONE_ID) ya da telefon numarası biçimi hatalı olabilir.';
  if(c===10||c===200) return 'Bu anahtarın bu numara için WhatsApp izni yok.';
  return '';
}
const waErrText=err=>err? '['+(err.code||'?')+'] '+(err.message||'') : '';
function waFail(err,label){
  toast(label+(err&&err.code?' ('+err.code+')':'')+': '+(waExplain(err)||(err&&err.message)||'bilinmeyen hata'),9000);
}

async function sendWA(to, message, meta){
  meta = meta || {};
  if(!to){ toast('Telefon numarası yok'); return false; }
  try{
    const r = await fetch('https://graph.facebook.com/v21.0/' + WA_PHONE_ID + '/messages', {
      method: 'POST',
      headers: { 'Authorization': 'Bearer ' + WA_TOKEN, 'Content-Type': 'application/json' },
      body: JSON.stringify({ messaging_product:'whatsapp', to: waNormalizePhone(to), type:'text', text:{ body: message } })
    });
    const data = await r.json().catch(()=>({}));
    const ok = r.ok;
    if(!ok){ console.error('WA hata',data); waFail(data.error,'WhatsApp gönderilemedi'); }
    else toast('WhatsApp mesajı gönderildi');
    waLogPush({ to, name: meta.name||'', message, type: meta.type||'manuel', ok, err: ok?'':waErrText(data.error), why: ok?'':waExplain(data.error) });
    try{ await save(); }catch(e){}
    return ok;
  }catch(e){
    console.error(e); toast('WhatsApp gönderilemedi: internet bağlantısı yok ya da tarayıcı isteği engelledi ('+(e&&e.message||'hata')+')',9000);
    waLogPush({ to, name: meta.name||'', message, type: meta.type||'manuel', ok:false, err:'Bağlantı hatası: '+(e&&e.message||'') });
    try{ await save(); }catch(e2){}
    return false;
  }
}

/* Dosya/belge gonderme - fileUrl internette erisilebilir bir link olmali */
async function sendWAFile(to, fileUrl, fileName, caption, meta){
  meta = meta || {};
  if(!to){ toast('Telefon numarası yok'); return false; }
  if(!fileUrl){ toast('Dosya bağlantısı yok'); return false; }
  try{
    const r = await fetch('https://graph.facebook.com/v21.0/' + WA_PHONE_ID + '/messages', {
      method: 'POST',
      headers: { 'Authorization': 'Bearer ' + WA_TOKEN, 'Content-Type': 'application/json' },
      body: JSON.stringify({
        messaging_product:'whatsapp', to: waNormalizePhone(to), type:'document',
        document: { link: fileUrl, filename: fileName||'dosya', caption: caption||undefined }
      })
    });
    const data = await r.json().catch(()=>({}));
    const ok = r.ok;
    if(!ok){ console.error('WA dosya hata',data); waFail(data.error,'Dosya gönderilemedi'); }
    else toast('Dosya WhatsApp\'ta gönderildi');
    waLogPush({ to, name: meta.name||'', message: '[Dosya] '+(fileName||''), type: meta.type||'dosya', ok, err: ok?'':waErrText(data.error), why: ok?'':waExplain(data.error) });
    try{ await save(); }catch(e){}
    return ok;
  }catch(e){
    console.error(e); toast('Dosya gönderilemedi: internet bağlantısı yok ya da tarayıcı isteği engelledi ('+(e&&e.message||'hata')+')',9000);
    waLogPush({ to, name: meta.name||'', message: '[Dosya] '+(fileName||''), type: meta.type||'dosya', ok:false, err:'Bağlantı hatası: '+(e&&e.message||'') });
    try{ await save(); }catch(e2){}
    return false;
  }
}

/* ═══════ Panel açıkken çalışan otomatik zamanlayıcı ═══════
   Not: Bu, yalnızca sayfa TARAYICIDA AÇIKKEN çalışır. Bilgisayar/
   telefon kapalıysa ya da sekme kapatılırsa duraklar. Panel açık
   kaldığı sürece (örn. bir bilgisayarda hep açık bırakılırsa)
   günde 2 kez yedek alır ve yeni danışanlara hoş geldin mesajı yollar. */
const WA_MSG_NEW_FEMALE = 'Merhaba {isim}, aramıza hoş geldiniz! Beslenme yolculuğunuzda yanınızdayım. 🌿';
const WA_MSG_NEW_MALE   = 'Merhaba {isim}, aramıza hoş geldin! Beslenme programın için buradayım. 💪';

function todayStr(d){ return new Date(d||Date.now()).toISOString().slice(0,10); }

async function autoWelcomeCheck(){
  if(!DB || !Array.isArray(DB.clients)) return;
  const today = todayStr();
  let changed = false;
  for(const c of DB.clients){
    if(!c || !c.phone || c.waWelcomeSent) continue;
    if(!c.created || todayStr(c.created) !== today) continue;
    const tpl = c.sex==='K' ? WA_MSG_NEW_FEMALE : WA_MSG_NEW_MALE;
    const ok = await sendWA(c.phone, tpl.replace(/\{isim\}/g, c.name||''), {name:c.name, type:'otomatik-hoşgeldin'});
    if(ok){ c.waWelcomeSent = true; changed = true; }
  }
  if(changed){ try{ await save(); }catch(e){} }
}

async function autoBackupCheck(){
  if(typeof cloudReady!=='function' || !cloudReady()) return; // bulut girişi yoksa yedek alamayız
  const hh = new Date().getHours();
  const slot = hh===12 ? 'noon' : (hh===18 ? 'evening' : null);
  if(!slot) return;
  const key = 'wa-backup-' + todayStr() + '-' + slot;
  if(localStorage.getItem(key)) return; // bu dilimde zaten alındı
  try{
    await cloudBackupWrite(false);   // yanıt başarısızsa hata fırlatır; dilim işaretlenmez
    localStorage.setItem(key, '1');
  }catch(e){ console.error('Yedekleme hatası', e); }
}

setInterval(()=>{ autoWelcomeCheck(); autoBackupCheck(); }, 5*60*1000); // her 5 dakikada bir kontrol
window.addEventListener('load', ()=>{ setTimeout(()=>{ autoWelcomeCheck(); autoBackupCheck(); }, 4000); });

/* ═══════ Haftalık Otomatik Mesaj Programı ═══════
   DB.waSchedule = [ { id, days:['Pzt','Sal',...], time:'09:00',
                        message:'...', groups:['yeni','kadin',...], image:'data:...'|'', lastSentDate:null } ]
   "groups" WA_GROUPS içindeki sabit 4 gruptan (Yeni/Kadın/Erkek/Özel danışan) biri ya da birkaçı olabilir.
   Gerçek gönderim, saatinde ve panel kapalıyken bile, Netlify'daki
   zamanlanmış fonksiyon tarafından yapılır (bu dosyada sadece
   PROGRAMI YAZIP KAYDEDİYORUZ, gönderimin kendisi sunucuda olur). */
const WA_DAYS = ['Pzt','Sal','Çar','Per','Cum','Cmt','Paz'];

function waScheduleEnsure(){ if(!Array.isArray(DB.waSchedule)) DB.waSchedule = []; }

/* Bir gün, o günün tüm mesajlarını (A/B/C/D...) tek ekranda gösterir ve yönetir */
function waSchedulerHtml(){
  waScheduleEnsure();
  const day = S.waSchDay || WA_DAYS[0];
  const dayCount = d => DB.waSchedule.filter(s=>(s.days||[]).includes(d)).length;

  const dayTabs = WA_DAYS.map(d=>
    `<button type="button" class="day-pick" data-wa-sch-day-tab="${d}" aria-pressed="${day===d}">
      ${d}${dayCount(d)?`<span style="display:block;font-size:9.5px;font-weight:500;opacity:.75;margin-top:1px">${dayCount(d)}</span>`:''}
    </button>`).join('');

  const dayEntries = DB.waSchedule
    .filter(s=>(s.days||[]).includes(day))
    .sort((a,b)=>(a.time||'').localeCompare(b.time||''));

  const entriesHtml = dayEntries.length ? dayEntries.map((s,i)=>{
    const letter = String.fromCharCode(65+i); // A, B, C, D...
    const tags = (s.groups||[]).map(waGroupTag).join('');
    return `<div class="agenda-slot">
      <div class="agenda-time">${esc(s.time)}</div>
      <div class="agenda-body">
        <b style="font-size:12px;color:var(--muted)">Mesaj ${letter}</b>
        <div class="agenda-msg">${esc(s.message)}</div>
        <div class="agenda-tags">${tags}</div>
      </div>
      ${s.image?`<img class="agenda-img" src="${s.image}">`:''}
      <button class="x" title="Sil" onclick="waDeleteSlot('${s.id}')">✕</button>
    </div>`;
  }).join('') : `<div class="agenda-empty">${day} günü için henüz mesaj eklenmedi.</div>`;

  const groupChips = WA_GROUPS.map(g=>
    `<button type="button" class="grp-pick ${g.id}" data-wa-sch-grp-pick="${g.id}" aria-pressed="false"><i class="dot"></i>${esc(g.label)}</button>`
  ).join('');

  return `
    <div style="max-height:66vh;overflow:auto">
      <div class="day-pick-row" style="margin-bottom:16px">${dayTabs}</div>

      <h4 style="margin-bottom:8px">${day} günü — mesajlar</h4>
      <div class="card" style="padding:0 14px;margin-bottom:16px">${entriesHtml}</div>

      <h4 style="margin-bottom:8px">${day} gününe yeni mesaj ekle</h4>
      <div class="field"><label>Saat</label><input type="time" id="wa-sch-time" value="09:00"></div>
      <div class="field"><label>Mesaj metni (isim için {isim} yazabilirsiniz)</label>
        <textarea id="wa-sch-msg" rows="3" placeholder="Merhaba {isim}, ..."></textarea>
        <button type="button" class="btn btn-sm" style="margin-top:6px;align-self:flex-start" data-wa-tpl-open="wa-sch-msg">📋 Şablon seç</button>
      </div>
      <div class="field"><label>Görsel — isteğe bağlı</label>
        <input type="file" id="wa-sch-file" accept="image/*">
      </div>
      ${S.waSchImg?`<img src="${S.waSchImg}" style="max-width:140px;border-radius:8px;margin-top:6px;display:block">
        <button class="btn btn-sm" style="margin-top:4px" onclick="S.waSchImg='';openWaScheduler();">Görseli kaldır</button>`:''}
      <div class="field"><label>Hangi gruplara gidecek?</label>
        <div class="grp-pick-row">${groupChips}</div>
        <span class="hint">Birden fazla grup seçebilirsin, hepsine aynı mesaj gider.</span>
      </div>
      <button class="btn btn-primary" style="margin-top:4px" onclick="waAddSlot()">+ ${day} gününe ekle</button>
    </div>`;
}

function waSwitchSchDay(d){ S.waSchDay=d; S.waSchImg=''; openWaScheduler(); }

function openWaScheduler(){
  modal('Otomatik Mesaj Programı — Haftalık Takvim', waSchedulerHtml(), 'Kapat', 'close', '640px');
  setTimeout(()=>{
    const fi=document.getElementById('wa-sch-file');
    if(fi) fi.addEventListener('change', async ()=>{
      const f=fi.files&&fi.files[0]; if(!f) return;
      try{ S.waSchImg=await shrinkData(await blobToData(f),900,.85); openWaScheduler(); }
      catch(err){ toast('Görsel okunamadı'); }
    });
  },0);
}

async function waAddSlot(){
  const day = S.waSchDay || WA_DAYS[0];
  const time = document.getElementById('wa-sch-time').value;
  const message = document.getElementById('wa-sch-msg').value.trim();
  const groups = Array.from(document.querySelectorAll('[data-wa-sch-grp-pick][aria-pressed="true"]')).map(x=>x.dataset.waSchGrpPick);

  if(!time) return toast('Saat seçin');
  if(!message) return toast('Mesaj yazın');
  if(!groups.length) return toast('En az bir grup seçin');

  waScheduleEnsure();
  DB.waSchedule.push({
    id: 'sch_' + Date.now() + '_' + Math.random().toString(36).slice(2,7),
    days: [day], time, message, groups, image: S.waSchImg||'', lastSentDate: null
  });
  S.waSchImg='';
  await save();
  toast(day+' gününe eklendi');
  openWaScheduler();
}

async function waDeleteSlot(id){
  waScheduleEnsure();
  DB.waSchedule = DB.waSchedule.filter(s=>s.id!==id);
  await save();
  toast('Program silindi');

/* Logonun en-boy oranını (PNG/JPEG başlığından) okur; Word'de ezilmeden yerleşsin diye */
function logoAspect(dataUrl){
  try{
    let b64=String(dataUrl).split(',')[1]||''; b64=b64.slice(0,4*Math.floor(Math.min(b64.length,240000)/4));
    const t=atob(b64), u=i=>t.charCodeAt(i);
    if(u(0)===0x89&&u(1)===0x50){ const w=(u(16)<<24)|(u(17)<<16)|(u(18)<<8)|u(19), h=(u(20)<<24)|(u(21)<<16)|(u(22)<<8)|u(23); return w/h; }
    let i=2;
    while(i<t.length-9){
      if(u(i)!==0xFF){ i++; continue; }
      const mk=u(i+1);
      if(mk>=0xC0&&mk<=0xCF&&mk!==0xC4&&mk!==0xC8&&mk!==0xCC){ const h=(u(i+5)<<8)|u(i+6), w=(u(i+7)<<8)|u(i+8); return w/h; }
      i+=2+((u(i+2)<<8)|u(i+3));
    }
  }catch(e){}
  return 1.49;
}
function logoEMU(maxW,maxH){
  const r=logoAspect(DB.profile&&DB.profile.logo)||1.49;
  let w=maxW, h=Math.round(maxW/r);
  if(h>maxH){ h=maxH; w=Math.round(maxH*r); }
  return [w,h];
}

/* ═══════ Mevsim · şablon · özel not ═══════ */
const SEASONS=[
  {k:'ilkbahar',ad:'İlkbahar',em:'🌸'},
  {k:'yaz',ad:'Yaz',em:'☀️'},
  {k:'sonbahar',ad:'Sonbahar',em:'🍂'},
  {k:'kis',ad:'Kış',em:'❄️'}
];
const seasonOf=k=>SEASONS.find(x=>x.k===k)||null;
const seasonTag=k=>{ const x=seasonOf(k); return x? x.em+' '+x.ad : 'Mevsimsiz'; };
function seasonFromDate(iso){
  const m=+String(iso||'').slice(5,7)||(new Date().getMonth()+1);
  return m>=3&&m<=5?'ilkbahar' : m>=6&&m<=8?'yaz' : m>=9&&m<=11?'sonbahar' : 'kis';
}
function seasonOpts(cur,withAuto){
  const none=(!withAuto&&!seasonOf(cur))?' selected':'';
  return (withAuto?'<option value="auto">Otomatik (şablon / tarih)</option>':'')
    +`<option value=""${none}>Mevsimsiz</option>`
    +SEASONS.map(x=>`<option value="${x.k}" ${cur===x.k?'selected':''}>${x.em} ${x.ad}</option>`).join('');
}
/* Özel not: yalnızca uygulamada görünür. Word, yazdırma, paylaşım ve WhatsApp çıktıları bu alanı hiç okumaz.
   Eski sürümde "Açıklama" diye tutulan metin (desc) varsa onu da not olarak gösterir. */
const planNote=p=>String((p&&p.privNote!==undefined)? p.privNote : ((p&&p.desc)||''));
const oneLine=(t,n)=>{ t=String(t||'').replace(/\s+/g,' ').trim(); return t.length>n? t.slice(0,n-1)+'…' : t; };

/* Kayıtlı şablonlar iki yerde durabiliyor (eski: DB.templates, yeni: DB.planTpls). Tek liste gibi okunur. */
const tplAll=()=>[...(DB.planTpls||[]),...(DB.templates||[])];
function tplGet(id){
  const t=tplAll().find(x=>x.id===id); if(!t) return null;
  const d=t.data||t;                       // eski biçimde içerik data içindedir
  return {t,sub:d.sub||'',purpose:d.purpose||[],closing:d.closing||'',footer:d.footer||'',days:d.days||[]};
}
function tplDays(t){ return ((t.data||t).days||[]).filter(d=>(d.meals||[]).some(m=>(m.lines||[]).length)).length; }
function tplRemove(id){
  DB.planTpls=(DB.planTpls||[]).filter(x=>x.id!==id);
  DB.templates=(DB.templates||[]).filter(x=>x.id!==id);
}
function tplOptions(){
  const L=tplAll(); let h='';
  [...SEASONS.map(x=>x.k),''].forEach(k=>{
    const g=L.filter(t=>(seasonOf(t.season)?t.season:'')===k); if(!g.length) return;
    h+=`<optgroup label="${esc(seasonTag(k))}">${g.map(t=>`<option value="${t.id}">${esc(t.name)}</option>`).join('')}</optgroup>`;
  });
  return h;
}
/* Şablon artık günlerin yanında Word temasını (renkleri), yazı tiplerini, mevsimi ve özel notu da saklar */
function tplFromPlan(p,name,keepPhotos,season,note){
  const days=JSON.parse(JSON.stringify(p.days));
  if(!keepPhotos) days.forEach(d=>{ d.photo=''; (d.meals||[]).forEach(m=>m.photo=''); });
  return {id:uid('t'),name,created:todayISO(),sub:p.sub||'',purpose:(p.purpose||[]).slice(),closing:p.closing||'',footer:p.footer||'',days,
    season:season||'',privNote:note||'',
    theme:p.theme||(DB.profile&&DB.profile.docTheme)||'deniz',
    fontH:p.fontH||'',fontB:p.fontB||'',
    docSummary:p.docSummary!==false,docShopping:!!p.docShopping};
}
function applyTplToPlan(p,T,subIsDefault){
  const t=T.t;
  if(T.days.length) p.days=JSON.parse(JSON.stringify(T.days));
  if(T.purpose.length) p.purpose=T.purpose.slice();
  if(T.closing) p.closing=T.closing;
  if(T.footer) p.footer=T.footer;
  if(T.sub&&subIsDefault) p.sub=T.sub;
  if(t.theme&&DOC_THEMES[t.theme]) p.theme=t.theme;
  if(t.fontH) p.fontH=t.fontH;
  if(t.fontB) p.fontB=t.fontB;
  if(t.docSummary!==undefined) p.docSummary=t.docSummary;
  if(t.docShopping!==undefined) p.docShopping=t.docShopping;
}

  const day=pl.days[di];

  const ornek=ms.length?ms:[{name:'Kahvaltı',emoji:'🥐',title:'Örnek öğün başlığı',lines:['4 yemek kaşığı yoğurt','1 küçük şeftali'],tip:''}];

    ${ornek.map((m,i)=>{

function newDays(){return Array.from({length:7},(_,i)=>({sub:DAY_SUB[i],photo:'',
  meals:MEAL_PRESET.map(m=>({name:m[0],emoji:m[1],title:'',lines:[],photo:''}))}));}
function migratePlan(p){
  if(!p.days) p.days=newDays();
  p.days.forEach(d=>{
    if(!d.meals) d.meals=MEAL_PRESET.map(m=>({name:m[0],emoji:m[1],title:'',lines:[],photo:''}));
    if(d.sub===undefined) d.sub='';
    if(d.photo===undefined) d.photo='';
    d.meals.forEach(m=>{
      if(m.tip===undefined) m.tip='';
      if(!m.lines) m.lines=(m.items||[]).map(i=>(i.q&&i.q!=='1 porsiyon'?i.q+' '+i.n:i.n));
      delete m.items;
      if(m.title===undefined) m.title='';
      if(m.photo===undefined) m.photo='';
      if(!m.emoji){const f=MEAL_PRESET.find(x=>x[0].toLocaleLowerCase('tr')===String(m.name||'').toLocaleLowerCase('tr'));m.emoji=f?f[1]:'🍽';}
    });
  });
  if(p.firstDay===undefined){
    const d=p.start? new Date(p.start):new Date();
    p.firstDay=(d.getDay()+6)%7;   // 0 = Pazartesi
  }
  if(!p.sub) p.sub=TPL.sub;
  if(!p.purpose||!p.purpose.length) p.purpose=TPL.purpose.slice();
  if(!p.closing) p.closing=TPL.closing;
  if(p.footer===undefined) p.footer='';
}

/* ══════════════ Fotoğraf kasası (IndexedDB) ══════════════
   Fotoğraflar artık ana kayıtla birlikte tek bir metne sıkıştırılmıyor.
   Ana kayıtta sadece 'ph://...' referansı durur, fotoğrafın kendisi
   tarayıcının IndexedDB kasasında saklanır. Böylece tarayıcı kotası
   dolmaz ve program fotoğrafları kaybolmaz. */
const PV={db:null,ok:false,map:new Map()};
const PH_MISS='data:image/svg+xml;utf8,'+encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" width="240" height="240"><rect width="240" height="240" fill="#EDF3F9"/><text x="120" y="112" font-size="42" text-anchor="middle">🖼</text><text x="120" y="150" font-size="13" fill="#7A90A6" text-anchor="middle" font-family="sans-serif">bu cihazda yok</text></svg>');
function pvOpen(){
  return new Promise(res=>{
    try{
      if(!window.indexedDB) return res(false);
      const rq=indexedDB.open('dyt-foto-kasa',1);
      rq.onupgradeneeded=()=>{ const d=rq.result; if(!d.objectStoreNames.contains('ph')) d.createObjectStore('ph'); };
      rq.onsuccess=()=>{ PV.db=rq.result; PV.ok=true; res(true); };
      rq.onerror=()=>res(false);
      rq.onblocked=()=>res(false);
    }catch(e){ res(false); }
  });
}
const pvStore=m=>PV.db.transaction('ph',m).objectStore('ph');
function pvPut(k,v){ return new Promise((res,rej)=>{ try{ const r=pvStore('readwrite').put(v,k); r.onsuccess=()=>res(); r.onerror=()=>rej(r.error);}catch(e){rej(e);} }); }
function pvDel(k){ return new Promise(res=>{ try{ const r=pvStore('readwrite').delete(k); r.onsuccess=()=>res(); r.onerror=()=>res(); }catch(e){res();} }); }
function pvLoadAll(){
  return new Promise(res=>{
    const out=new Map();
    try{ const rq=pvStore('readonly').openCursor();
      rq.onsuccess=()=>{ const c=rq.result; if(c){ out.set(c.key,c.value); c.continue(); } else res(out); };
      rq.onerror=()=>res(out);
    }catch(e){ res(out); }
  });
}
const isPhoto=v=>typeof v==='string'&&v.slice(0,11)==='data:image/';
const isPhRef=v=>typeof v==='string'&&v.slice(0,5)==='ph://';
function phHash(s){
  let h=0x811c9dc5;
  const step=Math.max(1,Math.floor(s.length/400));
  for(let i=0;i<s.length;i+=step){ h^=s.charCodeAt(i); h=Math.imul(h,0x01000193)>>>0; }
  for(let i=Math.max(0,s.length-80);i<s.length;i++){ h^=s.charCodeAt(i); h=Math.imul(h,0x01000193)>>>0; }
  return 'p'+s.length.toString(36)+'x'+h.toString(36);
}
/* DB'yi fotoğrafsız metne çevirir, bulunan fotoğrafları döndürür */
function dbLight(){
  const found=new Map();
  const raw=JSON.stringify(DB,(k,v)=>{
    if(isPhoto(v)){ const h=phHash(v); found.set(h,v); return 'ph://'+h; }
    return v;
  });
  return {raw,found};
}
/* 'ph://' referanslarını gerçek fotoğrafla değiştirir; kasada yoksa referans korunur */
function phHydrate(o,seen){
  seen=seen||new Set();
  if(!o||typeof o!=='object'||seen.has(o)) return o;
  seen.add(o);
  if(Array.isArray(o)){
    for(let i=0;i<o.length;i++){
      const v=o[i];
      if(isPhRef(v)){ const r=PV.map.get(v.slice(5)); if(r) o[i]=r; }
      else phHydrate(v,seen);
    }
    return o;
  }
  for(const k in o){
    const v=o[k];
    if(isPhRef(v)){ const r=PV.map.get(v.slice(5)); if(r) o[k]=r; }
    else phHydrate(v,seen);
  }
  return o;
}
/* Programlarda ve favorilerde olup galeride olmayan fotoğrafları galeriye ekler */
function galleryCollect(){
  if(!DB.gallery) DB.gallery=[];
  const have=new Set(DB.gallery.map(g=>g.k));
  let n=0;
  const add=(d,label)=>{
    if(!isPhoto(d)) return;
    const k=photoKey(d); if(have.has(k)) return;
    have.add(k); n++;
    DB.gallery.push({id:uid('g'),k,d,label:label||'',at:Date.now()});
  };
  (DB.plans||[]).forEach(p=>{
    (p.days||[]).forEach((d,di)=>{
      add(d.photo,(di+1)+'. gün tabağı');
      (d.meals||[]).forEach(m=>add(m.photo,m.title||m.name||''));
    });
  });
  (DB.favMeals||[]).forEach(f=>add(f.photo,f.title||f.name||''));
  return n;
}

async function save(opts){
  DB.updatedAt=Date.now();
  saving=true; paintSave('Kaydediliyor…','var(--warn)');
  let raw, found=null;
  if(PV.ok){ const L=dbLight(); raw=L.raw; found=L.found; }

      if(PV.map.has(k)) continue;

    }
  }

const TRASH_DAYS=10;
const TRASH_LBL={client:'Danışan',plan:'Program',measure:'Ölçüm',note:'Görüşme notu',appt:'Randevu',food:'Besin',tpl:'Şablon',wa:'WhatsApp kişisi'};
const TRASH_ICON={client:'👤',plan:'📋',measure:'⚖️',note:'📝',appt:'📅',food:'🥗',tpl:'⭐',wa:'📇'};
function trashPush(type,label,data,extra){
  if(!DB.trash) DB.trash=[];
  DB.trash.unshift({id:uid('t'),type,label:String(label||'—'),at:Date.now(),data,extra:extra||{}});
}
function trashPurge(){
  if(!Array.isArray(DB.trash)){ DB.trash=[]; return 0; }
  const cut=Date.now()-TRASH_DAYS*86400000, n=DB.trash.length;
  DB.trash=DB.trash.filter(x=>(+x.at||0)>cut);
  return n-DB.trash.length;
}
const trashLeft=it=>Math.max(0,Math.ceil((( +it.at||0)+TRASH_DAYS*86400000-Date.now())/86400000));
async function trashRestore(id){
  const i=(DB.trash||[]).findIndex(x=>x.id===id); if(i<0) return;
  const it=DB.trash[i], d=it.data, ex=it.extra||{};
  try{
    if(it.type==='client'){
      if(DB.clients.some(x=>x.id===d.client.id)) return toast('Bu danışan zaten listede');
      DB.clients.push(d.client);
      (d.plans||[]).forEach(x=>{ if(!DB.plans.some(y=>y.id===x.id)) DB.plans.push(x); });
      (d.appts||[]).forEach(x=>{ if(!DB.appts.some(y=>y.id===x.id)) DB.appts.push(x); });
    }
    else if(it.type==='plan'){
      if(!DB.clients.some(x=>x.id===d.clientId)) return toast('Danışanı silinmiş — önce danışanı geri al');
      if(!DB.plans.some(x=>x.id===d.id)) DB.plans.push(d);
    }
    else if(it.type==='measure'||it.type==='note'){
      const c=clientOf(ex.clientId); if(!c) return toast('Danışanı silinmiş — önce danışanı geri al');
      const arr=it.type==='measure'?(c.measures=c.measures||[]):(c.notes=c.notes||[]);
      if(!arr.some(x=>x.id===d.id)) arr.push(d);
    }
    else if(it.type==='appt'){ if(!DB.appts.some(x=>x.id===d.id)) DB.appts.push(d); }
    else if(it.type==='wa'){
      const L=waList();
      if(L.some(x=>phoneIntl(x.tel)===phoneIntl(d.tel))) return toast('Bu numara zaten listede');
      L.push(d); }
    else if(it.type==='food'){
      if(!DB.foods.some(x=>x.id===d.id)) DB.foods.push(d);
      if(typeof dropFoodIndex==='function') dropFoodIndex();
    }
    else if(it.type==='tpl'){ DB.templates=DB.templates||[]; if(!DB.templates.some(x=>x.id===d.id)) DB.templates.push(d); }
    else return toast('Bu kayıt geri alınamıyor');
  }catch(e){ return toast('Geri alınamadı'); }
  DB.trash.splice(i,1);
  await save(); toast((TRASH_LBL[it.type]||'Kayıt')+' geri alındı'); render();
}

async function cloudToken(){
  const c=CL();
  if(TOKEN.v && Date.now()<TOKEN.exp-60000) return TOKEN.v;
  const r=await fetch('https://securetoken.googleapis.com/v1/token?key='+encodeURIComponent(c.apiKey),{
    method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded'},
    body:'grant_type=refresh_token&refresh_token='+encodeURIComponent(c.refreshToken)});
  const d=await r.json();
  if(!r.ok) throw new Error(d.error&&d.error.message||'Oturum yenilenemedi');
  TOKEN={v:d.access_token||d.id_token, exp:Date.now()+(+d.expires_in||3600)*1000};
  return TOKEN.v;
}
async function cloudSignIn(apiKey,dbUrl,email,pass){
  const r=await fetch('https://identitytoolkit.googleapis.com/v1/accounts:signInWithPassword?key='+encodeURIComponent(apiKey),{
    method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify({email,password:pass,returnSecureToken:true})});
  const d=await r.json();
  if(!r.ok){
    const m=(d.error&&d.error.message)||'';
    throw new Error(m==='EMAIL_NOT_FOUND'?'Bu e-posta kayıtlı değil':
      m==='INVALID_PASSWORD'||m==='INVALID_LOGIN_CREDENTIALS'?'E-posta veya şifre hatalı':
      m==='OPERATION_NOT_ALLOWED'?'Firebase’de E-posta/Şifre girişi açık değil':m||'Giriş yapılamadı');
  }
  DB.cloud={apiKey,dbUrl:String(dbUrl).trim().replace(/\/+$/,''),email,uid:d.localId,refreshToken:d.refreshToken,enabled:true,last:0};
  TOKEN={v:d.idToken,exp:Date.now()+3500000};
  await save({noCloud:true});
}

/* Kasadaki fotoğrafları teker teker buluta yükler (yüklenenler işaretlenir) */
async function cloudPhotoPush(hashes){
  if(!PV.ok) return;
  const up=CL().phUp=CL().phUp||{};
  let n=0;
  for(const h of hashes){
    if(up[h]) continue;
    const v=PV.map.get(h); if(!v) continue;
    try{
      const r=await fetch(await cloudPhotoUrl(h),{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify(v)});
      if(r.ok){ up[h]=1; n++; }
    }catch(e){ break; }
    if(n>=25) break;   // her turda en fazla 25 fotoğraf
  }
}
/* Bu cihazda olmayan fotoğrafları buluttan indirir */
async function cloudPhotoPull(hashes){
  if(!PV.ok) return 0;
  let n=0;
  for(const h of hashes){
    if(PV.map.has(h)) continue;
    try{
      const r=await fetch(await cloudPhotoUrl(h));
      if(!r.ok) continue;
      const d=await r.json();
      if(isPhoto(d)){ await pvPut(h,d); PV.map.set(h,d); n++; }
    }catch(e){ break; }
  }
  return n;
}
const phRefsIn=raw=>{ const out=new Set(); const re=/ph:\/\/([A-Za-z0-9]+)/g; let m; while((m=re.exec(raw))) out.add(m[1]); return out; };

}

/* Firebase boş dizileri saklamaz; eski otomatik yedeklerde eksik kalan alanları tamamlar */
function normalizeRestored(o){
  const arr=v=>Array.isArray(v)? v : (v&&typeof v==='object'? Object.values(v) : []);
  ['clients','appts','plans','gallery','favMeals','planTpls'].forEach(k=>{ o[k]=arr(o[k]); });
  o.clients.forEach(c=>{ c.measures=arr(c.measures); c.notes=arr(c.notes); });
  const fix=p=>{
    p.purpose=arr(p.purpose);
    if(p.days){ p.days=arr(p.days); p.days.forEach(d=>{ d.meals=arr(d.meals); d.meals.forEach(m=>{ m.lines=arr(m.lines); }); }); }
  };
  o.plans.forEach(fix);
  [...o.planTpls,...(Array.isArray(o.templates)?o.templates:[])].forEach(t=>fix(t.data||t));
  if(!o.foods||!o.foods.length) o.foods=SEED_FOODS;
  if(!o.seq) o.seq=1;
  return o;
}
async function cloudBackupRestore(k){

/* ══════════════ Bulutla eşitleme = BİRLEŞTİRME (üzerine yazmaz, silmez) ══════════════
   Bu cihazdaki ve buluttaki kayıtlar id'lerine göre birleştirilir. Yalnız bir tarafta olan kayıt korunur;
   iki tarafta da olan kayıtta daha yeni kaydedilen taraf kazanır (içindeki ölçüm/not gibi alt listeler yine birleşir). */
const isPlain=v=>v&&typeof v==='object'&&!Array.isArray(v);
const hasIds=a=>Array.isArray(a)&&a.length>0&&a.every(x=>isPlain(x)&&x.id!==undefined&&x.id!==null);
function mergeVal(a,b,prefB){              // a = bu cihaz, b = bulut
  if(a===undefined) return b;
  if(b===undefined) return a;
  if(Array.isArray(a)&&Array.isArray(b)){
    if((hasIds(a)||!a.length)&&(hasIds(b)||!b.length)){
      const out=a.slice(), idx=new Map(out.map((x,i)=>[x.id,i]));
      b.forEach(y=>{ if(idx.has(y.id)){ const i=idx.get(y.id); out[i]=mergeVal(out[i],y,prefB); } else { idx.set(y.id,out.length); out.push(y); } });
      return out;
    }
    return prefB? b : a;                   // sırası önemli listeler (günler, öğünler…): yeni olan taraf
  }
  if(isPlain(a)&&isPlain(b)){
    const o={}; new Set([...Object.keys(a),...Object.keys(b)]).forEach(k=>{ o[k]=mergeVal(a[k],b[k],prefB); }); return o;
  }
  return prefB? b : a;
}
function mergeDB(local,remote){
  const prefB=(+remote.updatedAt||0)>(+local.updatedAt||0);
  const m=mergeVal(local,remote,prefB);
  m.seq=Math.max(+local.seq||1,+remote.seq||1);
  if(local.receiptNo||remote.receiptNo) m.receiptNo=Math.max(+local.receiptNo||0,+remote.receiptNo||0);
  if(Array.isArray(m.waLog)){ m.waLog.sort((x,y)=>String(y.time||'').localeCompare(String(x.time||''))); if(m.waLog.length>300) m.waLog.length=300; }
  if(Array.isArray(m.trash)) m.trash.sort((x,y)=>(+y.at||0)-(+x.at||0));
  return m;
}
const SYNC_LISTS=['clients','plans','appts','planTpls','templates','favMeals'];
function syncDiff(a,b){
  let onlyB=0,onlyA=0;
  SYNC_LISTS.forEach(k=>{
    const A=new Set((a[k]||[]).map(x=>x.id)), B=new Set((b[k]||[]).map(x=>x.id));
    B.forEach(i=>{ if(!A.has(i)) onlyB++; }); A.forEach(i=>{ if(!B.has(i)) onlyA++; });
  });
  return {onlyB,onlyA};
}

function lineChart(points,{w=560,h=170,unit='kg'}={}){

  const px=t=>40+(t-x0)/((x1-x0)||1)*(w-58), py=v=>14+(1-(v-y0)/((y1-y0)||1))*(h-46);
  const d=points.map((p,i)=>(i?'L':'M')+px(new Date(p.date).getTime()).toFixed(1)+','+py(+p.weight).toFixed(1)).join(' ');

  return `<svg viewBox="0 0 ${w} ${h}" style="width:100%;height:auto" role="img" aria-label="Kilo değişim grafiği">

    ${points.map(p=>`<circle cx="${px(new Date(p.date).getTime()).toFixed(1)}" cy="${py(+p.weight).toFixed(1)}" r="3.4" fill="#fff" stroke="#1B72BC" stroke-width="2"/>`).join('')}

  </svg>`;
}

function shrinkData(dataUrl,size,q){
  return new Promise((res,rej)=>{ const im=new Image();
    im.onload=()=>{ const m=Math.min(im.width,im.height), sx=(im.width-m)/2, sy=(im.height-m)/2;
      const cv=document.createElement('canvas'); cv.width=size; cv.height=size;

}

function gemExplain(status,msg){
  const m=String(msg||'').toLowerCase();

    return 'Anahtar geçersiz — eksik kopyalanmış olabilir. Anahtarın tamamını (sonundaki üç nokta değil, kopyala simgesiyle) yeniden al.';
  if(m.includes('referer')||m.includes('referrer')||m.includes('blocked'))
    return 'Anahtarda site kısıtlaması var. Google Cloud → API'+"'"+'ler ve Hizmetler → Kimlik bilgileri → anahtara tıkla → Uygulama kısıtlamaları: "Yok" yap ya da sitenin adresini ekle.';
  if(m.includes('has not been used')||m.includes('disabled')||m.includes('service_disabled'))
    return 'Bu projede Generative Language API kapalı. Hata metnindeki bağlantıya gir ve API'+"'"+'yi etkinleştir, 1-2 dakika bekle.';
  if(m.includes('billing'))
    return 'Faturalandırma gerekiyor — projeye kart/kredi eklenmeli.';
  if(status===401||status===403) return 'Yetki reddedildi'+(msg?' — '+msg.slice(0,120):'');
  if(status===404) return 'Bu model hesabında yok — listeden başka model seç'+(msg?' ('+msg.slice(0,70)+')':'');
  if(status===429) return 'Kota doldu ya da çok hızlı istek gitti — biraz bekle veya faturalandırmayı aç.';
  if(status===400) return 'İstek reddedildi'+(msg?' — '+msg.slice(0,120):'');

  'gemini-3.1-flash-image':'Nano Banana 2 — dengeli (önerilen)',
  'gemini-3.1-flash-lite-image':'Nano Banana 2 Lite — en hızlı/ucuz',
  'gemini-3-pro-image':'Nano Banana Pro — en kaliteli, en pahalı'
};
function gemFindImage(d){
  if(d && d.output_image && d.output_image.data) return d.output_image.data;
  const steps=(d&&d.steps)||[];
  for(const st of steps){
    const blocks=(st.content||st.summary||[]);
    for(const b of blocks) if(b && b.type==='image' && b.data) return b.data;
  }
  const cands=(d&&d.candidates)||[];
  for(const c of cands) for(const pt of ((c.content&&c.content.parts)||[]))
    if(pt.inlineData && pt.inlineData.data) return pt.inlineData.data;
  return null;
}
async function geminiImage(prompt,model){
  const key=gemKey();
  if(!key) throw new Error('Gemini anahtarı girilmemiş');
  const ctl=new AbortController(); const to=setTimeout(()=>ctl.abort(),90000);
  let r;
  try{
    r=await fetch('https://generativelanguage.googleapis.com/v1beta/interactions',{
      method:'POST', signal:ctl.signal,
      headers:{'x-goog-api-key':key,'Content-Type':'application/json'},
      body:JSON.stringify({
        model: model||'gemini-3.1-flash-image',
        input:[{type:'text',text:prompt}],
        response_format:{type:'image',mime_type:'image/jpeg',aspect_ratio:'1:1',image_size:'1K'}
      })
    });
  }catch(e){ clearTimeout(to); throw new Error('Google sunucusuna ulaşılamadı (internet?)'); }
  clearTimeout(to);
  if(!r.ok){
    let msg='';
    try{ const j=await r.json(); msg=(j&&j.error&&j.error.message)||''; }catch(e){}
    throw new Error(gemExplain(r.status,msg));
  }
  const d=await r.json();
  const b64=gemFindImage(d);
  if(!b64) throw new Error('Görsel gelmedi — tarifi biraz sadeleştir');
  return await shrinkData('data:image/jpeg;base64,'+b64,620,0.8);
}

/* ── Metin üreten model: hesapta hangisi varsa onu seç, isim gömme ── */
async function gemTextModel(){
  if(S.gemTxt) return S.gemTxt;
  if(DB.profile&&DB.profile.gemTxt){ S.gemTxt=DB.profile.gemTxt; return S.gemTxt; }
  const r=await fetch('https://generativelanguage.googleapis.com/v1beta/models',{headers:{'x-goog-api-key':gemKey()}});
  if(!r.ok){ const e=new Error(gemExplain(r.status,'')); e.status=r.status; throw e; }
  const d=await r.json();
  const names=(d.models||[])
    .filter(m=>(m.supportedGenerationMethods||[]).indexOf('generateContent')>=0)
    .map(m=>String(m.name||'').replace(/^models\//,''))
    .filter(n=>n.indexOf('image')<0 && n.indexOf('embedding')<0 && n.indexOf('tts')<0
             && n.indexOf('vision')<0 && n.indexOf('live')<0 && n.indexOf('audio')<0);
  const score=n=>{
    let v=0; const m=/gemini-(\d+)(?:\.(\d+))?/.exec(n);
    if(m) v=(+m[1])*100+(+(m[2]||0))*10;
    if(n.indexOf('flash')>=0) v+=40;      // hız/maliyet dengesi en iyi olan
    if(n.indexOf('lite')>=0) v-=10;
    if(n.indexOf('pro')>=0) v-=30;        // pahalı, bu iş için gerekmiyor
    if(n.indexOf('preview')>=0||n.indexOf('exp')>=0) v-=60;
    return v;
  };
  names.sort((a,b)=>score(b)-score(a));
  if(!names.length) throw new Error('Hesabında metin üreten model görünmüyor');
  S.gemTxt=names[0];
  if(DB.profile){ DB.profile.gemTxt=S.gemTxt; save(); }
  return S.gemTxt;
}
async function geminiText(prompt,maxTok){
  const model=await gemTextModel();
  const ctl=new AbortController(), to=setTimeout(()=>ctl.abort(),120000);
  let r;
  try{
    r=await fetch('https://generativelanguage.googleapis.com/v1beta/models/'+model+':generateContent',{
      method:'POST', signal:ctl.signal,
      headers:{'x-goog-api-key':gemKey(),'Content-Type':'application/json'},
      body:JSON.stringify({
        contents:[{role:'user',parts:[{text:prompt}]}],
        generationConfig:{temperature:0.7,maxOutputTokens:maxTok||8192,responseMimeType:'application/json'}
      })
    });
  }catch(e){ clearTimeout(to); throw new Error('Google sunucusuna ulaşılamadı (internet?)'); }
  clearTimeout(to);
  if(!r.ok){
    let msg=''; try{ const j=await r.json(); msg=(j&&j.error&&j.error.message)||''; }catch(e){}
    const err=new Error(gemExplain(r.status,msg)); err.status=r.status; err.raw=msg; throw err;
  }
  const d=await r.json();
  const parts=(((d.candidates||[])[0]||{}).content||{}).parts||[];
  const txt=parts.map(x=>x.text||'').join('').trim();
  if(!txt) throw new Error('Model boş yanıt verdi — metni biraz kısalt');
  return txt;
}
function gemJson(txt){
  let t=String(txt).replace(/```json/gi,'').replace(/```/g,'').trim();
  const i=t.indexOf('{'), j=t.lastIndexOf('}');
  if(i>0||j<t.length-1){ if(i>=0&&j>i) t=t.slice(i,j+1); }
  return JSON.parse(t);
}

/* Danışanın tüm dosyasını Gemini'ye verilecek metne çevirir */
function clientDossier(c){
  if(!c) return 'Danışan bilgisi yok.';
  const L=[clientBrief(c)];
  const ms=(c.measures||[]).slice().sort((a,b)=>String(a.date).localeCompare(String(b.date)));
  if(ms.length){
    L.push('','ÖLÇÜMLER (eskiden yeniye):');
    ms.slice(-8).forEach(m=>{
      const bits=[trDate(m.date)];
      if(m.weight) bits.push(m.weight+' kg');
      if(m.waist) bits.push('bel '+m.waist);
      if(m.fat) bits.push('yağ %'+m.fat);
      if(m.muscle) bits.push('kas '+m.muscle);
      if(m.note) bits.push('('+m.note+')');
      L.push('- '+bits.join(' · '));
    });
    const f=ms[0], l=ms[ms.length-1];
    if(ms.length>1 && f.weight && l.weight)
      L.push('Toplam değişim: '+(((+l.weight)-(+f.weight)).toFixed(1))+' kg');
  }
  const labs=(c.labs||[]).slice().sort((a,b)=>String(b.date).localeCompare(String(a.date)));
  if(labs.length){
    L.push('','SON LABORATUVAR ('+trDate(labs[0].date)+'):');
    LABS.forEach(x=>{ if(labs[0][x.k]!==undefined) L.push('- '+x.t+': '+labs[0][x.k]+' '+x.u+' (referans '+x.ref[0]+'-'+x.ref[1]+')'); });
    if(labs[0].note) L.push('Not: '+labs[0].note);
  }
  const ns=(c.notes||[]).slice().sort((a,b)=>String(b.date).localeCompare(String(a.date)));
  if(ns.length){
    L.push('','GÖRÜŞME NOTLARI (yeniden eskiye, en fazla 5):');
    ns.slice(0,5).forEach(n=>L.push('- '+trDate(n.date)+' ['+(n.type||'Görüşme')+']: '+String(n.text||'').slice(0,600)));
  }
  const ps=DB.plans.filter(x=>x.clientId===c.id);
  if(ps.length){
    L.push('','PROGRAMLAR:');
    ps.slice(-3).forEach(x=>L.push('- '+x.name+' · başlangıç '+trDate(x.start)+' · durum '+(x.status||'')));
  }
  const ap=(DB.appts||[]).filter(x=>x.clientId===c.id).sort((a,b)=>String(b.when).localeCompare(String(a.when)));
  if(ap.length) L.push('','Toplam randevu: '+ap.length+' · sonuncusu '+String(ap[0].when||'').replace('T',' '));
  return L.join('\n');
}
function planSummaryText(pl){
  if(!pl) return 'Aktif program yok.';
  const L=[pl.name];
  pl.days.forEach((d,i)=>{
    const items=d.meals.filter(m=>(m.lines||[]).length||m.title);
    if(!items.length) return;
    L.push((i+1)+'. gün'+(d.sub?' — '+d.sub:''));
    items.forEach(m=>L.push('  '+m.name+(m.title?' ('+m.title+')':'')+': '+(m.lines||[]).join(', ')));
  });
  return L.join('\n');
}
function activePlanOf(cid){

    const j=gemJson(await geminiText(prompt,2048));

function clientBrief(c){
  if(!c) return 'Danışan bilgisi girilmemiş.';
  const L=[];
  const add=(k,v)=>{ if(v!==''&&v!==null&&v!==undefined&&v!==0) L.push(k+': '+v); };
  add('Cinsiyet',c.sex); add('Yaş',c.age); add('Boy',c.height&&c.height+' cm');
  add('Kilo',c.weight&&c.weight+' kg'); add('Aktivite',c.pal); add('Hedef',c.goal);
  const t=dailyTarget(c); add('Günlük enerji hedefi',t&&t+' kcal');
  add('Protein hedefi',c.pTarget&&c.pTarget+' g');
  add('Alerji / intolerans',c.allergy); add('Hastalık / tanı',c.health);
  add('İlaçlar',c.meds); add('Sevmedikleri',c.dislikes); add('Meslek',c.job);
  if(c.note) add('Not',String(c.note).slice(0,400));
  return L.length?L.join('\n'):'Danışan bilgisi girilmemiş.';
}
const TONE_TXT=t=> t==='kisa' ? 'Kısa ve net yaz, süsleme yapma.'
  : t==='resmi' ? 'Kibar ve profesyonel bir dille yaz.'
  : 'Sıcak, samimi ve teşvik edici bir dille yaz; danışana "sen" diye hitap et.';

'- Günlük toplam yaklaşık '+(kcal||'uygun')+' kcal olacak şekilde porsiyonla.',
'- Market bulunabilirliği yüksek, mevsimlik ve ekonomik besinler seç. Egzotik ya da bulunması zor ürün kullanma.',
'- Günler birbirinin kopyası olmasın; kahvaltılar ve akşamlar çeşitlensin.',
'- Alerji, sevmedikleri ve hastalık bilgisine kesinlikle uy.',

'- "title" öğünün iştah açıcı kısa adı. Ara öğünlerde title boş kalabilir.',
'- "tip" o öğün için 1 cümlelik hazırlanış tarifi veya püf noktası. '+TONE_TXT(tone),
'- "sub" o günün tek cümlelik teması.',
'- Türkçe yaz.',
'',
'JSON ŞEMASI:',
'{"days":[{"sub":"gün teması","meals":[{"slot":0,"title":"","lines":[""],"tip":""}]}]}',
'',
'DANIŞAN:',
clientBrief(c),
extra?('\nDİYETİSYEN NOTU:\n'+String(extra).slice(0,1500)):''].join('\n');
}

async function runGen(){

  drawGen('loading');
  try{

function normDays(j,limit){
  return (j.days||[]).slice(0,limit).map(d=>({
    sub:String(d.sub||'').slice(0,120),
    meals:(d.meals||[]).map(m=>({
      slot:Math.max(0,Math.min(MEAL_PRESET.length-1,+m.slot||0)),
      title:String(m.title||'').slice(0,90),
      lines:(Array.isArray(m.lines)?m.lines:[]).map(x=>String(x).trim()).filter(Boolean).slice(0,14),
      tip:String(m.tip||'').slice(0,220)
    }))
  }));
}

/* ── B) Tanınmayan satırları Gemini ile eşleştir ── */
async function runMatch(mi){
  const pl=DB.plans.find(x=>x.id===S.plan); if(!pl) return;
  if(!gemKey()){ S.gemDiag=null; return gemDiagModal(); }
  const m=pl.days[S.day].meals[mi];
  const miss=mealNutri(m).miss;
  if(!miss.length) return toast('Eşleşmeyen satır yok');
  S.mtMi=mi; S.mtRes=null; drawMatch('loading');
  try{
    const names=DB.foods.slice(0,500).map(f=>f.n);
    const prompt=[
'Aşağıdaki beslenme programı satırlarını besin kütüphanesiyle eşleştir.','',
'KURALLAR:',
'- Yanıtı SADECE geçerli JSON olarak ver.',
'- Her satır için: kütüphanede karşılığı varsa "food" alanına listedeki adı AYNEN yaz.',
'- Çay, kahve, su, baharat, limon suyu gibi kalorisi ihmal edilebilir şeylerde "ignore": true yaz.',
'- Kütüphanede yoksa ve kalorisi varsa "yeni" alanını doldur: 100 gram için tahmini değerler.',
'- "yeni.birimG": satırdaki ölçünün TEK biriminin kaç gram geldiği. Örnek: "2 tam ceviz" için bir cevizin içi ~5 g olduğundan 5 yaz. "1 dilim ekmek" için 30 yaz. Emin değilsen 100 yaz.',
'- Tahminlerin Türkiye’de yaygın kullanılan besin bileşim tablolarına yakın olsun.',
'- Emin değilsen food ve yeni alanlarını boş bırak.','',
'JSON ŞEMASI:',
'{"sonuc":[{"satir":"","food":"","ignore":false,"yeni":{"n":"","kcal":0,"p":0,"k":0,"y":0,"lif":0,"birimG":0}}]}','',
'EŞLEŞTİRİLECEK SATIRLAR:',
miss.map(x=>'- '+x.raw).join('\n'),'',
'BESİN KÜTÜPHANESİ:',
names.join(', ')].join('\n');
    const j=gemJson(await geminiText(prompt,4096));
    const byName={}; DB.foods.forEach(f=>byName[FOLD(f.n)]=f);
    S.mtRes=(j.sonuc||[]).map((x,i)=>{
      const src=miss[i]||miss.find(mm=>FOLD(mm.raw)===FOLD(x.satir));
      if(!src) return null;
      const hit=x.food?byName[FOLD(x.food)]:null;
      return {key:FOLD(src.name),raw:src.raw,unit:src.unit||'',
        food:hit||null, ignore:!!x.ignore && !hit,
        yeni:(!hit && !x.ignore && x.yeni && +x.yeni.kcal>=0 && x.yeni.n)?x.yeni:null};
    }).filter(Boolean);
    if(!S.mtRes.length) throw new Error('Eşleştirme çıkmadı');
    drawMatch('done');
  }catch(e){ drawMatch('error',e.message); }
}
function drawMatch(state,err){
  const r=S.mtRes;
  const row=x=>`<tr><td>${esc(x.raw)}</td><td>${
      x.food?`<b>${esc(x.food.n)}</b> <span style="color:var(--muted);font-size:12px">kütüphanede</span>`
    : x.ignore?`<span style="color:var(--muted)">hesaba katılmayacak</span>`
    : x.yeni?`<b>${esc(x.yeni.n)}</b> <span style="color:var(--muted);font-size:12px">yeni kayıt · ${Math.round(+x.yeni.kcal||0)} kcal/100g · 1 ${esc(x.unit||'porsiyon')} ≈ ${Math.round(+x.yeni.birimG||100)} g</span>`
    : `<span style="color:var(--danger)">bulunamadı</span>`}</td></tr>`;
  const body = state==='done'&&r
   ? `<p style="margin:0 0 12px;color:var(--muted);font-size:13px">Onaylarsan bu eşleştirmeler kalıcı olur, aynı satırı bir daha yazdığında otomatik tanınır. Tahminî değerler yaklaşık olabilir; besin kütüphanesinden düzeltebilirsin.</p>
      <div class="tw"><table><thead><tr><th>Satır</th><th>Önerilen karşılık</th></tr></thead><tbody>${r.map(row).join('')}</tbody></table></div>
      <div class="ai-actions" style="margin-top:14px">
        <button class="btn" data-mt-run="${S.mtMi}">↻ Yeniden dene</button>
        <button class="btn btn-primary" data-mt-apply="1">Eşleştirmeleri kaydet</button></div>`
   : state==='loading' ? `<div class="ai-load"><span class="spin"></span><b>Satırlar eşleştiriliyor…</b><small>15-40 saniye</small></div>`
   : `<div class="ai-load"><span style="font-size:30px">⚠️</span><b style="color:var(--danger)">${esc(err||'Olmadı')}</b></div>
      <button class="btn btn-primary" data-mt-run="${S.mtMi}" style="margin-top:12px;width:100%;justify-content:center">↻ Tekrar dene</button>`;
  modal('Gemini ile eşleştir',body,'Kapat','close','700px');
}
async function applyMatch(){
  if(!S.mtRes) return;
  DB.foodMap=DB.foodMap||{};
  let nf=0, nm=0, ni=0;
  S.mtRes.forEach(x=>{
    if(x.food){ DB.foodMap[x.key]=x.food.id; nm++; }
    else if(x.ignore){ DB.foodMap[x.key]='__yok__'; ni++; }
    else if(x.yeni){
      const bg=Math.max(1,Math.min(500,+x.yeni.birimG||100));
      const rec={id:uid('f'),n:String(x.yeni.n).slice(0,60),cat:'Gemini tahmini',g:bg,u:{},gi:0};
      NUTRI_KEYS.forEach(k=>rec[k]=+x.yeni[k]||0);
      if(x.unit) rec.u[FOLD(x.unit)]=bg;
      DB.foods.push(rec); DB.foodMap[x.key]=rec.id; nf++;
    }
  });
  dropFoodIndex(); S.mtRes=null;
  await save(); toast(nm+' eşleşti · '+nf+' yeni besin · '+ni+' hesap dışı'); closeModal(); render();
}

async function runPaste(){
  const raw=(document.getElementById('pst-raw')||{}).value||S.pasteRaw||'';
  S.pasteRaw=raw;
  S.pasteDays=+((document.getElementById('pst-days')||{}).value)||S.pasteDays||7;
  S.pasteTone=(document.getElementById('pst-tone')||{}).value||S.pasteTone||'samimi';
  if(raw.trim().length<20) return toast('Önce programın metnini yapıştır');
  drawPaste('loading');
  try{
    const txt=await geminiText(pastePrompt(raw,S.pasteDays,S.pasteTone));
    const j=gemJson(txt);
    const days=(j.days||[]).slice(0,S.pasteDays).map(d=>({
      sub:String(d.sub||'').slice(0,120),
      meals:(d.meals||[]).map(m=>({
        slot:Math.max(0,Math.min(MEAL_PRESET.length-1,+m.slot||0)),
        title:String(m.title||'').slice(0,90),
        lines:(Array.isArray(m.lines)?m.lines:[]).map(x=>String(x).trim()).filter(Boolean).slice(0,14),
        tip:String(m.tip||'').slice(0,220)
      }))
    }));
    if(!days.length) throw new Error('Model programı çıkaramadı');
    S.pasteRes={days};
    drawPaste('done');
  }catch(e){ drawPaste('error',e.message); }
}
async function applyPaste(){
  const p=DB.plans.find(x=>x.id===S.plan); if(!p||!S.pasteRes) return;
  const withPhoto=!!((document.getElementById('pst-photo')||{}).checked);
  S.pasteRes.days.forEach((d,di)=>{
    if(di>=p.days.length) return;
    const day=p.days[di];
    if(d.sub) day.sub=d.sub;
    d.meals.forEach(m=>{
      const t=day.meals[m.slot]; if(!t) return;
      if(!m.title && !m.lines.length) return;
      t.title=m.title; t.lines=m.lines;
      if(m.tip) t.tip=m.tip;
    });
  });
  await save(); toast('Program dolduruldu'); render();
  if(withPhoto){ S.bqScope=S.pasteRes.days.length>1?'plan':'day'; S.pasteRes=null; return runBatch(); }
  S.pasteRes=null; closeModal();
}

function batchJobs(scope){
  const p=DB.plans.find(x=>x.id===S.plan); if(!p) return [];
  const idx = scope==='plan' ? p.days.map((_,i)=>i) : [S.day];
  const out=[];
  idx.forEach(di=>p.days[di].meals.forEach((m,mi)=>{
    if(!m.photo && ((m.lines&&m.lines.length)||m.title)) out.push({di,mi});
  }));
  return out;
}

   : state==='run'
   ? `<div class="ai-load"><span class="spin"></span><b>${q.done+q.fail} / ${q.total} tamamlandı</b>

      <button class="btn btn-danger" data-batch-stop="1" style="margin-top:12px;width:100%;justify-content:center">Durdur</button>`
   : `<div class="ai-load"><span style="font-size:32px">${q.fail?'⚠️':'✅'}</span>
        <b>${q.done} görsel eklendi</b>
        <small>${q.fail?q.fail+' öğün üretilemedi'+(q.err?' — '+esc(q.err):''):'Hepsi tamam'}</small></div>`;
  modal('Toplu görsel üretimi',body,'Kapat','close','560px');
}
async function runBatch(){
  const p=DB.plans.find(x=>x.id===S.plan); if(!p) return;
  const jobs=batchJobs(S.bqScope);
  if(!jobs.length) return toast('Üretilecek öğün yok');
  S.bqStop=false;
  S.bq={total:jobs.length,done:0,fail:0,cur:'',err:''};
  drawBatch('run');
  for(const j of jobs){
    if(S.bqStop) break;
    const m=p.days[j.di].meals[j.mi];
    S.bq.cur=(j.di+1)+'. gün · '+(m.title||m.name);
    drawBatch('run');
    try{
      const img=await geminiImage(aiPrompt(m,'plate'),S.gemModel);
      m.photo=img; addToGallery(img,(m.title||m.name)+' (Gemini)');
      S.bq.done++; await save();
    }catch(e){ S.bq.fail++; S.bq.err=e.message; }
    drawBatch('run');
  }
  drawBatch('done');
  render();
}

function addToGallery(dataUrl,label){
  if(!dataUrl) return;

function shrink(file,max,q,square){
  return new Promise((res,rej)=>{
    const fr=new FileReader();
    fr.onload=()=>{ const im=new Image();
      im.onload=()=>{
        let sw=im.width, sh=im.height, sx=0, sy=0;
        if(square){ const m=Math.min(sw,sh); sx=(sw-m)/2; sy=(sh-m)/2; sw=sh=m; }
        const w=square?max:Math.round(sw*Math.min(1,max/sw)), h=square?max:Math.round(sh*Math.min(1,max/sw));
        const cv=document.createElement('canvas'); cv.width=w; cv.height=h;
        cv.getContext('2d').drawImage(im,sx,sy,sw,sh,0,0,w,h);
        res(cv.toDataURL('image/jpeg',q));
      };
      im.onerror=rej; im.src=fr.result; };
    fr.onerror=rej; fr.readAsDataURL(file);
  });
}

/* ══════════════ Word (.docx) üretimi ══════════════ */
const CRCT=(()=>{const t=new Uint32Array(256);for(let n=0;n<256;n++){let c=n;for(let k=0;k<8;k++)c=(c&1)?(0xEDB88320^(c>>>1)):(c>>>1);t[n]=c>>>0;}return t;})();
function crc32(u8){let c=0xFFFFFFFF;for(let i=0;i<u8.length;i++)c=CRCT[(c^u8[i])&255]^(c>>>8);return (c^0xFFFFFFFF)>>>0;}
const TE=new TextEncoder();
function zipStore(files){
  const u16=n=>[n&255,(n>>8)&255], u32=n=>[n&255,(n>>8)&255,(n>>16)&255,(n>>24)&255];
  const parts=[], cdir=[]; let off=0;
  files.forEach(f=>{
    const nm=TE.encode(f.name), d=f.data, crc=crc32(d);
    const lh=new Uint8Array([...u32(0x04034b50),...u16(20),...u16(0),...u16(0),...u16(0),...u16(0),
      ...u32(crc),...u32(d.length),...u32(d.length),...u16(nm.length),...u16(0)]);
    parts.push(lh,nm,d); cdir.push({nm,crc,len:d.length,off}); off+=lh.length+nm.length+d.length;
  });
  const cdStart=off; const cparts=[];
  cdir.forEach(e=>{
    const ch=new Uint8Array([...u32(0x02014b50),...u16(20),...u16(20),...u16(0),...u16(0),...u16(0),...u16(0),
      ...u32(e.crc),...u32(e.len),...u32(e.len),...u16(e.nm.length),...u16(0),...u16(0),...u16(0),...u16(0),...u32(32),...u32(e.off)]);
    cparts.push(ch,e.nm); off+=ch.length+e.nm.length;
  });
  const end=new Uint8Array([...u32(0x06054b50),...u16(0),...u16(0),...u16(cdir.length),...u16(cdir.length),
    ...u32(off-cdStart),...u32(cdStart),...u16(0)]);
  const all=[...parts,...cparts,end];
  const out=new Uint8Array(all.reduce((a,x)=>a+x.length,0));
  let pos=0; all.forEach(x=>{out.set(x,pos);pos+=x.length});
  return out;
}
function b64u8(dataUrl){const b=atob(dataUrl.split(',')[1]),u=new Uint8Array(b.length);for(let i=0;i<b.length;i++)u[i]=b.charCodeAt(i);return u;}
const X=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

function wRPr(o){o=o||{};return `<w:rPr><w:rFonts w:ascii="${o.font||'Calibri'}" w:hAnsi="${o.font||'Calibri'}" w:cs="Segoe UI Emoji"/>`
 +`${o.b?'<w:b/>':''}${o.i?'<w:i/>':''}<w:color w:val="${o.color||'2B3A46'}"/>`
 +`<w:sz w:val="${o.size||22}"/><w:szCs w:val="${o.size||22}"/></w:rPr>`;}
function wPbase(text,o){o=o||{};
  return `<w:p><w:pPr>${o.align?`<w:jc w:val="${o.align}"/>`:''}`
  +`<w:spacing w:before="${o.before||0}" w:after="${o.after==null?60:o.after}" w:line="${o.line||264}" w:lineRule="auto"/>`
  +`${o.bullet?'<w:ind w:left="300" w:hanging="180"/>':''}${o.shd?`<w:shd w:val="clear" w:color="auto" w:fill="${o.shd}"/>`:''}</w:pPr>`
  +`<w:r>${wRPr(o)}<w:t xml:space="preserve">${X((o.bullet?'•  ':'')+text)}</w:t></w:r></w:p>`;}
const wP=wPbase;

  +`<pic:pic xmlns:pic="http://schemas.openxmlformats.org/drawingml/2006/picture"><pic:nvPicPr><pic:cNvPr id="${id}" name="Gorsel ${id}"/><pic:cNvPicPr/></pic:nvPicPr>`

  +`<pic:spPr><a:xfrm><a:off x="0" y="0"/><a:ext cx="${cx}" cy="${cy}"/></a:xfrm><a:prstGeom prst="roundRect"><a:avLst><a:gd name="adj" fmla="val 6000"/></a:avLst></a:prstGeom></pic:spPr>`
  +`</pic:pic></a:graphicData></a:graphic></wp:inline></w:drawing></w:r></w:p>`;}
function wCell(w,content,fill,valign){

function wTable(widths,cells,border){
  return `<w:tbl><w:tblPr><w:tblW w:w="${widths.reduce((a,b)=>a+b,0)}" w:type="dxa"/><w:tblBorders>`

function packDocx(body,media,rels,filename){

<Override PartName="/word/document.xml" ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.document.main+xml"/></Types>`;
  const rootRels=`<?xml version="1.0" encoding="UTF-8" standalone="yes"?>

  const docRels=`<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">${rels.join('')}</Relationships>`;
  const files=[{name:'[Content_Types].xml',data:TE.encode(ct)},{name:'_rels/.rels',data:TE.encode(rootRels)},
    {name:'word/document.xml',data:TE.encode(doc)},{name:'word/_rels/document.xml.rels',data:TE.encode(docRels)},...media];

/* Kilo grafiğini PNG'ye çiz (Word'e gömmek için) */
function chartPng(ms){
  const W=900,H=380,P=56;
  const cv=document.createElement('canvas'); cv.width=W; cv.height=H;
  const x=cv.getContext('2d');
  x.fillStyle='#fff'; x.fillRect(0,0,W,H);
  if(ms.length<2){ x.fillStyle='#7A90A6'; x.font='20px sans-serif'; x.textAlign='center';
    x.fillText('Grafik için en az iki ölçüm gerekiyor',W/2,H/2); return cv.toDataURL('image/jpeg',0.9); }
  const ys=ms.map(m=>+m.weight), y0=Math.min(...ys)-1, y1=Math.max(...ys)+1;
  const ts=ms.map(m=>new Date(m.date).getTime()), t0=Math.min(...ts), t1=Math.max(...ts);
  const px=t=>P+(t-t0)/((t1-t0)||1)*(W-P*1.4), py=v=>28+(1-(v-y0)/((y1-y0)||1))*(H-96);
  x.strokeStyle='#EAF2F9'; x.lineWidth=1; x.fillStyle='#7A90A6'; x.font='13px sans-serif';
  for(let i=0;i<=4;i++){ const v=y1-(y1-y0)*i/4, yy=py(v);
    x.beginPath(); x.moveTo(P,yy); x.lineTo(W-18,yy); x.stroke();
    x.textAlign='right'; x.fillText(v.toFixed(1),P-8,yy+4); }
  const g=x.createLinearGradient(0,20,0,H-60);
  g.addColorStop(0,'rgba(46,139,216,.28)'); g.addColorStop(1,'rgba(46,139,216,0)');
  x.beginPath(); x.moveTo(px(ts[0]),py(ys[0]));
  ms.forEach((m,i)=>x.lineTo(px(ts[i]),py(ys[i])));
  x.lineTo(px(ts[ts.length-1]),H-60); x.lineTo(px(ts[0]),H-60); x.closePath(); x.fillStyle=g; x.fill();
  x.beginPath(); ms.forEach((m,i)=>{const fx=px(ts[i]),fy=py(ys[i]); i?x.lineTo(fx,fy):x.moveTo(fx,fy);});
  x.strokeStyle='#1B72BC'; x.lineWidth=3.5; x.lineJoin='round'; x.stroke();
  ms.forEach((m,i)=>{ x.beginPath(); x.arc(px(ts[i]),py(ys[i]),6,0,7); x.fillStyle='#fff'; x.fill();
    x.strokeStyle='#1B72BC'; x.lineWidth=3; x.stroke(); });
  x.fillStyle='#41586E'; x.font='13px sans-serif'; x.textAlign='left';
  x.fillText(new Date(ms[0].date).toLocaleDateString('tr-TR'),P,H-28);
  x.textAlign='right';
  x.fillText(new Date(ms[ms.length-1].date).toLocaleDateString('tr-TR'),W-18,H-28);
  return cv.toDataURL('image/jpeg',0.92);
}

function imgDims(dataUrl){
  return new Promise(res=>{
    try{ const im=new Image();
      im.onload=()=>res({w:im.naturalWidth||1,h:im.naturalHeight||1});
      im.onerror=()=>res({w:1,h:1});
      im.src=dataUrl;
    }catch(e){ res({w:1,h:1}); }
  });
}
function fitEMU(d,maxW,maxH){
  const r=((d&&d.w)/(d&&d.h))||1;
  let w=maxW, h=Math.round(maxW/r);
  if(h>maxH){ h=maxH; w=Math.round(maxH*r); }
  return [Math.max(1,Math.round(w)),Math.max(1,Math.round(h))];
}

<Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/>
<Default Extension="xml" ContentType="application/xml"/><Default Extension="jpeg" ContentType="image/jpeg"/>
<Default Extension="png" ContentType="image/png"/>
<Override PartName="/word/document.xml" ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.document.main+xml"/></Types>`;
  const rootRels=`<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">
<Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="word/document.xml"/></Relationships>`;
  const docRels=`<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">${rels.join('')}</Relationships>`;

  const fname=((c?c.name+' - ':'')+p.name).replace(/[\\/:*?"<>|]/g,'').slice(0,80)+'.docx';
