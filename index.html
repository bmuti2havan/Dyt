<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dyt. Ayşenur KORKMAZ — Beslenme Danışmanlığı Paneli</title>
<style>
:root{
  --blue-900:#0B3B63; --blue-700:#125A96; --blue-600:#1B72BC; --blue-500:#2E8BD8;
  --blue-100:#DDEDFA; --blue-50:#EFF7FD; --canvas:#F1F7FC;
  --ink:#0E2438; --ink-2:#41586E; --muted:#7A90A6; --line:#D9E6F2; --line-2:#EAF2F9;
  --surface:#FFFFFF;
  --protein:#2563C9; --karb:#3E9BC4; --yag:#2E9BAE; --lif:#4A7FD0;
  --ok:#0F7B96; --ok-bg:#E3F4F8; --warn:#9A6B06; --warn-bg:#FCF3E1; --danger:#B23A31; --danger-bg:#FBECEA;
  --r:14px; --r-s:10px;
  --shadow:0 1px 2px rgba(14,36,56,.04), 0 12px 28px -22px rgba(14,36,56,.5);
  --shadow-lg:0 2px 4px rgba(14,36,56,.04), 0 22px 48px -28px rgba(14,36,56,.55);
  --ring:0 0 0 3px rgba(46,139,216,.16);
  --serif:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,ui-serif,serif;
  --sans:ui-sans-serif,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,"Roboto Mono",monospace;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--canvas);color:var(--ink);font-family:var(--sans);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
h1,h2,h3,h4{font-family:var(--serif);font-weight:600;letter-spacing:-.01em;margin:0}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}

.app{display:flex;min-height:100vh}
body{background:radial-gradient(1200px 600px at 78% -10%, #E7F1FB 0%, transparent 60%), var(--canvas)}
.rail{width:262px;flex:0 0 262px;background:linear-gradient(185deg,#FFFFFF 0%,#F3F9FE 100%);border-right:1px solid var(--line);position:sticky;top:0;height:100vh;display:flex;flex-direction:column}
.i{flex:0 0 auto;vertical-align:-3px}
.brand{padding:20px 18px 16px;border-bottom:1px solid var(--line-2);display:flex;gap:12px;align-items:center}
.brand .mark{width:42px;height:42px;flex:0 0 42px;border-radius:13px;background:linear-gradient(140deg,var(--blue-500),var(--blue-700));color:#fff;display:grid;place-items:center;font-family:var(--serif);font-size:16px;letter-spacing:.02em;box-shadow:0 8px 18px -10px var(--blue-600)}
.brand>div{min-width:0}
.brand b{display:block;font-family:var(--serif);font-size:15.5px;color:var(--blue-900);line-height:1.25}
.brand span{font-size:10px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
nav{padding:12px 12px 8px;overflow:auto;flex:1}
.nav-sec{font-size:10px;letter-spacing:.13em;text-transform:uppercase;color:var(--muted);padding:14px 10px 6px}
.nav-item{position:relative;display:flex;align-items:center;gap:11px;width:100%;text-align:left;background:none;border:0;padding:10px 12px;border-radius:var(--r-s);color:var(--ink-2);font-size:14px;margin-bottom:3px;transition:background .14s,color .14s}
.nav-item:hover{background:#EAF3FB;color:var(--blue-700)}
.nav-item[aria-current="page"]{background:linear-gradient(100deg,var(--blue-600),var(--blue-500));color:#fff;box-shadow:0 10px 20px -12px var(--blue-600)}
.nav-item[aria-current="page"]::before{content:'';position:absolute;left:-12px;top:50%;transform:translateY(-50%);width:4px;height:20px;border-radius:0 4px 4px 0;background:var(--blue-700)}
.nav-item .ic{width:18px;height:18px;display:grid;place-items:center;opacity:.9}
.nav-item .count{margin-left:auto;font-family:var(--mono);font-size:11px;opacity:.7}
.rail-foot{padding:12px;border-top:1px solid var(--line-2);display:grid;gap:6px}
.savestate{font-size:11.5px;color:var(--muted);display:flex;align-items:center;gap:6px;padding:0 4px}

.main{flex:1;min-width:0;display:flex;flex-direction:column}
.topbar{height:62px;background:rgba(255,255,255,.86);backdrop-filter:saturate(160%) blur(8px);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px;padding:0 26px;position:sticky;top:0;z-index:20}
.crumb{font-size:13px;color:var(--muted)}
.crumb b{color:var(--ink);font-weight:600}
.top-right{margin-left:auto;display:flex;align-items:center;gap:10px}
.who{display:flex;align-items:center;gap:9px;padding-left:12px;border-left:1px solid var(--line)}
.avatar{width:36px;height:36px;border-radius:12px;background:linear-gradient(140deg,var(--blue-500),var(--blue-700));color:#fff;display:grid;place-items:center;font-size:12.5px;font-weight:700;letter-spacing:.02em}
.av{width:34px;height:34px;border-radius:11px;display:grid;place-items:center;color:#fff;font-size:12px;font-weight:700;flex:0 0 34px}
.av-row{display:flex;align-items:center;gap:11px}
.who small{display:block;color:var(--muted);font-size:11px}
.page{padding:26px;max-width:1360px;width:100%;margin:0 auto}
.page-head{display:flex;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:20px}
.page-head h1{font-size:29px;color:var(--blue-900);letter-spacing:-.02em}
.page-head p{margin:6px 0 0;color:var(--muted);max-width:70ch}
.spacer{flex:1}

.btn{display:inline-flex;align-items:center;gap:7px;border-radius:var(--r-s);border:1px solid var(--line);background:#fff;padding:9px 14px;font-size:13.5px;font-weight:500;color:var(--ink-2);transition:transform .12s,box-shadow .14s,background .14s,border-color .14s}
.btn:hover{border-color:#BFD6E9;background:var(--blue-50);color:var(--blue-700)}
.btn:active{transform:translateY(1px)}
.btn-primary{background:linear-gradient(100deg,var(--blue-600),var(--blue-500));border-color:transparent;color:#fff;box-shadow:0 10px 20px -12px var(--blue-600)}
.btn-primary:hover{background:linear-gradient(100deg,var(--blue-700),var(--blue-600));color:#fff;box-shadow:0 12px 24px -12px var(--blue-700)}
.btn-ghost{border-color:transparent;background:none}
.btn-sm{padding:6px 10px;font-size:12.5px}
.btn-danger{color:var(--danger);border-color:#EFD3CF}
.btn-danger:hover{background:var(--danger-bg);color:var(--danger);border-color:#E4BDB8}

.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
.card-h h3{display:flex;align-items:center;gap:8px}
.card-h{display:flex;align-items:center;gap:10px;padding:14px 16px;border-bottom:1px solid var(--line-2)}
.card-h h3{font-size:16px}
.card-b{padding:16px}
.grid{display:grid;gap:16px}
.g-2{grid-template-columns:1fr 340px}
.g-3{grid-template-columns:repeat(3,1fr)}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:20px}
.stat{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;box-shadow:var(--shadow);overflow:hidden;transition:transform .16s,box-shadow .16s}
.stat:hover{transform:translateY(-2px);box-shadow:var(--shadow-lg)}
.stat::after{content:'';position:absolute;right:-28px;top:-28px;width:86px;height:86px;border-radius:50%;background:var(--blue-50)}
.stat .badge{position:relative;z-index:1;width:34px;height:34px;border-radius:11px;background:var(--blue-100);color:var(--blue-700);display:grid;place-items:center;margin-bottom:12px}
.stat .lbl{position:relative;z-index:1;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.stat .val{position:relative;z-index:1;font-family:var(--mono);font-size:27px;font-weight:600;margin-top:5px;color:var(--blue-900);letter-spacing:-.02em}
.stat .sub{position:relative;z-index:1;font-size:12px;color:var(--muted);margin-top:3px}

table{width:100%;border-collapse:collapse}
th{text-align:left;font-size:10.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);font-weight:700;padding:11px 14px;background:var(--blue-50);border-bottom:1px solid var(--line)}
td{padding:12px 14px;border-bottom:1px solid var(--line-2);vertical-align:middle}
tbody tr:last-child td{border-bottom:0}
tbody tr{transition:background .12s}
tbody tr:hover{background:#F6FBFF}
th:first-child{border-top-left-radius:0}
.t-right{text-align:right}
.t-name{font-weight:600}
.t-sub{font-size:12px;color:var(--muted);margin-top:2px}

.tag{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;padding:3px 9px;border-radius:99px;border:1px solid var(--line);background:#fff;color:var(--ink-2);white-space:nowrap}
.tag-blue{background:var(--blue-100);border-color:#C4DFF6;color:var(--blue-700)}
.tag-ok{background:var(--ok-bg);border-color:#BFE2EC;color:var(--ok)}
.tag-warn{background:var(--warn-bg);border-color:#EEDFB9;color:var(--warn)}
.tag-danger{background:var(--danger-bg);border-color:#F0D2CE;color:var(--danger)}
.dot{width:6px;height:6px;border-radius:50%;background:currentColor}

.field{display:flex;flex-direction:column;gap:5px}
.field label{font-size:12px;color:var(--ink-2);font-weight:600}
.field input,.field select,.field textarea{border:1px solid var(--line);background:#fff;border-radius:var(--r-s);padding:9px 11px;outline:0;width:100%}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--blue-500);box-shadow:var(--ring)}
.searchbar:focus-within{border-color:var(--blue-500);box-shadow:var(--ring)}
.field .hint{font-size:11.5px;color:var(--muted)}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.form-grid .full{grid-column:1/-1}
.searchbar{display:flex;align-items:center;gap:9px;background:#fff;border:1px solid var(--line);border-radius:99px;padding:8px 14px;min-width:260px}
.searchbar input{border:0;outline:0;width:100%}
.filters{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:16px}

.macro-bar{height:7px;border-radius:99px;background:var(--line-2);overflow:hidden;display:flex;margin-top:8px}
.macro-bar i{height:100%}
.macro-legend{display:flex;gap:14px;margin-top:7px;font-size:11.5px;color:var(--muted);flex-wrap:wrap}
.macro-legend b{font-family:var(--mono);color:var(--ink)}
.sw{width:8px;height:8px;border-radius:2px;display:inline-block;margin-right:5px}
.goal{display:grid;grid-template-columns:78px 1fr 108px;gap:10px;align-items:center;padding:6px 0}
.g-lbl{font-size:12.5px;color:var(--ink-2)}
.g-track{height:8px;border-radius:99px;background:var(--line-2);overflow:hidden;position:relative}
.g-fill{height:100%;border-radius:99px}
.g-over{position:absolute;top:0;height:100%;background-image:repeating-linear-gradient(45deg,var(--danger) 0 4px,#E7A79F 4px 8px)}
.g-val{font-family:var(--mono);font-size:12px;text-align:right;color:var(--muted)}
.g-val b{color:var(--ink)}

.tabs{display:inline-flex;gap:3px;background:#E9F1F8;border:1px solid var(--line);border-radius:12px;padding:4px;margin-bottom:20px;overflow:auto;max-width:100%}
.tab{border:0;background:none;padding:8px 15px;color:var(--ink-2);border-radius:9px;font-size:13.5px;white-space:nowrap;transition:background .14s,color .14s,box-shadow .14s}
.tab:hover{color:var(--blue-700)}
.tab[aria-selected="true"]{background:#fff;color:var(--blue-700);font-weight:600;box-shadow:0 2px 6px -2px rgba(14,36,56,.25)}
.days{display:flex;gap:7px;overflow:auto;padding-bottom:6px;margin-bottom:14px}
.day{flex:0 0 auto;border:1px solid var(--line);background:#fff;border-radius:var(--r-s);padding:8px 14px;text-align:center;min-width:86px}
.day .d-n{font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.day .d-d{font-family:var(--serif);font-size:19px}
.day .d-k{font-family:var(--mono);font-size:10.5px;color:var(--muted)}
.day[aria-pressed="true"]{background:var(--blue-600);border-color:var(--blue-600);color:#fff}
.day[aria-pressed="true"] .d-n,.day[aria-pressed="true"] .d-k{color:#CFE6F8}

.meal-h{display:flex;align-items:center;gap:10px;padding:12px 15px;border-bottom:1px solid var(--line-2);background:var(--blue-50);border-radius:var(--r) var(--r) 0 0}
.meal-h h4{font-size:14.5px;color:var(--blue-900)}
.meal-h .time{font-family:var(--mono);font-size:11.5px;color:var(--muted)}
.meal-h .kcal{font-family:var(--mono);font-size:13px;font-weight:600}
.item{display:grid;grid-template-columns:1fr auto auto;gap:12px;align-items:center;padding:10px 15px;border-bottom:1px solid var(--line-2)}
.item:last-child{border-bottom:0}
.i-q{font-family:var(--mono);font-size:11.5px;color:var(--muted);margin-top:2px}
.i-v{font-family:var(--mono);font-size:11.5px;color:var(--muted);text-align:right;white-space:nowrap}
.i-v b{display:block;color:var(--ink);font-size:13px}
.x{border:0;background:none;color:var(--muted);width:26px;height:26px;border-radius:6px}
.x:hover{background:var(--danger-bg);color:var(--danger)}

.empty{padding:52px 20px;text-align:center}
.empty .eic{width:56px;height:56px;border-radius:18px;background:var(--blue-50);color:var(--blue-600);display:grid;place-items:center;margin:0 auto 14px}
.empty h4{font-size:17px;margin-bottom:6px}
.empty p{color:var(--muted);margin:0 auto 16px;max-width:46ch}

.modal-bg{position:fixed;inset:0;background:rgba(11,59,99,.35);backdrop-filter:blur(2px);display:grid;place-items:center;z-index:60;padding:20px}
.modal{background:#fff;border-radius:14px;width:min(620px,100%);max-height:88vh;overflow:auto;box-shadow:0 30px 60px -20px rgba(11,59,99,.4)}
.modal-h{display:flex;align-items:center;gap:10px;padding:16px 20px;border-bottom:1px solid var(--line-2);position:sticky;top:0;background:#fff}
.modal-h h3{font-size:17px}
.modal-b{padding:20px}
.modal-f{display:flex;gap:10px;justify-content:flex-end;padding:14px 20px;border-top:1px solid var(--line-2);position:sticky;bottom:0;background:#fff}

.toast{position:fixed;right:22px;bottom:22px;background:var(--blue-900);color:#fff;padding:11px 16px;border-radius:10px;font-size:13.5px;z-index:80;box-shadow:0 14px 30px -12px rgba(11,59,99,.6)}
.kv{display:flex;justify-content:space-between;gap:12px;padding:9px 0;border-bottom:1px dashed var(--line);font-size:13.5px}
.kv:last-child{border-bottom:0}
.kv b{font-family:var(--mono)}
.pill-row{display:flex;gap:8px;flex-wrap:wrap}
.hero{position:relative;overflow:hidden;background:linear-gradient(135deg,var(--blue-700) 0%,var(--blue-500) 55%,#4FA6E0 100%);color:#fff;border-radius:18px;padding:24px 26px;box-shadow:0 20px 40px -26px var(--blue-700)}
.hero::after{content:'';position:absolute;right:-60px;top:-90px;width:280px;height:280px;border-radius:50%;background:rgba(255,255,255,.09)}
.hero::before{content:'';position:absolute;right:60px;bottom:-120px;width:200px;height:200px;border-radius:50%;background:rgba(255,255,255,.06)}
.hero>*{position:relative;z-index:1}
.hero h1{color:#fff;font-size:26px}
.hero p{margin:8px 0 0;color:#D9EDFB;max-width:62ch}
.hero .meta{display:flex;gap:20px;flex-wrap:wrap;margin-top:14px;font-size:12.5px;color:#CFE6F8}
.hero .meta b{font-family:var(--mono);color:#fff}
:focus-visible{outline:2px solid var(--blue-500);outline-offset:2px}
#lock{position:fixed;inset:0;z-index:200;display:grid;place-items:center;padding:20px;
  background:radial-gradient(900px 520px at 50% -5%, #3D97DE 0%, #125A96 55%, #0B3B63 100%)}
.lock-card{background:#fff;border-radius:22px;padding:30px 28px;width:min(380px,100%);text-align:center;
  box-shadow:0 40px 80px -30px rgba(6,32,54,.7)}
.lock-card .lg{max-width:190px;width:70%;margin:0 auto 16px;display:block}
.lock-card h2{font-size:18px;color:var(--blue-900)}
.lock-card p{color:var(--muted);font-size:13px;margin:6px 0 20px}
.pin-dots{display:flex;gap:12px;justify-content:center;margin-bottom:18px}
.pin-dots i{width:13px;height:13px;border-radius:50%;background:#DCE7F1;transition:transform .15s,background .15s}
.pin-dots i.on{background:var(--blue-600);transform:scale(1.15)}
#pinInput{position:absolute;opacity:0;pointer-events:none}
.keys{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.keys button{height:52px;border-radius:14px;border:1px solid var(--line);background:#fff;font-size:20px;
  font-family:var(--mono);color:var(--blue-900);transition:transform .1s,background .14s}
.keys button:hover{background:var(--blue-50)}
.keys button:active{transform:scale(.96)}
.keys .fn{font-size:13px;font-family:var(--sans);color:var(--muted)}
.lock-err{color:var(--danger);font-size:13px;min-height:18px;margin-top:12px}
.shake{animation:sh .32s}
@keyframes sh{0%,100%{transform:none}20%{transform:translateX(-8px)}40%{transform:translateX(8px)}60%{transform:translateX(-5px)}80%{transform:translateX(5px)}}
.brand-logo{display:block;width:100%;max-width:210px;margin:0 auto}

@media (max-width:1100px){.g-2{grid-template-columns:1fr}.stats{grid-template-columns:repeat(2,1fr)}.g-3{grid-template-columns:1fr}}
@media (max-width:820px){.app{flex-direction:column}.rail{width:100%;height:auto;position:static}.rail nav{display:flex;overflow:auto;gap:4px;padding:8px}.nav-sec,.rail-foot{display:none}.nav-item{width:auto;white-space:nowrap}.form-grid{grid-template-columns:1fr}.page{padding:16px}}

@media print{
  .rail,.topbar,.no-print{display:none!important}
  body{background:#fff}
  .page{padding:0;max-width:none}
  .card{box-shadow:none;break-inside:avoid}
  .print-head{display:block!important;margin-bottom:16px;border-bottom:2px solid var(--blue-700);padding-bottom:10px}
}
.print-head{display:none}
.only-print{display:none}
.meal-edit{display:grid;grid-template-columns:1fr 232px;gap:18px;align-items:start}
.meal-card .meal-h h4{letter-spacing:.03em}
.ph{display:grid;gap:8px}
.ph img{width:100%;aspect-ratio:1/1;object-fit:cover;border-radius:10px;border:1px solid var(--line)}
.ph.wide img,.ph-drop.wide{aspect-ratio:16/9}
.ph-actions{display:flex;gap:6px}
.ph-actions .btn{flex:1;justify-content:center}
.ph-drop{display:grid;gap:4px;place-items:center;text-align:center;aspect-ratio:1/1;border:2px dashed #B9D4EA;border-radius:12px;background:var(--blue-50);color:var(--blue-700);padding:14px;cursor:pointer}
.ph-drop:hover{background:#E4F1FC;border-color:var(--blue-500)}
.ph-plus{font-size:26px;line-height:1}
.ph-drop small{color:var(--muted);font-size:11px;line-height:1.35}
.logo-box{display:flex;gap:12px;align-items:center}
.logo-box img{height:64px;border-radius:8px;border:1px solid var(--line)}
@media (max-width:900px){.meal-edit{grid-template-columns:1fr}.ph img,.ph-drop{aspect-ratio:16/9}}
.fm .fm-grid{display:grid;grid-template-columns:1fr 1fr;gap:0 26px}
.fm-row{display:grid;grid-template-columns:132px 1fr;gap:12px;align-items:center;padding:9px 0;border-bottom:1px solid var(--line-2)}
.fm-l{font-size:12.5px;font-weight:600;color:var(--blue-900);letter-spacing:.02em;text-transform:uppercase}
.fm-row input,.fm-row textarea{border:0;border-bottom:1px solid transparent;background:var(--blue-50);border-radius:8px;padding:8px 11px;width:100%;outline:0;resize:vertical}
.fm-row input:focus,.fm-row textarea:focus{background:#fff;box-shadow:0 0 0 3px rgba(46,139,216,.15)}
.fm-block{margin-top:14px;border-top:2px solid var(--line);padding-top:6px}
.fm-blank{display:block;height:26px;border-bottom:1px dotted var(--muted)}
@media print{
  .only-print{display:table-row}
  p.only-print{display:block}
  .fm-row input,.fm-row textarea{background:none;border-bottom:1px dotted #7A90A6;border-radius:0;padding:6px 2px}
  .fm .fm-grid{gap:0 20px}
  table{page-break-inside:auto}
}
</style>
</head>
<body>
<div class="app">
  <aside class="rail">
    <div class="brand" style="display:block;text-align:center">
      <img class="brand-logo" id="brandLogo" alt="Dyt. Ayşenur KORKMAZ">
      <b id="brandName" style="display:none"></b>
      <span id="brandSub" style="display:block;margin-top:8px">Beslenme ve Diyet Danışmanlığı</span>
    </div>
    <nav id="nav"></nav>
    <div class="rail-foot">

function newDays(){return Array.from({length:7},(_,i)=>({sub:DAY_SUB[i],photo:'',
  meals:MEAL_PRESET.map(m=>({name:m[0],emoji:m[1],title:'',lines:[],photo:''}))}));}
function migratePlan(p){
  if(!p.days) p.days=newDays();
  p.days.forEach(d=>{
    if(!d.meals) d.meals=MEAL_PRESET.map(m=>({name:m[0],emoji:m[1],title:'',lines:[],photo:''}));
    if(d.sub===undefined) d.sub='';
    if(d.photo===undefined) d.photo='';
    d.meals.forEach(m=>{
      if(!m.lines) m.lines=(m.items||[]).map(i=>(i.q&&i.q!=='1 porsiyon'?i.q+' '+i.n:i.n));
      delete m.items;
      if(m.title===undefined) m.title='';
      if(m.photo===undefined) m.photo='';
      if(!m.emoji){const f=MEAL_PRESET.find(x=>x[0].toLocaleLowerCase('tr')===String(m.name||'').toLocaleLowerCase('tr'));m.emoji=f?f[1]:'🍽';}
    });
  });
  if(p.firstDay===undefined){
    const d=p.start? new Date(p.start):new Date();
    p.firstDay=(d.getDay()+6)%7;   // 0 = Pazartesi
  }
  if(!p.sub) p.sub=TPL.sub;
  if(!p.purpose||!p.purpose.length) p.purpose=TPL.purpose.slice();
  if(!p.closing) p.closing=TPL.closing;
  if(p.footer===undefined) p.footer='';
}

      phone:'', mail:'', note:'Sorularınız için bana yazabilirsiniz.', logo:LOGO},

  };
}
async function loadDB(){
  let raw=null;
  try{ const r=await window.storage.get(KEY); raw=r&&r.value; }catch(e){}
  if(!raw){ try{ raw=localStorage.getItem(KEY); }catch(e){} }
  DB = raw? JSON.parse(raw) : seed();
  if(!DB.foods||!DB.foods.length) DB.foods=SEED_FOODS;
  if(!DB.profile.logo || DB.profile.logoV!==2){ DB.profile.logo=LOGO; DB.profile.logoV=2; }
}
async function save(){
  const raw=JSON.stringify(DB); saving=true; paintSave('Kaydediliyor…','var(--warn)');
  let ok=false;
  try{ await window.storage.set(KEY,raw); ok=true; }catch(e){}
  try{ localStorage.setItem(KEY,raw); ok=true; }catch(e){}
  paintSave(ok?'Kaydedildi':'Tarayıcı kaydetmiyor — yedek alın', ok?'var(--ok)':'var(--danger)');
}
function paintSave(t,c){ const d=document.getElementById('saveDot'), s=document.getElementById('saveTxt'); if(d){d.style.color=c;} if(s){s.textContent=t;} }

const uid=p=>p+(DB.seq++)+'-'+Date.now().toString(36).slice(-4);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const n1=n=>Number(n||0).toFixed(1).replace(/\.0$/,'');
const kc=n=>Math.round(Number(n)||0);
const todayISO=()=>new Date().toISOString().slice(0,10);
const trDate=s=>{ if(!s) return '—'; const d=new Date(s); return d.toLocaleDateString('tr-TR',{day:'2-digit',month:'short',year:'numeric'}); };
const trDT=s=>{ if(!s) return '—'; const d=new Date(s); return d.toLocaleDateString('tr-TR',{day:'2-digit',month:'short'})+' · '+d.toLocaleTimeString('tr-TR',{hour:'2-digit',minute:'2-digit'}); };

function bmi(kg,cm){ if(!kg||!cm) return null; return kg/Math.pow(cm/100,2); }
function bmiLabel(v){ if(v==null) return ['—','']; if(v<18.5) return ['Zayıf','tag-warn']; if(v<25) return ['Normal','tag-ok']; if(v<30) return ['Fazla kilolu','tag-warn']; return ['Obez','tag-danger']; }
function bmr(c){ // Mifflin-St Jeor
  const w=+c.weight, h=+c.height, a=+c.age; if(!w||!h||!a) return null;
  return c.sex==='K' ? 10*w+6.25*h-5*a-161 : 10*w+6.25*h-5*a+5;
}
const PAL={'1.2':'Hareketsiz','1.375':'Hafif aktif','1.55':'Orta aktif','1.725':'Çok aktif','1.9':'Sporcu'};
function tdee(c){ const b=bmr(c); return b? b*(+c.pal||1.375) : null; }
function idealWeight(c){ const h=+c.height; if(!h) return null; return c.sex==='K'? 45.5+0.91*(h-152.4) : 50+0.91*(h-152.4); }

function macroBar(p,k,y){
  const kp=p*4,kk=k*4,ky=y*9,t=Math.max(kp+kk+ky,1),pc=v=>Math.round(v/t*100);
  return `<div class="macro-bar"><i style="width:${kp/t*100}%;background:var(--protein)"></i><i style="width:${kk/t*100}%;background:var(--karb)"></i><i style="width:${ky/t*100}%;background:var(--yag)"></i></div>
  <div class="macro-legend">
    <span><i class="sw" style="background:var(--protein)"></i>Protein <b>${n1(p)} g</b> · %${pc(kp)}</span>
    <span><i class="sw" style="background:var(--karb)"></i>Karbonhidrat <b>${n1(k)} g</b> · %${pc(kk)}</span>
    <span><i class="sw" style="background:var(--yag)"></i>Yağ <b>${n1(y)} g</b> · %${pc(ky)}</span></div>`;
}
function goalRow(lbl,val,target,unit,color){
  if(!target) return '';
  const pct=val/target*100, base=Math.min(pct,100), over=Math.max(0,Math.min(pct-100,55));
  return `<div class="goal"><span class="g-lbl">${lbl}</span>
    <span class="g-track"><span class="g-fill" style="width:${base}%;background:${color}"></span>
    ${over?`<span class="g-over" style="left:${100-over}%;width:${over}%"></span>`:''}</span>
    <span class="g-val"><b>${n1(val)}</b>/${kc(target)} ${unit} · %${Math.round(pct)}</span></div>`;
}
function lineChart(points,{w=560,h=170,unit='kg'}={}){
  if(points.length<2) return `<div class="empty" style="padding:26px"><p>Grafik için en az iki ölçüm gerekiyor.</p></div>`;
  const xs=points.map(p=>new Date(p.date).getTime()), ys=points.map(p=>+p.weight);
  const x0=Math.min(...xs),x1=Math.max(...xs),y0=Math.min(...ys)-1,y1=Math.max(...ys)+1;
  const px=t=>40+(t-x0)/((x1-x0)||1)*(w-58), py=v=>14+(1-(v-y0)/((y1-y0)||1))*(h-46);
  const d=points.map((p,i)=>(i?'L':'M')+px(new Date(p.date).getTime()).toFixed(1)+','+py(+p.weight).toFixed(1)).join(' ');
  const area=d+` L ${px(x1).toFixed(1)},${h-26} L ${px(x0).toFixed(1)},${h-26} Z`;
  return `<svg viewBox="0 0 ${w} ${h}" style="width:100%;height:auto" role="img" aria-label="Kilo değişim grafiği">
    <defs><linearGradient id="ga" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2E8BD8" stop-opacity=".28"/><stop offset="1" stop-color="#2E8BD8" stop-opacity="0"/></linearGradient></defs>
    ${[0,.5,1].map(f=>`<line x1="40" x2="${w-8}" y1="${(14+f*(h-46)).toFixed(1)}" y2="${(14+f*(h-46)).toFixed(1)}" stroke="#EAF2F9"/>
      <text x="4" y="${(18+f*(h-46)).toFixed(1)}" font-size="9" fill="#7A90A6" font-family="ui-monospace,monospace">${(y1-f*(y1-y0)).toFixed(1)}</text>`).join('')}
    <path d="${area}" fill="url(#ga)"/>
    <path d="${d}" fill="none" stroke="#1B72BC" stroke-width="2.2" stroke-linejoin="round"/>
    ${points.map(p=>`<circle cx="${px(new Date(p.date).getTime()).toFixed(1)}" cy="${py(+p.weight).toFixed(1)}" r="3.4" fill="#fff" stroke="#1B72BC" stroke-width="2"/>`).join('')}
    <text x="40" y="${h-8}" font-size="9.5" fill="#7A90A6">${trDate(points[0].date)}</text>
    <text x="${w-8}" y="${h-8}" font-size="9.5" fill="#7A90A6" text-anchor="end">${trDate(points[points.length-1].date)} · ${unit}</text>
  </svg>`;
}

function shrink(file,max,q,square){
  return new Promise((res,rej)=>{
    const fr=new FileReader();
    fr.onload=()=>{ const im=new Image();
      im.onload=()=>{
        let sw=im.width, sh=im.height, sx=0, sy=0;
        if(square){ const m=Math.min(sw,sh); sx=(sw-m)/2; sy=(sh-m)/2; sw=sh=m; }
        const w=square?max:Math.round(sw*Math.min(1,max/sw)), h=square?max:Math.round(sh*Math.min(1,max/sw));
        const cv=document.createElement('canvas'); cv.width=w; cv.height=h;
        cv.getContext('2d').drawImage(im,sx,sy,sw,sh,0,0,w,h);
        res(cv.toDataURL('image/jpeg',q));
      };
      im.onerror=rej; im.src=fr.result; };
    fr.onerror=rej; fr.readAsDataURL(file);
  });
}

/* ══════════════ Word (.docx) üretimi ══════════════ */
const CRCT=(()=>{const t=new Uint32Array(256);for(let n=0;n<256;n++){let c=n;for(let k=0;k<8;k++)c=(c&1)?(0xEDB88320^(c>>>1)):(c>>>1);t[n]=c>>>0;}return t;})();
function crc32(u8){let c=0xFFFFFFFF;for(let i=0;i<u8.length;i++)c=CRCT[(c^u8[i])&255]^(c>>>8);return (c^0xFFFFFFFF)>>>0;}
const TE=new TextEncoder();
function zipStore(files){
  const u16=n=>[n&255,(n>>8)&255], u32=n=>[n&255,(n>>8)&255,(n>>16)&255,(n>>24)&255];
  const parts=[], cdir=[]; let off=0;
  files.forEach(f=>{
    const nm=TE.encode(f.name), d=f.data, crc=crc32(d);
    const lh=new Uint8Array([...u32(0x04034b50),...u16(20),...u16(0),...u16(0),...u16(0),...u16(0),
      ...u32(crc),...u32(d.length),...u32(d.length),...u16(nm.length),...u16(0)]);
    parts.push(lh,nm,d); cdir.push({nm,crc,len:d.length,off}); off+=lh.length+nm.length+d.length;
  });
  const cdStart=off; const cparts=[];
  cdir.forEach(e=>{
    const ch=new Uint8Array([...u32(0x02014b50),...u16(20),...u16(20),...u16(0),...u16(0),...u16(0),...u16(0),
      ...u32(e.crc),...u32(e.len),...u32(e.len),...u16(e.nm.length),...u16(0),...u16(0),...u16(0),...u16(0),...u32(32),...u32(e.off)]);
    cparts.push(ch,e.nm); off+=ch.length+e.nm.length;
  });
  const end=new Uint8Array([...u32(0x06054b50),...u16(0),...u16(0),...u16(cdir.length),...u16(cdir.length),
    ...u32(off-cdStart),...u32(cdStart),...u16(0)]);
  const all=[...parts,...cparts,end];
  const out=new Uint8Array(all.reduce((a,x)=>a+x.length,0));
  let pos=0; all.forEach(x=>{out.set(x,pos);pos+=x.length});
  return out;
}
function b64u8(dataUrl){const b=atob(dataUrl.split(',')[1]),u=new Uint8Array(b.length);for(let i=0;i<b.length;i++)u[i]=b.charCodeAt(i);return u;}
const X=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

function wRPr(o){o=o||{};return `<w:rPr><w:rFonts w:ascii="${o.font||'Calibri'}" w:hAnsi="${o.font||'Calibri'}" w:cs="Segoe UI Emoji"/>`
 +`${o.b?'<w:b/>':''}${o.i?'<w:i/>':''}<w:color w:val="${o.color||'2B3A46'}"/>`
 +`<w:sz w:val="${o.size||22}"/><w:szCs w:val="${o.size||22}"/></w:rPr>`;}
function wP(text,o){o=o||{};
  return `<w:p><w:pPr>${o.align?`<w:jc w:val="${o.align}"/>`:''}`
  +`<w:spacing w:before="${o.before||0}" w:after="${o.after==null?60:o.after}" w:line="${o.line||264}" w:lineRule="auto"/>`
  +`${o.bullet?'<w:ind w:left="300" w:hanging="180"/>':''}${o.shd?`<w:shd w:val="clear" w:color="auto" w:fill="${o.shd}"/>`:''}</w:pPr>`
  +`<w:r>${wRPr(o)}<w:t xml:space="preserve">${X((o.bullet?'•  ':'')+text)}</w:t></w:r></w:p>`;}
function wImg(rid,id,cx,cy){
  return `<w:p><w:pPr><w:jc w:val="center"/><w:spacing w:after="0"/></w:pPr><w:r><w:drawing>`
  +`<wp:inline distT="0" distB="0" distL="0" distR="0"><wp:extent cx="${cx}" cy="${cy}"/>`
  +`<wp:docPr id="${id}" name="Gorsel ${id}"/><wp:cNvGraphicFramePr><a:graphicFrameLocks xmlns:a="http://schemas.openxmlformats.org/drawingml/2006/main" noChangeAspect="1"/></wp:cNvGraphicFramePr>`
  +`<a:graphic xmlns:a="http://schemas.openxmlformats.org/drawingml/2006/main"><a:graphicData uri="http://schemas.openxmlformats.org/drawingml/2006/picture">`
  +`<pic:pic xmlns:pic="http://schemas.openxmlformats.org/drawingml/2006/picture"><pic:nvPicPr><pic:cNvPr id="${id}" name="Gorsel ${id}"/><pic:cNvPicPr/></pic:nvPicPr>`
  +`<pic:blipFill><a:blip r:embed="${rid}"/><a:stretch><a:fillRect/></a:stretch></pic:blipFill>`
  +`<pic:spPr><a:xfrm><a:off x="0" y="0"/><a:ext cx="${cx}" cy="${cy}"/></a:xfrm><a:prstGeom prst="roundRect"><a:avLst><a:gd name="adj" fmla="val 6000"/></a:avLst></a:prstGeom></pic:spPr>`
  +`</pic:pic></a:graphicData></a:graphic></wp:inline></w:drawing></w:r></w:p>`;}
function wCell(w,content,fill,valign){
  return `<w:tc><w:tcPr><w:tcW w:w="${w}" w:type="dxa"/>${fill?`<w:shd w:val="clear" w:color="auto" w:fill="${fill}"/>`:''}`
  +`<w:tcMar><w:top w:w="110" w:type="dxa"/><w:bottom w:w="110" w:type="dxa"/><w:left w:w="160" w:type="dxa"/><w:right w:w="160" w:type="dxa"/></w:tcMar>`
  +`<w:vAlign w:val="${valign||'center'}"/></w:tcPr>${content||wP('')}</w:tc>`;}
function wTable(widths,cells,border){
  return `<w:tbl><w:tblPr><w:tblW w:w="${widths.reduce((a,b)=>a+b,0)}" w:type="dxa"/><w:tblBorders>`
  +['top','left','bottom','right','insideH','insideV'].map(x=>`<w:${x} w:val="${border?'single':'none'}" w:sz="6" w:space="0" w:color="${border||'auto'}"/>`).join('')
  +`</w:tblBorders></w:tblPr><w:tblGrid>${widths.map(w=>`<w:gridCol w:w="${w}"/>`).join('')}</w:tblGrid>`
  +`<w:tr>${cells}</w:tr></w:tbl>`+wP('',{after:80,size:8});}
const wBreak=()=>`<w:p><w:r><w:br w:type="page"/></w:r></w:p>`;
function wRows(widths,rows,border){
  return `<w:tbl><w:tblPr><w:tblW w:w="${widths.reduce((a,b)=>a+b,0)}" w:type="dxa"/><w:tblBorders>`
  +['top','left','bottom','right','insideH','insideV'].map(x=>`<w:${x} w:val="${border?'single':'none'}" w:sz="6" w:space="0" w:color="${border||'auto'}"/>`).join('')
  +`</w:tblBorders></w:tblPr><w:tblGrid>${widths.map(w=>`<w:gridCol w:w="${w}"/>`).join('')}</w:tblGrid>`
  +rows.map(cells=>`<w:tr>${cells}</w:tr>`).join('')+`</w:tbl>`+wP('',{after:80,size:8});
}
function packDocx(body,media,rels,filename){
  const doc=`<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<w:document xmlns:w="http://schemas.openxmlformats.org/wordprocessingml/2006/main" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships" xmlns:wp="http://schemas.openxmlformats.org/drawingml/2006/wordprocessingDrawing">
<w:body>${body}<w:sectPr><w:pgSz w:w="11906" w:h="16838" w:orient="portrait"/><w:pgMar w:top="900" w:right="850" w:bottom="900" w:left="850" w:header="420" w:footer="420" w:gutter="0"/></w:sectPr></w:body></w:document>`;
  const ct=`<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types">
<Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/>
<Default Extension="xml" ContentType="application/xml"/><Default Extension="jpeg" ContentType="image/jpeg"/>
<Default Extension="png" ContentType="image/png"/>
<Override PartName="/word/document.xml" ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.document.main+xml"/></Types>`;
  const rootRels=`<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">
<Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="word/document.xml"/></Relationships>`;
  const docRels=`<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">${rels.join('')}</Relationships>`;
  const files=[{name:'[Content_Types].xml',data:TE.encode(ct)},{name:'_rels/.rels',data:TE.encode(rootRels)},
    {name:'word/document.xml',data:TE.encode(doc)},{name:'word/_rels/document.xml.rels',data:TE.encode(docRels)},...media];
  const blob=new Blob([zipStore(files)],{type:'application/vnd.openxmlformats-officedocument.wordprocessingml.document'});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob);
  a.download=filename.replace(/[\\/:*?"<>|]/g,'').slice(0,80)+'.docx';
  a.click(); setTimeout(()=>URL.revokeObjectURL(a.href),4000);
}

  const addImg=(d)=>{ if(!d) return null; const nm='image'+imgId+'.jpeg', rid='rId'+(100+imgId);

  body+=wP('DANIŞAN BİLGİ FORMU',{align:'center',b:true,size:28,color:BRAND,after:60});

               ['MESLEK',c.job],['TELEFON',c.phone]];

    rows.push(wCell(half,L(pairs[i][0]+':',pairs[i][1]),'F4F9FD','top')+wCell(half,L(pairs[i+1][0]+':',pairs[i+1][1]),'F4F9FD','top'));
  body+=wRows([half,half],rows,'CFE0EE');

  const blocks=[['HASTALIKLAR',c.health||(blank?'':'YOK')],['İLAÇLAR',c.meds],['SEVMEDİKLERİ',c.dislikes],
                ['SEVDİKLERİ',c.likes],['ALERJİLER',c.allergy],['Kan tahlili',c.blood],['Önemli notlar',c.important]];
  body+=wRows([W],blocks.map(b=>[wCell(W,
      wP(b[0],{b:true,size:22,color:BRAND,after:10})+wP(b[1]||' ',{size:21,color:BODYC,after:0}),
      'FFFFFF','top')]),'CFE0EE');

  const ms=[...(c.measures||[])].sort((a,b)=>new Date(a.date)-new Date(b.date));
  const w1=2600,w2=1700,w3=W-w1-w2;
  const trows=[[wCell(w1,wP('GÖRÜŞME TARİHİ',{b:true,size:22,color:BRAND,after:0}),'E7F2FA')
              +wCell(w2,wP('KİLO',{b:true,size:22,color:BRAND,after:0}),'E7F2FA')
              +wCell(w3,wP('NOTLAR',{b:true,size:22,color:BRAND,after:0}),'E7F2FA')]];
  const filled=blank?[]:ms;
  filled.forEach(m=>trows.push([wCell(w1,wP(trDate(m.date),{size:22,color:BODYC,after:0}))
    +wCell(w2,wP((m.weight?n1(m.weight)+' kg':''),{size:22,color:BODYC,after:0}))
    +wCell(w3,wP(m.note||'',{size:22,color:BODYC,after:0}))]));
  for(let i=filled.length;i<5;i++)
    trows.push([wCell(w1,wP(' ',{size:20,after:0}))+wCell(w2,wP(' ',{size:20,after:0}))+wCell(w3,wP(' ',{size:20,after:0}))]);
  body+=wRows([w1,w2,w3],trows,'CFE0EE');

  if(DB.profile.phone||DB.profile.mail)
    body+=wP([DB.profile.name,DB.profile.phone,DB.profile.mail].filter(Boolean).join('  ·  '),{align:'center',size:16,color:'9AA8B4',before:40,after:0});
  packDocx(body,media,rels,(blank?'Danisan Bilgi Formu (bos)':'Danisan Bilgi Formu - '+(c.name||'')));
  toast('Word dosyası indirildi');
}

  a.download=((c?c.name+' - ':'')+p.name).replace(/[\\/:*?"<>|]/g,'').slice(0,80)+'.docx';

  toast('Word dosyası indirildi');
}

function pageAppts(){
  const as=[...DB.appts].sort((a,b)=>new Date(a.when)-new Date(b.when));
  const future=as.filter(a=>new Date(a.when)>=new Date(Date.now()-36e5));
  const past=as.filter(a=>new Date(a.when)<new Date(Date.now()-36e5)).reverse();
  const row=a=>{const c=clientOf(a.clientId);return `<tr><td class="num">${trDT(a.when)}</td><td class="t-name">${esc(c?c.name:'—')}</td>
    <td><span class="tag ${a.type==='Online'?'tag-blue':''}">${esc(a.type)}</span></td><td style="color:var(--muted)">${esc(a.note||'')}</td>
    <td class="t-right"><button class="x" data-del-appt="${a.id}">✕</button></td></tr>`;};
  return `<div class="page-head"><div><h1>Randevular</h1><p>Yüz yüze ve online görüşmeler tek takvimde.</p></div><div class="spacer"></div>
  <button class="btn btn-primary" data-modal="appt">${ic('plus',15)} Randevu</button></div>
  <section class="card"><div class="card-h"><h3>Yaklaşan</h3></div>
    ${future.length?`<table><thead><tr><th>Tarih</th><th>Danışan</th><th>Tür</th><th>Not</th><th></th></tr></thead><tbody>${future.map(row).join('')}</tbody></table>`
    :`<div class="empty"><div class="eic">${ic('plus',24)}</div><h4>Yaklaşan randevu yok</h4><p>Görüşme planlayın; panelde ve danışan dosyasında görünür.</p><button class="btn btn-primary" data-modal="appt">+ Randevu ekle</button></div>`}</section>
  ${past.length?`<section class="card" style="margin-top:16px"><div class="card-h"><h3>Geçmiş</h3></div>
    <table><tbody>${past.slice(0,20).map(row).join('')}</tbody></table></section>`:''}`;
}

function modal(title,bodyHTML,okLabel,okAct,size){
  document.getElementById('modalRoot').innerHTML=`<div class="modal-bg"><div class="modal" style="${size?'width:min('+size+',100%)':''}" role="dialog" aria-modal="true">
    <div class="modal-h"><h3>${title}</h3><div class="spacer"></div><button class="x" data-close="1">✕</button></div>
    <div class="modal-b">${bodyHTML}</div>
    <div class="modal-f"><button class="btn" data-close="1">Vazgeç</button><button class="btn btn-primary" data-ok="${okAct}">${okLabel}</button></div>
  </div></div>`;
  const f=document.querySelector('.modal-b input,.modal-b select,.modal-b textarea'); if(f) f.focus();
}
const closeModal=()=>document.getElementById('modalRoot').innerHTML='';
const val=id=>{const e=document.getElementById(id);return e?e.value.trim():'';};

async function handleOk(act){
  if(act==='close') return closeModal();
  const c=clientOf(S.client);
  if(act==='client'||act==='client-edit'){
    const d=readClient();
    if(!d.name) return toast('Ad soyad zorunlu');
    if(act==='client'){
      const nc={id:uid('c'),created:todayISO(),measures:[],notes:[],...d};
      if(nc.weight) nc.measures.push({id:uid('m'),date:todayISO(),weight:nc.weight,note:'İlk ölçüm'});
      DB.clients.push(nc); S.client=nc.id; S.page='client'; S.tab='form'; toast('Danışan eklendi — bilgi formunu tamamlayabilirsiniz');
    } else { Object.assign(c,d); toast('Bilgiler güncellendi'); }
  }
  if(act==='measure'){
    if(!val('m-weight')) return toast('Kilo zorunlu');
    c.measures=c.measures||[];
    c.measures.push({id:uid('m'),date:val('m-date')||todayISO(),weight:val('m-weight'),waist:val('m-waist'),hip:val('m-hip'),fat:val('m-fat'),muscle:val('m-muscle'),note:val('m-note')});
    c.weight=val('m-weight'); toast('Ölçüm kaydedildi');
  }
  if(act==='appt'){
    if(!val('a-when')) return toast('Tarih zorunlu');
    DB.appts.push({id:uid('a'),clientId:val('a-client'),when:val('a-when'),type:val('a-type'),note:val('a-note')});
    toast('Randevu eklendi');
  }
  if(act==='note'){
    if(!val('n-text')) return toast('Not boş olamaz');
    c.notes=c.notes||[]; c.notes.push({id:uid('n'),date:val('n-date')||todayISO(),type:val('n-type'),text:val('n-text')});
    toast('Not kaydedildi');
  }
  if(act==='food'){
    if(!val('f-n')) return toast('Besin adı zorunlu');
    DB.foods.push({id:uid('f'),n:val('f-n'),cat:val('f-cat')||'Diğer',kcal:+val('f-kcal')||0,p:+val('f-p')||0,k:+val('f-k')||0,y:+val('f-y')||0,lif:+val('f-lif')||0,mg:+val('f-mg')||0});
    toast('Besin eklendi');
  }
  if(act==='plan-new'){
    if(!val('p-name')) return toast('Program başlığı zorunlu');
    const p={id:uid('p'),clientId:val('p-client'),name:val('p-name'),sub:val('p-sub'),start:val('p-start')||todayISO(),
      status:val('p-status'),desc:val('p-desc'),footer:'',firstDay:+val('p-firstday'),
      purpose:val('p-purpose').split('\n').map(x=>x.trim()).filter(Boolean),closing:TPL.closing,days:newDays()};
    DB.plans.push(p); S.plan=p.id; S.day=0; S.page='planEdit'; toast('Program oluşturuldu');
  }
  if(act==='plan-edit'){
    const p=DB.plans.find(x=>x.id===S.plan);
    Object.assign(p,{name:val('p-name'),sub:val('p-sub'),start:val('p-start'),status:val('p-status'),desc:val('p-desc'),firstDay:+val('p-firstday'),
      purpose:val('p-purpose').split('\n').map(x=>x.trim()).filter(Boolean)});
    toast('Program güncellendi');
  }
  if(act==='meal'){
    if(!val('ml-n')) return toast('Öğün adı zorunlu');
    DB.plans.find(x=>x.id===S.plan).days[S.day].meals.push({name:val('ml-n'),time:val('ml-t'),items:[]});
    toast('Öğün eklendi');
  }
  if(act==='item'){
    const name=val('it-food'); if(!name) return toast('Besin adı zorunlu');
    const p=DB.plans.find(x=>x.id===S.plan);
    const q=val('it-q')|| (val('it-gram')? val('it-gram')+' g':'1 porsiyon');
    p.days[S.day].meals[S.mealIdx].items.push({n:name,q,kcal:+val('it-kcal')||0,p:+val('it-p')||0,k:+val('it-k')||0,y:+val('it-y')||0});
    toast('Besin eklendi');
  }
  closeModal(); await save(); render();
}

document.addEventListener('click',async e=>{
  const t=e.target;
  if(t.classList.contains('modal-bg')) return closeModal();
  if(t.closest('button[data-close]')) return closeModal();
  const ok=t.closest('[data-ok]'); if(ok) return handleOk(ok.dataset.ok);
  const go=t.closest('[data-go]'); if(go){ S.page=go.dataset.go; S.q=''; return render(); }
  const md=t.closest('[data-modal]'); if(md) return openModal(md.dataset.modal);
  const cl=t.closest('[data-client]'); if(cl){ S.client=cl.dataset.client; S.page='client'; S.tab='form'; return render(); }
  const tb=t.closest('[data-tab]'); if(tb){ S.tab=tb.dataset.tab; return render(); }
  const np=t.closest('[data-newplan]'); if(np){ S.newPlanClient=np.dataset.newplan||S.client; return openModal('plan-new'); }
  const pl=t.closest('[data-plan]'); if(pl){ S.plan=pl.dataset.plan; S.day=0; S.page='planEdit'; return render(); }
  const dy=t.closest('[data-day]'); if(dy){ S.day=+dy.dataset.day; return render(); }
  const am=t.closest('[data-addmeal]'); if(am) return openModal('meal');
  const ai=t.closest('[data-additem]'); if(ai){ S.mealIdx=+ai.dataset.additem; return openModal('item'); }
  const di=t.closest('[data-delitem]'); if(di){ const [m,i]=di.dataset.delitem.split(':').map(Number);
    DB.plans.find(x=>x.id===S.plan).days[S.day].meals[m].items.splice(i,1); await save(); return render(); }
  const dm=t.closest('[data-del-measure]'); if(dm){ const c=clientOf(S.client); c.measures=c.measures.filter(x=>x.id!==dm.dataset.delMeasure); await save(); return render(); }
  const dn=t.closest('[data-del-note]'); if(dn){ const c=clientOf(S.client); c.notes=c.notes.filter(x=>x.id!==dn.dataset.delNote); await save(); return render(); }
  const da=t.closest('[data-del-appt]'); if(da){ DB.appts=DB.appts.filter(x=>x.id!==da.dataset.delAppt); await save(); return render(); }
  const df=t.closest('[data-del-food]'); if(df){ DB.foods=DB.foods.filter(x=>x.id!==df.dataset.delFood); await save(); return render(); }
  const ddp=t.closest('[data-deldayphoto]'); if(ddp){
    const p=DB.plans.find(x=>x.id===S.plan); p.days[S.day].photo='';
    await save(); return render(); }
  const dph=t.closest('[data-delphoto]'); if(dph){
    const p=DB.plans.find(x=>x.id===S.plan); p.days[S.day].meals[+dph.dataset.delphoto].photo='';
    await save(); return render(); }
  const dp=t.closest('[data-del-plan]'); if(dp){ if(!confirm('Bu program silinsin mi?')) return;
    DB.plans=DB.plans.filter(x=>x.id!==dp.dataset.delPlan); S.page='plans'; await save(); return render(); }
  const dc=t.closest('[data-del-client]'); if(dc){ if(!confirm('Danışan ve tüm kayıtları silinsin mi?')) return;
    DB.clients=DB.clients.filter(x=>x.id!==dc.dataset.delClient);
    DB.plans=DB.plans.filter(x=>x.clientId!==dc.dataset.delClient);
    DB.appts=DB.appts.filter(x=>x.clientId!==dc.dataset.delClient);
    S.page='clients'; await save(); return render(); }

  const act=t.closest('[data-act]'); if(act){
    const a=act.dataset.act;
    if(a==='print') window.print();
    if(a==='lock'){ lockApp(); return; }
    if(a==='save-pin'){
      const a1=val('pin-new'), a2=val('pin-new2');
      if(!/^[0-9]{4,8}$/.test(a1)) return toast('Şifre 4-8 rakam olmalı');
      if(a1!==a2) return toast('Şifreler eşleşmiyor');
      DB.profile.pin=a1; await save(); toast('Şifre güncellendi'); render(); return;
    }
    if(a==='form-docx'){ try{ exportFormDocx(false); }catch(err){ console.error(err); toast('Word dosyası oluşturulamadı'); } return; }
    if(a==='form-docx-blank'){ try{ exportFormDocx(true); }catch(err){ toast('Word dosyası oluşturulamadı'); } return; }
    if(a==='docx'){ try{ await exportDocx(); }catch(err){ console.error(err); toast('Word dosyası oluşturulamadı'); } return; }
    if(a==='save-form'){
      const c2=clientOf(S.client);
      Object.assign(c2,{name:val('fm-name')||c2.name,age:val('fm-age'),city:val('fm-city'),height:val('fm-height'),
        job:val('fm-job'),phone:val('fm-phone'),health:val('fm-health'),meds:val('fm-meds'),dislikes:val('fm-dislikes'),
        likes:val('fm-likes'),allergy:val('fm-allergy'),blood:val('fm-blood'),important:val('fm-important')});
      await save(); toast('Bilgi formu kaydedildi'); render(); return;
    }
    if(a==='add-session'){
      const c2=clientOf(S.client);
      if(!val('s-weight')&&!val('s-note')) return toast('Kilo veya not girin');
      c2.measures=c2.measures||[];
      c2.measures.push({id:uid('m'),date:val('s-date')||todayISO(),weight:val('s-weight')||c2.weight||0,note:val('s-note')});
      if(val('s-weight')) c2.weight=val('s-weight');
      await save(); toast('Görüşme kaydedildi'); render(); return;
    }
    if(a==='print-blank'){
      const v=document.getElementById('view'), old=v.innerHTML;
      v.innerHTML=`<div class="page">${blankForm()}</div>`; window.print(); v.innerHTML=old; return;
    }
    if(a==='save-note'){ DB.plans.find(x=>x.id===S.plan).note=document.getElementById('planNote').value; await save(); toast('Not kaydedildi'); render(); }
    if(a==='save-profile'){ Object.assign(DB.profile,{name:val('pf-name'),clinic:val('pf-clinic'),phone:val('pf-phone'),mail:val('pf-mail'),note:val('pf-note')}); await save(); toast('Bilgiler kaydedildi'); render(); }
    if(a==='export'){ const b=new Blob([JSON.stringify(DB,null,2)],{type:'application/json'});
      const u=URL.createObjectURL(b), l=document.createElement('a'); l.href=u; l.download='diyet-yedek-'+todayISO()+'.json'; l.click(); URL.revokeObjectURL(u); toast('Yedek indirildi'); }
    if(a==='import') document.getElementById('importFile').click();
    if(a==='del-logo'){ DB.profile.logo=''; await save(); render(); }
    if(a==='reset'){ if(confirm('Tüm danışanlar, programlar ve randevular silinecek. Emin misiniz?')){ DB=seed(); S.page='panel'; await save(); render(); } }
  }
});
document.addEventListener('input',e=>{
  if(e.target.id==='q'){ S.q=e.target.value; render();
    const i=document.getElementById('q'); if(i){ i.focus(); i.setSelectionRange(i.value.length,i.value.length); } }
  if(e.target.id==='it-food'||e.target.id==='it-gram'){
    const f=DB.foods.find(x=>x.n.toLocaleLowerCase('tr')===val('it-food').toLocaleLowerCase('tr'));
    const gr=+val('it-gram');
    if(f&&gr){ const r=gr/100;
      document.getElementById('it-kcal').value=Math.round(f.kcal*r);
      document.getElementById('it-p').value=(f.p*r).toFixed(1);
      document.getElementById('it-k').value=(f.k*r).toFixed(1);
      document.getElementById('it-y').value=(f.y*r).toFixed(1); }
  }
});
document.addEventListener('change',async e=>{
  const f=e.target.closest('[data-f]');
  if(f){
    const p=DB.plans.find(x=>x.id===S.plan); if(!p) return;
    const [k,i]=f.dataset.f.split(':'), v=e.target.value;
    if(k==='title')  p.days[S.day].meals[+i].title=v;
    if(k==='lines')  p.days[S.day].meals[+i].lines=v.split('\n').map(x=>x.trim()).filter(Boolean);
    if(k==='daysub') p.days[+i].sub=v;
    if(k==='firstday'){ p.firstDay=+v; await save(); return render(); }
    if(k==='purpose') p.purpose=v.split('\n').map(x=>x.trim()).filter(Boolean);
    if(k==='closing') p.closing=v;
    if(k==='footer') p.footer=v;
    await save(); return;
  }
  const dph2=e.target.closest('[data-dayphoto]');
  if(dph2 && dph2.files && dph2.files[0]){
    try{ const d=await shrink(dph2.files[0],1100,0.72,false);
      const p=DB.plans.find(x=>x.id===S.plan); p.days[S.day].photo=d;
      await save(); toast('Gün fotoğrafı eklendi'); render();
    }catch(err){ toast('Fotoğraf okunamadı'); }
    return;
  }
  const ph=e.target.closest('[data-photo]');
  if(ph && ph.files && ph.files[0]){
    try{
      const d=await shrink(ph.files[0],620,0.72,true);
      const p=DB.plans.find(x=>x.id===S.plan);
      p.days[S.day].meals[+ph.dataset.photo].photo=d;
      await save(); toast('Fotoğraf eklendi'); render();
    }catch(err){ toast('Fotoğraf okunamadı'); }
    return;
  }
  if(e.target.id==='logoFile' && e.target.files && e.target.files[0]){
    try{ DB.profile.logo=await shrink(e.target.files[0],760,0.82,false); await save(); toast('Logo kaydedildi'); render(); }
    catch(err){ toast('Görsel okunamadı'); }
  }
});

document.getElementById('importFile').addEventListener('change',e=>{
  const f=e.target.files[0]; if(!f) return;
  const r=new FileReader();
  r.onload=async()=>{ try{ const d=JSON.parse(r.result); if(!d.clients) throw 0; DB=d; await save(); S.page='panel'; render(); toast('Yedek yüklendi'); }
    catch(err){ toast('Dosya okunamadı'); } };
  r.readAsText(f); e.target.value='';
});
document.addEventListener('keydown',e=>{ if(e.key==='Escape') closeModal(); });

/* ══════════════ Şifre kilidi ══════════════ */
let PIN='';
const realPin=()=>String(DB.profile.pin||'0508');
function pinPaint(){
  document.getElementById('pinDots').innerHTML=
    Array.from({length:realPin().length},(_,i)=>`<i class="${i<PIN.length?'on':''}"></i>`).join('');
}
function unlock(){
  const lock=document.getElementById('lock'), app=document.querySelector('.app');
  lock.hidden=true; lock.style.display='none';
  if(app) app.style.display='flex';
  try{ render(); paintSave('Hazır','var(--ok)'); }
  catch(err){
    console.error(err);
    document.getElementById('view').innerHTML='<div class="page"><section class="card"><div class="card-b">'
      +'<b>Bir sorun oluştu:</b><br><span style="font-family:var(--mono);font-size:12px">'+String(err.message||err)+'</span>'
      +'<br><br><button class="btn" data-act="reset">Verileri sıfırla</button></div></section></div>';
  }
}
function pinTry(force){
  if(!force && PIN.length<realPin().length) return;
  if(PIN===realPin()){ unlock(); }
  else{
    const c=document.getElementById('lockCard');
    document.getElementById('lockErr').textContent='Şifre hatalı, tekrar deneyin';
    c.classList.add('shake'); setTimeout(()=>c.classList.remove('shake'),350);
    PIN=''; pinPaint();
  }
}
function pinKey(k){
  document.getElementById('lockErr').textContent='';
  if(k==='del') PIN=PIN.slice(0,-1);
  else if(k==='clear') PIN='';
  else if(k==='ok'){ pinPaint(); return pinTry(true); }
  else if(/^[0-9]$/.test(k)&&PIN.length<8) PIN+=k;
  pinPaint(); pinTry();
}
function lockApp(){
  PIN='';
  document.getElementById('lockName').textContent=DB.profile.name||'Giriş';
  const lg=document.getElementById('lockLogo');
  if(DB.profile.logo){ lg.src=DB.profile.logo; lg.style.display=''; } else lg.style.display='none';
  document.getElementById('lockErr').textContent='';
  const lock=document.getElementById('lock');
  lock.hidden=false; lock.style.display='grid';
  const app=document.querySelector('.app'); if(app) app.style.display='none';
  pinPaint();
}
document.getElementById('keys').addEventListener('click',e=>{
  const b=e.target.closest('[data-k]'); if(b){ e.preventDefault(); pinKey(b.dataset.k); }
});
document.getElementById('btnEnter').addEventListener('click',e=>{ e.preventDefault(); pinKey('ok'); });
document.addEventListener('keydown',e=>{
  if(document.getElementById('lock').hidden) return;
  if(/^[0-9]$/.test(e.key)) pinKey(e.key);
  else if(e.key==='Backspace'){ e.preventDefault(); pinKey('del'); }
  else if(e.key==='Enter') pinTry();
});

(async()=>{
  try{ await loadDB(); }catch(err){ DB=seed(); }
  if(DB.profile.pin===undefined||DB.profile.pin==='') DB.profile.pin='0508';
  lockApp();
})();
</script>
</body>
</html>
